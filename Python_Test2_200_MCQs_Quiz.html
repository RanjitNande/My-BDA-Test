<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Python Test 2 · 200 MCQs (Original + 4 Subsets) Study Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunken:#E7EDEF; --ink:#13232B; --muted:#56676F; --line:#D2DCE0;
  --accent:#1B5E86; --accent-ink:#FFFFFF; --accent-soft:#DCEAF3;
  --ok:#1C7A4A; --ok-soft:#DCF1E4; --bad:#B23A2E; --bad-soft:#F7E0DC; --todo:#C5C9D6;
  --code-bg:#11202A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(23,26,43,.06),0 4px 14px rgba(23,26,43,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
    --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
    --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
    --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
  --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
  --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
  --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 74px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:11px;flex-wrap:wrap}
.nav-arrows{display:inline-flex;gap:6px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.toplinks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:8px 14px;font-weight:500;cursor:pointer;min-height:40px;text-align:center;text-decoration:none}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .count{font-family:var(--font-mono);font-size:12px;opacity:.85;background:var(--sunken);padding:1px 6px;border-radius:10px}
.btn.primary .count{background:rgba(255,255,255,.2);color:inherit}

/* Bookmark button & strip indicator */
.bm-btn{margin-left:auto;border-radius:999px;font-family:var(--font-mono);font-size:12px;padding:3px 10px;min-height:28px;color:var(--muted)}
.bm-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sq{position:relative}
.sq.bm::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;border-radius:2px;background:var(--accent)}

/* Home */
.home{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.summary{display:flex;flex-direction:column;gap:18px}
@media (min-width:901px){.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.bigrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack span{display:block;height:100%}
.stack .s-ok{background:var(--ok)} .stack .s-bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.todo{background:var(--todo)}
.lvrows{display:grid;gap:8px}
.lvrow{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.lvrow .stack{height:7px}
.lvrow .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:grid;gap:8px}
.subsets-box{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.subsets-box h3{font-size:15px}
.subset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.subset-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border:1px solid var(--line);background:var(--sunken);border-radius:7px;cursor:pointer;text-align:left}
.subset-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.subset-btn b{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.subset-btn span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.weak h3{font-size:16px;margin-bottom:8px}
.weaklist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.weaklist button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sunken);border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.weaklist button:hover{border-color:var(--accent)}
.weaklist .wname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaklist .wstat{font-family:var(--font-mono);font-size:12px;color:var(--bad);white-space:nowrap}
.empty-note{font-size:13px;color:var(--muted);margin:0}
.reset{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.reset .confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

.topics-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.topics-head h2{font-size:24px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.topics-head .seg{margin-left:auto}
.topiclist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.topic{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) 84px;gap:14px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--accent)}
.tnum{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
.tnum b{display:block;font-family:var(--font-display);font-size:21px;color:var(--ink);font-weight:600;letter-spacing:0;white-space:nowrap}
.tbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.tname{font-weight:600;font-size:15px;line-height:1.35}
.tsub{font-size:12.5px;color:var(--muted);line-height:1.4}
.tmeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tmeta .past{color:var(--accent)}
.tbar{height:6px}
.tscore{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tscore small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.tscore.na{color:var(--todo)}
@media (max-width:520px){.topic{grid-template-columns:48px minmax(0,1fr) 64px;gap:10px;padding:12px}.tnum b{font-size:17px}.tscore{font-size:18px}}
.intro{font-size:13.5px;color:var(--muted);max-width:68ch;margin:0 0 14px}

/* Quiz — Continuous Vertical Feed */
.quiz{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.switcher-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
.switcher-select{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunken);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.qhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.qhead .titles{min-width:0;flex:1 1 300px}
.qhead h2{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--bg);padding-top:6px;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:5px;width:max-content;padding-bottom:4px}
.sq{width:38px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:11.5px;cursor:pointer;color:var(--muted);flex:none}
.sq:hover{border-color:var(--accent);color:var(--ink)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:600}
.progressline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progressline b{color:var(--ink)}
.qfeed{display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:115px;transition:border-color .2s}
.qcard.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:520px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--font-mono);font-weight:600;font-size:14px;background:var(--sunken);padding:2px 8px;border-radius:5px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:4px;background:var(--todo);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}
.bars.on1 i:nth-child(-n+1),.bars.on2 i:nth-child(-n+2),.bars.on3 i:nth-child(-n+3){background:var(--accent)}
.missed{font-family:var(--font-mono);font-size:11.5px;color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:1px 8px}
.pyq{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px}
.sref{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.stem{font-size:16.5px;line-height:1.5;margin:0;white-space:pre-wrap;font-weight:500}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;tab-size:4}
.code .kw{color:var(--code-kw)} .code .st{color:var(--code-str)} .code .cm{color:var(--code-com);font-style:italic} .code .nu{color:var(--code-num)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.key{width:28px;height:28px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px}
.otext{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.otext.codey{font-family:var(--font-mono);font-size:13.5px;white-space:pre-wrap}
.mark{padding-top:3px;font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
@media (max-width:520px){.opt{grid-template-columns:30px minmax(0,1fr)}.mark{grid-column:2;padding-top:0}.mark:empty{display:none}}
.feedback{border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-soft)}
.feedback .verdict{font-weight:600;font-size:15px}
.feedback.yes .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback p{margin:0}
.feedback .fbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.qfoot .spacer{flex:1}
.nolist{padding:28px;text-align:center;color:var(--muted)}

/* Results + mistakes */
.result{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.scorecard{grid-template-columns:minmax(0,1fr)}}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--font-display);font-size:32px;line-height:1}
.ring .lbl small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mistake .stem{font-size:15px}
.answers{display:grid;gap:6px}
.ans{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;font-size:14px;align-items:start;padding:8px 10px;border-radius:7px}
.ans > span{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.ans{grid-template-columns:minmax(0,1fr);gap:2px}}
.ans .who{font-family:var(--font-mono);font-size:12px;padding-top:2px}
.ans.yours{background:var(--bad-soft)} .ans.yours .who{color:var(--bad)}
.ans.correct{background:var(--ok-soft)} .ans.correct .who{color:var(--ok)}
.explain{font-size:14px;margin:0;color:var(--ink)}
.explain b{font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.grouphead h3{font-size:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* Topic group headings on the home list */
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:14px;padding:0 2px}
.topiclist li.ghead:first-child{margin-top:0}
.ghead b{font-family:var(--font-display);font-size:18px;font-weight:600}
.ghead .gno{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ghead .gstat{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quick facts */
.info{max-width:1080px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.info h2{font-size:24px}
.info h3{font-size:18px;margin-bottom:10px}
.info p{margin:0 0 10px;max-width:68ch}
.info p:last-child{margin-bottom:0}
.info ul{margin:0;padding-left:20px;display:grid;gap:7px;max-width:68ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts .panel h3{font-size:17px}
.facts ul{gap:6px;font-size:14px}
.info code{font-family:var(--font-mono);font-size:13px;background:var(--sunken);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.topic,.sq{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">

<script type="application/json" id="qdata">{"groups": [{"n": 1, "name": "Exam Paper · Original Quiz", "range": "Set 1 · Q1–Q40"}, {"n": 2, "name": "Full-Syllabus Practice Subsets", "range": "Sets 2–5 · Q41–Q200"}], "sessions": [{"n": 1, "g": 1, "name": "Original Quiz (40 Q · Q1–Q40)", "topics": "All 40 exam questions from the attached Python & R Programming exam PDF (Pandas Series/DataFrame, file modes, seek/readline, dicts, lists, *args/**kwargs, R basics, packages, tidyverse, plots, ANOVA, t-test, chi-square, normality & regression)"}, {"n": 2, "g": 2, "name": "Subset 1 (40 Q · Q41–Q80)", "topics": "Full syllabus variation 1: Python syntax & loops, strings & slices, dicts & ROT-13, list operations, functions & pickling, tuples & zip, OOP/regex/generators/decorators, exceptions & logging, NumPy/Pandas, BS4/Seaborn, File/CSV/JSON, FastAPI & R programming"}, {"n": 3, "g": 2, "name": "Subset 2 (40 Q · Q81–Q120)", "topics": "Full syllabus variation 2: Operators & control flow, pangrams/palindromes, dictionary comprehensions, list methods, recursion & lambdas, tuple sorting, inheritance & MRO, custom exceptions, diamonds DataFrame wrangling, Matplotlib/Plotly, context managers, DB-API & R tidyverse"}, {"n": 4, "g": 2, "name": "Subset 3 (40 Q · Q121–Q160)", "topics": "Full syllabus variation 3: Loops & factorials, string formatting, dict methods, list comprehensions, scope (global/nonlocal) & modules, tuple unpacking, regex & decorators, logging levels, NumPy broadcasting & PIL images, BeautifulSoup selectors, JSON/CSV, FastAPI Pydantic & R stats"}, {"n": 5, "g": 2, "name": "Subset 4 (40 Q · Q161–Q200)", "topics": "Full syllabus variation 4: Code output tracing, robovarspraket/ing heuristics, nested structures, generator classes, OOP data hiding & polymorphism, try-except-else-finally, Pandas duplicates & groupby, correlation heatmaps, binary files, virtualenvs, R Markdown & ChickWeight case study"}], "questions": [{"n": 1, "s": 1, "lv": "E", "topic": "S10 · Pandas Series", "q": "A __________ is a one-dimensional array.", "code": "", "lang": "", "chk": 0, "o": ["Data Frame", "Series", "Both of the above", "None of the above"], "oc": [false, false, false, false], "a": 1, "e": "In Pandas, a Series is a one-dimensional labeled array capable of holding any data type, whereas a DataFrame is a 2-dimensional labeled table with rows and columns. (Note: the marked screenshot boxed 'Both of the above', but strictly Series is 1D and DataFrame is 2D.)"}, {"n": 2, "s": 1, "lv": "E", "topic": "S12 · File Handling", "q": "Which method is used to read a file line by line in Python?", "code": "", "lang": "", "chk": 0, "o": ["read()", "read(1)", "readline()", "readlines(1)"], "oc": [true, true, true, true], "a": 2, "e": "readline() reads and returns a single line from the file each time it is called. read() reads the entire file into one string, read(1) reads a single character/byte, and readlines() reads all lines into a list."}, {"n": 3, "s": 1, "lv": "E", "topic": "S3 · Dictionaries", "q": "What happens when the following dictionary code is executed?", "code": "dict = {\"Joey\": 1, \"Rachel\": 2}\ndict.update({\"Phoebe\": 2})\nprint(dict)", "lang": "py", "chk": 1, "o": ["error", "new value will be updated in nw dictionary", "a new value will be in old dictionary", "both of above"], "oc": [false, false, false, false], "a": 2, "e": "dict.update({\"Phoebe\": 2}) mutates the existing dictionary in place by inserting the new key-value pair 'Phoebe': 2, printing {'Joey': 1, 'Rachel': 2, 'Phoebe': 2}."}, {"n": 4, "s": 1, "lv": "E", "topic": "S12 · File Handling", "q": "Select the incorrect file access mode in Python:", "code": "", "lang": "", "chk": 0, "o": ["r", "ab+", "wb+", "rw+"], "oc": [true, true, true, true], "a": 3, "e": "Valid Python open() modes combine a base mode ('r', 'w', 'a', 'x') with '+' (read and write) and 'b'/'t' (binary/text), such as 'r+', 'w+', 'ab+', or 'wb+'. 'rw+' is invalid and raises ValueError."}, {"n": 5, "s": 1, "lv": "M", "topic": "S3 · Dictionaries & Strings", "q": "What is the output of the following Python code?", "code": "dict1 = {\"a\": 10, \"b\": 2, \"c\": 3}\nstr1 = \"\"\nfor i in dict1:\n    str1 = str1 + str(dict1[i]) + \" \"\n    str2 = str1[:-1]\nprint(str2[::-1])", "lang": "py", "chk": 1, "o": ["3,2", "3,2,10", "3,2,01", "error"], "oc": [true, true, true, false], "a": 2, "e": "The loop builds str1 = '10 2 3 ' and str2 = str1[:-1] = '10 2 3'. Slicing with [::-1] reverses the characters of '10 2 3' into '3 2 01' (written as 3,2,01 in the exam choices; '10' reverses to '01')."}, {"n": 6, "s": 1, "lv": "E", "topic": "S15 · R Data Objects", "q": "How many basic types of R data objects are present in RStudio data types (among the given options)?", "code": "", "lang": "", "chk": 0, "o": ["1", "2", "5", "4"], "oc": [false, false, false, false], "a": 2, "e": "Standard R MCQs list 5 core data object structures (Vector, List, Matrix, Array, Data Frame — or 6 including Factor, and 6 atomic vector modes: logical, numeric, integer, complex, character, raw). Among the options [1, 2, 5, 4], 5 is the standard keyed answer."}, {"n": 7, "s": 1, "lv": "E", "topic": "S17 · R Regression", "q": "In order to run simple linear regression in R, which command below is used (where DV = Dependent Variable and IDV = Independent Variable)?", "code": "", "lang": "", "chk": 0, "o": ["lm(DV~IDV)", "lm(IDV~DV)", "lm(IDV,DV)", "lm(DV,IDV)"], "oc": [true, true, true, true], "a": 0, "e": "In R, lm() takes a formula of the form response ~ predictor, i.e., lm(DV ~ IDV), where the dependent variable (DV) is modeled as a function of the independent variable (IDV)."}, {"n": 8, "s": 1, "lv": "M", "topic": "S5 · Function Arguments", "q": "What is the output of the following display_person() function call?", "code": "def display_person(*args):\n    for i in args:\n        print(i)\n\ndisplay_person(name=\"Emma\", age=\"25\")", "lang": "py", "chk": 1, "o": ["Emma ,25", "name,age", "error", "both a and b"], "oc": [false, false, false, false], "a": 2, "e": "*args collects only positional arguments into a tuple. Passing keyword arguments name='Emma', age='25' to def display_person(*args): raises TypeError: display_person() got an unexpected keyword argument 'name'."}, {"n": 9, "s": 1, "lv": "M", "topic": "S4 · Lists", "q": "What is the output of the following list operation?", "code": "L1 = [1, 2, 4]\nL1.insert(4, 10)\nprint(L1)", "lang": "py", "chk": 1, "o": ["error", "[1,2,10]", "[1,2,4,10]", "none of above"], "oc": [false, true, true, false], "a": 2, "e": "L1.insert(4, 10) inserts 10 at index 4. Since L1 only has indices 0, 1, 2, Python places the new element at the end of the list without raising IndexError, producing [1, 2, 4, 10]."}, {"n": 10, "s": 1, "lv": "E", "topic": "S3 · Dictionaries", "q": "Select the correct way to remove the key \"marks\" from the dictionary:", "code": "student = {\n    \"name\": \"Emma\",\n    \"class\": 9,\n    \"marks\": 75\n}", "lang": "py", "chk": 1, "o": ["student.pop(\"marks\")", "student.remove(\"marks\")", "del student(\"marks\")", "error"], "oc": [true, true, true, false], "a": 0, "e": "student.pop('marks') removes the 'marks' key and returns its value (75). Dictionaries have no .remove() method, and del uses square brackets del student['marks'], not parentheses."}, {"n": 11, "s": 1, "lv": "M", "topic": "S5 · Function Arguments", "q": "What is the output of the following display() function call?", "code": "def display(**kwargs):\n    for i in kwargs:\n        print(i)\n\ndisplay(emp=\"Kelly\", salary=9000)", "lang": "py", "chk": 1, "o": ["TypeError", "Kelly,9000", "('emp', 'Kelly') ('salary', 9000)", "emp,salary"], "oc": [false, false, false, false], "a": 3, "e": "**kwargs collects keyword arguments into a dictionary {'emp': 'Kelly', 'salary': 9000}. Iterating 'for i in kwargs:' yields the dictionary keys: emp and salary."}, {"n": 12, "s": 1, "lv": "E", "topic": "S17 · R Statistical Tests", "q": "Which of the following functions is used for a Student's t-test in R?", "code": "", "lang": "", "chk": 0, "o": ["t.test()", "ttest()", "tt.test()", "None of them"], "oc": [true, true, true, false], "a": 0, "e": "In R's stats package, t.test() performs one- and two-sample t-tests on vectors of data."}, {"n": 13, "s": 1, "lv": "E", "topic": "S14 · R Introduction", "q": "R is preferred most compared to the rest of the software because of .....", "code": "", "lang": "", "chk": 0, "o": ["It is free of cost.", "Easy to use and deal with huge data set", "Makes data visualization easy", "All of the above"], "oc": [false, false, false, false], "a": 3, "e": "R is open-source (free of cost), handles statistical data manipulation effectively, and provides powerful visualization tools (base plots, lattice, ggplot2)."}, {"n": 14, "s": 1, "lv": "M", "topic": "S17 · R Statistical Tests", "q": "How do you apply the Anderson-Darling test for normality using the nortest package in R?", "code": "", "lang": "", "chk": 0, "o": ["ad.test()", "ADtest()", "Andersondarling ()", "None of above"], "oc": [true, true, true, false], "a": 0, "e": "The ad.test(x) function from R's nortest package performs the Anderson-Darling test for the composite hypothesis of normality."}, {"n": 15, "s": 1, "lv": "M", "topic": "S12 · File Handling", "q": "Select the correct meaning of the following Python file operation: fp.seek(5, 1)", "code": "fp.seek(5, 1)", "lang": "py", "chk": 0, "o": ["Move file pointer five characters ahead from the current position", "Move file pointer five characters ahead from the beginning of a file.", "Move file pointer five characters behind from the current position.", "Move file pointer five characters behind ahead from the end of a file."], "oc": [false, false, false, false], "a": 0, "e": "In fp.seek(offset, whence), whence=0 is the start of the file, whence=1 is the current position, and whence=2 is the end of the file. Thus fp.seek(5, 1) moves 5 bytes/characters ahead from the current position."}, {"n": 16, "s": 1, "lv": "E", "topic": "S17 · R Statistical Tests", "q": "_______ function carries out a chi-square test in R.", "code": "", "lang": "", "chk": 0, "o": ["chisq.test()", "t.test()", "prop.test()", "fisher.test()"], "oc": [true, true, true, true], "a": 0, "e": "chisq.test() performs chi-squared contingency table tests and goodness-of-fit tests in R."}, {"n": 17, "s": 1, "lv": "M", "topic": "S3 · Dictionaries", "q": "What is the result of executing the following dictionary lookup?", "code": "d = {'k1': 100, 'k2': 900, 'k3': 500}\nv = d.get(k5)\nprint(v)", "lang": "py", "chk": 1, "o": ["key error", "-1", "0", "none of above"], "oc": [false, false, false, false], "a": 3, "e": "dict.get(key) never raises a KeyError: if 'k5' is passed as a string, d.get('k5') returns None; as written without quotes, k5 raises NameError. In either case it is not KeyError, -1, or 0, so 'none of above' is correct (note: the exam screenshot boxed 'key error', confusing d.get('k5') with d['k5'])."}, {"n": 18, "s": 1, "lv": "E", "topic": "S12 · File Handling", "q": "Which method is used to set the position of a file pointer in Python?", "code": "", "lang": "", "chk": 0, "o": ["ftell()", "fseek()", "tell()", "seek()"], "oc": [true, true, true, true], "a": 3, "e": "In Python, file.seek(offset[, whence]) sets the file pointer's position, whereas file.tell() returns the current file pointer position."}, {"n": 19, "s": 1, "lv": "E", "topic": "S14 · R Basics", "q": "Which of the following is used to create a sequence from 1 to 10 in R?", "code": "", "lang": "", "chk": 0, "o": ["Disp(10)", "View(1:10)", "Seq(10)", "None of the mentioned"], "oc": [true, true, true, false], "a": 2, "e": "In R, seq(10) generates the sequence 1, 2, ..., 10. (The exam paper capitalizes the initial letter of each option as Disp(10), View(1:10), Seq(10); in strict R code, use lowercase seq(10) or 1:10.)"}, {"n": 20, "s": 1, "lv": "E", "topic": "S17 · R Functions", "q": "Point out the correct statement about functions in R:", "code": "", "lang": "", "chk": 0, "o": ["In R, a function is an object which has the mode function", "R interpreter is able to pass control to the function, along with arguments that may be necessary for the function to accomplish the actions that are desired", "Functions are also often written when code must be shared with others or the public", "All of the mentioned"], "oc": [false, false, false, false], "a": 3, "e": "All three statements are true: R functions are first-class objects with mode 'function', take arguments passed by the R interpreter, and package reusable logic for sharing."}, {"n": 21, "s": 1, "lv": "E", "topic": "S15 · R Packages", "q": "Which of the following is NOT a valid R package used in RStudio?", "code": "", "lang": "", "chk": 0, "o": ["Robert", "Car", "Readxl", "haven"], "oc": [false, false, false, false], "a": 0, "e": "car (Companion to Applied Regression), readxl (Excel import), and haven (SPSS/Stata/SAS import) are widely used R packages. 'Robert' (from R co-author Robert Gentleman) is not an R package."}, {"n": 22, "s": 1, "lv": "M", "topic": "S4 · Lists", "q": "What will be the output of the following Python code?", "code": "L = [1, 2, 3]\nL1 = [10, 20, 30]\nL.append(L1)\nprint(L1)", "lang": "py", "chk": 1, "o": ["error", "[1,2,3,10,20,30]", "[1,2,3,[10,20,30]]", "none of above"], "oc": [false, true, true, false], "a": 3, "e": "L.append(L1) modifies L into [1, 2, 3, [10, 20, 30]], but the final statement is print(L1), which outputs [10, 20, 30]. Since [10, 20, 30] is not among the first three options, 'none of above' is correct."}, {"n": 23, "s": 1, "lv": "M", "topic": "S5 · Functions", "q": "Select which statement is FALSE for a Python function:", "code": "", "lang": "", "chk": 0, "o": ["A function is a code block that only executes when called and always returns a value.", "A function only executes when it is called and we can reuse it in a program", "Python doesn't support nested function", "A function is a code block that only executes when called and a may be returns a value."], "oc": [false, false, false, false], "a": 2, "e": "'Python doesn't support nested function' is false because Python fully supports defining inner functions inside outer functions (closures and decorators). Note: the screenshot boxed option D, which is actually a true description of functions."}, {"n": 24, "s": 1, "lv": "E", "topic": "S12 · File Handling", "q": "Select the correct mode to open a file for appending as well as reading in Python:", "code": "", "lang": "", "chk": 0, "o": ["a+", "ar", "r+", "ar+"], "oc": [true, true, true, true], "a": 0, "e": "'a+' opens a file for both appending and reading. The file pointer is placed at the end of the file if it exists, or a new file is created if it does not exist."}, {"n": 25, "s": 1, "lv": "E", "topic": "S3 · Dictionaries", "q": "Which one of the following statements about Python dictionaries is correct?", "code": "", "lang": "", "chk": 0, "o": ["a dictionary can have two same keys with different values.", "a dictionary can have two same values with different keys", "a dictionary can have two same keys or same values but cannot have two same key-value pair", "a dictionary can neither have two same keys nor two same values."], "oc": [false, false, false, false], "a": 1, "e": "In a Python dictionary, keys must be unique, but multiple distinct keys can hold the exact same value (e.g., {'a': 1, 'b': 1})."}, {"n": 26, "s": 1, "lv": "E", "topic": "S10 · Pandas DataFrame", "q": "Which of the following are correct features of a DataFrame?", "code": "", "lang": "", "chk": 0, "o": ["Potentially columns are of different types", "Can Perform Arithmetic operations on rows and columns", "Labeled axes (rows and columns)", "All of the above"], "oc": [false, false, false, false], "a": 3, "e": "A DataFrame has labeled row and column axes, supports columns of different data types (int, float, string, boolean), and supports arithmetic operations across rows and columns."}, {"n": 27, "s": 1, "lv": "E", "topic": "S14 · R Introduction", "q": "R was created by Ross Ihaka and Robert Gentleman in the Department of Statistics at the University of _________.", "code": "", "lang": "", "chk": 0, "o": ["Denmark", "Auckland", "Belgium", "London"], "oc": [false, false, false, false], "a": 1, "e": "In 1991, R was created by Ross Ihaka and Robert Gentleman in the Department of Statistics at the University of Auckland, New Zealand."}, {"n": 28, "s": 1, "lv": "E", "topic": "S15 · R Data Objects", "q": "Which of the following commands helps to make a factor of a categorical variable in R?", "code": "", "lang": "", "chk": 0, "o": ["factor()", "as.factor()", "Asfactor ()", "AS.fact ()"], "oc": [true, true, true, true], "a": 0, "e": "factor() encodes a vector as a categorical factor variable (and as.factor() coerces an object to a factor)."}, {"n": 29, "s": 1, "lv": "E", "topic": "S15 · R Packages", "q": "Which of the following syntax is used to install the 'car' package in R?", "code": "", "lang": "", "chk": 0, "o": ["install.pack(\"car\")", "install.packages(\"cara\")", "install.packages(\"car\")", "all of the mentioned"], "oc": [true, true, true, false], "a": 2, "e": "install.packages(\"car\") downloads and installs the \"car\" package from CRAN."}, {"n": 30, "s": 1, "lv": "E", "topic": "S10 · Pandas Series", "q": "When we create a Pandas Series from a dictionary, the keys of the dictionary become ___________.", "code": "", "lang": "", "chk": 0, "o": ["Index of the series", "Value of the series", "Caption of the series", "none of above"], "oc": [false, false, false, false], "a": 0, "e": "When a dictionary is passed to pd.Series(d), the dictionary keys become the Series index labels and the dictionary values become the Series data values."}, {"n": 31, "s": 1, "lv": "E", "topic": "S17 · R Statistical Functions", "q": "Which of the following functions is used to find the variance of all values in R?", "code": "", "lang": "", "chk": 0, "o": ["var()", "sd()", "mean()", "all of the above"], "oc": [true, true, true, false], "a": 0, "e": "var() computes the sample variance in R, whereas sd() computes the standard deviation (the square root of variance) and mean() computes the average. (Note: the screenshot had sd() boxed, but var() is the function for variance.)"}, {"n": 32, "s": 1, "lv": "E", "topic": "S15 · R Data Objects", "q": "Attributes of an R object (if any) can be accessed using the ______ function.", "code": "", "lang": "", "chk": 0, "o": ["objects()", "attrib()", "attributes()", "all of the mentioned"], "oc": [true, true, true, false], "a": 2, "e": "attributes(x) returns or sets the list of attributes attached to an R object x (such as names, dim, class, row.names)."}, {"n": 33, "s": 1, "lv": "M", "topic": "S17 · R Normality Checks", "q": "Which of the following is a function/tool in R for checking normality?", "code": "", "lang": "", "chk": 0, "o": ["qqline()", "qline()", "anova()", "all of the mentioned"], "oc": [true, true, true, false], "a": 0, "e": "qqline() (used alongside qqnorm()) draws a reference line on a Normal Quantile-Quantile (Q-Q) plot to visually check whether data follows a normal distribution."}, {"n": 34, "s": 1, "lv": "M", "topic": "S17 · R Normality Checks", "q": "Which companion R function plots sample quantiles against theoretical normal quantiles to visually check normality (paired with qqline())?", "code": "", "lang": "", "chk": 0, "o": ["qqnorm()", "normplot()", "qnorm()", "rnorm()"], "oc": [true, true, true, true], "a": 0, "e": "qqnorm(x) produces a normal Q-Q plot of the values in x, and qqline(x) adds the theoretical reference line. (Note: In the exam PDF, Q35 was photographed twice on pages 6 & 7, skipping Q34; qqnorm() is explicitly noted in the Q33 study callout.)"}, {"n": 35, "s": 1, "lv": "E", "topic": "S17 · R Statistical Tests", "q": "Following function is used for the Chi-Square test in RStudio:", "code": "", "lang": "", "chk": 0, "o": ["chisq.test()", "chisquare()", "chi.square()", "None of above"], "oc": [true, true, true, false], "a": 0, "e": "chisq.test(data) performs chi-squared contingency table and goodness-of-fit tests in R."}, {"n": 36, "s": 1, "lv": "E", "topic": "S16 · R Tidyverse", "q": "Which of the following packages is NOT included in the core tidyverse?", "code": "", "lang": "", "chk": 0, "o": ["tidyr", "ggplot2", "readr", "tseries"], "oc": [true, true, true, true], "a": 3, "e": "The 8 core tidyverse packages are ggplot2, dplyr, tidyr, readr, purrr, tibble, stringr, and forcats. tseries is a separate time-series analysis package."}, {"n": 37, "s": 1, "lv": "E", "topic": "S3 · Nested Dictionaries", "q": "Select the correct way to print Emma's age from the nested dictionary:", "code": "student = {\n    1: {'name': 'Emma', 'age': '27', 'sex': 'Female'},\n    2: {'name': 'Mike', 'age': '22', 'sex': 'Male'}\n}", "lang": "py", "chk": 1, "o": ["student[0][1]", "student[1][\"age\"]", "student[0][\"age\"]", "none of above"], "oc": [true, true, true, false], "a": 1, "e": "student[1] accesses Emma's dictionary (key 1), and [\"age\"] retrieves her age value (\"27\")."}, {"n": 38, "s": 1, "lv": "E", "topic": "S16 · R Visualization", "q": "Which of the plots below can be made in R?", "code": "", "lang": "", "chk": 0, "o": ["Bar plot", "Pie Chart", "Box plot", "All of the above"], "oc": [false, false, false, false], "a": 3, "e": "R creates bar plots (barplot() / geom_bar()), pie charts (pie()), and box plots (boxplot() / geom_boxplot()), so 'All of the above' is correct. (Note: the screenshot had 'Box plot' boxed, though R supports all three.)"}, {"n": 39, "s": 1, "lv": "E", "topic": "S4 · List Comprehension", "q": "What is the output of the following list comprehension?", "code": "L = ['a' * x for x in range(4)]\nprint(L)", "lang": "py", "chk": 1, "o": ["['', 'a', 'aa', 'aaa']", "['a', 'aa', 'aaa']", "error", "none of above"], "oc": [true, true, false, false], "a": 0, "e": "range(4) yields 0, 1, 2, 3. For x = 0, 'a' * 0 evaluates to the empty string '', followed by 'a', 'aa', and 'aaa'."}, {"n": 40, "s": 1, "lv": "E", "topic": "S17 · R ANOVA", "q": "_______ function carries out one-way ANOVA in R.", "code": "", "lang": "", "chk": 0, "o": ["aov()", "ANOVA()", "ANOVA", "All of above"], "oc": [true, true, true, false], "a": 0, "e": "aov(formula, data) fits an Analysis of Variance (ANOVA) model in R."}, {"n": 41, "s": 2, "lv": "E", "topic": "S1 · Operators", "q": "In Python 3, what are the values and types returned by 15 / 4 and 15 // 4?", "code": "", "lang": "", "chk": 1, "o": ["3.75 (float) and 3 (int)", "3 (int) and 3.75 (float)", "3.75 (float) and 4 (int)", "3 (int) and 3 (int)"], "oc": [false, false, false, false], "a": 0, "e": "In Python 3, '/' performs true division and always returns a float (3.75), while '//' performs floor division and returns the floored integer quotient (3)."}, {"n": 42, "s": 2, "lv": "M", "topic": "S1 · Control Flow", "q": "In a Python for-else loop, when does the else block execute?", "code": "", "lang": "", "chk": 0, "o": ["Only when the loop terminates via a break statement", "Only when the loop finishes normally without encountering a break statement", "After every single iteration of the loop", "Only when the iterable is empty"], "oc": [false, false, false, false], "a": 1, "e": "The else clause on a for or while loop runs once the loop completes normally without hitting a break statement (including when the iterable is empty)."}, {"n": 43, "s": 2, "lv": "M", "topic": "S1 · Loops & Factorials", "q": "In the Session 1 factorial lab algorithm (f = 1, n = 0; repeat 10 times: print n! = f, n += 1, f *= n), what is the last factorial printed on the 10th iteration?", "code": "", "lang": "", "chk": 1, "o": ["9! = 362880", "10! = 3628800", "8! = 40320", "11! = 39916800"], "oc": [false, false, false, false], "a": 0, "e": "Because the print statement executes before n is incremented, repeating 10 times starting at n = 0 prints 0! through 9! (362880); after the 10th print, n becomes 10 and f becomes 3628800."}, {"n": 44, "s": 2, "lv": "E", "topic": "S2 · String Slicing", "q": "What is the output of 'PythonProgramming'[2:10:3]?", "code": "print('PythonProgramming'[2:10:3])", "lang": "py", "chk": 1, "o": ["'tnr'", "'toP'", "'tng'", "'yhr'"], "oc": [true, true, true, true], "a": 0, "e": "Starting at index 2 ('t'), stepping by 3 up to index 10 selects indices 2 ('t'), 5 ('n'), and 8 ('r'), producing 'tnr'."}, {"n": 45, "s": 2, "lv": "M", "topic": "S2 · Strings & Sets", "q": "Which Python expression accurately checks whether a sentence s is a pangram (contains all 26 English letters at least once)?", "code": "", "lang": "", "chk": 0, "o": ["set('abcdefghijklmnopqrstuvwxyz') <= set(s.lower())", "len(s.lower()) >= 26", "s.isalpha() and len(set(s)) == 26", "sorted(s.lower()) == list('abcdefghijklmnopqrstuvwxyz')"], "oc": [true, true, true, true], "a": 0, "e": "Converting s to lowercase and checking whether the set of all 26 ASCII lowercase letters is a subset (<=) of set(s.lower()) ignores spaces, digits, punctuation, and duplicate letters."}, {"n": 46, "s": 2, "lv": "M", "topic": "S3 · Dictionaries & ROT-13", "q": "In the Session 3 Caesar cipher lab, why can the exact same ROT-13 function be used for both encryption and decryption?", "code": "", "lang": "", "chk": 0, "o": ["Because the English alphabet has 26 letters and 13 + 13 = 26, making ROT-13 its own inverse", "Because Python dictionaries automatically reverse key-value lookups", "Because ROT-13 only shifts vowels", "Because ord() and chr() are symmetric functions"], "oc": [false, false, false, false], "a": 0, "e": "Applying a shift of 13 twice shifts each letter by 26 positions (modulo 26 = 0), returning every letter to its original position."}, {"n": 47, "s": 2, "lv": "M", "topic": "S3 · Dict Comprehension", "q": "What is the output of the following dictionary comprehension?", "code": "d = {x: x * x for x in range(6) if x % 2 == 1}\nprint(d)", "lang": "py", "chk": 1, "o": ["{1: 1, 3: 9, 5: 25}", "{0: 0, 2: 4, 4: 16}", "{1: 2, 3: 6, 5: 10}", "{1: 1, 2: 4, 3: 9, 4: 16, 5: 25}"], "oc": [true, true, true, true], "a": 0, "e": "range(6) yields 0..5; filtering with if x % 2 == 1 keeps odd numbers 1, 3, 5 and maps each to x*x."}, {"n": 48, "s": 2, "lv": "E", "topic": "S4 · List Operations", "q": "How does list.extend([4, 5]) differ from list.append([4, 5]) on a = [1, 2, 3]?", "code": "", "lang": "", "chk": 1, "o": ["extend produces [1, 2, 3, 4, 5] (length 5), whereas append produces [1, 2, 3, [4, 5]] (length 4)", "Both produce [1, 2, 3, 4, 5]", "append produces [1, 2, 3, 4, 5], whereas extend produces [1, 2, 3, [4, 5]]", "extend returns a new list while append modifies in place"], "oc": [false, false, false, false], "a": 0, "e": "extend() iterates over its argument and appends each element individually, while append() adds its argument as a single nested element. Both mutate the list in place and return None."}, {"n": 49, "s": 2, "lv": "E", "topic": "S4 · Split & Join", "q": "What is the output of '-'.join('a b  c'.split())?", "code": "print('-'.join('a b  c'.split()))", "lang": "py", "chk": 1, "o": ["'a-b-c'", "'a-b--c'", "['a', 'b', 'c']", "'a b c'"], "oc": [true, true, true, true], "a": 0, "e": "Calling .split() with no arguments splits on runs of arbitrary whitespace (compressing multiple spaces), yielding ['a', 'b', 'c']. '-'.join(...) joins them into 'a-b-c'."}, {"n": 50, "s": 2, "lv": "M", "topic": "S5 · Pickling", "q": "Which module and function serialize a Python object to a binary file stream in Python (Pickling)?", "code": "", "lang": "", "chk": 0, "o": ["pickle.dump(obj, file)", "pickle.dumps(obj, file)", "json.dump(obj, file)", "marshal.write(obj, file)"], "oc": [true, true, true, true], "a": 0, "e": "pickle.dump(obj, file) writes the pickled byte representation of obj to an open binary file object, whereas pickle.dumps(obj) returns a bytes object in memory."}, {"n": 51, "s": 2, "lv": "T", "topic": "S5 · Function Arguments", "q": "What is the output of calling add_item(1) followed by add_item(2) on the function below?", "code": "def add_item(x, items=[]):\n    items.append(x)\n    return items\n\nprint(add_item(1))\nprint(add_item(2))", "lang": "py", "chk": 1, "o": ["[1] then [1, 2]", "[1] then [2]", "[1, 2] then [1, 2]", "TypeError"], "oc": [true, true, true, false], "a": 0, "e": "Default argument values in Python are evaluated only once when the def statement is executed, not on each call. Both calls mutate and return the same shared list object."}, {"n": 52, "s": 2, "lv": "M", "topic": "S6 · Tuples & Sorting", "q": "In the Session 6 lab, given data = [('item1', '12.20'), ('item2', '15.10'), ('item3', '24.5')], which expression sorts the list in descending order by its float value?", "code": "", "lang": "", "chk": 0, "o": ["sorted(data, key=lambda x: float(x[1]), reverse=True)", "data.sort(reverse=True)", "sorted(data, key=lambda x: x[0], reverse=True)", "sorted(data, key=float)"], "oc": [true, true, true, true], "a": 0, "e": "Passing key=lambda x: float(x[1]) converts the second tuple element to float for numeric comparison, and reverse=True orders from highest (24.5) to lowest (12.20)."}, {"n": 53, "s": 2, "lv": "M", "topic": "S6 · Tuples & zip()", "q": "In the Session 6 lab, which expression computes the element-wise sum of t1 = (1, 2, 3, 4), t2 = (3, 5, 2, 1), and t3 = (2, 2, 3, 1) to produce (6, 9, 8, 6)?", "code": "", "lang": "", "chk": 1, "o": ["tuple(map(sum, zip(t1, t2, t3)))", "tuple(t1 + t2 + t3)", "sum(zip(t1, t2, t3))", "zip(sum(t1), sum(t2), sum(t3))"], "oc": [true, true, true, true], "a": 0, "e": "zip(t1, t2, t3) pairs corresponding elements ((1,3,2), (2,5,2), (3,2,3), (4,1,1)), map(sum, ...) sums each tuple, and tuple() converts the result to (6, 9, 8, 6)."}, {"n": 54, "s": 2, "lv": "E", "topic": "S7 · OOP Concepts", "q": "In a Python class, which special method is automatically invoked when an instance is passed to print() or str()?", "code": "", "lang": "", "chk": 0, "o": ["__str__(self)", "__init__(self)", "__call__(self)", "__new__(cls)"], "oc": [true, true, true, true], "a": 0, "e": "__str__(self) returns the informal, human-readable string representation of an object used by print() and str()."}, {"n": 55, "s": 2, "lv": "M", "topic": "S7 · OOP Data Hiding", "q": "How does Python implement data hiding for a class attribute named __gpa inside class Student?", "code": "", "lang": "", "chk": 0, "o": ["Name mangling rewrites it to _Student__gpa", "The interpreter blocks all external access with a PrivateAccessError", "It is deleted as soon as __init__ finishes", "It is converted into a read-only global variable"], "oc": [false, false, false, false], "a": 0, "e": "Double-leading-underscore attributes (__gpa) undergo name mangling to _ClassName__attribute (_Student__gpa) to prevent accidental overrides in subclasses."}, {"n": 56, "s": 2, "lv": "M", "topic": "S8 · Regular Expressions", "q": "What is the difference between re.match(pattern, text) and re.search(pattern, text) in Python's re module?", "code": "", "lang": "", "chk": 0, "o": ["re.match checks for a match only at the beginning of the string, while re.search scans through the entire string", "re.match returns all matches as a list, while re.search returns only the first match", "re.search checks only the beginning of the string, while re.match scans the whole string", "There is no difference"], "oc": [false, false, false, false], "a": 0, "e": "re.match() anchors at index 0 of the string, whereas re.search() scans anywhere in the string for the first location where the regex pattern matches."}, {"n": 57, "s": 2, "lv": "M", "topic": "S8 · Generators", "q": "What does a Python function containing the yield keyword return when called?", "code": "", "lang": "", "chk": 0, "o": ["A generator iterator object without immediately executing the function body", "A list containing all yielded values", "The first yielded value only", "A tuple of all local variables"], "oc": [false, false, false, false], "a": 0, "e": "Any function containing yield is a generator function. Calling it returns a generator object that produces values lazily on each call to next() or iteration in a loop."}, {"n": 58, "s": 2, "lv": "M", "topic": "S9 · Exception Handling", "q": "In Python exception handling, when do the else and finally blocks execute in a try-except-else-finally statement?", "code": "", "lang": "", "chk": 0, "o": ["else runs only if no exception was raised in try; finally always runs whether an exception occurred or not", "else runs when an exception occurs; finally runs only if no exception occurs", "Both else and finally run only when an exception is caught", "else always runs; finally runs only on unhandled exceptions"], "oc": [false, false, false, false], "a": 0, "e": "The else block runs only when the try block succeeds without raising an exception, while the finally block always executes as cleanup before leaving the try statement."}, {"n": 59, "s": 2, "lv": "E", "topic": "S9 · Logging in Python", "q": "What is the ascending order of standard severity levels in Python's logging module?", "code": "", "lang": "", "chk": 0, "o": ["DEBUG < INFO < WARNING < ERROR < CRITICAL", "INFO < DEBUG < WARNING < CRITICAL < ERROR", "TRACE < DEBUG < INFO < WARN < FATAL", "DEBUG < WARNING < INFO < ERROR < CRITICAL"], "oc": [false, false, false, false], "a": 0, "e": "Python's numeric logging levels are DEBUG (10), INFO (20), WARNING (30), ERROR (40), and CRITICAL (50). Default root logger threshold is WARNING."}, {"n": 60, "s": 2, "lv": "M", "topic": "S10 · NumPy & PIL Image", "q": "In the Session 10 PIL/NumPy lab, which pair of calls converts a PIL Image img to a NumPy array arr and back to a PIL Image?", "code": "", "lang": "", "chk": 0, "o": ["arr = np.array(img) and Image.fromarray(arr)", "arr = img.to_numpy() and Image.from_numpy(arr)", "arr = np.fromimage(img) and img.fromarray(arr)", "arr = np.imread(img) and Image.open(arr)"], "oc": [true, true, true, true], "a": 0, "e": "np.array(img) (or np.asarray(img)) converts a PIL Image into a 3D (H, W, C) or 2D NumPy array, and PIL.Image.fromarray(arr) reconstructs the PIL Image."}, {"n": 61, "s": 2, "lv": "M", "topic": "S10 · Pandas Wrangling", "q": "In the Session 10 diamonds DataFrame lab, which expression computes the count, minimum, and maximum price for each cut?", "code": "", "lang": "", "chk": 0, "o": ["df.groupby('cut')['price'].agg(['count', 'min', 'max'])", "df.sort_values('cut')['price'].describe()", "df.pivot('cut', 'price', ['count', 'min', 'max'])", "df.filter('cut').agg_price('count', 'min', 'max')"], "oc": [true, true, true, true], "a": 0, "e": "df.groupby('cut')['price'].agg(['count', 'min', 'max']) groups rows by the 'cut' column and aggregates the 'price' column with count, min, and max."}, {"n": 62, "s": 2, "lv": "E", "topic": "S10 · Pandas Data Cleaning", "q": "Which Pandas expression counts the total number of duplicate rows in a DataFrame df?", "code": "", "lang": "", "chk": 0, "o": ["df.duplicated().sum()", "df.drop_duplicates().count()", "df.isnull().sum()", "df.nunique()"], "oc": [true, true, true, true], "a": 0, "e": "df.duplicated() returns a boolean Series marking duplicate rows as True, and .sum() counts the True values."}, {"n": 63, "s": 2, "lv": "E", "topic": "S11 · BeautifulSoup", "q": "In BeautifulSoup, which method returns a list of all matching HTML tag elements, whereas which method returns only the first matching tag?", "code": "", "lang": "", "chk": 0, "o": ["find_all() returns a list of all matches; find() returns the first match", "select_one() returns all matches; select() returns the first match", "search_all() returns all matches; search() returns the first match", "get_all() returns all matches; get() returns the first match"], "oc": [false, false, false, false], "a": 0, "e": "soup.find_all('a') (or CSS selector soup.select('a')) returns a list of all matching elements, while soup.find('a') (or soup.select_one('a')) returns only the first match."}, {"n": 64, "s": 2, "lv": "E", "topic": "S11 · Seaborn Visualization", "q": "In the Session 11 visualization lab, which Seaborn function plots a color-coded matrix of pairwise column correlations with numeric values printed inside each cell?", "code": "", "lang": "", "chk": 0, "o": ["sns.heatmap(df.corr(numeric_only=True), annot=True)", "sns.scatterplot(df.corr(), labels=True)", "sns.pairplot(df, corr=True)", "sns.barplot(df.corr(), show_values=True)"], "oc": [true, true, true, true], "a": 0, "e": "sns.heatmap() takes the 2D correlation matrix from df.corr() and displays the correlation values inside each square when annot=True is passed."}, {"n": 65, "s": 2, "lv": "M", "topic": "S12 · Context Managers", "q": "Why is a with statement (context manager) recommended when opening files in Python (with open('data.txt') as f:)?", "code": "", "lang": "", "chk": 0, "o": ["It guarantees the file is automatically closed via __exit__() even if an exception occurs inside the block", "It loads the entire file into CPU cache memory", "It prevents SyntaxError inside the file", "It automatically converts text files to JSON"], "oc": [false, false, false, false], "a": 0, "e": "The context manager protocol (__enter__ and __exit__) ensures deterministic cleanup: the file stream is closed when exiting the with block, even if an exception is raised."}, {"n": 66, "s": 2, "lv": "E", "topic": "S12 · JSON Processing", "q": "In Python's json module, what is the difference between json.loads() and json.load()?", "code": "", "lang": "", "chk": 0, "o": ["json.loads() parses a JSON-formatted string, while json.load() reads and parses JSON from an open file-like object", "json.loads() reads a file, while json.load() parses a string", "json.loads() writes JSON to a string, while json.load() writes JSON to a file", "json.loads() only supports lists, while json.load() only supports dicts"], "oc": [false, false, false, false], "a": 0, "e": "The trailing 's' in loads() and dumps() stands for 'string': json.loads(str_data) deserializes a JSON string, whereas json.load(fp) deserializes from a file stream."}, {"n": 67, "s": 2, "lv": "E", "topic": "S13 · Virtual Environments", "q": "Which command creates a new isolated Python virtual environment named .venv using the standard library?", "code": "", "lang": "", "chk": 0, "o": ["python3 -m venv .venv", "pip create venv .venv", "python3 --virtualenv .venv", "venv init .venv"], "oc": [true, true, true, true], "a": 0, "e": "Python 3 includes the built-in venv module, invoked via python3 -m venv <directory>."}, {"n": 68, "s": 2, "lv": "M", "topic": "S13 · Database Connectivity", "q": "In Python DB-API 2.0 (such as sqlite3 or mysql.connector), why must you call conn.commit() after executing INSERT, UPDATE, or DELETE statements?", "code": "", "lang": "", "chk": 0, "o": ["Because DB-API connections start a transaction by default and changes are not persisted to disk until commit() is called", "Because execute() only checks SQL syntax without running the query", "Because commit() closes the cursor and frees memory", "Because SELECT queries fail unless commit() is called first"], "oc": [false, false, false, false], "a": 0, "e": "Per PEP 249 (DB-API 2.0), autocommit is off by default; DML modifications remain uncommitted in the current transaction until conn.commit() is invoked."}, {"n": 69, "s": 2, "lv": "M", "topic": "S13 · FastAPI", "q": "In FastAPI, given @app.get('/items/{item_id}') and def read_item(item_id: int, q: str = None):, how are item_id and q classified?", "code": "", "lang": "", "chk": 0, "o": ["item_id is a path parameter and q is an optional query parameter", "Both item_id and q are path parameters", "item_id is a request body model and q is a path parameter", "Both item_id and q are HTTP headers"], "oc": [false, false, false, false], "a": 0, "e": "Parameters declared in the URL route template ({item_id}) are extracted as path parameters; other scalar function parameters (like q: str = None) are extracted from the URL query string (?q=...)."}, {"n": 70, "s": 2, "lv": "E", "topic": "S13 · FastAPI Swagger UI", "q": "On which default URL path does FastAPI automatically serve its interactive Swagger UI documentation?", "code": "", "lang": "", "chk": 0, "o": ["/docs", "/swagger", "/api-docs", "/ui"], "oc": [true, true, true, true], "a": 0, "e": "FastAPI automatically generates OpenAPI documentation and serves interactive Swagger UI at /docs (and ReDoc at /redoc)."}, {"n": 71, "s": 2, "lv": "E", "topic": "S14 · R Arithmetic", "q": "In R, what do the operators %% and %/% compute in 17 %% 5 and 17 %/% 5?", "code": "", "lang": "", "chk": 1, "o": ["Remainder 2 and integer quotient 3", "Integer quotient 3 and remainder 2", "True division 3.4 and remainder 2", "Matrix product and element-wise division"], "oc": [false, false, false, false], "a": 0, "e": "In R, %% is the modulo operator (17 %% 5 == 2) and %/% is integer division (17 %/% 5 == 3)."}, {"n": 72, "s": 2, "lv": "M", "topic": "S14 · R Vector Recycling", "q": "What is the result of c(1, 2, 3, 4) + c(10, 20) in R?", "code": "", "lang": "", "chk": 1, "o": ["c(11, 22, 13, 24) due to vector recycling", "An error because the vector lengths differ", "c(11, 22, NA, NA)", "c(11, 22)"], "oc": [true, false, true, true], "a": 0, "e": "R recycles the shorter vector c(10, 20) to match the length of the longer vector, repeating it as c(10, 20, 10, 20) and adding element-wise to produce 11, 22, 13, 24."}, {"n": 73, "s": 2, "lv": "E", "topic": "S15 · R Data Structures", "q": "In R, what is the key difference between a matrix and a data.frame?", "code": "", "lang": "", "chk": 0, "o": ["A matrix is homogeneous (all elements must share the same atomic type), while a data.frame can have columns of different types", "A matrix is 1-dimensional, while a data.frame is 3-dimensional", "A data.frame can only store character strings, while a matrix stores numbers", "There is no difference"], "oc": [false, false, false, false], "a": 0, "e": "An R matrix is a 2D atomic vector where every cell has the same mode (e.g., all numeric or all character), whereas a data.frame is a list of equal-length vectors allowing heterogeneous column types."}, {"n": 74, "s": 2, "lv": "E", "topic": "S15 · R Exporting Data", "q": "In the Session 15 R lab, which function from the writexl package exports an R data frame df to an Excel .xlsx file?", "code": "", "lang": "", "chk": 0, "o": ["write_xlsx(df, \"output.xlsx\")", "export.excel(df, \"output.xlsx\")", "write.csv(df, \"output.xlsx\")", "save.xlsx(df, \"output.xlsx\")"], "oc": [true, true, true, true], "a": 0, "e": "The writexl package provides write_xlsx(x, path) to export a data frame or named list of data frames to an Excel .xlsx file without requiring Java."}, {"n": 75, "s": 2, "lv": "E", "topic": "S16 · R Tidyverse (dplyr)", "q": "In R's dplyr package (tidyverse), which verb adds new computed columns to a data frame while keeping existing columns?", "code": "", "lang": "", "chk": 0, "o": ["mutate()", "select()", "filter()", "arrange()"], "oc": [true, true, true, true], "a": 0, "e": "mutate() adds new variables or transforms existing ones while preserving all existing columns (transmute() drops unreferenced columns)."}, {"n": 76, "s": 2, "lv": "M", "topic": "S16 · R Tidyverse (tidyr)", "q": "In R's tidyr package, which function converts wide data (many columns) into tidy long format by collapsing column names into a key column and their values into a value column?", "code": "", "lang": "", "chk": 0, "o": ["pivot_longer()", "pivot_wider()", "separate()", "unite()"], "oc": [true, true, true, true], "a": 0, "e": "pivot_longer() (the modern replacement for gather()) lengthens data by increasing the number of rows and decreasing the number of columns; pivot_wider() does the inverse."}, {"n": 77, "s": 2, "lv": "M", "topic": "S17 · R ChickWeight Lab", "q": "In R, what does split(ChickWeight$weight, ChickWeight$Diet) return in the Session 17 lab?", "code": "", "lang": "", "chk": 0, "o": ["A named list of 4 numeric vectors containing the weights for each Diet group (1, 2, 3, 4)", "A single numeric mean value for all chicks", "A 4x4 correlation matrix", "A boxplot object"], "oc": [false, false, false, false], "a": 0, "e": "split(x, f) divides the data in vector/data.frame x into groups defined by factor f, returning a named list of subsets—one for each level of Diet."}, {"n": 78, "s": 2, "lv": "M", "topic": "S17 · R ChickWeight Lab", "q": "In the Session 17 ChickWeight lab, which base R expression computes the mean weight for each Time point among chicks in Diet group 4?", "code": "", "lang": "", "chk": 0, "o": ["with(subset(ChickWeight, Diet == 4), tapply(weight, Time, mean))", "mean(ChickWeight$weight, Diet == 4)", "split(ChickWeight, Time == 4)", "lapply(ChickWeight, Diet, mean)"], "oc": [true, true, true, true], "a": 0, "e": "subset(ChickWeight, Diet == 4) filters for Diet 4, and tapply(weight, Time, mean) applies mean() to weight grouped by each unique Time point."}, {"n": 79, "s": 2, "lv": "E", "topic": "S17 · R Markdown", "q": "In an R Markdown (.Rmd) code chunk ```{r, echo=FALSE}, what does the chunk option echo=FALSE do?", "code": "", "lang": "", "chk": 0, "o": ["It hides the R source code in the rendered output document but still runs the code and displays its results/plots", "It prevents the R code from executing", "It suppresses all plots and printed output while showing the code", "It deletes the chunk after rendering"], "oc": [false, false, false, false], "a": 0, "e": "echo=FALSE suppresses printing of the R source code itself while still evaluating the chunk and including its output and plots in the final report (eval=FALSE skips execution)."}, {"n": 80, "s": 2, "lv": "M", "topic": "S17 · R Built-in Functions", "q": "In R, what does mean(c(10, 20, NA, 30)) return by default, and how do you ignore missing values?", "code": "", "lang": "", "chk": 1, "o": ["Returns NA by default; pass na.rm = TRUE to get 20", "Returns 20 by default; pass na.rm = FALSE to get NA", "Returns 15 by treating NA as 0", "Raises a runtime stop() error"], "oc": [false, false, false, false], "a": 0, "e": "In R, arithmetic and statistical functions propagate NA by default so missing data is not silently ignored. Setting na.rm = TRUE strips NA values before computing the mean (60 / 3 = 20)."}, {"n": 81, "s": 3, "lv": "E", "topic": "S1 · Operator Precedence", "q": "What is the value of the Python expression 2 ** 3 ** 2?", "code": "", "lang": "", "chk": 1, "o": ["512", "64", "36", "12"], "oc": [false, false, false, false], "a": 0, "e": "The exponentiation operator (**) in Python is right-associative, so 2 ** (3 ** 2) = 2 ** 9 = 512 (whereas (2 ** 3) ** 2 would be 8 ** 2 = 64)."}, {"n": 82, "s": 3, "lv": "E", "topic": "S1 · Control Structures", "q": "What does the pass statement do in Python?", "code": "", "lang": "", "chk": 0, "o": ["It is a null operation (no-op) placeholder used where syntax requires a statement but no action is needed", "It skips the rest of the current loop iteration like continue", "It exits the enclosing function and returns None", "It passes arguments from a subclass to a superclass"], "oc": [false, false, false, false], "a": 0, "e": "pass does nothing when executed; it serves as a syntactic placeholder in empty function definitions, classes, or branches."}, {"n": 83, "s": 3, "lv": "M", "topic": "S1 · While Loop Lab", "q": "In the Session 1 factorial while-loop lab ('print all factorial values less than 2 billion'), what is the largest n! that is strictly less than 2,000,000,000?", "code": "", "lang": "", "chk": 1, "o": ["12! = 479,001,600 (since 13! = 6,227,020,800 > 2 billion)", "10! = 3,628,800", "15! = 1,307,674,368,000", "11! = 39,916,800"], "oc": [false, false, false, false], "a": 0, "e": "12! = 479,001,600 is under 2 billion, while 13! = 6,227,020,800 exceeds 2 billion."}, {"n": 84, "s": 3, "lv": "M", "topic": "S2 · String Palindromes", "q": "In the Session 2 phrase-palindrome lab, why do we apply ''.join(ch.lower() for ch in s if ch.isalnum()) before checking cleaned == cleaned[::-1]?", "code": "", "lang": "", "chk": 0, "o": ["To strip spaces and punctuation and normalize case so phrases like \"Was it a rat I saw?\" match forward and backward", "Because Python's [::-1] slice fails on strings containing spaces", "Because .lower() automatically removes punctuation", "To convert the string into a tuple of ASCII codes"], "oc": [false, false, false, false], "a": 0, "e": "Phrase palindromes ignore spacing, punctuation, and capitalization; keeping only alphanumeric characters in lowercase allows direct comparison with its reverse."}, {"n": 85, "s": 3, "lv": "E", "topic": "S2 · Multiple Assignment", "q": "What happens when you execute a, *b, c = [10, 20, 30, 40, 50] in Python?", "code": "", "lang": "", "chk": 1, "o": ["a = 10, b = [20, 30, 40], c = 50", "a = 10, b = (20, 30, 40), c = 50", "ValueError: too many values to unpack", "a = [10, 20], b = 30, c = [40, 50]"], "oc": [true, true, false, true], "a": 0, "e": "Extended iterable unpacking (*b) always assigns the middle elements as a list ([20, 30, 40]), while a gets the first item (10) and c gets the last item (50)."}, {"n": 86, "s": 3, "lv": "M", "topic": "S3 · Dictionary Methods", "q": "What does d.setdefault('count', 0) do on a Python dictionary d?", "code": "", "lang": "", "chk": 0, "o": ["If 'count' is in d, returns d['count'] without changing d; otherwise inserts d['count'] = 0 and returns 0", "Always overwrites d['count'] with 0", "Sets a default value of 0 for all future missing keys in d", "Raises KeyError if 'count' is missing"], "oc": [false, false, false, false], "a": 0, "e": "setdefault(key, default) returns the existing value if key is present; only when key is absent does it insert key: default and return default."}, {"n": 87, "s": 3, "lv": "E", "topic": "S3 · Dictionary Keys", "q": "Which data types can be used as keys in a standard Python dictionary?", "code": "", "lang": "", "chk": 0, "o": ["Only hashable (immutable) objects such as str, int, float, and tuples of immutable elements", "Any Python object including lists and dictionaries", "Only strings and integers", "Lists, sets, and tuples"], "oc": [false, false, false, false], "a": 0, "e": "Dictionary keys must be hashable (__hash__ remains constant). Mutable containers like list, dict, and set are unhashable (raising TypeError: unhashable type), whereas a tuple of immutables is hashable."}, {"n": 88, "s": 3, "lv": "M", "topic": "S4 · List References", "q": "What is the output of the following shallow-copy list code?", "code": "a = [[1, 2], [3, 4]]\nb = a[:]\nb[0][0] = 99\nprint(a)", "lang": "py", "chk": 1, "o": ["[[99, 2], [3, 4]]", "[[1, 2], [3, 4]]", "[[99, 2], [99, 4]]", "IndexError"], "oc": [true, true, true, false], "a": 0, "e": "b = a[:] creates a shallow copy of the outer list, so a[0] and b[0] still reference the exact same inner list [1, 2]. Mutating b[0][0] = 99 is visible through a."}, {"n": 89, "s": 3, "lv": "E", "topic": "S4 · Deleting List Elements", "q": "What is the difference between list.pop(1) and list.remove(1) on L = [10, 1, 20]?", "code": "", "lang": "", "chk": 0, "o": ["L.pop(1) removes by index (removing 1 at index 1 and returning it); L.remove(1) searches by value (removing the first occurrence of 1 and returning None)", "Both remove the element at index 1", "L.pop(1) removes the value 1; L.remove(1) removes index 1", "Both return the removed element"], "oc": [false, false, false, false], "a": 0, "e": "pop(i) takes an optional index (defaulting to -1) and returns the removed item; remove(val) deletes the first matching value and returns None."}, {"n": 90, "s": 3, "lv": "M", "topic": "S5 · Recursion", "q": "In the Session 5 recursive sum lab (sum(x) returns 1 if x == 1 else x + sum(x - 1)), what happens if sum(0) is called without modifying the base case?", "code": "", "lang": "", "chk": 0, "o": ["It recurses infinitely through negative numbers until Python raises RecursionError", "It immediately returns 0", "It returns 1", "It raises ValueError"], "oc": [false, false, false, false], "a": 0, "e": "Because 0 < 1, x == 1 is False and x - 1 moves away from 1 (-1, -2, ...), hitting Python's maximum recursion depth (RecursionError)."}, {"n": 91, "s": 3, "lv": "M", "topic": "S5 · Filter & Comprehensions", "q": "In the Session 5 lab function filter_long_words(words, n), which expression returns all words strictly longer than n characters?", "code": "", "lang": "", "chk": 0, "o": ["[w for w in words if len(w) > n]", "[len(w) for w in words if w > n]", "list(map(lambda w: len(w) > n, words))", "words.filter(len > n)"], "oc": [true, true, true, true], "a": 0, "e": "A list comprehension [w for w in words if len(w) > n] (or list(filter(lambda w: len(w) > n, words))) keeps words whose length exceeds n. map() would return booleans instead of words."}, {"n": 92, "s": 3, "lv": "E", "topic": "S6 · Tuples", "q": "How do you define a single-element tuple containing the integer 5 in Python?", "code": "", "lang": "", "chk": 0, "o": ["(5,)", "(5)", "tuple(5)", "[5]"], "oc": [true, true, true, true], "a": 0, "e": "A trailing comma (5,) is required for a 1-element tuple; (5) is just the integer 5 in grouping parentheses, and tuple(5) raises TypeError because int is not iterable."}, {"n": 93, "s": 3, "lv": "M", "topic": "S6 · Tuples Lab", "q": "In the Session 6 lab ('count the elements in a list until an element is a tuple'), what does the code below print for data = [10, 20, 30, (40, 50), 60]?", "code": "data = [10, 20, 30, (40, 50), 60]\ncount = 0\nfor x in data:\n    if isinstance(x, tuple):\n        break\n    count += 1\nprint(count)", "lang": "py", "chk": 1, "o": ["3", "4", "5", "2"], "oc": [false, false, false, false], "a": 0, "e": "10, 20, and 30 are integers (count becomes 3). On (40, 50), isinstance(x, tuple) is True and break stops the loop."}, {"n": 94, "s": 3, "lv": "M", "topic": "S7 · Inheritance & MRO", "q": "In Python multiple inheritance class D(B, C): where both B and C inherit from A, which attribute inspects the Method Resolution Order (C3 linearization)?", "code": "", "lang": "", "chk": 0, "o": ["D.__mro__ or D.mro()", "D.__bases__", "D.__dict__", "super(D)"], "oc": [true, true, true, true], "a": 0, "e": "Class.__mro__ (a tuple) or Class.mro() (a list) shows the exact C3 linearization order Python searches when resolving methods and super() calls."}, {"n": 95, "s": 3, "lv": "M", "topic": "S8 · Decorators", "q": "In the Session 8 decorator lab (log_method_call), why is @functools.wraps(func) placed on the inner wrapper(*args, **kwargs) function?", "code": "", "lang": "", "chk": 0, "o": ["To preserve the original function's metadata (__name__, __doc__, __qualname__) instead of replacing them with 'wrapper'", "To make the decorated function run twice as fast", "Because Python syntax requires @wraps inside every decorator", "To automatically catch exceptions inside func"], "oc": [false, false, false, false], "a": 0, "e": "@functools.wraps(func) copies __name__, __doc__, __annotations__, and __wrapped__ from func onto wrapper."}, {"n": 96, "s": 3, "lv": "M", "topic": "S8 · Regular Expressions", "q": "What is the output of re.findall(r'\\d+', 'Order 42 costs 350 rupees and 99 paise')?", "code": "import re\nprint(re.findall(r'\\d+', 'Order 42 costs 350 rupees and 99 paise'))", "lang": "py", "chk": 1, "o": ["['42', '350', '99']", "['4', '2', '3', '5', '0', '9', '9']", "('42', '350', '99')", "'42'"], "oc": [true, true, true, true], "a": 0, "e": "re.findall() returns a list of all non-overlapping matches of r'\\d+' (one or more digits), which are ['42', '350', '99']."}, {"n": 97, "s": 3, "lv": "E", "topic": "S9 · User-Defined Exceptions", "q": "When defining a custom user-defined exception class in Python, which built-in class should it inherit from?", "code": "", "lang": "", "chk": 0, "o": ["Exception", "BaseObject", "RuntimeWarning", "Throwable"], "oc": [true, true, true, true], "a": 0, "e": "User-defined exceptions should inherit from Exception (not BaseException directly, since BaseException also includes SystemExit and KeyboardInterrupt)."}, {"n": 98, "s": 3, "lv": "M", "topic": "S9 · Try-Finally Clause", "q": "What happens when a return statement is executed inside a try block that also has a finally block?", "code": "", "lang": "", "chk": 0, "o": ["The finally block still executes before the function actually returns to the caller", "The finally block is skipped", "Python raises a SyntaxError", "The return value is discarded unless finally also returns"], "oc": [false, false, false, false], "a": 0, "e": "finally is guaranteed to run whenever control leaves a try block—including via return, break, continue, or an exception. (If finally itself executes a return, that overrides the try's return.)"}, {"n": 99, "s": 3, "lv": "E", "topic": "S10 · Pandas Indexing", "q": "In Pandas, what is the difference between df.loc[] and df.iloc[]?", "code": "", "lang": "", "chk": 0, "o": ["df.loc[] selects by row/column labels (and includes the stop label in slices), while df.iloc[] selects by 0-based integer positions (excluding the stop index)", "df.loc[] selects by integer position, while df.iloc[] selects by label", "df.loc[] works only on rows, while df.iloc[] works only on columns", "They are aliases for the exact same indexer"], "oc": [false, false, false, false], "a": 0, "e": "loc is label-based (inclusive of slice endpoints), whereas iloc is integer-position-based (half-open [start:stop) like standard Python slicing)."}, {"n": 100, "s": 3, "lv": "M", "topic": "S10 · Pandas DataFrame Summary", "q": "In the Session 10 lab, which Pandas method prints a concise summary of a DataFrame including index dtype, column names, non-null counts, and memory usage?", "code": "", "lang": "", "chk": 0, "o": ["df.info()", "df.describe()", "df.head()", "df.summary()"], "oc": [true, true, true, true], "a": 0, "e": "df.info() prints the DataFrame class, index range, column dtypes, non-null counts, and memory usage. df.describe() computes summary statistics for columns."}, {"n": 101, "s": 3, "lv": "M", "topic": "S10 · NumPy Broadcasting", "q": "Given NumPy arrays A of shape (3, 1) and B of shape (1, 4), what is the shape of A + B via broadcasting?", "code": "", "lang": "", "chk": 1, "o": ["(3, 4)", "(3, 1)", "(1, 4)", "ValueError: operands could not be broadcast together"], "oc": [true, true, true, false], "a": 0, "e": "Under NumPy broadcasting rules, dimensions of size 1 stretch to match the other array's size, so (3, 1) and (1, 4) broadcast to (3, 4)."}, {"n": 102, "s": 3, "lv": "E", "topic": "S11 · BeautifulSoup", "q": "In BeautifulSoup, given tag = soup.find('a', href=True), how do you extract the URL string inside its href attribute?", "code": "", "lang": "", "chk": 0, "o": ["tag['href'] or tag.get('href')", "tag.href()", "tag.text['href']", "soup.href(tag)"], "oc": [true, true, true, true], "a": 0, "e": "BeautifulSoup Tag objects behave like dictionaries for HTML attributes: tag['href'] or tag.get('href') returns the attribute value, while tag.text (or tag.get_text()) returns the inner text."}, {"n": 103, "s": 3, "lv": "E", "topic": "S11 · Plotly Visualization", "q": "In Plotly Express (Session 11 lab), which function creates an interactive scatter plot of carat vs price from the diamonds DataFrame?", "code": "", "lang": "", "chk": 0, "o": ["px.scatter(df, x='carat', y='price')", "px.plot_scatter(df['carat'], df['price'])", "px.points(df, 'carat', 'price')", "plt.scatter_plotly(df, 'carat', 'price')"], "oc": [true, true, true, true], "a": 0, "e": "plotly.express.scatter(df, x=..., y=...) builds an interactive scatter plot figure."}, {"n": 104, "s": 3, "lv": "M", "topic": "S12 · CSV Processing", "q": "When writing a CSV file on Windows using Python's csv.writer, why should open('out.csv', 'w', newline='') be used?", "code": "", "lang": "", "chk": 0, "o": ["To prevent csv.writer's '\\r\\n' line endings from being translated a second time into '\\r\\r\\n', which causes blank lines be
