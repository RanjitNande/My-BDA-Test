tween rows", "Because csv.writer raises an error if newline is not specified", "To strip all newline characters so the CSV is written on a single line", "To force UTF-16 encoding"], "oc": [false, false, false, false], "a": 0, "e": "The csv module writes its own '\\r\\n' line terminators; passing newline='' disables universal newline translation so extra blank lines are not inserted."}, {"n": 105, "s": 3, "lv": "M", "topic": "S12 · CSV Processing", "q": "In Python's csv module, which class reads each row of a CSV file as an ordered dictionary keyed by the header row's column names?", "code": "", "lang": "", "chk": 0, "o": ["csv.DictReader", "csv.JsonReader", "csv.HeaderReader", "csv.reader(as_dict=True)"], "oc": [true, true, true, true], "a": 0, "e": "csv.DictReader(f) uses the first row of the CSV (unless fieldnames is passed) as dictionary keys for every subsequent row."}, {"n": 106, "s": 3, "lv": "M", "topic": "S13 · FastAPI Request Models", "q": "In FastAPI, how do you define and validate a JSON request body for a POST endpoint?", "code": "", "lang": "", "chk": 0, "o": ["Define a class inheriting from pydantic.BaseModel and use it as the type annotation of the endpoint parameter", "Use @app.body(json=True) above the function", "Pass request.json() as a default argument in @app.get()", "Inherit from fastapi.JsonTable"], "oc": [false, false, false, false], "a": 0, "e": "FastAPI uses Pydantic BaseModel classes to parse, validate, and document JSON request bodies and response models automatically."}, {"n": 107, "s": 3, "lv": "M", "topic": "S13 · Database Security", "q": "Why should parameterized queries (cursor.execute('SELECT * FROM users WHERE id = ?', (user_id,))) always be used instead of Python f-strings in SQL queries?", "code": "", "lang": "", "chk": 0, "o": ["To prevent SQL injection attacks and let the database driver safely escape parameter values", "Because Python f-strings cannot contain SQL keywords", "Because cursor.execute() rejects strings longer than 50 characters", "To convert SQL tables into NumPy arrays automatically"], "oc": [false, false, false, false], "a": 0, "e": "String formatting/concatenation of user input into SQL queries exposes the database to SQL injection; parameterized placeholders (? in sqlite3, %s in mysql.connector/psycopg2) separate SQL code from data."}, {"n": 108, "s": 3, "lv": "E", "topic": "S14 · R Data Types", "q": "In R, what is the difference between typeof(10) and typeof(10L)?", "code": "", "lang": "", "chk": 0, "o": ["typeof(10) is \"double\", while typeof(10L) is \"integer\"", "typeof(10) is \"integer\", while typeof(10L) is \"long\"", "Both return \"numeric\"", "typeof(10) is \"float\", while typeof(10L) is \"double\""], "oc": [false, false, false, false], "a": 0, "e": "In R, plain number literals like 10 are double-precision floating-point values (typeof(10) == 'double'), whereas the 'L' suffix creates a 32-bit integer (typeof(10L) == 'integer')."}, {"n": 109, "s": 3, "lv": "M", "topic": "S15 · R Type Coercion", "q": "In R, what does c(1, TRUE, 'three') evaluate to?", "code": "", "lang": "", "chk": 0, "o": ["c(\"1\", \"TRUE\", \"three\") (a character vector via implicit coercion)", "A list containing 1, TRUE, and \"three\"", "An error due to mixed types", "c(1, 1, NA) (a numeric vector)"], "oc": [true, false, false, true], "a": 0, "e": "c() creates an atomic vector, which must be homogeneous. R coerces elements along the hierarchy logical -> integer -> double -> complex -> character, turning all three into character strings."}, {"n": 110, "s": 3, "lv": "M", "topic": "S15 · R Lists of DataFrames", "q": "Given an R list lst <- list(df1 = data.frame(a=1:2), df2 = data.frame(b=3:4)), what is the difference between lst[1] and lst[[1]]?", "code": "", "lang": "", "chk": 0, "o": ["lst[1] returns a sublist of length 1 (class 'list'), whereas lst[[1]] extracts the actual data.frame object inside element 1", "lst[1] extracts the data.frame, whereas lst[[1]] returns a sublist", "lst[[1]] is invalid syntax in R", "Both return the exact same object"], "oc": [false, false, false, false], "a": 0, "e": "Single brackets [ ] always slice and return a list, while double brackets [[ ]] (or $name) extract the single underlying element itself."}, {"n": 111, "s": 3, "lv": "M", "topic": "S15 · R Sorting DataFrames", "q": "In Base R (Session 15 lab), how do you sort a data frame df ascending by column dept and descending by numeric column salary?", "code": "", "lang": "", "chk": 0, "o": ["df[order(df$dept, -df$salary), ]", "sort(df, by = c('dept', '-salary'))", "df.sort_values(['dept', 'salary'])", "order(df, dept, desc(salary))"], "oc": [true, true, true, true], "a": 0, "e": "order() returns the row permutation indices; negating a numeric vector (-df$salary) sorts it descending, and indexing df[order(...), ] reorders the rows."}, {"n": 112, "s": 3, "lv": "E", "topic": "S16 · R Tidyverse (dplyr)", "q": "In R's dplyr package, what is the difference between filter() and select()?", "code": "", "lang": "", "chk": 0, "o": ["filter() subsets rows based on logical conditions, while select() subsets columns by name or helper function", "filter() subsets columns, while select() subsets rows", "Both subset rows, but select() also sorts them", "filter() works on matrices, while select() works on lists"], "oc": [false, false, false, false], "a": 0, "e": "In dplyr, filter() keeps rows matching row predicates, and select() picks or reorders columns."}, {"n": 113, "s": 3, "lv": "E", "topic": "S16 · R ggplot2", "q": "In ggplot2, which operator chains geometric layers (such as geom_point() or geom_bar()) onto a ggplot(data, aes(...)) object?", "code": "", "lang": "", "chk": 0, "o": ["+", "%>%", "|>", "->"], "oc": [true, true, true, true], "a": 0, "e": "ggplot2 uses the '+' operator to add geoms, scales, facets, and themes to a plot object (whereas '%>%' and '|>' pipe data between functions)."}, {"n": 114, "s": 3, "lv": "M", "topic": "S16 · R Merging DataFrames", "q": "In Base R, how do you perform an inner join vs. a left outer join of two data frames x and y?", "code": "", "lang": "", "chk": 0, "o": ["merge(x, y) performs an inner join; merge(x, y, all.x = TRUE) performs a left join", "join(x, y) for inner; join(x, y, left = TRUE) for left", "cbind(x, y) for inner; rbind(x, y) for left", "merge(x, y, all = TRUE) for inner; merge(x, y, all.y = TRUE) for left"], "oc": [true, true, true, true], "a": 0, "e": "Base R's merge(x, y) keeps only matching rows by default (inner join). Setting all.x = TRUE keeps all rows of x (left join), all.y = TRUE keeps all rows of y (right join), and all = TRUE performs a full outer join."}, {"n": 115, "s": 3, "lv": "E", "topic": "S17 · R Apply Family", "q": "What is the difference between lapply(X, FUN) and sapply(X, FUN) in R?", "code": "", "lang": "", "chk": 0, "o": ["lapply() always returns a list, while sapply() attempts to simplify the result to a vector or matrix", "sapply() always returns a list, while lapply() returns a vector", "lapply() only works on matrices, while sapply() only works on data frames", "sapply() modifies X in place"], "oc": [false, false, false, false], "a": 0, "e": "'l' in lapply stands for list (always returns a list of the same length as X); 's' in sapply stands for simplify (simplifies to an atomic vector or matrix when all outputs have equal length)."}, {"n": 116, "s": 3, "lv": "M", "topic": "S17 · R Apply Family", "q": "In R, what does apply(mat, 1, sum) compute compared to apply(mat, 2, sum) on a 2D matrix mat?", "code": "", "lang": "", "chk": 0, "o": ["MARGIN = 1 sums across each row; MARGIN = 2 sums down each column", "MARGIN = 1 sums down each column; MARGIN = 2 sums across each row", "MARGIN = 1 sums the first row only; MARGIN = 2 sums the second row only", "Both compute the grand total of the matrix"], "oc": [false, false, false, false], "a": 0, "e": "In apply(X, MARGIN, FUN), MARGIN = 1 applies FUN over rows and MARGIN = 2 applies FUN over columns."}, {"n": 117, "s": 3, "lv": "E", "topic": "S17 · R Character Functions", "q": "In R, what is the difference between paste('a', 'b') and paste0('a', 'b')?", "code": "", "lang": "", "chk": 0, "o": ["paste(\"a\", \"b\") separates arguments with a space (\"a b\") by default, while paste0(\"a\", \"b\") concatenates with no separator (\"ab\")", "paste0() adds a \"0\" between strings (\"a0b\")", "paste() returns a list while paste0() returns a character vector", "There is no difference"], "oc": [false, false, false, false], "a": 0, "e": "paste(..., sep = ' ') defaults to a single space separator, whereas paste0(...) is an efficient shorthand for paste(..., sep = '')."}, {"n": 118, "s": 3, "lv": "M", "topic": "S17 · R Normality Tests", "q": "In R statistical testing, what is the null hypothesis (H0) of shapiro.test(x) and ad.test(x)?", "code": "", "lang": "", "chk": 0, "o": ["H0: The sample data comes from a normally distributed population (so p-value < 0.05 rejects normality)", "H0: The sample data is NOT normally distributed (so p-value < 0.05 confirms normality)", "H0: Two group means are equal", "H0: Two categorical variables are independent"], "oc": [false, false, false, false], "a": 0, "e": "In normality tests (Shapiro-Wilk shapiro.test and Anderson-Darling ad.test), the null hypothesis is that the population is normal. A small p-value (< 0.05) indicates significant departure from normality."}, {"n": 119, "s": 3, "lv": "M", "topic": "S17 · R ChickWeight Dataset", "q": "In the R built-in ChickWeight dataset (Session 17 lab), what are the four variables (columns)?", "code": "", "lang": "", "chk": 0, "o": ["weight, Time, Chick, and Diet", "height, age, Bird, and Food", "mass, Day, ID, and Group", "weight, Week, Hen, and Feed"], "oc": [false, false, false, false], "a": 0, "e": "ChickWeight has 578 rows and 4 columns: weight (numeric body weight in gm), Time (numeric days since birth), Chick (ordered factor 1..50), and Diet (factor 1..4)."}, {"n": 120, "s": 3, "lv": "E", "topic": "S17 · R Plotting", "q": "In Base R graphics (Session 17 ChickWeight lab), after drawing a line plot with plot(x, y, type='l'), which function adds a second line for another group to the existing plot?", "code": "", "lang": "", "chk": 0, "o": ["lines(x2, y2)", "plot(x2, y2, add=TRUE)", "geom_line(x2, y2)", "abline(x2, y2)"], "oc": [true, true, true, true], "a": 0, "e": "plot() starts a new plot frame, while lines(x, y) (and points(x, y)) overlays additional lines or points onto the active plot canvas; legend() adds a legend."}, {"n": 121, "s": 4, "lv": "M", "topic": "S1 · Short-Circuit Operators", "q": "What is the output of print(0 or 'Hello', 'World' and 42) in Python?", "code": "print(0 or 'Hello', 'World' and 42)", "lang": "py", "chk": 1, "o": ["Hello 42", "True True", "0 'World'", "False 42"], "oc": [true, true, true, true], "a": 0, "e": "Python's 'or' and 'and' short-circuit and return the actual operand value: '0 or \"Hello\"' returns 'Hello' (since 0 is falsy), and '\"World\" and 42' returns 42 (since 'World' is truthy)."}, {"n": 122, "s": 4, "lv": "E", "topic": "S1 · Identity vs Equality", "q": "What is the difference between is and == in Python?", "code": "", "lang": "", "chk": 0, "o": ["'is' checks object identity (whether two references point to the exact same object in memory, id(a) == id(b)), while '==' checks value equality", "'is' checks value equality, while '==' checks memory address", "'is' works only on strings, while '==' works only on numbers", "There is no difference"], "oc": [false, false, false, false], "a": 0, "e": "'==' invokes __eq__() to compare values, whereas 'is' compares object identity (memory address)."}, {"n": 123, "s": 4, "lv": "E", "topic": "S2 · String Formatting", "q": "What does f'{3.14159:.2f}' evaluate to in Python?", "code": "print(f'{3.14159:.2f}')", "lang": "py", "chk": 1, "o": ["'3.14'", "'3.14159'", "'3.1'", "'3.15'"], "oc": [true, true, true, true], "a": 0, "e": "The format specifier :.2f formats a floating-point number to 2 decimal places ('3.14')."}, {"n": 124, "s": 4, "lv": "M", "topic": "S2 · Histogram Lab", "q": "In the Session 2 lab procedure histogram([4, 9, 7]), what does the code below print?", "code": "def histogram(items):\n    for n in items:\n        print('*' * n)\n\nhistogram([4, 9, 7])", "lang": "py", "chk": 1, "o": ["Three lines of asterisks with 4, 9, and 7 '*' characters respectively", "The sum 20", "A single line with 20 '*' characters", "['****', '*********', '*******']"], "oc": [false, false, false, false], "a": 0, "e": "In Python, multiplying a string '*' by an integer n repeats the character n times, printing ****, *********, and ******* on separate lines."}, {"n": 125, "s": 4, "lv": "M", "topic": "S3 · Sorting Dictionaries", "q": "In the Session 5 lab ('sort and print students and their favourite colours alphabetically by name' for people = {'Arham':'Blue','Lisa':'Yellow','Vinod':'Purple','Jenny':'Pink'}), which loop prints the pairs sorted by student name?", "code": "", "lang": "", "chk": 0, "o": ["for k, v in sorted(people.items()): print(k, v)", "for k, v in people.sort(): print(k, v)", "for k, v in sorted(people.values()): print(k, v)", "print(people.sorted_keys())"], "oc": [true, true, true, true], "a": 0, "e": "sorted(people.items()) returns a list of (key, value) tuples sorted alphabetically by key (since tuples compare element by element starting at index 0)."}, {"n": 126, "s": 4, "lv": "E", "topic": "S3 · Dictionary Methods", "q": "What does dict.fromkeys(['a', 'b', 'c'], 0) return?", "code": "print(dict.fromkeys(['a', 'b', 'c'], 0))", "lang": "py", "chk": 1, "o": ["{'a': 0, 'b': 0, 'c': 0}", "[('a', 0), ('b', 0), ('c', 0)]", "{0: ['a', 'b', 'c']}", "{'a': None, 'b': None, 'c': 0}"], "oc": [true, true, true, true], "a": 0, "e": "dict.fromkeys(iterable, value) creates a new dictionary with keys from iterable and all values set to value (default None)."}, {"n": 127, "s": 4, "lv": "M", "topic": "S4 · Sorting Lists", "q": "What is the difference between nums.sort() and sorted(nums) in Python?", "code": "", "lang": "", "chk": 0, "o": ["nums.sort() sorts the list in place and returns None; sorted(nums) leaves nums unchanged and returns a new sorted list", "sorted(nums) sorts in place and returns None; nums.sort() returns a new list", "nums.sort() works on any iterable (tuples, dicts, sets); sorted() works only on lists", "Both modify the list in place and return the list"], "oc": [false, false, false, false], "a": 0, "e": "list.sort() is a list-only method that mutates the list in place and returns None; the built-in sorted() accepts any iterable and returns a new sorted list."}, {"n": 128, "s": 4, "lv": "M", "topic": "S4 · List Comprehension", "q": "What is the output of the following list comprehension with a conditional expression?", "code": "res = ['even' if x % 2 == 0 else 'odd' for x in range(4)]\nprint(res)", "lang": "py", "chk": 1, "o": ["['even', 'odd', 'even', 'odd']", "[0, 2]", "[1, 3]", "SyntaxError"], "oc": [true, true, true, false], "a": 0, "e": "When 'A if cond else B' appears before 'for' in a list comprehension, it is a ternary conditional expression that transforms every element rather than filtering."}, {"n": 129, "s": 4, "lv": "M", "topic": "S5 · Global & Local Variables", "q": "In Python scope resolution (LEGB rule), what is the difference between the global and nonlocal keywords?", "code": "", "lang": "", "chk": 0, "o": ["global binds a name to the module-level (global) namespace, while nonlocal binds a name to the nearest enclosing function's scope", "nonlocal binds a name to the global scope, while global binds to built-in scope", "They are synonyms and can be used interchangeably", "nonlocal creates a new variable in the caller's module"], "oc": [false, false, false, false], "a": 0, "e": "LEGB stands for Local, Enclosing, Global, Built-in. 'global x' modifies a module-level variable, while 'nonlocal x' modifies a variable in an outer (enclosing) non-global function."}, {"n": 130, "s": 4, "lv": "M", "topic": "S5 · String & Regex Lab", "q": "In the Session 5 spelling-correction lab correct(s), which regex call inserts a space after a period whenever a period is immediately followed by a letter (e.g. 'cool.Indeed!' -> 'cool. Indeed!')?", "code": "", "lang": "", "chk": 0, "o": ["re.sub(r'\\.([A-Za-z])', r'. \\1', s)", "re.sub(r'\\.', '. ', s)", "s.replace('.', ' .')", "re.split(r'\\.[A-Za-z]', s)"], "oc": [true, true, true, true], "a": 0, "e": "r'\\.([A-Za-z])' matches a literal period followed immediately by a letter (captured in group 1), and r'. \\1' replaces it with a period, a space, and that captured letter."}, {"n": 131, "s": 4, "lv": "E", "topic": "S5 · Modules", "q": "What happens when a Python file is executed directly (`python3 app.py`) vs. imported as a module (`import app`)?", "code": "", "lang": "", "chk": 0, "o": ["__name__ is '__main__' when executed directly, and 'app' (the module name) when imported", "__name__ is always 'app'", "__name__ is '__init__' when executed directly", "__name__ is None when imported"], "oc": [false, false, false, false], "a": 0, "e": "Checking if __name__ == '__main__': lets a file run script/test code when executed directly without running it on import."}, {"n": 132, "s": 4, "lv": "M", "topic": "S6 · Tuple Immutability", "q": "Given t = (1, 2, [30, 40]), what happens when t[2].append(50) is executed?", "code": "t = (1, 2, [30, 40])\nt[2].append(50)\nprint(t)", "lang": "py", "chk": 1, "o": ["It succeeds and t becomes (1, 2, [30, 40, 50]) because the tuple's reference to the list does not change, while the list itself is mutable", "It raises TypeError: 'tuple' object does not support item assignment", "It creates a new tuple and leaves t unchanged", "It converts t into a list"], "oc": [false, false, false, false], "a": 0, "e": "A tuple's immutability means its slot references cannot be rebound (t[2] = ... fails), but if an element is a mutable list, mutating that list in place via .append() succeeds."}, {"n": 133, "s": 4, "lv": "M", "topic": "S7 · Class vs Instance Attributes", "q": "In Python OOP, what is the difference between an instance attribute (self.x) and a class attribute defined directly inside the class body?", "code": "", "lang": "", "chk": 0, "o": ["A class attribute is shared across all instances (unless shadowed on self), whereas an instance attribute belongs to that specific object instance", "A class attribute can only be accessed inside __init__", "An instance attribute is shared by all instances of the class", "Class attributes must be private"], "oc": [false, false, false, false], "a": 0, "e": "Class attributes live on the class namespace and are shared by all instances, whereas self.attr lives in the instance's __dict__."}, {"n": 134, "s": 4, "lv": "M", "topic": "S8 · Generator Class Lab", "q": "In the Session 8 generator lab (class NumberSeries generating even numbers up to limit), what is the output of the code below?", "code": "class NumberSeries:\n    def evens(self, limit):\n        for n in range(0, limit + 1, 2):\n            yield n\n\nprint(list(NumberSeries().evens(6)))", "lang": "py", "chk": 1, "o": ["[0, 2, 4, 6]", "[2, 4, 6, 8]", "[0, 1, 2, 3, 4, 5, 6]", "<generator object>"], "oc": [true, true, true, true], "a": 0, "e": "The generator method yields even numbers 0, 2, 4, 6 up to limit=6, and list() consumes the generator into [0, 2, 4, 6]."}, {"n": 135, "s": 4, "lv": "M", "topic": "S9 · Logging Configuration", "q": "If logging.basicConfig(filename='app.log', level=logging.WARNING) is configured, which of these calls will be written to app.log?", "code": "", "lang": "", "chk": 0, "o": ["logging.warning('Disk 85% full') and logging.error('Connection failed'), but NOT logging.info() or logging.debug()", "All four: debug, info, warning, and error", "Only logging.warning()", "Only logging.critical()"], "oc": [false, false, false, false], "a": 0, "e": "Setting level=logging.WARNING (30) logs messages at level WARNING (30), ERROR (40), and CRITICAL (50), while ignoring DEBUG (10) and INFO (20)."}, {"n": 136, "s": 4, "lv": "M", "topic": "S9 · Exception Hierarchy", "q": "In Python exception handling, why should specific exception classes (like except ZeroDivisionError:) be placed BEFORE a parent class (like except Exception:)?", "code": "", "lang": "", "chk": 0, "o": ["Because Python checks except clauses top-to-bottom and executes the first matching handler; putting Exception first would catch everything and make later handlers unreachable", "Because Python raises SyntaxError if Exception is not last", "Because Python executes all matching except clauses in reverse order", "Because ZeroDivisionError does not inherit from Exception"], "oc": [false, false, false, false], "a": 0, "e": "except clauses are checked in order; since ZeroDivisionError is a subclass of ArithmeticError -> Exception, an earlier except Exception: would match it first."}, {"n": 137, "s": 4, "lv": "E", "topic": "S10 · Pandas to NumPy", "q": "In the Session 10 lab ('convert Pandas DataFrame to NumPy array'), which attribute or method is recommended in modern Pandas to convert df to a NumPy array?", "code": "", "lang": "", "chk": 0, "o": ["df.to_numpy()", "df.as_list()", "np.from_dataframe(df)", "df.to_matrix()"], "oc": [true, true, true, true], "a": 0, "e": "df.to_numpy() (or np.asarray(df)) is the standard way to convert a Pandas DataFrame to a NumPy ndarray (and df.columns.to_numpy() retrieves the column headers)."}, {"n": 138, "s": 4, "lv": "M", "topic": "S10 · NumPy Indexing", "q": "In NumPy, what is the output of the boolean indexing code below?", "code": "import numpy as np\narr = np.array([10, 20, 30, 40, 50])\nprint(arr[arr > 25])", "lang": "py", "chk": 1, "o": ["[30 40 50]", "[False False True True True]", "[10 20]", "[2 3 4]"], "oc": [true, true, true, true], "a": 0, "e": "arr > 25 creates a boolean mask [False, False, True, True, True], and indexing arr[arr > 25] returns a 1D array of the matching elements [30, 40, 50]."}, {"n": 139, "s": 4, " ry listed dependency."}, {"n": 145, "s": 4, "lv": "E", "topic": "S13 · FastAPI & REST CRUD", "q": "In RESTful APIs built with FastAPI, which HTTP methods correspond to the CRUD operations Create, Read, Update, and Delete?", "code": "", "lang": "", "chk": 0, "o": ["POST (Create), GET (Read), PUT/PATCH (Update), DELETE (Delete)", "GET (Create), POST (Read), UPDATE (Update), REMOVE (Delete)", "CREATE, SELECT, MODIFY, DROP", "PUT (Create), FETCH (Read), POST (Update), ERASE (Delete)"], "oc": [false, false, false, false], "a": 0, "e": "In REST conventions and FastAPI decorators, @app.post creates resources, @app.get reads resources, @app.put/@app.patch updates resources, and @app.delete removes resources."}, {"n": 146, "s": 4, "lv": "E", "topic": "S15 · R Packages", "q": "In R, what is the difference between library(dplyr) and require(dplyr) when loading an installed package?", "code": "", "lang": "", "chk": 0, "o": ["library() stops with an error if the package is not installed, while require() returns FALSE and gives a warning (often used inside functions)", "require() installs the package from CRAN automatically, while library() does not", "library() unloads the package, while require() loads it", "There is no difference"], "oc": [false, false, false, false], "a": 0, "e": "library(pkg) raises an error immediately if pkg is missing; require(pkg) returns a logical TRUE/FALSE indicating whether the package loaded."}, {"n": 147, "s": 4, "lv": "E", "topic": "S15 · R Workspace", "q": "In R, which workspace commands list all objects in the current environment and remove a specific object x?", "code": "", "lang": "", "chk": 0, "o": ["ls() (or objects()) lists objects; rm(x) removes x", "dir() lists objects; del(x) removes x", "show() lists objects; drop(x) removes x", "env() lists objects; clear(x) removes x"], "oc": [true, true, true, true], "a": 0, "e": "ls() and objects() return a character vector of object names in the workspace; rm(x) deletes object x (and rm(list = ls() n = and <- vs. ==?", "code": "", "lang": "", "chk": 0, "o": ["<- and = are assignment operators, whereas == is the relational equality comparison operator that returns a logical vector", "<- compares less-than-negative, while = assigns", "== assigns global variables, while <- assigns local variables", "All three are assignment operators"], "oc": [false, false, false, false], "a": 0, "e": "<- (preferred in R style) and = assign values to variables, while == tests element-wise equality and returns TRUE/FALSE/NA."}, {"n": 152, "s": 4, "lv": "M", "topic": "S17 · R Built-in Functions", "q": "In R, what does rep(1:3, times = 2) produce compared to rep(1:3, each = 2)?", "code": "", "lang": "", "chk": 1, "o": ["times = 2 gives c(1, 2, 3, 1, 2, 3); each = 2 gives c(1, 1, 2, 2, 3, 3)", "times = 2 gives c(1, 1, 2, 2, 3, 3); each = 2 gives c(1, 2, 3, 1, 2, 3)", "Both give c(1, 2, 3, 1, 2, 3)", "times = 2 multiplies by 2 to give c(2, 4, 6)"], "oc": [true, true, true, true], "a": 0, "e": "rep(x, times = 2) repeats the whole vector twice, whereas rep(x, each = 2) repeats each individual element twice before moving to the next."}, {"n": 153, "s": 4, "lv": "M", "topic": "S17 · R vs Python Indexing", "q": "What is the output of substr('RProgramming', 2, 5) in R vs. 'RProgramming'[2:5] in Python?", "code": "", "lang": "", "chk": 1, "o": ["In R (1-indexed, inclusive) substr('RProgramming', 2, 5) is 'Prog'; in Python (0-indexed, exclusive stop) 'RProgramming'[2:5] is 'rog'", "Both return 'Prog'", "Both return 'rog'", "In R it returns 'rog'; in Python it returns 'Prog'"], "oc": [false, false, false, false], "a": 0, "e": "R strings/vectors are 1-indexed and substr(x, start, stop) includes both start and stop positions (2..5 -> 'Prog'); Python is 0-indexed and excludes stop (2..4 -> 'rog')."}, {"n": 154, "s": 4, "lv": "M", "topic": "S17 · R Linear Regression", "q": "In R, after fitting a linear regression model fit <- lm(mpg ~ wt, data = mtcars), which function displays the detailed table of coefficient estimates, standard errors, t-values, p-values, and R-squared?", "code": "", "lang": "", "chk": 0, "o": ["summary(fit)", "print(fit)", "str(fit)", "attributes(fit)"], "oc": [true, true, true, true], "a": 0, "e": "print(fit) only displays the call and the intercept/slope coefficients; summary(fit) computes and displays standard errors, t-statistics, p-values, residual standard error, and R-squared."}, {"n": 155, "s": 4, "lv": "M", "topic": "S17 · R Linear Regression", "q": "In R, how do you extract the vector of fitted residuals and the vector of model coefficients from an lm() model object fit?", "code": "", "lang": "", "chk": 0, "o": ["residuals(fit) (or fit$residuals) and coef(fit) (or fit$coefficients)", "errors(fit) and weights(fit)", "fit.resid() and fit.params()", "predict(fit) and anova(fit)"], "oc": [true, true, true, true], "a": 0, "e": "residuals(fit) (or resid(fit)) returns the residuals (observed minus fitted), and coef(fit) (or coefficients(fit)) returns the estimated regression coefficients."}, {"n": 156, "s": 4, "lv": "M", "topic": "S16 · Tidy Data Philosophy", "q": "In the Session 16 tidy data philosophy, which three rules define a 'tidy' dataset (Wickham)?", "code": "", "lang": "", "chk": 0, "o": ["1) Each variable forms a column, 2) Each observation forms a row, 3) Each value has its own cell", "1) No missing values, 2) All columns are numeric, 3) Sorted by primary key", "1) Stored in SQLite, 2) Normalized to 3NF, 3) Indexed by timestamp", "1) Each row is a variable, 2) Each column is an observation, 3) Each table has 10 columns"], "oc": [false, false, false, false], "a": 0, "e": "Tidy data standardizes structure: every variable is a column, every observation is a row, and every cell is a single value—making vectorized dplyr and ggplot2 pipelines seamless."}, {"n": 157, "s": 4, "lv": "M", "topic": "S5 · Rövarspråket Lab", "q": "In the Session 5 lab function translate(text) for 'rövarspråket' (double every consonant and place 'o' in between), what does translate('cat') return?", "code": "", "lang": "", "chk": 1, "o": ["'cocatot'", "'caoatot'", "'ccoaatt'", "'cotat'"], "oc": [true, true, true, true], "a": 0, "e": "'c' is a consonant -> 'coc', 'a' is a vowel -> 'a', 't' is a consonant -> 'tot', producing 'cocatot'."}, {"n": 158, "s": 4, "lv": "M", "topic": "S5 · Present Participle Lab", "q": "In the Session 5 lab function make_ing_form(verb), applying the heuristic rules to 'lie', 'see', 'move', and 'hug' yields which present participles?", "code": "", "lang": "", "chk": 1, "o": ["'lying', 'seeing', 'moving', and 'hugging'", "'lieing', 'sing', 'moveing', and 'huging'", "'lying', 'seing', 'moving', and 'huging'", "'lyeing', 'seeing', 'movving', and 'hugging'"], "oc": [false, false, false, false], "a": 0, "e": "Rule 2 ('ie' -> 'y' + 'ing') turns 'lie' into 'lying'; Rule 1 exception keeps 'see' -> 'seeing'; Rule 1 drops final 'e' on 'move' -> 'moving'; Rule 3 (CVC) doubles final consonant on 'hug' -> 'hugging'."}, {"n": 159, "s": 4, "lv": "M", "topic": "S7 · Student GPA Class Lab", "q": "In the Session 7 lab ('gpa = (1/3)*m1 + (1/2)*m2 + (1/4)*m3'), what GPA is returned in Python 3 for m1 = 60, m2 = 80, m3 = 40?", "code": "", "lang": "", "chk": 1, "o": ["70.0", "0.0", "60.0", "65.0"], "oc": [false, false, false, false], "a": 0, "e": "(1/3)*60 = 20.0, (1/2)*80 = 40.0, and (1/4)*40 = 10.0; 20.0 + 40.0 + 10.0 = 70.0."}, {"n": 160, "s": 4, "lv": "E", "topic": "S17 · R Markdown", "q": "Which command renders an R Markdown file report.Rmd into its output format (such as HTML or PDF) from the R console?", "code": "", "lang": "", "chk": 0, "o": ["rmarkdown::render(\"report.Rmd\")", "knitr::compile(\"report.Rmd\")", "rstudio::export(\"report.Rmd\")", "markdown::build(\"report.Rmd\")"], "oc": [true, true, true, true], "a": 0, "e": "rmarkdown::render(\"report.Rmd\") runs knitr to execute all code chunks and pandoc to convert the resulting Markdown into HTML, PDF, or Word."}, {"n": 161, "s": 5, "lv": "M", "topic": "S1 · Break & Continue", "q": "What is the output of the following Python loop using continue and break?", "code": "out = []\nfor i in range(1, 7):\n    if i == 5:\n        break\n    if i % 2 == 0:\n        continue\n    out.append(str(i))\nprint(' '.join(out))", "lang": "py", "chk": 1, "o": ["1 3", "1 2 3", "1 3 5", "1 2 3 4"], "oc": [true, true, true, true], "a": 0, "e": "For i=1: prints 1; i=2: even -> continue skips print; i=3: prints 3; i=4: even -> continue; i=5: hits i == 5 -> break terminates loop. Output is 1 3."}, {"n": 162, "s": 5, "lv": "E", "topic": "S1 · Truthiness & Data Types", "q": "In Python, which of the following values evaluates to True in a boolean context (bool(x))?", "code": "", "lang": "", "chk": 1, "o": ["'0' (a non-empty string containing the character zero)", "0 (integer zero)", "[] (an empty list)", "{} (an empty dictionary)"], "oc": [false, false, false, false], "a": 0, "e": "In Python, numeric zeros (0, 0.0), empty sequences/collections ('', (), [], {}, set()), and None are falsy. Any non-empty string, including '0' or 'False', is truthy."}, {"n": 163, "s": 5, "lv": "M", "topic": "S2 · String Methods", "q": "What is the output of 'banana'.replace('a', 'o', 2) in Python?", "code": "print('banana'.replace('a', 'o', 2))", "lang": "py", "chk": 1, "o": ["'bonona'", "'bonono'", "'banana'", "'booona'"], "oc": [true, true, true, true], "a": 0, "e": "str.replace(old, new, count) replaces only the first count (2) occurrences of 'a' with 'o', leaving the third 'a' unchanged ('bonona')."}, {"n": 164, "s": 5, "lv": "M", "topic": "S2 · Calendar Lab", "q": "In the Session 2 calendar-printing lab, if a 30-day month starts on day_of_week = 4 (Thursday, where Sunday=0 .. Saturday=6), after printing 4 leading blank slots, after which day numbers should a newline be printed?", "code": "", "lang": "", "chk": 1, "o": ["Whenever (day + 4) % 7 == 0 (i.e., after days 3, 10, 17, 24)", "Whenever day % 7 == 0 (after days 7, 14, 21, 28)", "Whenever day % 5 == 0", "Only after day 30"], "oc": [false, false, false, false], "a": 0, "e": "With 4 initial offset spaces (Sun, Mon, Tue, Wed), day 3 lands on column 7 (Saturday), so (day + start_offset) % 7 == 0 triggers the end of each 7-column week row."}, {"n": 165, "s": 5, "lv": "M", "topic": "S3 · Dictionary Operators", "q": "What is the output of the following dictionary merge code in Python 3.9+?", "code": "d1 = {'x': 1, 'y': 2}\nd2 = {'y': 99, 'z': 3}\nprint(d1 | d2)", "lang": "py", "chk": 1, "o": ["{'x': 1, 'y': 99, 'z': 3}", "{'x': 1, 'y': 2, 'z': 3}", "TypeError: unsupported operand type(s) for |", "{('x', 'y'): (1, 2), ('y', 'z'): (99, 3)}"], "oc": [true, true, false, true], "a": 0, "e": "In Python 3.9+, the | operator merges dictionaries, and when a key appears in both ('y'), the right-hand operand's value (99) wins."}, {"n": 166, "s": 5, "lv": "M", "topic": "S3 · Dictionary Methods", "q": "In Python 3.7+, what does d.popitem() do on a dictionary d = {'a': 1, 'b': 2, 'c': 3}?", "code": "", "lang": "", "chk": 1, "o": ["Removes and returns the last inserted (key, value) pair ('c', 3) in LIFO order", "Removes and returns the first inserted pair ('a', 1) in FIFO order", "Removes a random key and returns only the key", "Clears the entire dictionary"], "oc": [false, false, false, false], "a": 0, "e": "Since Python 3.7 preserved dictionary insertion order, dict.popitem() removes and returns the last key-value pair as a tuple in LIFO (last-in, first-out) order."}, {"n": 167, "s": 5, "lv": "M", "topic": "S4 · List Slice Assignment", "q": "What is the result of assigning nums[1:3] = [200] on nums = [10, 20, 30, 40]?", "code": "nums = [10, 20, 30, 40]\nnums[1:3] = [200]\nprint(nums)", "lang": "py", "chk": 1, "o": ["[10, 200, 40]", "[10, [200], 30, 40]", "[10, 200, 30, 40]", "ValueError: attempt to assign sequence of size 1 to slice of size 2"], "oc": [true, true, true, false], "a": 0, "e": "Standard slice assignment nums[1:3] replaces the 2-element slice [20, 30] with the contents of the iterable [200], shrinking the list to [10, 200, 40]."}, {"n": 168, "s": 5, "lv": "E", "topic": "S4 · List Min & Max Lab", "q": "In the Session 4 lab ('find the largest and smallest number in a list'), which built-in functions return the smallest and largest elements of a non-empty list L?", "code": "", "lang": "", "chk": 0, "o": ["min(L) and max(L)", "smallest(L) and largest(L)", "L.min() and L.max()", "low(L) and high(L)"], "oc": [true, true, true, true], "a": 0, "e": "Python provides the built-in functions min(iterable) and max(iterable) (lists do not have .min() or .max() methods)."}, {"n": 169, "s": 5, "lv": "M", "topic": "S5 · Overlapping Lists Lab", "q": "In the Session 5 lab function overlapping(list1, list2) ('return True if they have at least one member in common'), which expression is both correct and O(n + m) using sets?", "code": "", "lang": "", "chk": 0, "o": ["bool(set(list1) & set(list2)) (or not set(list1).isdisjoint(list2))", "list1 == list2", "len(list1 + list2) > 0", "set(list1) | set(list2) == True"], "oc": [true, true, true, true], "a": 0, "e": "Set intersection (set(list1) & set(list2)) is non-empty (truthy) if and only if at least one element appears in both lists."}, {"n": 170, "s": 5, "lv": "E", "topic": "S5 · Built-in Functions (type, str, dir)", "q": "What does the built-in function dir(obj) return in Python?", "code": "", "lang": "", "chk": 0, "o": ["A sorted list of valid attribute and method names associated with obj", "The filesystem directory path where obj is saved", "The memory size of obj in bytes", "The docstring of obj"], "oc": [false, false, false, false], "a": 0, "e": "dir(obj) inspects an object and returns a sorted list of strings naming its attributes and methods (including special dunder attributes)."}, {"n": 171, "s": 5, "lv": "M", "topic": "S6 · Repeated Tuple Items Lab", "q": "In the Session 6 lab ('find the repeated items of a tuple'), what does the code below output for t = (2, 4, 5, 6, 2, 3, 4, 4, 7)?", "code" <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const Q = DATA.questions;
const TOTAL = Q.length;
const byN = {}; Q.forEach(q => { byN[q.n] = q; });
const LV = {E:'Easy', M:'Medium', T:'Tough'};
const LVBARS = {E:1, M:2, T:3};
const GROUPS = DATA.groups;
const SET_LABELS = {1:'Original', 2:'Subset 1', 3:'Subset 2', 4:'Subset 3', 5:'Subset 4'};
const SESS = DATA.sessions.map(s => ({
  n:s.n, g:s.g, label:SET_LABELS[s.n] || ('Set ' + s.n), short:String(s.n), name:s.name, topics:s.topics,
  qs: Q.filter(q => q.s === s.n).map(q => q.n)
}));
const sessByN = {}; SESS.forEach(s => { sessByN[s.n] = s; });
const CHECKED = Q.filter(q => q.chk).length;
const MOCK_SIZE = 40;

/* 5 Continuous 40-Question Sets (Original Quiz + Subsets 1–4) */
const SUBSETS = SESS.map(s => ({
  t: s.n,
  label: s.label,
  title: s.name,
  sub: s.topics,
  qs: s.qs.slice()
}));
const subsetByT = {}; SUBSETS.forEach(tb => { subsetByT[tb.t] = tb; });

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
const KW = {
  java: /^(abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|null|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|true|false|var)$/,
  py: /^(from|import|as|def|return|lambda|for|in|if|elif|else|print|True|False|None|and|or|not|with|try|except|class|while|is)$/,
  sql: /^(select|from|where|group|by|order|having|join|on|as|over|partition|rows|range|between|and|or|not|null|is|insert|into|overwrite|table|create|external|stored|load|data|local|inpath|limit|lateral|view|distinct|case|when|then|else|end|desc|asc|preceding|following|current|row|unbounded|union|all|with)$/i,
  r: /^(function|if|else|for|in|while|repeat|next|break|return|TRUE|FALSE|NULL|NA|Inf|NaN|library|require)$/,
  sh: /^$/
};
const COMMENT = {java: '//', py: '#', sh: '#', sql: '--'};
function highlight(code, lang){
  const kw = KW[lang] || KW.java, cm = COMMENT[lang] || '//';
  const cmRe = cm === '//' ? '\\/\\/[^\\n]*' : cm === '--' ? '--[^\\n]*' : '#[^\\n]*';
  const re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|' + cmRe + '|\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?[LlFf]?)\\b|\\b[A-Za-z_]\\w*\\b)', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const tk = m[0];
    if (tk[0] === '"' || tk[0] === "'") out += '<span class="st">' + esc(tk) + '</span>';
    else if (tk.startsWith(cm)) out += '<span class="cm">' + esc(tk) + '</span>';
    else if (/^\d/.test(tk)) out += '<span class="nu">' + esc(tk) + '</span>';
    else if (kw.test(tk)) out += '<span class="kw">' + esc(tk) + '</span>';
    else out += esc(tk);
    last = m.index + tk.length;
  }
  return out + esc(code.slice(last));
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400); }

/* ---------- theme switcher ---------- */
const THEME_KEY = 'portal_theme';
function getActiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'dark' || attr === 'light') return attr;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = $('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '🌙 Dark' : '☀️ Light';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}
function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){}
  if (saved === 'dark' || saved === 'light') applyTheme(saved);
  else applyTheme(getActiveTheme());
}

/* ---------- progress store ---------- */
const LS_KEY = 'pyt2-200-progress-v1';
let store = {a:{}, bm:{}, resetAt:0};
function lsRead(){
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s){
      const o = JSON.parse(s);
      if (o && typeof o.a === 'object') store = {
        a: o.a,
        bm: (o.bm && typeof o.bm === 'object') ? o.bm : {},
        resetAt: o.resetAt || 0
      };
    }
  } catch(e){}
}
function lsWrite(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){}
}
function ans(n){ const e = store.a[n]; return (e && e.c >= 0) ? e : null; }
function record(n, choice){
  const q = byN[n], ok = choice === q.a, e = store.a[n] || {};
  store.a[n] = {c:choice, ok, t:Date.now(), w:(e.w || 0) + (ok ? 0 : 1), r:(e.r || 0) + (ok ? 1 : 0)};
  persist();
}
function clearAnswers(ns){
  const t = Date.now();
  ns.forEach(n => { const e = store.a[n]; if (e && e.c >= 0) store.a[n] = Object.assign({}, e, {c:-1, ok:false, t}); });
  persist();
}
function resetAll(){ store = {a:{}, bm:{}, resetAt:Date.now()}; persist(); }
function stats(ns){
  let ok = 0, bad = 0;
  ns.forEach(n => { const e = ans(n); if (e){ if (e.ok) ok++; else bad++; } });
  return {ok, bad, done: ok + bad, total: ns.length, todo: ns.length - ok - bad};
}
function wrongList(){ return Q.filter(q => { const e = ans(q.n); return e && !e.ok; }).map(q => q.n); }
function isBookmarked(n){ return !!(store.bm && store.bm[n]); }
function toggleBookmark(n){
  if (!store.bm || typeof store.bm !== 'object') store.bm = {};
  if (store.bm[n]) delete store.bm[n];
  else store.bm[n] = 1;
  persist();
}
function bookmarkList(){ return Q.filter(q => isBookmarked(q.n)).map(q => q.n); }
function persist(){
  lsWrite();
  $('mistakesCount').textContent = wrongList().length;
  $('bookmarksCount').textContent = bookmarkList().length;
}

/* ---------- view & history navigation state ---------- */
let view = 'home';       // home | quiz | result | mistakes | bookmarks | info
let sortMode = 'syllabus';
let resetArmed = false;
let set = null;          // {title, sub, kind, s, t, ns}
let lvFilter = 'all';    // all | E | M | T
let stFilter = 'all';    // all | todo | wrong | bm
let list = [];           // filtered question numbers in current set
let activeQ = null;      // last clicked/jumped question number

/* Browser-like Back / Forward navigation stack */
let navHistory = [];
let navIndex = -1;
let isNavigatingHistory = false;

function cloneState(){
  return {
    view,
    sortMode,
    set: set ? JSON.parse(JSON.stringify(set)) : null,
    lvFilter,
    stFilter,
    scrollY: window.scrollY || 0
  };
}
function pushHistory(){
  if (isNavigatingHistory) return;
  const snap = cloneState();
  if (navIndex >= 0 && navIndex < navHistory.length){
    navHistory[navIndex].scrollY = window.scrollY || 0;
  }
  navHistory = navHistory.slice(0, navIndex + 1);
  navHistory.push(snap);
  navIndex = navHistory.length - 1;
  updateNavButtons();
}
function updateNavButtons(){
  $('navBackBtn').disabled = navIndex <= 0;
  $('navFwdBtn').disabled = navIndex >= navHistory.length - 1;
}
function restoreState(snap){
  isNavigatingHistory = true;
  view = snap.view;
  sortMode = snap.sortMode || 'syllabus';
  set = snap.set ? JSON.parse(JSON.stringify(snap.set)) : null;
  lvFilter = snap.lvFilter || 'all';
  stFilter = snap.stFilter || 'all';
  if (set) buildList();
  applyViewVisibility();
  refresh();
  window.scrollTo(0, snap.scrollY || 0);
  isNavigatingHistory = false;
  updateNavButtons();
}
function navBack(){
  if (navIndex > 0){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex--;
    restoreState(navHistory[navIndex]);
  }
}
function navForward(){
  if (navIndex < navHistory.length - 1){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex++;
    restoreState(navHistory[navIndex]);
  }
}

function applyViewVisibility(){
  $('vHome').hidden = view !== 'home';
  $('vQuiz').hidden = view !== 'quiz';
  $('vResult').hidden = view !== 'result';
  $('vMistakes').hidden = view !== 'mistakes';
  $('vBookmarks').hidden = view !== 'bookmarks';
  $('vInfo').hidden = view !== 'info';

  $('allTestsLink').hidden = false;
  $('consoleHomeBtn').hidden = view === 'home';
  $('brandTitle').textContent = 'Python Test 2 · 200';
  $('brandSub').textContent = 'CCEE · Python & R Programming · Original + 4 Subsets';
}

function show(v){
  if ((v === 'quiz' || v === 'result') && !set) v = 'home';
  view = v;
  applyViewVisibility();
  refresh();
  window.scrollTo(0, 0);
  pushHistory();
}

function refresh(){
  $('mistakesCount').textContent = wrongList().length;
  $('bookmarksCount').textContent = bookmarkList().length;
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'result') renderResult();
  else if (view === 'mistakes') renderMistakes();
  else if (view === 'bookmarks') renderBookmarks();
  else if (view === 'info') renderInfo();
}

function stackBar(st, cls){
  const t = st.total || 1;
  return '<div class="stack ' + (cls || '') + '" role="img" aria-label="' + st.ok + ' right, ' + st.bad + ' wrong, ' + st.todo + ' not answered"><span class="s-ok" style="width:' + (100 * st.ok / t) + '%"></span><span class="s-bad" style="width:' + (100 * st.bad / t) + '%"></span></div>';
}

/* ---------- console home ---------- */
function renderHome(){
  const all = stats(Q.map(q => q.n));
  const acc = all.done ? pct(all.ok, all.done) : null;
  const lvRows = ['E', 'M', 'T'].map(l => {
    const st = stats(Q.filter(q => q.lv === l).map(q => q.n));
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(st) + '<span class="num">' + st.ok + '/' + st.done + ' · ' + st.total + '</span></div>';
  }).join('');

  const subsetBtns = SUBSETS.map(tb => {
    const st = stats(tb.qs);
    return '<button type="button" class="subset-btn" data-subset="' + tb.t + '">' +
      '<b>' + esc(tb.label) + '</b>' +
      '<span>Q' + tb.qs[0] + '–' + tb.qs[tb.qs.length - 1] + ' · ' + st.done + '/' + st.total + '</span>' +
    '</button>';
  }).join('');

  const weak = SESS.map(s => ({s, st: stats(s.qs)})).filter(x => x.st.bad > 0)
    .sort((a, b) => (a.st.ok / a.st.done) - (b.st.ok / b.st.done) || b.st.bad - a.st.bad).slice(0, 5);
  const weakHtml = weak.length
    ? '<ul class="weaklist">' + weak.map(x => '<li><button type="button" data-review="' + x.s.n + '"><span class="wname">' + x.s.label + ' · ' + esc(x.s.name) + '</span><span class="wstat">' + x.st.bad + ' wrong · ' + pct(x.st.ok, x.st.done) + '%</span></button></li>').join('') + '</ul>'
    : '<p class="empty-note">Answer a few questions and your weakest sessions will show up here, worst first.</p>';
  const wrongN = wrongList().length;
  const bmN = bookmarkList().length;
  const order = SESS.slice();
  if (sortMode === 'weak') order.sort((a, b) => {
    const A = stats(a.qs), B = stats(b.qs);
    const ka = A.done ? A.ok / A.done : 2, kb = B.done ? B.ok / B.done : 2;
    return ka - kb || a.n - b.n;
  });
  let lastG = 0;
  const topics = order.map(s => {
    const st = stats(s.qs);
    const lv = {E:0, M:0, T:0}; s.qs.forEach(n => lv[byN[n].lv]++);
    const chk = s.qs.filter(n => byN[n].chk).length;
    const bmSess = s.qs.filter(n => isBookmarked(n)).length;
    const qRange = 'Q' + s.qs[0] + '–Q' + s.qs[s.qs.length - 1];
    const score = st.done ? '<div class="tscore">' + pct(st.ok, st.done) + '%<small>' + st.done + '/' + st.total + ' done</small></div>' : '<div class="tscore na">—<small>not started</small></div>';
    let head = '';
    if (sortMode !== 'weak' && s.g !== lastG){
      lastG = s.g;
      const G = GROUPS[s.g - 1];
      const gs = stats(Q.filter(q => sessByN[q.s].g === s.g).map(q => q.n));
      head = '<li class="ghead"><span class="gno">' + esc(G.range) + '</span><b>' + esc(G.name) + '</b><span class="gstat">' + gs.done + '/' + gs.total + ' done' + (gs.done ? ' · ' + pct(gs.ok, gs.done) + '%' : '') + '</span></li>';
    }
    return head + '<li><button class="topic" type="button" data-session="' + s.n + '">' +
      '<span class="tnum">Set<b>' + String(s.n).padStart(2, '0') + '</b></span>' +
      '<span class="tbody"><span class="tname">' + esc(s.name) + '</span>' +
      '<span class="tsub">' + esc(s.topics) + '</span>' +
      '<span class="tmeta"><span>' + qRange + '</span><span>' + s.qs.length + ' questions</span><span>E' + lv.E + ' M' + lv.M + ' T' + lv.T + '</span>' +
      (chk ? '<span class="past">' + chk + ' code-checked</span>' : '') +
      (bmSess ? '<span class="past">★ ' + bmSess + ' saved</span>' : '') + '</span>' +
      stackBar(st, 'tbar') + '</span>' + score + '</button></li>';
  }).join('');

  $('vHome').innerHTML =
  '<div class="home">' +
    '<aside class="summary panel">' +
      '<div><div class="eyebrow">Overall</div><div class="bigrow"><div class="big">' + (acc === null ? '—' : acc + '<small>%</small>') + '</div><div class="muted" style="padding-bottom:4px">accuracy on ' + all.done + ' of ' + TOTAL + ' answered</div></div></div>' +
      stackBar(all) +
      '<div class="legend"><span><i class="dot ok"></i>Right <b>' + all.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + all.bad + '</b></span><span><i class="dot todo"></i>Left <b>' + all.todo + '</b></span></div>' +
      '<div><div class="eyebrow" style="margin-bottom:8px">By difficulty · right/answered · total</div><div class="lvrows">' + lvRows + '</div></div>' +
      '<div class="actions">' +
        '<button class="btn primary" type="button" id="mock40">Mock paper: 40 from all sessions</button>' +
        '<button class="btn" type="button" id="practiseWrong"' + (wrongN ? '' : ' disabled') + '>Practise my mistakes <span class="count">' + wrongN + '</span></button>' +
        '<button class="btn" type="button" id="practiseBm"' + (bmN ? '' : ' disabled') + '>★ Practise bookmarked <span class="count">' + bmN + '</span></button>' +
        '<button class="btn" type="button" id="random20">Random 20 from all sessions</button>' +
      '</div>' +
      '<div class="subsets-box">' +
        '<div class="eyebrow">5 × 40-Question Sets (Quick Jump)</div>' +
        '<div class="subset-grid">' + subsetBtns + '</div>' +
      '</div>' +
      '<div class="weak"><h3>Where you lose marks</h3>' + weakHtml + '</div>' +
      '<div class="reset">' + (resetArmed
        ? '<div class="confirm"><span>Clear every answer?</span><button class="btn small" type="button" id="resetYes">Yes, clear</button><button class="btn small ghost" type="button" id="resetNo">Cancel</button></div>'
        : '<button class="btn small ghost" type="button" id="resetBtn"' + (all.done || wrongN ? '' : ' disabled') + '>Reset all progress</button>') + '</div>' +
    '</aside>' +
    '<section>' +
      '<div class="topics-head"><div><div class="eyebrow">Pick a 40-Question Set</div><h2>5 Continuous Sets · ' + TOTAL + ' Total MCQs</h2></div>' +
        '<div class="seg" role="group" aria-label="Order sessions"><button type="button" data-sort="syllabus" aria-pressed="' + (sortMode !== 'weak') + '">Syllabus order</button><button type="button" data-sort="weak" aria-pressed="' + (sortMode === 'weak') + '">Weakest first</button></div></div>' +

      '<ul class="topiclist">' + topics + '</ul>' +
