avac along with the runtime components."}, {"n": 3, "s": 1, "lv": "E", "q": "What is the usual extension of compiled Java bytecode files?", "code": "", "o": [".java", ".class", ".jar", ".exe"], "oc": [false, false, false, false], "a": 1, "e": "A .java file contains source code; javac normally produces a .class file containing bytecode."}, {"n": 4, "s": 1, "lv": "E", "q": "Which command compiles Hello.java?", "code": "", "o": ["java Hello.java", "javac Hello.java", "javadoc Hello.java", "jar Hello.java"], "oc": [false, true, false, false], "a": 1, "e": "javac is the Java compiler. The java launcher runs a compiled class or, in supported versions, a source file."}, {"n": 5, "s": 1, "lv": "E", "q": "Which is a primitive type in Java?", "code": "", "o": ["String", "Integer", "boolean", "ArrayList"], "oc": [false, false, false, false], "a": 2, "e": "boolean is a primitive type. String, Integer and ArrayList are reference types."}, {"n": 6, "s": 1, "lv": "E", "q": "What is the size of Java's int type?", "code": "", "o": ["8 bits", "16 bits", "32 bits", "64 bits"], "oc": [false, false, false, false], "a": 2, "e": "Java int is a signed 32-bit integer with a defined range independent of the platform."}, {"n": 7, "s": 1, "lv": "E", "q": "Which primitive type stores a 64-bit integer?", "code": "", "o": ["short", "int", "long", "float"], "oc": [false, false, false, false], "a": 2, "e": "long is a signed 64-bit integral primitive type."}, {"n": 8, "s": 1, "lv": "M", "q": "What is the default value of an instance field of type int?", "code": "", "o": ["0", "1", "null", "Undefined"], "oc": [false, false, false, false], "a": 0, "e": "Instance fields receive default values; numeric integral fields default to zero. Local variables do not receive automatic defaults."}, {"n": 9, "s": 1, "lv": "M", "q": "Which statement about local variables is correct?", "code": "", "o": ["They always default to zero", "They must be definitely assigned before use", "They can be used without declaration", "They are always static"], "oc": [false, false, false, false], "a": 1, "e": "Java's definite-assignment rules require a local variable to be assigned before it is read."}, {"n": 10, "s": 1, "lv": "M", "q": "Which is a valid Java entry-point declaration?", "code": "", "o": ["public void main()", "public static void main(String[] args)", "static int main(String args)", "private static main(String[] args)"], "oc": [true, true, true, true], "a": 1, "e": "The conventional application entry point is public static void main(String[] args)."}, {"n": 11, "s": 1, "lv": "M", "q": "Which keyword is used to create an object?", "code": "", "o": ["class", "this", "new", "instanceof"], "oc": [false, false, false, false], "a": 2, "e": "The new operator creates an object and invokes a constructor."}, {"n": 12, "s": 1, "lv": "M", "q": "What does the expression 7 / 2 evaluate to when both operands are int?", "code": "", "o": ["3.5", "3", "4", "Compile-time error"], "oc": [false, false, false, false], "a": 1, "e": "Integer division discards the fractional part, so 7 / 2 evaluates to 3."}, {"n": 13, "s": 1, "lv": "M", "q": "Which operator is the short-circuit logical AND?", "code": "", "o": ["&", "&&", "||", "!"], "oc": [false, true, true, false], "a": 1, "e": "&& evaluates the right operand only if the left operand is true. The single & can also operate on booleans but does not short-circuit."}, {"n": 14, "s": 1, "lv": "M", "q": "What is the result of 5 % 2?", "code": "", "o": ["0", "1", "2", "2.5"], "oc": [false, false, false, false], "a": 1, "e": "The remainder operator % returns the remainder after division; 5 divided by 2 leaves remainder 1."}, {"n": 15, "s": 1, "lv": "M", "q": "Which loop guarantees that its body executes at least once?", "code": "", "o": ["for", "while", "do-while", "enhanced for"], "oc": [false, false, false, false], "a": 2, "e": "A do-while loop tests its condition after executing the body."}, {"n": 16, "s": 1, "lv": "T", "q": "Which statement exits the nearest enclosing loop or switch?", "code": "", "o": ["continue", "break", "return", "throw"], "oc": [false, false, false, false], "a": 1, "e": "break terminates the nearest enclosing loop or switch statement."}, {"n": 17, "s": 1, "lv": "T", "q": "What does continue do in a loop?", "code": "", "o": ["Terminates the program", "Skips to the next iteration", "Exits all enclosing loops", "Restarts the JVM"], "oc": [false, false, false, false], "a": 1, "e": "continue skips the remaining statements in the current iteration and proceeds to the next iteration."}, {"n": 18, "s": 1, "lv": "T", "q": "Which construct is suitable for selecting among several discrete cases?", "code": "", "o": ["switch", "try", "synchronized", "package"], "oc": [false, false, false, false], "a": 0, "e": "switch selects a branch based on a selector expression and matching case labels."}, {"n": 19, "s": 1, "lv": "T", "q": "Which conversion is generally a widening primitive conversion?", "code": "", "o": ["double to int", "long to byte", "int to long", "float to short"], "oc": [false, false, true, false], "a": 2, "e": "Converting int to long widens the value and is allowed implicitly. Narrowing conversions generally require a cast."}, {"n": 20, "s": 1, "lv": "T", "q": "What does the ternary operator return?", "code": "", "o": ["A class", "A value selected from two expressions", "A loop", "A package"], "oc": [false, false, false, false], "a": 1, "e": "The conditional operator condition ? expr1 : expr2 evaluates one of the two expressions and yields its value."}, {"n": 21, "s": 2, "lv": "E", "q": "What is the primary purpose of a Java package?", "code": "", "o": ["To execute bytecode", "To group related types and help avoid naming conflicts", "To allocate heap memory", "To create threads"], "oc": [false, true, false, false], "a": 1, "e": "Packages organize related classes and interfaces, provide namespace management and participate in access control."}, {"n": 22, "s": 2, "lv": "E", "q": "Which declaration, if present, must appear before import declarations?", "code": "", "o": ["class declaration", "package declaration", "main method", "constructor"], "oc": [true, false, false, false], "a": 1, "e": "A package declaration appears first in a compilation unit, followed by imports and then top-level type declarations."}, {"n": 23, "s": 2, "lv": "E", "q": "What does the classpath help the Java compiler/runtime locate?", "code": "", "o": ["Only CPU registers", "Classes and package resources", "Only source comments", "The operating system kernel"], "oc": [false, false, false, false], "a": 1, "e": "The classpath identifies locations from which user classes and resources can be loaded."}, {"n": 24, "s": 2, "lv": "E", "q": "Which statement about Java arrays is correct?", "code": "", "o": ["Their length changes automatically", "They store elements of a declared component type and have fixed length", "They can store only primitives", "They have no index"], "oc": [false, false, false, false], "a": 1, "e": "An array has a fixed length once created and can hold primitives or references of its component type."}, {"n": 25, "s": 2, "lv": "E", "q": "What is the valid index range for an array of length n?", "code": "", "o": ["1 through n", "0 through n", "0 through n-1", "-1 through n-1"], "oc": [false, false, false, false], "a": 2, "e": "Java arrays are zero-indexed. The final valid index is length - 1."}, {"n": 26, "s": 2, "lv": "E", "q": "Which property gives the number of elements in an array arr?", "code": "", "o": ["arr.size()", "arr.length", "arr.length()", "arr.count"], "oc": [true, false, true, false], "a": 1, "e": "Arrays expose a length field, not a length() method."}, {"n": 27, "s": 2, "lv": "M", "q": "What happens when code accesses arr[arr.length]?", "code": "", "o": ["It accesses the last element", "It returns null", "ArrayIndexOutOfBoundsException is thrown", "The array grows"], "oc": [false, false, false, false], "a": 2, "e": "The last valid index is arr.length - 1, so arr.length is out of bounds."}, {"n": 28, "s": 2, "lv": "M", "q": "What does a reference variable contain?", "code": "", "o": ["The complete object inline", "A reference to an object or null", "Only an integer", "A method body"], "oc": [false, false, false, false], "a": 1, "e": "A reference variable refers to an object; it does not contain the object's full instance state as a primitive value."}, {"n": 29, "s": 2, "lv": "M", "q": "What happens after b = a when a and b are object references?", "code": "", "o": ["A deep copy is always made", "Both can refer to the same object", "The object is destroyed", "The class is copied"], "oc": [false, false, false, true], "a": 1, "e": "Reference assignment copies the reference value. It does not automatically clone the referenced object."}, {"n": 30, "s": 2, "lv": "M", "q": "When is an object eligible for garbage collection?", "code": "", "o": ["Immediately after construction", "When it is no longer reachable from live references", "Whenever a method returns", "Only when finalize is called"], "oc": [false, false, false, false], "a": 1, "e": "An object becomes eligible when it is unreachable, although the JVM does not guarantee immediate collection."}, {"n": 31, "s": 2, "lv": "M", "q": "Which statement about System.gc() is correct?", "code": "", "o": ["It guarantees immediate collection", "It requests garbage collection but does not guarantee it", "It deletes all objects", "It runs finalize synchronously"], "oc": [false, false, false, false], "a": 1, "e": "System.gc() is only a request/hint to the JVM; collection timing is not guaranteed."}, {"n": 32, "s": 2, "lv": "T", "q": "In modern Java, should finalize() be relied upon for resource cleanup?", "code": "", "o": ["Yes, it is guaranteed to run immediately", "Yes, it replaces close()", "No, finalization is deprecated for removal and is unreliable", "Only for arrays"], "oc": [false, true, false, false], "a": 2, "e": "Finalization is deprecated for removal and must not be used as a dependable cleanup mechanism. Prefer try-with-resources and explicit close methods."}, {"n": 33, "s": 2, "lv": "T", "q": "Which keyword declares a class-level member shared by all instances?", "code": "", "o": ["final", "static", "volatile", "transient"], "oc": [false, false, false, false], "a": 1, "e": "A static field or method belongs to the class rather than to each individual instance."}, {"n": 34, "s": 2, "lv": "T", "q": "Which keyword refers to the current object?", "code": "", "o": ["super", "this", "self", "current"], "oc": [false, false, false, false], "a": 1, "e": "this is a reference to the current object and can distinguish instance fields from parameters."}, {"n": 35, "s": 2, "lv": "T", "q": "What does instanceof test?", "code": "", "o": ["Whether two references are identical", "Whether an object is compatible with a given reference type", "Whether a class is abstract", "Whether a method is static"], "oc": [false, false, true, false], "a": 1, "e": "instanceof performs a runtime type-compatibility test and returns a boolean."}, {"n": 36, "s": 3, "lv": "E", "q": "A class is best described as:", "code": "", "o": ["An instance of an object", "A blueprint defining state and behaviour", "A primitive data type", "A running thread"], "oc": [false, true, false, false], "a": 1, "e": "A class defines fields and methods from which objects are instantiated."}, {"n": 37, "s": 3, "lv": "E", "q": "Which set lists the four commonly taught OOP pillars?", "code": "", "o": ["JVM, JDK, JRE, API", "Abstraction, encapsulation, inheritance, polymorphism", "Looping, branching, casting, compiling", "Files, streams, sockets, threads"], "oc": [false, false, false, false], "a": 1, "e": "These are the four core OOP concepts emphasized in the lecture material."}, {"n": 38, "s": 3, "lv": "E", "q": "Which concept exposes essential features while hiding unnecessary implementation detail?", "code": "", "o": ["Inheritance", "Abstraction", "Overloading", "Serialization"], "oc": [false, false, false, false], "a": 1, "e": "Abstraction models the relevant features of an entity while omitting irrelevant details."}, {"n": 39, "s": 3, "lv": "E", "q": "Which concept bundles data with methods and controls direct access to internal state?", "code": "", "o": ["Encapsulation", "Recursion", "Casting", "Iteration"], "oc": [false, false, false, false], "a": 0, "e": "Encapsulation protects an object's internal state and exposes controlled operations through methods."}, {"n": 40, "s": 3, "lv": "E", "q": "Which access modifier gives the broadest access?", "code": "", "o": ["private", "protected", "default/package-private", "public"], "oc": [false, false, false, false], "a": 3, "e": "public members are accessible wherever the declaring type is accessible, subject to module and type accessibility."}, {"n": 41, "s": 3, "lv": "E", "q": "A member with no explicit access modifier is:", "code": "", "o": ["private", "package-private", "protected", "public"], "oc": [false, false, false, false], "a": 1, "e": "No modifier means package-private access: the member is accessible within its package."}, {"n": 42, "s": 3, "lv": "E", "q": "Which access modifier restricts a member to its declaring class?", "code": "", "o": ["public", "protected", "private", "default"], "oc": [false, false, false, false], "a": 2, "e": "private members are directly accessible only within the declaring top-level class (including relevant nestmate access rules)."}, {"n": 43, "s": 3, "lv": "E", "q": "Which statement about constructors is correct?", "code": "", "o": ["They have a return type", "They initialize newly created objects", "They must be static", "They cannot be overloaded"], "oc": [false, false, false, false], "a": 1, "e": "Constructors initialize instances and have the same name as the class; they do not declare a return type."}, {"n": 44, "s": 3, "lv": "E", "q": "If no constructor is declared in a class, what does the compiler provide?", "code": "", "o": ["A public parameterized constructor", "A default no-argument constructor", "A copy constructor", "No constructor at all"], "oc": [true, false, false, false], "a": 1, "e": "The compiler provides a default no-argument constructor only when the class declares no constructor."}, {"n": 45, "s": 3, "lv": "M", "q": "What is constructor overloading?", "code": "", "o": ["Defining multiple constructors with different parameter lists", "Overriding a constructor", "Calling a constructor repeatedly", "Making a constructor static"], "oc": [false, false, false, false], "a": 0, "e": "Constructors can be overloaded by providing different parameter lists."}, {"n": 46, "s": 3, "lv": "M", "q": "Which statement about this() in a constructor is correct?", "code": "", "o": ["It calls a superclass method", "It invokes another constructor in the same class and must be the first statement", "It creates a new thread", "It is optional after return"], "oc": [true, true, false, false], "a": 1, "e": "this(...) performs constructor chaining within the same class and must be the first constructor statement."}, {"n": 47, "s": 3, "lv": "M", "q": "Which keyword invokes a superclass constructor?", "code": "", "o": ["this", "base", "super", "parent"], "oc": [false, false, false, false], "a": 2, "e": "super(...) invokes a superclass constructor and, when written explicitly, must be the first statement in the constructor."}, {"n": 48, "s": 3, "lv": "M", "q": "Java supports which class inheritance model?", "code": "", "o": ["A class can extend multiple classes", "A class can extend one class", "A class cannot extend another class", "Interfaces cannot be implemented"], "oc": [true, true, true, false], "a": 1, "e": "A Java class has at most one direct superclass, though it can implement multiple interfaces."}, {"n": 49, "s": 3, "lv": "M", "q": "Inheritance commonly models which relationship?", "code": "", "o": ["has-a", "is-a", "uses-a-only", "part-of-a-only"], "oc": [false, false, false, false], "a": 1, "e": "Inheritance represents an is-a relationship between a subclass and its superclass."}, {"n": 50, "s": 3, "lv": "M", "q": "Which members are not directly inherited as accessible members by a subclass?", "code": "", "o": ["public fields", "protected methods", "private fields", "package-visible members in same package"], "oc": [true, true, true, false], "a": 2, "e": "Private superclass members are not directly accessible in the subclass, although they remain part of the superclass portion of the object."}, {"n": 51, "s": 3, "lv": "M", "q": "What is method overloading?", "code": "", "o": ["Same method name with different parameter lists", "Same signature in subclass only", "Changing only the return type", "Calling a method twice"], "oc": [false, true, false, false], "a": 0, "e": "Overloaded methods share a name but differ in parameter number, types or order. Return type alone cannot distinguish overloads."}, {"n": 52, "s": 3, "lv": "M", "q": "What is method overriding?", "code": "", "o": ["A subclass provides a compatible implementation of an inherited instance method", "A class defines two constructors", "A method changes only its return type", "A method is declared final"], "oc": [true, true, false, false], "a": 0, "e": "Overriding lets a subclass specialize an inherited instance method using a compatible signature and return type."}, {"n": 53, "s": 3, "lv": "M", "q": "Which polymorphism is typically resolved at runtime through overriding?", "code": "", "o": ["Compile-time polymorphism", "Runtime polymorphism", "Static binding only", "Operator precedence"], "oc": [false, false, false, false], "a": 1, "e": "Dynamic method dispatch selects an overridden instance method based on the actual object at runtime."}, {"n": 54, "s": 3, "lv": "T", "q": "What does a superclass reference pointing to a subclass object demonstrate?", "code": "", "o": ["Autoboxing", "Upcasting and polymorphism", "Serialization", "Method hiding"], "oc": [false, false, false, false], "a": 1, "e": "A superclass reference can refer to a subclass instance; overridden instance methods dispatch to the subclass implementation."}, {"n": 55, "s": 3, "lv": "T", "q": "Which cast can fail at runtime if the actual object is not of the target subtype?", "code": "", "o": ["Widening primitive conversion", "Downcasting a reference", "int to long", "char to int"], "oc": [false, false, true, false], "a": 1, "e": "An invalid reference downcast throws ClassCastException; instanceof can be used to check compatibility first."}, {"n": 56, "s": 3, "lv": "T", "q": "Which class cannot be instantiated directly?", "code": "", "o": ["Concrete class", "Abstract class", "Final class", "Nested static class"], "oc": [false, false, false, true], "a": 1, "e": "An abstract class may contain abstract methods and cannot be instantiated directly."}, {"n": 57, "s": 3, "lv": "T", "q": "Which statement about an interface is correct?", "code": "", "o": ["A class can implement multiple interfaces", "An interface can be instantiated with new", "A class can implement only one interface", "Interfaces cannot have default methods"], "oc": [true, false, true, false], "a": 0, "e": "Java permits a class to implement multiple interfaces. Interfaces can also declare default, static and private methods under applicable rules."}, {"n": 58, "s": 3, "lv": "T", "q": "What is an inner class?", "code": "", "o": ["A class declared inside another class or interface", "A class without methods", "A top-level public class", "A primitive wrapper"], "oc": [true, true, true, false], "a": 0, "e": "Nested classes are declared within another class; a non-static nested class is commonly called an inner class."}, {"n": 59, "s": 3, "lv": "T", "q": "An anonymous class is:", "code": "", "o": ["A class with no constructor", "A class expression declared and instantiated without a name", "A class that cannot implement interfaces", "A package-private top-level class"], "oc": [true, true, true, true], "a": 1, "e": "An anonymous class provides a one-off subclass or interface implementation at the point of creation."}, {"n": 60, "s": 3, "lv": "T", "q": "Which keyword prevents a class from being subclassed?", "code": "", "o": ["static", "final", "abstract", "volatile"], "oc": [false, false, false, false], "a": 1, "e": "A final class cannot be extended."}, {"n": 61, "s": 4, "lv": "E", "q": "What is an exception?", "code": "", "o": ["A syntax rule", "An event that disrupts normal program flow", "A package declaration", "A compiler optimization"], "oc": [false, false, false, false], "a": 1, "e": "An exception represents an abnormal condition that can be detected and handled during execution."}, {"n": 62, "s": 4, "lv": "E", "q": "Which is the root class of Java's exception/error hierarchy?", "code": "", "o": ["Exception", "Throwable", "RuntimeException", "Object"], "oc": [false, false, false, false], "a": 1, "e": "Throwable is the superclass of Exception and Error."}, {"n": 63, "s": 4, "lv": "E", "q": "Which category generally requires handling or declaration at compile time?", "code": "", "o": ["Checked exceptions", "Unchecked exceptions", "Errors only", "All runtime exceptions"], "oc": [false, false, false, false], "a": 0, "e": "Checked exceptions, except certain special cases, must be caught or declared with throws."}, {"n": 64, "s": 4, "lv": "E", "q": "Which is an unchecked exception?", "code": "", "o": ["IOException", "SQLException", "NullPointerException", "ClassNotFoundException"], "oc": [false, false, false, false], "a": 2, "e": "NullPointerException extends RuntimeException and is unchecked."}, {"n": 65, "s": 4, "lv": "E", "q": "Which keyword explicitly throws an exception object?", "code": "", "o": ["throws", "throw", "catch", "finally"], "oc": [false, false, false, false], "a": 1, "e": "throw is used in a statement to throw a particular Throwable instance."}, {"n": 66, "s": 4, "lv": "E", "q": "Which keyword declares exceptions a method may pass to its caller?", "code": "", "o": ["throw", "throws", "try", "final"], "oc": [false, false, false, false], "a": 1, "e": "throws appears in a method or constructor declaration to list exception types that may be propagated."}, {"n": 67, "s": 4, "lv": "M", "q": "What is the purpose of a finally block?", "code": "", "o": ["To declare a class", "To execute cleanup code after try/catch flow, subject to abrupt JVM termination", "To catch only Errors", "To prevent all exceptions"], "oc": [false, false, false, false], "a": 1, "e": "finally is generally used for cleanup and normally runs whether or not an exception occurs."}, {"n": 68, "s": 4, "lv": "M", "q": "Which order should multiple catch blocks use?", "code": "", "o": ["Superclass before subclass", "Subclass before superclass", "Random order", "Only RuntimeException first"], "oc": [true, true, false, false], "a": 1, "e": "A catch for a superclass makes later catches for its subclasses unreachable, so more specific exception types must come first."}, {"n": 69, "s": 4, "lv": "M", "q": "What happens if an exception is not caught in the current method?", "code": "", "o": ["It is ignored", "It propagates up the call stack", "It becomes a checked exception", "The compiler restarts"], "oc": [false, false, false, false], "a": 1, "e": "An uncaught exception propagates to the caller until handled or until it reaches the thread's uncaught-exception handler."}, {"n": 70, "s": 4, "lv": "M", "q": "Which exception commonly results from integer division by zero?", "code": "", "o": ["IOException", "ArithmeticException", "NumberFormatException", "IndexOutOfBoundsException"], "oc": [false, false, false, false], "a": 1, "e": "Integer division by zero throws ArithmeticException."}, {"n": 71, "s": 4, "lv": "M", "q": "Which exception can result from parsing a non-numeric string using Integer.parseInt?", "code": "", "o": ["NumberFormatException", "IOException", "SQLException", "InterruptedException"], "oc": [false, false, false, false], "a": 0, "e": "parseInt throws NumberFormatException when the input is not a valid integer representation."}, {"n": 72, "s": 4, "lv": "T", "q": "A custom checked exception should generally extend:", "code": "", "o": ["Error", "RuntimeException", "Exception", "Object"], "oc": [false, false, false, false], "a": 2, "e": "A custom checked exception typically extends Exception directly or through another checked exception class."}, {"n": 73, "s": 4, "lv": "T", "q": "Which statement about Error is generally correct?", "code": "", "o": ["It is normally intended for routine application recovery", "It represents serious JVM or system-level problems", "It is always checked", "It is a subclass of RuntimeException"], "oc": [false, false, false, true], "a": 1, "e": "Error represents serious problems that applications generally are not expected to handle as routine conditions."}, {"n": 74, "s": 4, "lv": "T", "q": "What is try-with-resources designed to do?", "code": "", "o": ["Automatically close eligible resources", "Automatically retry failed SQL", "Create threads", "Suppress compilation"], "oc": [false, false, false, false], "a": 0, "e": "Try-with-resources closes AutoCloseable resources automatically when control leaves the statement."}, {"n": 75, "s": 4, "lv": "T", "q": "If a method declares throws IOException, what does it mean?", "code": "", "o": ["It catches IOException", "It may propagate IOException to its caller", "It can never throw IOException", "It converts it to RuntimeException"], "oc": [false, false, false, false], "a": 1, "e": "The throws clause documents and permits propagation of the checked exception to callers."}, {"n": 76, "s": 5, "lv": "E", "q": "Why is String described as immutable?", "code": "", "o": ["Its contents cannot be changed after creation", "It cannot be referenced", "It stores only one character", "It is always mutable"], "oc": [false, false, false, false], "a": 0, "e": "String objects are immutable; operations that appear to modify a string create or return another String."}, {"n": 77, "s": 5, "lv": "E", "q": "What does s1 == s2 compare for String references?", "code": "", "o": ["Text content", "Reference identity", "Alphabetical order", "String length"], "oc": [false, false, false, false], "a": 1, "e": "For references, == checks whether both references identify the same object. Use equals() for content equality."}, {"n": 78, "s": 5, "lv": "E", "q": "Which method compares String contents?", "code": "", "o": ["==", "equals()", "compare()", "same()"], "oc": [true, true, true, true], "a": 1, "e": "String.equals() compares character content, while == compares reference identity."}, {"n": 79, "s": 5, "lv": "E", "q": "What is the String constant pool used for?", "code": "", "o": ["Storing thread stacks", "Sharing/interning string literals and canonical strings", "Storing primitive local variables", "Caching JDBC connections"], "oc": [false, false, false, false], "a": 1, "e": "The string pool enables reuse of equal interned strings, including string literals."}, {"n": 80, "s": 5, "lv": "E", "q": "What does String.intern() return?", "code": "", "o": ["A mutable copy", "The canonical pooled representation of the string", "The string length", "A byte array"], "oc": [false, false, false, false], "a": 1, "e": "intern() returns the canonical pooled String for the same contents, adding it to the pool if necessary."}, {"n": 81, "s": 5, "lv": "E", "q": "Which class is generally preferred for repeated string modification in single-threaded code?", "code": "", "o": ["StringBuilder", "String", "StringTokenizer", "Character"], "oc": [false, false, false, false], "a": 0, "e": "StringBuilder is mutable and avoids creating a new String for every append operation."}, {"n": 82, "s": 5, "lv": "M", "q": "Which class provides synchronized mutable string operations?", "code": "", "o": ["String", "StringBuilder", "StringBuffer", "CharSequence"], "oc": [false, false, false, false], "a": 2, "e": "StringBuffer's methods are synchronized, making it suitable for certain shared mutable-string scenarios."}, {"n": 83, "s": 5, "lv": "M", "q": "Which statement is correct about StringBuilder?", "code": "", "o": ["It is immutable", "It is mutable and not synchronized by default", "It cannot append numbers", "It is an interface"], "oc": [false, false, false, false], "a": 1, "e": "StringBuilder is mutable and generally faster than StringBuffer in single-threaded use because its methods are not synchronized."}, {"n": 84, "s": 5, "lv": "M", "q": "What does length() return for a String?", "code": "", "o": ["Number of bytes in memory", "Number of UTF-16 code units", "Number of words", "Number of distinct characters"], "oc": [false, false, false, false], "a": 1, "e": "String.length() returns the number of UTF-16 code units, not necessarily Unicode code points or displayed characters."}, {"n": 85, "s": 5, "lv": "M", "q": "Which method extracts a portion of a String?", "code": "", "o": ["substring()", "splitOnly()", "sliceArray()", "extract()"], "oc": [true, true, true, true], "a": 0, "e": "substring(begin, end) returns a new String from begin inclusive to end exclusive."}, {"n": 86, "s": 5, "lv": "M", "q": "Which method checks whether a string starts with a prefix?", "code": "", "o": ["contains()", "startsWith()", "matches()", "endsWith()"], "oc": [true, true, true, true], "a": 1, "e": "startsWith(prefix) tests whether the string begins with the supplied prefix."}, {"n": 87, "s": 5, "lv": "T", "q": "Which String method splits text using a regular expression?", "code": "", "o": ["divide()", "split()", "tokenize()", "partition()"], "oc": [true, true, true, true], "a": 1, "e": "String.split(regex) splits around matches of a regular expression."}, {"n": 88, "s": 5, "lv": "T", "q": "In a regular expression, what does \\\\d represent?", "code": "", "o": ["Any letter", "A digit", "Whitespace only", "End of input"], "oc": [false, false, false, false], "a": 1, "e": "The regex token \\d matches a digit; in a Java string literal the backslash is escaped as \\\\d."}, {"n": 89, "s": 5, "lv": "T", "q": "Which method tests whether the entire string matches a regular expression?", "code": "", "o": ["contains()", "matches()", "find()", "search()"], "oc": [true, true, true, true], "a": 1, "e": "String.matches(regex) returns true only when the entire string matches the pattern."}, {"n": 90, "s": 5, "lv": "T", "q": "What does StringBuilder.append() typically return?", "code": "", "o": ["void", "The same StringBuilder instance", "A char array", "A new immutable String"], "oc": [false, false, false, false], "a": 1, "e": "append() returns the StringBuilder itself, allowing chained calls."}, {"n": 91, "s": 6, "lv": "E", "q": "What is the main benefit of Java generics?", "code": "", "o": ["Runtime code generation", "Compile-time type safety and reduced casting", "Automatic database mapping", "Thread scheduling"], "oc": [false, false, false, false], "a": 1, "e": "Generics let APIs express element types and catch many type errors at compile time."}, {"n": 92, "s": 6, "lv": "E", "q": "What does List<E> represent?", "code": "", "o": ["A key-value mapping", "An ordered collection that permits duplicates", "A collection that forbids duplicates", "A thread-safe queue only"], "oc": [false, false, false, false], "a": 1, "e": "List preserves positional order and allows duplicate elements."}, {"n": 93, "s": 6, "lv": "E", "q": "Which implementation is backed by a resizable array?", "code": "", "o": ["ArrayList", "LinkedList", "TreeSet", "HashMap"], "oc": [false, false, false, false], "a": 0, "e": "ArrayList uses a dynamically resizable array internally."}, {"n": 94, "s": 6, "lv": "E", "q": "Which implementation is based on a doubly linked list?", "code": "", "o": ["ArrayList", "LinkedList", "HashSet", "TreeMap"], "oc": [false, false, false, false], "a": 1, "e": "LinkedList implements List and Deque and uses linked nodes, commonly described as a doubly linked list."}, {"n": 95, "s": 6, "lv": "E", "q": "Which collection does not allow duplicate elements?", "code": "", "o": ["List", "Set", "ArrayList", "Vector"], "oc": [false, false, false, false], "a": 1, "e": "Set models a collection with no duplicate elements according to equality semantics."}, {"n": 96, "s": 6, "lv": "E", "q": "Which Set implementation maintains natural sorted order?", "code": "", "o": ["HashSet", "LinkedHashSet", "TreeSet", "ArrayList"], "oc": [false, false, false, false], "a": 2, "e": "TreeSet is a sorted set, normally ordering elements by natural ordering or a supplied Comparator."}, {"n": 97, "s": 6, "lv": "E", "q": "Which Set implementation maintains insertion order?", "code": "", "o": ["HashSet", "LinkedHashSet", "TreeSet", "PriorityQueue"], "oc": [false, false, false, false], "a": 1, "e": "LinkedHashSet maintains a predictable insertion-order iteration sequence."}, {"n": 98, "s": 6, "lv": "E", "q": "Which Map implementation generally makes no ordering guarantee?", "code": "", "o": ["TreeMap", "LinkedHashMap", "HashMap", "EnumMap"], "oc": [false, false, false, false], "a": 2, "e": "HashMap does not guarantee iteration order."}, {"n": 99, "s": 6, "lv": "E", "q": "Which Map implementation sorts keys by natural order by default?", "code": "", "o": ["HashMap", "TreeMap", "LinkedHashMap", "IdentityHashMap"], "oc": [false, false, false, false], "a": 1, "e": "TreeMap is a sorted map ordered by key natural ordering or a supplied Comparator."}, {"n": 100, "s": 6, "lv": "M", "q": "Can a HashMap contain a null key?", "code": "", "o": ["Never", "At most one null key", "Unlimited null keys", "Only if values are null"], "oc": [false, false, false, false], "a": 1, "e": "HashMap permits one null key and multiple null values."}, {"n": 101, "s": 6, "lv": "M", "q": "What does Map.put(key, value) do when the key already exists?", "code": "", "o": ["Always throws an exception", "Replaces the mapping and returns the previous value", "Adds a duplicate key entry", "Clears the map"], "oc": [false, false, false, false], "a": 1, "e": "A Map has unique keys; put replaces the value associated with an existing key and returns the previous value."}, {"n": 102, "s": 6, "lv": "M", "q": "Which interface provides hasNext() and next() for sequential traversal?", "code": "", "o": ["Comparator", "Iterator", "Runnable", "Serializable"], "oc": [false, false, false, false], "a": 1, "e": "Iterator provides hasNext() and next(), and optionally remove() depending on implementation support."}, {"n": 103, "s": 6, "lv": "M", "q": "Which utility class provides static methods such as sort(List)?", "code": "", "o": ["Collection", "Collections", "ArraysList", "Iterator"], "oc": [false, false, false, false], "a": 1, "e": "java.util.Collections contains static algorithms and utility methods for working with collections."}, {"n": 104, "s": 6, "lv": "M", "q": "Which interface is commonly used for a class's natural ordering?", "code": "", "o": ["Comparator", "Comparable", "Iterable", "Cloneable"], "oc": [false, false, false, false], "a": 1, "e": "Comparable<T> defines compareTo(T) and represents a type's natural ordering."}, {"n": 105, "s": 6, "lv": "M", "q": "Which interface supports external/custom comparison strategies?", "code": "", "o": ["Comparable", "Comparator", "Runnable", "AutoCloseable"], "oc": [false, false, false, false], "a": 1, "e": "Comparator<T> defines compare(a, b) and allows multiple ordering strategies."}, {"n": 106, "s": 6, "lv": "M", "q": "What does Comparator.compare(a, b) return when a should come before b?", "code": "", "o": ["Always 0", "A negative integer", "A positive integer", "A boolean"], "oc": [false, false, false, false], "a": 1, "e": "A negative result means the first argument is ordered before the second; zero means equal in ordering; positive means after."}, {"n": 107, "s": 6, "lv": "M", "q": "What does a Queue typically model?", "code": "", "o": ["Last-in-first-out only", "Elements waiting to be processed", "Key-value pairs", "Sorted unique keys only"], "oc": [false, false, false, false], "a": 1, "e": "Queue represents a collection designed for holding elements prior to processing, commonly FIFO."}, {"n": 108, "s": 6, "lv": "M", "q": "Which collection interface provides operations at both ends?", "code": "", "o": ["Deque", "Map", "Set", "SortedMap"], "oc": [false, false, false, false], "a": 0, "e": "Deque is a double-ended queue supporting insertion and removal at both the front and rear."}, {"n": 109, "s": 6, "lv": "T", "q": "What is the purpose of the wildcard <? extends Number>?", "code": "", "o": ["Accept any supertype of Number", "Accept Number or a subtype, primarily for reading values as Number", "Accept only Integer", "Make the list mutable"], "oc": [false, false, false, false], "a": 1, "e": "An upper-bounded wildcard accepts Number and its subtypes; it is useful when a producer supplies values."}, {"n": 110, "s": 6, "lv": "T", "q": "What does <? super Integer> mean?", "code": "", "o": ["Integer or a subtype only", "Integer or one of its supertypes", "Only Object", "Any primitive integer"], "oc": [false, false, false, false], "a": 1, "e": "A lower-bounded wildcard accepts Integer or a supertype of Integer, making it useful for consuming Integer values."}, {"n": 111, "s": 6, "lv": "T", "q": "Which principle summarizes wildcard use for producers and consumers?", "code": "", "o": ["FIFO/LIFO", "PECS: Producer Extends, Consumer Super", "DRY", "MVC"], "oc": [false, false, false, false], "a": 1, "e": "PECS is a practical guideline: use extends when reading/producing values and super when writing/consuming values."}, {"n": 112, "s": 6, "lv": "T", "q": "What does List<Integer> prevent at compile time?", "code": "", "o": ["Storing Integer values", "Adding an unrelated type such as String", "Using iteration", "Calling size()"], "oc": [false, false, false, true], "a": 1, "e": "The generic type parameter restricts elements to Integer-compatible values at compile time."}, {"n": 113, "s": 6, "lv": "T", "q": "Which method reports the number of elements in a Collection?", "code": "", "o": ["length", "size()", "count()", "capacity()"], "oc": [false, true, true, true], "a": 1, "e": "Collection.size() returns the number of elements currently in the collection."}, {"n": 114, "s": 6, "lv": "T", "q": "Which statement about Map is correct?", "code": "", "o": ["Map extends Collection", "Map stores key-value mappings and is separate from Collection hierarchy", "Map forbids values", "Map allows duplicate keys"], "oc": [false, false, false, false], "a": 1, "e": "Map is part of the Collections Framework but does not extend the Collection interface."}, {"n": 115, "s": 6, "lv": "T", "q": "Which is the most suitable structure for fast lookup by a unique employee ID?", "code": "", "o": ["ArrayList only", "HashMap<ID, Employee>", "StringBuilder", "TreeSet of salaries"], "oc": [false, true, false, false], "a": 1, "e": "A HashMap provides key-based lookup and is a natural fit for ID-to-object mappings."}, {"n": 116, "s": 7, "lv": "E", "q": "What is an enum?", "code": "", "o": ["A list of named constants represented by a special class type", "A primitive type", "A thread group", "A file format"], "oc": [true, false, false, false], "a": 0, "e": "An enum defines a fixed set of instances known as enum constants."}, {"n": 117, "s": 7, "lv": "E", "q": "Can an enum be instantiated using new from ordinary client code?", "code": "", "o": ["Yes, always", "No", "Only with public constructor", "Only inside main"], "oc": [false, false, true, false], "a": 1, "e": "Enum instances are the declared constants; client code cannot instantiate enum types using new."}, {"n": 118, "s": 7, "lv": "E", "q": "Which method returns the declared enum constants as an array?", "code": "", "o": ["values()", "valueOf()", "toArray()", "constants()"], "oc": [true, true, true, true], "a": 0, "e": "The compiler provides a static values() method returning an array of the enum constants."}, {"n": 119, "s": 7, "lv": "E", "q": "What does EnumType.valueOf(\"READY\") do?", "code": "", "o": ["Returns null for all inputs", "Returns the enum constant named READY or throws IllegalArgumentException if absent", "Creates a new enum instance", "Returns the ordinal"], "oc": [false, false, false, false], "a": 1, "e": "valueOf(String) looks up a constant by its exact declared name."}, {"n": 120, "s": 7, "lv": "E", "q": "What is autoboxing?", "code": "", "o": ["Converting a wrapper to a primitive", "Automatic conversion of a primitive to its corresponding wrapper type", "Casting Object to String", "Converting int to long"], "oc": [false, false, false, true], "a": 1, "e": "Autoboxing automatically converts a primitive value such as int to its wrapper Integer when required."}, {"n": 121, "s": 7, "lv": "E", "q": "What is unboxing?", "code": "", "o": ["Converting Integer to int automatically", "Converting String to Integer", "Converting double to long", "Creating an enum"], "oc": [true, false, false, false], "a": 0, "e": "Unboxing converts a wrapper object to its corresponding primitive value; unboxing null can throw NullPointerException."}, {"n": 122, "s": 7, "lv": "M", "q": "Which method parses a decimal integer from a String into primitive int?", "code": "", "o": ["Integer.valueOf()", "Integer.parseInt()", "Integer.toString()", "Integer.compareTo()"], "oc": [true, true, true, true], "a": 1, "e": "Integer.parseInt(String) returns primitive int. Integer.valueOf(String) returns an Integer object."}, {"n": 123, "s": 7, "lv": "M", "q": "What does Integer.valueOf(\"42\") return?", "code": "", "o": ["primitive int", "Integer object", "String", "long"], "oc": [false, false, false, false], "a": 1, "e": "valueOf returns an Integer wrapper object, potentially using cached instances for some values."}, {"n": 124, "s": 7, "lv": "M", "q": "Which package contains fundamental classes such as String, Object and Integer?", "code": "", "o": ["java.util", "java.lang", "java.io", "java.sql"], "oc": [true, true, true, true], "a": 1, "e": "java.lang contains core language classes and is implicitly imported into every compilation unit."}, {"n": 125, "s": 7, "lv": "M", "q": "Which package contains ArrayList, HashMap and Random?", "code": "", "o": ["java.lang", "java.util", "java.io", "java.net"], "oc": [true, true, true, true], "a": 1, "e": "These utility and collection classes are in java.util."}, {"n": 126, "s": 7, "lv": "M", "q": "What is the purpose of @Override?", "code": "", "o": ["It creates an interface", "It asks the compiler to verify that a method overrides an inherited method", "It makes a method static", "It prevents exceptions"], "oc": [false, false, false, false], "a": 1, "e": "@Override is a compile-time annotation that helps detect accidental non-overrides."}, {"n": 127, "s": 7, "lv": "T", "q": "Which annotation marks a functional interface?", "code": "", "o": ["@Override", "@FunctionalInterface", "@Deprecated", "@SuppressWarnings"], "oc": [true, true, true, true], "a": 1, "e": "@FunctionalInterface asks the compiler to verify that the interface has exactly one abstract method."}, {"n": 128, "s": 7, "lv": "T", "q": "What does Math.max(a, b) return?", "code": "", "o": ["The smaller value", "The larger value", "The average", "The absolute difference"], "oc": [false, false, false, false], "a": 1, "e": "Math.max returns the greater of its two arguments."}, {"n": 129, "s": 7, "lv": "T", "q": "Which class is used to generate pseudo-random values in java.util?", "code": "", "o": ["Random", "MathOnly", "ThreadLocalDate", "Scanner"], "oc": [false, false, false, false], "a": 0, "e": "java.util.Random generates pseudorandom values; it is not intended for cryptographic security."}, {"n": 130, "s": 7, "lv": "T", "q": "Which statement about wrapper classes is correct?", "code": "", "o": ["They allow primitive values to be represented as objects", "They are all mutable", "They cannot be used in collections", "They are user-defined only"], "oc": [false, false, false, false], "a": 0, "e": "Wrapper classes such as Integer and Double represent primitive values as objects, enabling use in generics and collections."}, {"n": 131, "s": 8, "lv": "E", "q": "A functional interface contains:", "code": "", "o": ["Exactly one abstract method", "Exactly one method of any kind", "No methods", "Only static methods"], "oc": [false, false, false, true], "a": 0, "e": "A functional interface has exactly one abstract method; default and static methods do not count toward the single abstract method."}, {"n": 132, "s": 8, "lv": "E", "q": "What is the lambda operator in Java?", "code": "", "o": ["=>", "->", "::", "==>"], "oc": [true, true, true, true], "a": 1, "e": "Java lambda expressions use -> between the parameter list and the body."}, {"n": 133, "s": 8, "lv": "E", "q": "A lambda expression can be assigned where?", "code": "", "o": ["To any primitive variable", "Where a compatible functional-interface target type is expected", "Only to String", "Only to Thread"], "oc": [false, false, false, false], "a": 1, "e": "The target functional-interface type supplies the parameter and return-type context for a lambda."}, {"n": 134, "s": 8, "lv": "E", "q": "Which functional interface represents a test that returns boolean?", "code": "", "o": ["Consumer<T>", "Predicate<T>", "Supplier<T>", "Function<T,R>"], "oc": [true, true, true, true], "a": 1, "e": "Predicate<T> has test(T) and returns boolean."}, {"n": 135, "s": 8, "lv": "E", "q": "Which interface accepts one argument and returns a result?", "code": "", "o": ["Consumer<T>", "Function<T,R>", "Runnable", "Supplier<T>"], "oc": [true, true, false, true], "a": 1, "e": "Function<T,R> represents a function from T to R through apply(T)."}, {"n": 136, "s": 8, "lv": "E", "q": "Which interface accepts one argument and returns no result?", "code": "", "o": ["Consumer<T>", "Supplier<T>", "Predicate<T>", "Callable<T>"], "oc": [true, true, true, true], "a": 0, "e": "Consumer<T> has accept(T) and returns void."}, {"n": 137, "s": 8, "lv": "M", "q": "Which interface supplies a result without taking an input argument?", "code": "", "o": ["Function<T,R>", "Supplier<T>", "Predicate<T>", "Comparator<T>"], "oc": [true, true, true, true], "a": 1, "e": "Supplier<T> has get() and takes no arguments."}, {"n": 138, "s": 8, "lv": "M", "q": "Which method is the abstract method of Predicate<T>?", "code": "", "o": ["apply(T)", "accept(T)", "test(T)", "get()"], "oc": [true, true, true, true], "a": 2, "e": "Predicate's functional method is boolean test(T t)."}, {"n": 139, "s": 8, "lv": "M", "q": "Which method is the abstract method of Function<T,R>?", "code": "", "o": ["apply(T)", "test(T)", "accept(T)", "run()"], "oc": [true, true, true, true], "a": 0, "e": "Function's functional method is R apply(T t)."}, {"n": 140, "s": 8, "lv": "M", "q": "Which method is the abstract method of Consumer<T>?", "code": "", "o": ["get()", "accept(T)", "apply(T)", "compare(T,T)"], "oc": [true, true, true, true], "a": 1, "e": "Consumer's functional method is void accept(T t)."}, {"n": 141, "s": 8, "lv": "M", "q": "Which lambda correctly represents a Predicate<Integer> that tests whether n is positive?", "code": "", "o": ["n -> n > 0", "n => n > 0", "n -> return n > 0;", "positive(n)"], "oc": [true, true, true, true], "a": 0, "e": "The expression lambda n -> n > 0 returns a boolean and is compatible with Predicate<Integer>."}, {"n": 142, "s": 8, "lv": "T", "q": "What does the method reference String::length represent in an appropriate target context?", "code": "", "o": ["A reference to the length method", "A constructor call", "A package declaration", "A thread start"], "oc": [false, false, false, false], "a": 0, "e": "The :: operator provides a method reference; its compatibility depends on the target functional interface."}, {"n": 143, "s": 8, "lv": "T", "q": "Can a functional interface contain default methods?", "code": "", "o": ["No", "Yes", "Only one method total", "Only private methods"], "oc": [false, false, false, true], "a": 1, "e": "A functional interface may contain default, static and private methods in addition to its one abstract method."}, {"n": 144, "s": 8, "lv": "T", "q": "Which statement about lambda parameter types is correct?", "code": "", "o": ["They must always be explicitly declared", "They can often be inferred from the target type", "They must be primitive", "They must be named arg0"], "oc": [false, false, false, false], "a": 1, "e": "The compiler can infer lambda parameter types from the functional-interface target type."}, {"n": 145, "s": 8, "lv": "T", "q": "Which Collection method accepts a Consumer and performs an action for each element?", "code": "", "o": ["forEach()", "filter()", "reduce()", "compareTo()"], "oc": [true, true, true, true], "a": 0, "e": "Iterable.forEach(Consumer) performs the supplied action for each element."}, {"n": 146, "s": 9, "lv": "E", "q": "A Stream is best described as:", "code": "", "o": ["A data structure that permanently stores elements", "A sequence of elements supporting aggregate operations", "A thread", "A file descriptor"], "oc": [false, false, false, false], "a": 1, "e": "A Stream processes a sequence of elements from a source through a pipeline; it does not itself store the data."}, {"n": 147, "s": 9, "lv": "E", "q": "Which is a key difference between a Collection and a Stream?", "code": "", "o": ["Collections store/manage data; streams process data through operations", "Streams always modify the source", "Collections can never be iterated", "Streams can be reused repeatedly"], "oc": [true, false, false, false], "a": 0, "e": "A collection is a data structure, while a stream is a one-use computation pipeline over a source."}, {"n": 148, "s": 9, "lv": "E", "q": "Which stream operation selects elements matching a condition?", "code": "", "o": ["map()", "filter()", "reduce()", "sorted()"], "oc": [true, true, true, true], "a": 1, "e": "filter(Predicate) retains only elements for which the predicate returns true."}, {"n": 149, "s": 9, "lv": "E", "q": "Which stream operation transforms each element?", "code": "", "o": ["filter()", "map()", "count()", "anyMatch()"], "oc": [true, true, true, true], "a": 1, "e": "map(Function) applies a transformation to each element and emits the mapped results."}, {"n": 150, "s": 9, "lv": "E", "q": "Which operation combines stream elements into a single result?", "code": "", "o": ["filter()", "reduce()", "peek()", "limit()"], "oc": [true, true, true, true], "a": 1, "e": "reduce performs a reduction using an accumulator, optionally with an identity value."}, {"n": 151, "s": 9, "lv": "E", "q": "Which operation converts each element to zero or more elements and flattens the results?", "code": "", "o": ["map()", "flatMap()", "count()", "distinct()"], "oc": [true, true, true, true], "a": 1, "e": "flatMap maps each input to a stream and flattens those streams into one output stream."}, {"n": 152, "s": 9, "lv": "E", "q": "Which of the following is a terminal stream operation?", "code": "", "o": ["filter()", "map()", "sorted()", "count()"], "oc": [true, true, true, true], "a": 3, "e": "count() is terminal and triggers evaluation of the pipeline."}, {"n": 153, "s": 9, "lv": "M", "q": "Which of the following is an intermediate stream operation?", "code": "", "o": ["collect()", "forEach()", "filter()", "count()"], "oc": [true, true, true, true], "a": 2, "e": "filter() is intermediate and returns another stream; terminal operations produce a result or side effect."}, {"n": 154, "s": 9, "lv": "M", "q": "What happens after a terminal operation has been performed on a stream?", "code": "", "o": ["The same stream can be reused freely", "The stream is consumed and should not be reused", "The source collection is always deleted", "The JVM shuts down"], "oc": [false, false, false, false], "a": 1, "e": "A stream is consumed by a terminal operation; attempting to reuse it generally causes IllegalStateException."}, {"n": 155, "s": 9, "lv": "M", "q": "What does anyMatch(predicate) return?", "code": "", "o": ["A count", "True if at least one element matches", "A sorted list", "The first element"], "oc": [false, false, false, false], "a": 1, "e": "anyMatch is a short-circuiting terminal operation that returns true when at least one element matches."}, {"n": 156, "s": 9, "lv": "M", "q": "Which primitive stream specializes for int values?", "code": "", "o": ["Stream<Integer>", "IntStream", "LongStream", "DoubleStream"], "oc": [true, false, false, false], "a": 1, "e": "IntStream is the primitive specialization for int values and offers operations such as sum and average."}, {"n": 157, "s": 9, "lv": "M", "q": "Which method converts an IntStream into Stream<Integer>?", "code": "", "o": ["unbox()", "boxed()", "wrap()", "toObject()"], "oc": [true, true, true, true], "a": 1, "e": "boxed() converts primitive int elements to Integer elements in a reference stream."}, {"n": 158, "s": 9, "lv": "M", "q": "Which method can collect stream results into a List using modern Java APIs?", "code": "", "o": ["collect(Collectors.toList())", "toArrayListOnly()", "reduceList()", "filterList()"], "oc": [true, true, true, true], "a": 0, "e": "A common collection pattern is stream.collect(Collectors.toList()); Java 16+ also provides Stream.toList(), which returns an unmodifiable list."}, {"n": 159, "s": 9, "lv": "M", "q": "Which class represents a date without time or time zone in java.time?", "code": "", "o": ["Date", "LocalDate", "LocalDateTime", "Instant"], "oc": [false, false, false, false], "a": 1, "e": "LocalDate represents a calendar date without a time or time zone."}, {"n": 160, "s": 9, "lv": "M", "q": "Which class represents a date and time without a time zone?", "code": "", "o": ["LocalDate", "LocalTime", "LocalDateTime", "ZoneId"], "oc": [false, false, false, false], "a": 2, "e": "LocalDateTime combines date and time fields but has no time-zone or offset information."}, {"n": 161, "s": 9, "lv": "T", "q": "Which API type represents a point on the UTC timeline?", "code": "", "o": ["LocalDate", "Instant", "Month", "Period"], "oc": [false, false, false, false], "a": 1, "e": "Instant represents a moment on the timeline using seconds and nanoseconds from the epoch."}, {"n": 162, "s": 9, "lv": "T", "q": "Which type is commonly used to represent a date-based amount such as years, months and days?", "code": "", "o": ["Duration", "Period", "Instant", "ZoneOffset"], "oc": [false, false, false, false], "a": 1, "e": "Period represents a date-based amount in years, months and days; Duration is time-based."}, {"n": 163, "s": 9, "lv": "T", "q": "Which class is commonly used to calculate the amount of time between two LocalDate values?", "code": "", "o": ["Period", "Random", "StringBuilder", "Thread"], "oc": [false, false, false, false], "a": 0, "e": "Period.between(start, end) calculates the date-based difference between two LocalDate values."}, {"n": 164, "s": 9, "lv": "T", "q": "Which statement about stream laziness is correct?", "code": "", "o": ["Intermediate operations are generally lazy", "All operations execute immediately", "Terminal operations are always lazy", "Streams never evaluate"], "oc": [false, false, false, false], "a": 0, "e": "Intermediate operations build a pipeline and are generally evaluated only when a terminal operation is invoked."}, {"n": 165, "s": 9, "lv": "T", "q": "Which operation sorts stream elements?", "code": "", "o": ["order()", "sorted()", "arrange()", "sortNow()"], "oc": [true, true, true, true], "a": 1, "e": "sorted() returns a stream with elements ordered by natural order or a supplied Comparator."}, {"n": 166, "s": 10, "lv": "E", "q": "What is a thread?", "code": "", "o": ["A separate program file", "A path of execution within a process", "A database table", "A Java package"], "oc": [false, false, false, false], "a": 1, "e": "A thread is an independent sequence of execution within a process; threads in a process share process resources."}, {"n": 167, "s": 10, "lv": "E", "q": "Which interface is commonly used to define a task for a thread?", "code": "", "o": ["Serializable", "Runnable", "Comparator", "Collection"], "oc": [false, false, false, false], "a": 1, "e": "Runnable represents a task through its run() method."}, {"n": 168, "s": 10, "lv": "E", "q": "Which method actually schedules a new thread of execution?", "code": "", "o": ["run()", "start()", "sleep()", "join()"], "oc": [true, true, true, true], "a": 1, "e": "Calling start() causes the JVM to schedule a new thread; the new thread then invokes run()."}, {"n": 169, "s": 10, "lv": "E", "q": "What happens when run() is called directly like an ordinary method?", "code": "", "o": ["A new thread is always created", "It executes on the current thread", "The JVM rejects it", "It terminates the current thread"], "oc": [false, false, false, false], "a": 1, "e": "A direct call to run() is an ordinary method call and does not start a new thread."}, {"n": 170, "s": 10, "lv": "E", "q": "Which method pauses the current thread for a specified time?", "code": "", "o": ["join()", "sleep()", "notify()", "yield()"], "oc": [true, true, true, true], "a": 1, "e": "Thread.sleep() pauses the currently executing thread for at least the specified duration, subject to scheduling."}, {"n": 171, "s": 10, "lv": "E", "q": "Which method waits for another thread to finish?", "code": "", "o": ["sleep()", "join()", "yield()", "notifyAll()"], "oc": [true, true, true, true], "a": 1, "e": "join() causes the current thread to wait for the target thread to terminate."}, {"n": 172, "s": 10, "lv": "E", "q": "Which method gives a scheduling hint to let other threads run?", "code": "", "o": ["yield()", "wait()", "start()", "interrupt()"], "oc": [true, true, true, true], "a": 0, "e": "yield() is a scheduler hint; it does not guarantee that another thread will run."}, {"n": 173, "s": 10, "lv": "M", "q": "Which object defines the monitor used by a synchronized instance method?", "code": "", "o": ["The class loader", "The current object (this)", "The current thread's stack", "The garbage collector"], "oc": [true, true, false, false], "a": 1, "e": "A synchronized instance method acquires the monitor lock associated with this."}, {"n": 174, "s": 10, "lv": "M", "q": "A synchronized static method locks:", "code": "", "o": ["The current instance", "The Class object associated with the declaring class", "Every object in the JVM", "The current thread"], "oc": [false, false, false, false], "a": 1, "e": "A static synchronized method acquires the monitor of the Class object for the declaring class."}, {"n": 175, "s": 10, "lv": "M", "q": "What problem does synchronization primarily help prevent when accessing shared mutable state?", "code": "", "o": ["Syntax errors", "Race conditions", "Package conflicts", "Integer overflow"], "oc": [false, false, false, false], "a": 1, "e": "Synchronization provides mutual exclusion and memory-visibility guarantees for code guarded by the same monitor."}, {"n": 176, "s": 10, "lv": "M", "q": "Which method releases an object's monitor while waiting for a condition?", "code": "", "o": ["sleep()", "wait()", "join()", "yield()"], "oc": [true, true, true, true], "a": 1, "e": "Object.wait() releases the monitor and suspends the thread until notification, interruption or timeout."}, {"n": 177, "s": 10, "lv": "M", "q": "Which method wakes one thread waiting on an object's monitor?", "code": "", "o": ["notify()", "notifyAll()", "start()", "interruptAll()"], "oc": [true, true, true, true], "a": 0, "e": "notify() wakes one arbitrarily selected thread waiting on that object's monitor."}, {"n": 178, "s": 10, "lv": "M", "q": "Which method wakes all threads waiting on an object's monitor?", "code": "", "o": ["notify()", "notifyAll()", "sleep()", "join()"], "oc": [true, true, true, true], "a": 1, "e": "notifyAll() wakes all threads waiting on that object's monitor; they must reacquire the monitor before proceeding."}, {"n": 179, "s": 10, "lv": "M", "q": "Where must wait(), notify() and notifyAll() be called?", "code": "", "o": ["Anywhere", "While holding the same object's monitor", "Only in static methods", "Only in main"], "oc": [false, false, true, false], "a": 1, "e": "Calling these Object methods without owning the object's monitor throws IllegalMonitorStateException."}, {"n": 180, "s": 10, "lv": "M", "q": "Which state indicates a thread has been created but start() has not yet been called?", "code": "", "o": ["RUNNABLE", "NEW", "BLOCKED", "TERMINATED"], "oc": [false, false, false, false], "a": 1, "e": "A newly constructed Thread is in the NEW state until start() is invoked."}, {"n": 181, "s": 10, "lv": "T", "q": "Which Thread.State represents a thread waiting to acquire a monitor lock?", "code": "", "o": ["WAITING", "TIMED_WAITING", "BLOCKED", "NEW"], "oc": [false, false, false, false], "a": 2, "e": "BLOCKED means the thread is waiting to enter a synchronized block or method because another thread owns the monitor."}, {"n": 182, "s": 10, "lv": "T", "q": "Which is a valid way to implement a task using Runnable?", "code": "", "o": ["Implement run() and pass the instance to Thread", "Implement main() only", "Extend String", "Override wait()"], "oc": [true, true, false, true], "a": 0, "e": "A Runnable implementation defines run() and can be supplied to a Thread constructor."}, {"n": 183, "s": 10, "lv": "T", "q": "What is a race condition?", "code": "", "o": ["A deterministic compile-time warning", "A result that depends on uncontrolled timing/interleaving of concurrent operations", "A thread that runs fastest", "A JVM memory region"], "oc": [false, false, false, false], "a": 1, "e": "A race condition occurs when correctness depends on unpredictable thread interleavings, commonly involving shared mutable state."}, {"n": 184, "s": 10, "lv": "T", "q": "What does thread interruption do?", "code": "", "o": ["Always forcibly terminates a thread", "Sets an interruption signal that cooperative code can detect", "Restarts the JVM", "Releases every lock"], "oc": [false, false, false, false], "a": 1, "e": "Interruption is a cooperative cancellation mechanism; blocking methods may throw InterruptedException."}, {"n": 185, "s": 10, "lv": "T", "q": "What is the main difference between multiprocessing and multithreading in the lecture comparison?", "code": "", "o": ["Processes share one address space by default", "Threads in a process share address space; processes generally have separate address spaces", "Threads always run on separate computers", "Processes cannot run concurrently"], "oc": [false, true, false, false], "a": 1, "e": "The notes contrast separate process address spaces with threads sharing a process address space, with lower communication/context-switch overhead typically associated with threads."}, {"n": 186, "s": 11, "lv": "E", "q": "Which package contains core file and stream I/O classes?", "code": "", "o": ["java.io", "java.sql", "java.net", "java.awt"], "oc": [true, true, true, true], "a": 0, "e": "The java.io package provides stream-based input/output and serialization classes."}, {"n": 187, "s": 11, "lv": "E", "q": "What does serialization mean in Java?", "code": "", "o": ["Converting an object state into a byte stream", "Converting bytecode to source", "Sorting objects", "Starting a thread"], "oc": [false, false, false, false], "a": 0, "e": "Serialization writes an object's state to a byte stream so it can be stored or transmitted."}, {"n": 188, "s": 11, "lv": "E", "q": "Which marker interface enables default Java object serialization?", "code": "", "o": ["Runnable", "Serializable", "Comparable", "Cloneable"], "oc": [false, false, false, false], "a": 1, "e": "A class generally implements Serializable to allow its instances to be serialized by ObjectOutputStream."}, {"n": 189, "s": 11, "lv": "E", "q": "Which class writes objects to an output stream?", "code": "", "o": ["ObjectInputStream", "ObjectOutputStream", "FileReader", "BufferedReader"], "oc": [false, false, false, false], "a": 1, "e": "ObjectOutputStream writes primitive data and object graphs to an underlying output stream."}, {"n": 190, "s": 11, "lv": "E", "q": "Which class reads serialized objects?", "code": "", "o": ["ObjectOutputStream", "ObjectInputStream", "FileWriter", "PrintWriter"], "oc": [false, false, false, false], "a": 1, "e": "ObjectInputStream reads primitive data and objects previously written by ObjectOutputStream."}, {"n": 191, "s": 11, "lv": "E", "q": "Which keyword marks an instance field to be excluded from default serialization?", "code": "", "o": ["volatile", "static", "transient", "native"], "oc": [false, false, false, false], "a": 2, "e": "transient fields are not written as part of default serialization; after deserialization they receive default values unless restored separately."}, {"n": 192, "s": 11, "lv": "M", "q": "Are static fields serialized as part of an individual object's default state?", "code": "", "o": ["Yes, always", "No, static fields belong to the class, not the serialized instance state", "Only if final", "Only if transient"], "oc": [false, true, false, false], "a": 1, "e": "Default serialization records instance state, not static class state."}, {"n": 193, "s": 11, "lv": "M", "q": "Which exception may occur when deserializing an incompatible serialized class version?", "code": "", "o": ["InvalidClassException", "ArithmeticException", "NullPointerException", "NumberFormatException"], "oc": [false, false, false, false], "a": 0, "e": "InvalidClassException is an ObjectStreamException commonly raised for serialization compatibility problems."}, {"n": 194, "s": 11, "lv": "M", "q": "What is serialVersionUID used for?", "code": "", "o": ["Thread identification", "Version compatibility checking during serialization", "File naming", "Database connection pooling"], "oc": [false, false, false, false], "a": 1, "e": "serialVersionUID identifies a serializable class version and helps the runtime verify compatibility."}, {"n": 195, "s": 11, "lv": "M", "q": "Which approach is recommended to ensure a stream is closed?", "code": "", "o": ["Ignore it", "Use try-with-resources", "Call System.gc()", "Use finalize()"], "oc": [false, false, true, true], "a": 1, "e": "Try-with-resources automatically closes resources that implement AutoCloseable, including many I/O streams."}, {"n": 196, "s": 11, "lv": "M", "q": "Which class reads character data efficiently using buffering?", "code": "", "o": ["BufferedReader", "ObjectOutputStream", "Random", "Thread"], "oc": [false, false, false, false], "a": 0, "e": "BufferedReader buffers character input and provides convenient methods such as readLine()."}, {"n": 197, "s": 11, "lv": "T", "q": "Which class writes character data to a file?", "code": "", "o": ["FileWriter", "FileInputStream", "ObjectInputStream", "DataInputStream"], "oc": [false, false, false, false], "a": 0, "e": "FileWriter is a character-output convenience class; for explicit charset control, newer APIs such as Files.newBufferedWriter are often preferable."}, {"n": 198, "s": 11, "lv": "T", "q": "Which statement about File is correct?", "code": "", "o": ["It directly represents the contents of a file in memory", "It represents a file-system path and supports path-related operations", "It serializes objects automatically", "It is a thread"], "oc": [false, false, false, false], "a": 1, "e": "java.io.File represents a file or directory path and provides operations such as exists(), isDirectory() and delete()."}, {"n": 199, "s": 11, "lv": "T", "q": "Which interface should a resource implement to be used in try-with-resources?", "code": "", "o": ["Runnable", "AutoCloseable", "Comparator", "Iterable"], "oc": [false, false, false, false], "a": 1, "e": "Try-with-resources works with resources implementing AutoCloseable; Closeable extends AutoCloseable."}, {"n": 200, "s": 11, "lv": "T", "q": "What is deserialization?", "code": "", "o": ["Writing object state to a stream", "Reconstructing objects from a serialized byte stream", "Deleting a file", "Compiling Java"], "oc": [false, false, false, false], "a": 1, "e": "Deserialization reads a serialized representation and reconstructs the object graph."}, {"n": 201, "s": 12, "lv": "E", "q": "What does JDBC stand for?", "code": "", "o": ["Java Database Connectivity", "Java Data Binary Compiler", "Java Distributed Byte Code", "Joint Database Class"], "oc": [false, false, false, true], "a": 0, "e": "JDBC is the Java API for connecting to databases and executing SQL operations."}, {"n": 202, "s": 12, "lv": "E", "q": "What is the main role of a JDBC driver?", "code": "", "o": ["Compile Java source", "Translate JDBC calls into database-specific communication", "Create Java threads", "Serialize Java objects"], "oc": [false, false, false, false], "a": 1, "e": "A JDBC driver implements the JDBC interfaces and communicates with a particular database system."}, {"n": 203, "s": 12, "lv": "E", "q": "Which JDBC object represents an active database session?", "code": "", "o": ["ResultSet", "Connection", "DriverManager only", "SQLException"], "oc": [false, false, false, false], "a": 1, "e": "Connection represents a session/connection to a particular database."}, {"n": 204, "s": 12, "lv": "E", "q": "Which interface is used to execute a simple SQL statement without parameters?", "code": "", "o": ["Statement", "ResultSet", "Runnable", "PreparedStatement only"], "oc": [false, false, false, false], "a": 0, "e": "Statement is used to execute static SQL statements; PreparedStatement is generally preferred for parameterized SQL."}, {"n": 205, "s": 12, "lv": "E", "q": "Which JDBC interface represents a precompiled parameterized SQL statement?", "code": "", "o": ["Statement", "PreparedStatement", "ResultSet", "Driver"], "oc": [false, false, false, false], "a": 1, "e": "PreparedStatement supports parameter placeholders, parameter binding and repeated execution."}, {"n": 206, "s": 12, "lv": "E", "q": "Which character is commonly used as a parameter placeholder in PreparedStatement SQL?", "code": "", "o": ["#", "?", "@", "$"], "oc": [false, false, true, false], "a": 1, "e": "A question mark (?) represents a positional parameter that is set using methods such as
