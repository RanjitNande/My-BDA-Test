o data frames `x` and `y` using the `merge()` function?", "code": "", "o": ["merge(x, y, by = 'id', all.x = TRUE)", "merge(x, y, by = 'id', left = TRUE)", "merge(x, y, by = 'id', all.y = TRUE)", "merge(x, y, by = 'id')"], "oc": [true, true, true, true], "a": 0, "e": "`merge(x, y, by = 'id')` performs an inner join by default; passing `all.x = TRUE` performs a left outer join (`all.y = TRUE` for right join, `all = TRUE` for full outer join)."}, {"n": 189, "s": 16, "lv": "E", "q": "In R (Session 17), what value does a user-defined function `f <- function(a, b = 2) { a * b }` return if no explicit `return()` call is used?", "code": "", "o": ["NULL", "The value of the last evaluated expression in the function body (`a * b`)", "NA", "TRUE"], "oc": [false, true, false, false], "a": 1, "e": "In R, functions automatically return the value of the final evaluated expression in their body without requiring an explicit `return()` call."}, {"n": 190, "s": 16, "lv": "E", "q": "Which built-in R character function concatenates strings together with a space separator by default, and which variant concatenates with no separator (`sep = ''`)?", "code": "", "o": ["paste() and paste0()", "concat() and concat0()", "str_join() and str_cat()", "join() and glue0()"], "oc": [true, true, true, true], "a": 0, "e": "`paste(..., sep = ' ')` joins arguments with a space by default, while `paste0(...)` joins them with an empty string `''`."}, {"n": 191, "s": 16, "lv": "E", "q": "In R, what is the difference between `length('DataScience')` and `nchar('DataScience')`?", "code": "", "o": ["`length('DataScience')` returns `1` (a character vector of 1 string), whereas `nchar('DataScience')` returns `11` (the number of characters in that string)", "Both return `11`", "`length()` returns `11` and `nchar()` returns `1`", "`nchar()` raises an error on strings"], "oc": [true, false, true, true], "a": 0, "e": "In R, `'DataScience'` is a character vector of length 1 (`length()` = 1); `nchar()` counts the characters inside each string element (`11`)."}, {"n": 192, "s": 16, "lv": "E", "q": "In R Markdown (`.Rmd`, Session 17), what are the three main components of an R Markdown document?", "code": "", "o": ["YAML metadata header (`---`), Markdown narrative text, and executable R code chunks (```` ```{r} ````)", "HTML head, CSS stylesheet, and JavaScript script tag", "Preamble, LaTeX body, and BibTeX file only", "SQL schema, R script, and CSV attachment"], "oc": [true, false, false, false], "a": 0, "e": "An `.Rmd` file consists of a YAML frontmatter header enclosed in `---`, formatted Markdown prose, and fenced code chunks ` ```{r} ... ``` `."}, {"n": 193, "s": 16, "lv": "M", "q": "In R Markdown code chunk options (```` ```{r, echo=FALSE, eval=TRUE} ````), what is the difference between `echo=FALSE` and `eval=FALSE`?", "code": "", "o": ["`echo=FALSE` hides the R source code in the final report but still runs the code and shows its output/plots; `eval=FALSE` prevents the code from running at all", "`echo=FALSE` disables plots; `eval=FALSE` hides code", "Both hide the code and prevent execution", "`echo=FALSE` prints warnings only"], "oc": [true, false, false, true], "a": 0, "e": "`echo=FALSE` suppresses displaying the source code in the rendered document while still evaluating the chunk and displaying its results/plots; `eval=FALSE` skips executing the chunk."}, {"n": 194, "s": 16, "lv": "M", "q": "In Session 17 Lab Case Study (`ChickWeight` dataset), what are the four variables (columns) in the built-in `ChickWeight` data frame?", "code": "", "o": ["weight, Time, Chick, and Diet", "height, Age, Bird, and Food", "mass, Day, ID, and Group", "weight, Week, Species, and Supplement"], "oc": [false, false, false, false], "a": 0, "e": "The built-in R dataset `ChickWeight` has 578 rows and 4 columns: `weight` (gm), `Time` (days since birth), `Chick` (unique chick identifier), and `Diet` (experimental diet 1–4)."}, {"n": 195, "s": 16, "lv": "M", "q": "In the Session 17 `ChickWeight` Case Study, what does `split(ChickWeight, ChickWeight$Diet)` return?", "code": "", "o": ["A named list of 4 data frames, one for each level of `Diet` (1, 2, 3, and 4)", "A single sorted data frame", "A 4x4 correlation matrix", "A vector of mean weights"], "oc": [true, false, false, false], "a": 0, "e": "`split(x, f)` divides the data frame `ChickWeight` into a named list of subsets grouped by the factor `ChickWeight$Diet`."}, {"n": 196, "s": 16, "lv": "M", "q": "In the Session 17 `ChickWeight` Case Study, after subsetting `diet4 <- subset(ChickWeight, Diet == 4)`, which base R formula call displays box plots of `weight` for each `Time` point?", "code": "", "o": ["boxplot(weight ~ Time, data = diet4)", "plot_box(diet4$Time, diet4$weight)", "hist(weight ~ Time, data = diet4)", "barplot(diet4$weight, diet4$Time)"], "oc": [true, true, true, true], "a": 0, "e": "`boxplot(weight ~ Time, data = diet4)` (or `boxplot(split(diet4$weight, diet4$Time))`) draws side-by-side boxplots of chick weight at each time point for Diet group 4."}, {"n": 197, "s": 16, "lv": "M", "q": "In the Session 17 `ChickWeight` Case Study, after plotting the mean weight vs. time for Diet group 4 using `plot(times, mean_g4, type = 'l')`, which base R function adds the mean weight curve for Diet group 2 onto the EXISTING plot without erasing it?", "code": "", "o": ["lines(times, mean_g2, col = 'red')", "plot(times, mean_g2, add = TRUE)", "add_curve(times, mean_g2)", "boxplot(times, mean_g2)"], "oc": [true, true, true, true], "a": 0, "e": "In base R graphics, `plot()` starts a new plot frame, whereas low-level plotting functions like `lines()`, `points()`, `legend()`, and `title()` add layers to the existing active plot."}, {"n": 198, "s": 16, "lv": "T", "q": "In the Session 17 `ChickWeight` Case Study, which base R expression computes the mean `weight` for each `Time` point within `diet4` (`Diet == 4`)?", "code": "", "o": ["tapply(diet4$weight, diet4$Time, mean)", "lapply(diet4$weight, mean)", "vapply(diet4, diet4$Time, sum)", "mapply(mean, diet4$weight)"], "oc": [true, true, true, true], "a": 0, "e": "`tapply(X, INDEX, FUN)` applies a function (`mean`) to a ragged array/vector (`diet4$weight`) grouped by one or more factors (`diet4$Time`), returning the mean weight at each time point."}, {"n": 199, "s": 16, "lv": "T", "q": "In R's built-in numeric rounding functions (Session 17), what does `round(c(2.5, 3.5))` return under R's IEC 60559 'round to even' (banker's rounding) rule?", "code": "", "o": ["c(3, 4)", "c(2, 4)", "c(2, 3)", "c(3, 3)"], "oc": [true, true, true, true], "a": 1, "e": "R's `round()` uses round-half-to-even: exact `.5` values round to the nearest EVEN integer, so `2.5` rounds to `2` and `3.5` rounds to `4`."}, {"n": 200, "s": 16, "lv": "T", "q": "What is the difference between `grep('cat', x)` and `grepl('cat', x)` in R's built-in character functions?", "code": "", "o": ["`grep()` returns the integer indices of matching elements (or values if `value=TRUE`), whereas `grepl()` returns a logical (`TRUE`/`FALSE`) vector of the same length as `x`", "`grepl()` returns a list and `grep()` returns a vector", "`grep()` replaces matches with a new string", "There is no difference"], "oc": [true, true, true, false], "a": 0, "e": "`grep(pattern, x)` returns a vector of matching element indices, while `grepl(pattern, x)` ('grep logical') returns a boolean vector (`TRUE`/`FALSE` for every element of `x`)."}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const Q = DATA.questions;
const TOTAL_Q = Q.length;
const byN = {}; Q.forEach(q => { byN[q.n] = q; });
const LV = {E:'Easy', M:'Medium', T:'Tough'};
const LVBARS = {E:1, M:2, T:3};
const SESS = DATA.sessions.map(s => {
  const i = s.title.indexOf(': ');
  const qs = Q.filter(q => q.s === s.n).map(q => q.n);
  return {n:s.n, refs:s.refs, name: i > 0 ? s.title.slice(0, i) : s.title, topics: i > 0 ? s.title.slice(i + 2) : '', qs};
});
const sessByN = {}; SESS.forEach(s => { sessByN[s.n] = s; });

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
const SQLKW = /^(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|FULL|NATURAL|USING|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|DISTINCT|UNION|ALL|ANY|EXISTS|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|ALTER|DROP|TRUNCATE|RENAME|TO|ADD|COLUMN|MODIFY|CHANGE|PRIMARY|FOREIGN|KEY|REFERENCES|UNIQUE|CHECK|DEFAULT|CONSTRAINT|AUTO_INCREMENT|INT|INTEGER|BIGINT|VARCHAR|CHAR|DECIMAL|DATE|TEXT|BEGIN|END|DECLARE|PROCEDURE|FUNCTION|RETURNS|RETURN|CALL|IF|THEN|ELSE|ELSEIF|CASE|WHEN|WHILE|DO|LOOP|LEAVE|ITERATE|REPEAT|UNTIL|CURSOR|FOR|OPEN|FETCH|CLOSE|HANDLER|CONTINUE|EXIT|FOUND|SQLEXCEPTION|SQLSTATE|SIGNAL|RESIGNAL|TRIGGER|BEFORE|AFTER|EACH|ROW|NEW|OLD|DELIMITER|START|TRANSACTION|COMMIT|ROLLBACK|SAVEPOINT|GRANT|REVOKE|WITH|RECURSIVE|OVER|PARTITION|ROWS|BETWEEN|LIKE|DESC|ASC|COUNT|SUM|AVG|MIN|MAX|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|COALESCE|IFNULL|CONCAT|DETERMINISTIC|READS|SQL|DATA|OUT|INOUT|TEMPORARY|ENGINE|SHOW|DESCRIBE|USE|DATABASE|TRUE|FALSE|def|return|if|elif|else|for|while|break|continue|pass|import|from|as|class|try|except|finally|raise|with|yield|lambda|and|or|not|in|is|None|True|False|self|super|async|await|global|nonlocal|del|assert|function|library|require|install|packages|c|list|data|frame|matrix|factor|NA|NaN|NULL|Inf|TRUE|FALSE|print|range|len|set|dict|tuple|int|float|str|bool|sum|min|max|sorted|zip|map|filter|open|ggplot|aes|geom_bar|geom_point|coord_polar|facet_wrap|group_by|summarise|mutate|select|filter|arrange|pivot_longer|pivot_wider|public|private|protected|static|final|void|new|this|extends|implements|interface|abstract|throws|throw|catch|synchronized|volatile|transient|package|boolean|byte|short|long|double|char|switch|case|default|do|instanceof|enum|System|out|println|String|StringBuilder|List|ArrayList|Set|HashSet|Map|HashMap|IntStream|LocalDate|Thread|PreparedStatement)$/;
function highlight(code){
  const re = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|--[^\n]*|\/\/[^\n]*|#[^\n]*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]+\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (t[0] === "'" || t[0] === '"') out += '<span class="st">' + esc(t) + '</span>';
    else if (t.startsWith('--') || t.startsWith('//') || t[0] === '#') out += '<span class="cm">' + esc(t) + '</span>';
    else if (/^\d/.test(t)) out += '<span class="nu">' + esc(t) + '</span>';
    else if (SQLKW.test(t)) out += '<span class="kw">' + esc(t) + '</span>';
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}
function asciiTable(rows){
  const w = rows[0].map((_, c) => Math.max(...rows.map(r => String(r[c]).length)));
  const line = '+' + w.map(x => '-'.repeat(x + 2)).join('+') + '+';
  const fmt = r => '| ' + r.map((v, c) => { const s = String(v); return /^\d+$/.test(s) ? s.padStart(w[c]) : s.padEnd(w[c]); }).join(' | ') + ' |';
  return [line, fmt(rows[0]), line, ...rows.slice(1).map(fmt), line].join('\n') + '\n' + (rows.length - 1) + ' rows in set';
}
let toastTimer = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }

/* ---------- progress store ---------- */
const LS_KEY = 'pyr200-progress-v1';
let store = {a:{}, resetAt:0};
function lsRead(){ try { const s = localStorage.getItem(LS_KEY); if (s){ const o = JSON.parse(s); if (o && typeof o.a === 'object') store = {a:o.a, resetAt:o.resetAt || 0}; } } catch(e){} }
function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){} }
function ans(n){ const e = store.a[n]; return (e && e.c >= 0) ? e : null; }
function record(n, choice){
  const q = byN[n], ok = choice === q.a, e = store.a[n] || {};
  store.a[n] = {c:choice, ok, t:Date.now(), w:(e.w || 0) + (ok ? 0 : 1), r:(e.r || 0) + (ok ? 1 : 0)};
  persist();
}
function clearAnswers(ns){
  const t = Date.now();
  ns.forEach(n => { const e = store.a[n]; if (e && e.c >= 0) store.a[n] = Object.assign({}, e, {c:-1, ok:false, t}); });
  persist();
}
function resetAll(){ store = {a:{}, resetAt:Date.now()}; persist(); }
function stats(ns){
  let ok = 0, bad = 0;
  ns.forEach(n => { const e = ans(n); if (e){ if (e.ok) ok++; else bad++; } });
  return {ok, bad, done: ok + bad, total: ns.length, todo: ns.length - ok - bad};
}
function wrongList(){ return Q.filter(q => { const e = ans(q.n); return e && !e.ok; }).map(q => q.n); }

let ref = null, remoteOn = false, dirty = false, saveTimer = null, writing = Promise.resolve(), retried = false;
function setSync(s){
  const el = $('sync'); el.dataset.s = s;
  $('syncText').textContent = s === 'account' ? 'Saved to your account' : s === 'connecting' ? 'Connecting…' : 'Saved in this browser';
}
function persist(){
  lsWrite();
  $('mistakesCount').textContent = wrongList().length;
  if (remoteOn){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
}
function flush(){
  if (!dirty || !ref || !remoteOn) return;
  dirty = false;
  const body = JSON.parse(JSON.stringify(store));
  writing = writing.then(() => ref.set(body)).then(() => { retried = false; setSync('account'); }, err => {
    if (err && err.code === 'unavailable' && !retried){ retried = true; dirty = true; saveTimer = setTimeout(flush, 2500 + Math.random() * 2500); }
    else { remoteOn = false; setSync('local'); }
  });
}

/* ---------- view state & universal history stack ---------- */
let view = 'home';
let sortMode = 'syllabus';
let resetArmed = false;
let set = null;          // {title, sub, kind, s, ns}
let lvFilter = 'all';    // all | E | M | T
let stFilter = 'all';    // all | todo | wrong
let list = [];           // question numbers currently in filtered list
let idx = 0;             // active question index in list
let showRefs = false;

let navStack = [];
let navPtr = -1;
let suppressPush = false;

function captureSnapshot() {
  return {
    view,
    sortMode,
    set: set ? JSON.parse(JSON.stringify(set)) : null,
    lvFilter,
    stFilter,
    idx,
    scrollY: window.scrollY
  };
}

function pushNavState() {
  if (suppressPush) return;
  const snap = captureSnapshot();
  if (navPtr >= 0) {
    const cur = navStack[navPtr];
    if (cur && cur.view === snap.view && cur.lvFilter === snap.lvFilter && cur.stFilter === snap.stFilter &&
        cur.sortMode === snap.sortMode && ((cur.set && snap.set && cur.set.title === snap.set.title) || (!cur.set && !snap.set))) {
      navStack[navPtr] = snap;
      updateNavButtons();
      return;
    }
  }
  navStack = navStack.slice(0, navPtr + 1);
  navStack.push(snap);
  navPtr = navStack.length - 1;
  try { history.pushState({navPtr}, ''); } catch(e) {}
  updateNavButtons();
}

function restoreNavState(targetPtr) {
  if (targetPtr < 0 || targetPtr >= navStack.length) return;
  if (navPtr >= 0 && navStack[navPtr]) {
    navStack[navPtr].scrollY = window.scrollY;
  }
  navPtr = targetPtr;
  const snap = navStack[navPtr];
  suppressPush = true;
  view = snap.view;
  sortMode = snap.sortMode || 'syllabus';
  set = snap.set ? JSON.parse(JSON.stringify(snap.set)) : null;
  lvFilter = snap.lvFilter || 'all';
  stFilter = snap.stFilter || 'all';
  if (set) buildList();
  idx = snap.idx || 0;
  $('vHome').hidden = view !== 'home';
  $('vQuiz').hidden = view !== 'quiz';
  $('vResult').hidden = view !== 'result';
  $('vMistakes').hidden = view !== 'mistakes';
  refresh();
  updateNavButtons();
  setTimeout(() => {
    window.scrollTo({top: snap.scrollY || 0, behavior: 'auto'});
    suppressPush = false;
  }, 10);
}

function updateNavButtons() {
  const backBtn = $('navBackBtn');
  const fwdBtn = $('navFwdBtn');
  if (backBtn) backBtn.disabled = navPtr <= 0;
  if (fwdBtn) fwdBtn.disabled = navPtr >= navStack.length - 1;
}

window.addEventListener('popstate', ev => {
  if (ev.state && typeof ev.state.navPtr === 'number') {
    restoreNavState(ev.state.navPtr);
  }
});

function show(v, skipScrollTop){
  if (navPtr >= 0 && navStack[navPtr]) {
    navStack[navPtr].scrollY = window.scrollY;
  }
  view = v;
  $('vHome').hidden = v !== 'home'; $('vQuiz').hidden = v !== 'quiz'; $('vResult').hidden = v !== 'result'; $('vMistakes').hidden = v !== 'mistakes';
  refresh();
  if (!skipScrollTop) window.scrollTo(0, 0);
  pushNavState();
}

function refresh(){
  $('mistakesCount').textContent = wrongList().length;
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'result') renderResult();
  else if (view === 'mistakes') renderMistakes();
  updateNavButtons();
}

/* ---------- home ---------- */
function stackBar(st, cls){
  const t = st.total || 1;
  return '<div class="stack ' + (cls || '') + '" role="img" aria-label="' + st.ok + ' right, ' + st.bad + ' wrong, ' + st.todo + ' not answered"><span class="s-ok" style="width:' + (100 * st.ok / t) + '%"></span><span class="s-bad" style="width:' + (100 * st.bad / t) + '%"></span></div>';
}
function renderHome(){
  const all = stats(Q.map(q => q.n));
  const acc = all.done ? pct(all.ok, all.done) : null;
  const lvRows = ['E', 'M', 'T'].map(l => {
    const st = stats(Q.filter(q => q.lv === l).map(q => q.n));
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(st) + '<span class="num">' + st.ok + '/' + st.done + ' · ' + st.total + '</span></div>';
  }).join('');
  const weak = SESS.map(s => ({s, st: stats(s.qs)})).filter(x => x.st.bad > 0)
    .sort((a, b) => (a.st.ok / a.st.done) - (b.st.ok / b.st.done) || b.st.bad - a.st.bad).slice(0, 5);
  const weakHtml = weak.length
    ? '<ul class="weaklist">' + weak.map(x => '<li><button type="button" data-review="' + x.s.n + '"><span class="wname">S' + x.s.n + ' · ' + esc(x.s.name) + '</span><span class="wstat">' + x.st.bad + ' wrong · ' + pct(x.st.ok, x.st.done) + '%</span></button></li>').join('') + '</ul>'
    : '<p class="empty-note">Answer a few questions and your weakest sessions will show up here, worst first.</p>';
  const wrongN = wrongList().length;
  const order = SESS.slice();
  if (sortMode === 'weak') order.sort((a, b) => {
    const A = stats(a.qs), B = stats(b.qs);
    const ka = A.done ? A.ok / A.done : 2, kb = B.done ? B.ok / B.done : 2;
    return ka - kb || a.n - b.n;
  });
  const topics = order.map(s => {
    const st = stats(s.qs);
    const lv = {E:0, M:0, T:0}; s.qs.forEach(n => lv[byN[n].lv]++);
    const score = st.done ? '<div class="tscore">' + pct(st.ok, st.done) + '%<small>' + st.done + '/' + st.total + ' done</small></div>' : '<div class="tscore na">—<small>not started</small></div>';
    return '<li><button class="topic" type="button" data-session="' + s.n + '">' +
      '<span class="tnum">S<b>' + String(s.n).padStart(2, '0') + '</b></span>' +
      '<span class="tbody"><span class="tname">' + esc(s.name) + '</span>' +
      (s.topics ? '<span class="tsub">' + esc(s.topics) + '</span>' : '') +
      '<span class="tmeta"><span>Q' + s.qs[0] + '–Q' + s.qs[s.qs.length - 1] + '</span><span>' + s.qs.length + ' questions</span><span>E' + lv.E + ' M' + lv.M + ' T' + lv.T + '</span></span>' +
      stackBar(st, 'tbar') + '</span>' + score + '</button></li>';
  }).join('');
  $('vHome').innerHTML =
  '<div class="home">' +
    '<aside class="summary panel">' +
      '<div><div class="eyebrow">Overall</div><div class="bigrow"><div class="big">' + (acc === null ? '—' : acc + '<small>%</small>') + '</div><div class="muted" style="padding-bottom:4px">accuracy on ' + all.done + ' of ' + TOTAL_Q + ' answered</div></div></div>' +
      stackBar(all) +
      '<div class="legend"><span><i class="dot ok"></i>Right <b>' + all.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + all.bad + '</b></span><span><i class="dot todo"></i>Left <b>' + all.todo + '</b></span></div>' +
      '<div><div class="eyebrow" style="margin-bottom:8px">By difficulty · right/answered · total</div><div class="lvrows">' + lvRows + '</div></div>' +
      '<div class="actions">' +
        '<button class="btn primary" type="button" id="practiseWrong"' + (wrongN ? '' : ' disabled') + '>Practise my mistakes <span class="count">' + wrongN + '</span></button>' +
        '<button class="btn" type="button" id="random20">Random 20 from all sessions</button>' +
      '</div>' +
      '<div class="weak"><h3>Where you lose marks</h3>' + weakHtml + '</div>' +
      '<div class="reset">' + (resetArmed
        ? '<div class="confirm"><span>Clear every answer?</span><button class="btn small" type="button" id="resetYes">Yes, clear</button><button class="btn small ghost" type="button" id="resetNo">Cancel</button></div>'
        : '<button class="btn small ghost" type="button" id="resetBtn"' + (all.done || wrongN ? '' : ' disabled') + '>Reset all progress</button>') + '</div>' +
    '</aside>' +
    '<section>' +
      '<div class="topics-head"><div><div class="eyebrow">Pick a session</div><h2>16 sessions · 200 questions</h2></div>' +
        '<div class="seg" role="group" aria-label="Order sessions"><button type="button" data-sort="syllabus" aria-pressed="' + (sortMode === 'syllabus') + '">Syllabus order</button><button type="button" data-sort="weak" aria-pressed="' + (sortMode === 'weak') + '">Weakest first</button></div></div>' +
      '<p class="intro">Answer one session at a time in a continuous vertical list. You see right or wrong as soon as you tap an option, with the explanation from the answer key. Covers Python (Sessions 1–13) and R Programming (Sessions 14–17).</p>' +
      '<ul class="topiclist">' + topics + '</ul>' +
    '</section>' +
  '</div>';
}

/* ---------- quiz (Continuous Vertical List) ---------- */
function startSet(s){ set = s; lvFilter = 'all'; stFilter = 'all'; buildList(); idx = firstOpen(); show('quiz'); }
function startSession(n){
  const s = sessByN[n];
  if (!s) return;
  startSet({kind:'session', s:n, title:'S' + n + ' · ' + s.name, sub:s.topics, ns:s.qs.slice()});
}
function firstOpen(){ const i = list.findIndex(n => !ans(n)); return i < 0 ? 0 : i; }
function buildList(){
  list = set.ns.filter(n => {
    const q = byN[n], e = ans(n);
    if (lvFilter !== 'all' && q.lv !== lvFilter) return false;
    if (stFilter === 'todo' && e) return false;
    if (stFilter === 'wrong' && !(e && !e.ok)) return false;
    return true;
  });
}

function renderSessionSwitcherBar() {
  if (set.kind !== 'session') return '';
  const curS = set.s;
  const prevS = curS > 1 ? sessByN[curS - 1] : null;
  const nextS = curS < SESS.length ? sessByN[curS + 1] : null;
  const optionsHtml = SESS.map(s => {
    const st = stats(s.qs);
    return '<option value="' + s.n + '"' + (s.n === curS ? ' selected' : '') + '>S' + String(s.n).padStart(2, '0') + ' · ' + esc(s.name) + ' (' + st.done + '/' + st.total + ')</option>';
  }).join('');
  return '<div class="sessbar">' +
    '<button type="button" class="btn small" id="prevSessBtn"' + (prevS ? ' data-goto-session="' + prevS.n + '"' : ' disabled') + '>◀ ' + (prevS ? 'S' + prevS.n : 'Prev') + '</button>' +
    '<select id="sessJumpSelect" aria-label="Jump to session">' + optionsHtml + '</select>' +
    '<button type="button" class="btn small" id="nextSessBtn"' + (nextS ? ' data-goto-session="' + nextS.n + '"' : ' disabled') + '>' + (nextS ? 'S' + nextS.n : 'Next') + ' ▶</button>' +
  '</div>';
}

function renderQuiz(preserveScroll){
  const prevY = window.scrollY;
  const st = stats(set.ns);
  const lvCounts = {E:0, M:0, T:0}; set.ns.forEach(n => lvCounts[byN[n].lv]++);
  const lvSeg = '<div class="seg" role="group" aria-label="Difficulty">' + [['all', 'All ' + set.ns.length]].concat(['E', 'M', 'T'].filter(l => lvCounts[l]).map(l => [l, LV[l] + ' ' + lvCounts[l]]))
    .map(([k, label]) => '<button type="button" data-lv="' + k + '" aria-pressed="' + (lvFilter === k) + '">' + label + '</button>').join('') + '</div>';
  const stSeg = '<div class="seg" role="group" aria-label="Show"><button type="button" data-st="all" aria-pressed="' + (stFilter === 'all') + '">All</button><button type="button" data-st="todo" aria-pressed="' + (stFilter === 'todo') + '">Not answered</button><button type="button" data-st="wrong" aria-pressed="' + (stFilter === 'wrong') + '">Wrong</button></div>';
  const strip = list.map((n, i) => {
    const e = ans(n);
    return '<button type="button" class="sq' + (e ? (e.ok ? ' ok' : ' bad') : '') + (i === idx ? ' cur' : '') + '" data-go="' + i + '" aria-label="Jump to Question ' + n + (e ? (e.ok ? ', right' : ', wrong') : ', not answered') + '">' + n + '</button>';
  }).join('');
  
  let cardsHtml;
  if (!list.length){
    cardsHtml = '<div class="qcard nolist">No questions match this filter. <button class="btn small" type="button" data-st="all">Show all</button></div>';
  } else {
    if (idx >= list.length) idx = list.length - 1;
    cardsHtml = '<div class="qfeed">' + list.map(n => renderCard(byN[n])).join('') + '</div>';
  }

  const nextS = (set.kind === 'session' && set.s < SESS.length) ? sessByN[set.s + 1] : null;
  const prevS = (set.kind === 'session' && set.s > 1) ? sessByN[set.s - 1] : null;

  $('vQuiz').innerHTML =
  '<div class="quiz">' +
    renderSessionSwitcherBar() +
    '<div class="qhead"><div class="titles"><div class="eyebrow">' + (set.kind === 'session' ? 'Session' : set.kind === 'random' ? 'Mixed practice' : 'Mistake practice') + '</div><h2>' + esc(set.title) + '</h2>' + (set.sub ? '<div class="muted" style="font-size:13px">' + esc(set.sub) + '</div>' : '') + '</div>' +
      '<button class="btn small" type="button" id="toResult">See result</button></div>' +
    '<div class="progressline"><span><b>' + st.done + '</b> of ' + st.total + ' answered</span><span><i class="dot ok"></i><b>' + st.ok + '</b> right</span><span><i class="dot bad"></i><b>' + st.bad + '</b> wrong</span>' + (st.done ? '<span><b>' + pct(st.ok, st.done) + '%</b> accuracy</span>' : '') + '</div>' +
    stackBar(st) +
    '<div class="qsticky">' +
      '<div class="filters">' + lvSeg + stSeg + '</div>' +
      '<div class="strip-wrap"><div class="strip">' + strip + '</div></div>' +
    '</div>' +
    cardsHtml +
    (list.length ? '<div class="qfoot">' +
      (prevS ? '<button class="btn" type="button" data-goto-session="' + prevS.n + '">◀ Session ' + prevS.n + '</button>' : '<button class="btn" type="button" data-home>← All sessions</button>') +
      '<button class="btn ghost small" type="button" id="scrollTopBtn">↑ Top</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" type="button" id="finish">See result scorecard</button>' +
      (nextS ? '<button class="btn primary" type="button" data-goto-session="' + nextS.n + '">Session ' + nextS.n + ' ▶</button>' : '') +
    '</div>' : '') +
  '</div>';

  const sel = $('sessJumpSelect');
  if (sel) sel.addEventListener('change', function() { startSession(+this.value); });

  if (preserveScroll) {
    window.scrollTo({top: prevY, behavior: 'auto'});
  }
}

function lvlBadge(q){ return '<span class="lvl"><span class="bars on' + LVBARS[q.lv] + '"><i></i><i></i><i></i></span>' + LV[q.lv] + '</span>'; }
function refsBlock(){
  if (!DATA.tables || !DATA.tables.EMP) return '';
  return '<div class="refs"><div class="cap mono">mysql&gt; SELECT * FROM emp;</div><div class="grid-wrap"><pre>' + esc(asciiTable(DATA.tables.EMP)) + '</pre></div>' +
    '<div class="cap mono">mysql&gt; SELECT * FROM dept;</div><div class="grid-wrap"><pre>' + esc(asciiTable(DATA.tables.DEPT)) + '</pre></div></div>';
}
function needsRefs(q){ return sessByN[q.s] && sessByN[q.s].refs && /\b(EMP|DEPT)\b/.test(q.q) && /Refer to|on the EMP|views are created/.test(q.q); }

function renderCard(q){
  const e = ans(q.n);
  const opts = q.o.map((t, i) => {
    let cls = 'opt', mark = '';
    if (e){
      if (i === q.a){ cls += ' right'; mark = i === e.c ? '✓ Your answer' : '✓ Correct'; }
      else if (i === e.c){ cls += ' wrong'; mark = '✗ Your answer'; }
      else cls += ' dim';
    }
    return '<li><button type="button" class="' + cls + '" data-q="' + q.n + '" data-opt="' + i + '"' + (e ? ' disabled' : '') + '><span class="key">' + 'ABCD'[i] + '</span><span class="otext' + (q.oc[i] ? ' codey' : '') + '">' + esc(t) + '</span><span class="mark">' + mark + '</span></button></li>';
  }).join('');
  const all = store.a[q.n];
  const missed = all && all.w ? '<span class="missed">missed ' + all.w + '×</span>' : '';
  const refs = needsRefs(q);
  let fb = '';
  if (e){
    fb = '<div class="feedback ' + (e.ok ? 'yes' : 'no') + '" role="status"><div class="verdict">' + (e.ok ? 'Correct. Answer ' + 'ABCD'[q.a] : 'Wrong. You chose ' + 'ABCD'[e.c] + ', the answer is ' + 'ABCD'[q.a]) + '</div>' +
      (e.ok ? '' : '<p><b>' + 'ABCD'[q.a] + '.</b> ' + esc(q.o[q.a]) + '</p>') +
      '<p>' + esc(q.e) + '</p><div class="fbrow"><button class="btn small ghost" type="button" data-retry-q="' + q.n + '">Try this one again</button></div></div>';
  }
  return '<article class="qcard" id="qcard-' + q.n + '" data-qno="' + q.n + '">' +
    '<div class="qmeta"><span class="qno">Q' + q.n + '</span>' + lvlBadge(q) + '<span class="muted" style="font-size:12.5px">S' + q.s + '</span>' + missed +
      (refs ? '<button class="btn small refbtn" type="button" data-ref-toggle="' + q.n + '" aria-expanded="' + showRefs + '">' + (showRefs ? 'Hide' : 'Show') + ' EMP &amp; DEPT</button>' : '') + '</div>' +
    '<p class="stem">' + esc(q.q) + '</p>' +
    (refs && showRefs ? refsBlock() : '') +
    (q.code ? '<pre class="code">' + highlight(q.code) + '</pre>' : '') +
    '<ol class="opts">' + opts + '</ol>' + fb +
  '</article>';
}

function answerQuestion(qNum, choiceIdx){
  if (ans(qNum)) return;
  record(qNum, choiceIdx);
  const pos = list.indexOf(qNum);
  if (pos >= 0) idx = pos;
  renderQuiz(true);
}

function goQuestion(i){
  if (i < 0 || i >= list.length) return;
  idx = i;
  const qNum = list[i];
  document.querySelectorAll('.sq').forEach((btn, bIdx) => btn.classList.toggle('cur', bIdx === i));
  const card = $('qcard-' + qNum);
  if (card) card.scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* Update active question pill in sticky strip while scrolling vertically */
window.addEventListener('scroll', () => {
  if (view !== 'quiz' || !list.length) return;
  const cards = document.querySelectorAll('.qcard[data-qno]');
  let activeQ = list[0];
  const threshold = 220;
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    if (rect.top <= threshold) {
      activeQ = +cards[i].dataset.qno;
    } else {
      break;
    }
  }
  const newIdx = list.indexOf(activeQ);
  if (newIdx >= 0 && newIdx !== idx) {
    idx = newIdx;
    const sqs = document.querySelectorAll('.sq');
    sqs.forEach((btn, bIdx) => btn.classList.toggle('cur', bIdx === idx));
    const cur = sqs[idx];
    if (cur) {
      const w = cur.parentElement.parentElement;
      w.scrollLeft = cur.offsetLeft - w.clientWidth / 2 + cur.clientWidth / 2;
    }
  }
}, {passive: true});

/* ---------- results ---------- */
function ring(ok, total){
  const r = 54, c = 2 * Math.PI * r, f = total ? ok / total : 0;
  return '<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--sunken)" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '"/></svg>' +
    '<div class="lbl"><div><b>' + ok + '/' + total + '</b><small>correct</small></div></div></div>';
}
function mistakeCard(n){
  const q = byN[n], e = ans(n), all = store.a[n];
  return '<article class="mistake"><div class="qmeta"><span class="qno">Q' + q.n + '</span>' + lvlBadge(q) + '<span class="muted" style="font-size:12.5px">S' + q.s + '</span>' + (all && all.w > 1 ? '<span class="missed">missed ' + all.w + '×</span>' : '') + '</div>' +
    '<p class="stem">' + esc(q.q) + '</p>' + (q.code ? '<pre class="code">' + highlight(q.code) + '</pre>' : '') +
    '<div class="answers"><div class="ans yours"><span class="who">You chose ' + 'ABCD'[e.c] + '</span><span class="' + (q.oc[e.c] ? 'mono' : '') + '">' + esc(q.o[e.c]) + '</span></div>' +
    '<div class="ans correct"><span class="who">Correct: ' + 'ABCD'[q.a] + '</span><span class="' + (q.oc[q.a] ? 'mono' : '') + '">' + esc(q.o[q.a]) + '</span></div></div>' +
    '<p class="explain"><b>Why:</b> ' + esc(q.e) + '</p></article>';
}
function renderResult(){
  const st = stats(set.ns);
  const wrong = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
  const lvRows = ['E', 'M', 'T'].map(l => {
    const ns = set.ns.filter(n => byN[n].lv === l); if (!ns.length) return '';
    const s = stats(ns);
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(s) + '<span class="num">' + s.ok + '/' + s.total + '</span></div>';
  }).join('');
  const nextS = (set.kind === 'session' && set.s < SESS.length) ? sessByN[set.s + 1] : null;
  $('vResult').innerHTML =
  '<div class="result">' +
    renderSessionSwitcherBar() +
    '<div><div class="eyebrow">Result</div><h2 style="font-size:24px">' + esc(set.title) + '</h2></div>' +
    '<div class="panel scorecard">' + ring(st.ok, st.total) +
      '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' +
        '<div class="legend"><span><i class="dot ok"></i>Right <b>' + st.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + st.bad + '</b></span><span><i class="dot todo"></i>Skipped <b>' + st.todo + '</b></span>' + (st.done ? '<span>Accuracy <b>' + pct(st.ok, st.done) + '%</b></span>' : '') + '</div>' +
        '<div class="lvrows">' + lvRows + '</div>' +
        '<div class="rowbtns">' + (wrong.length ? '<button class="btn primary" type="button" id="retryWrong">Retry the ' + wrong.length + ' wrong</button>' : '') +
          (st.todo ? '<button class="btn" type="button" id="backToQuiz">Answer the ' + st.todo + ' skipped</button>' : '') +
          (nextS ? '<button class="btn primary" type="button" data-goto-session="' + nextS.n + '">Next: Session ' + nextS.n + ' ▶</button>' : '') +
          '<button class="btn" type="button" id="restartSet">Restart this set</button><button class="btn ghost" type="button" data-home>All sessions</button></div>' +
      '</div></div>' +
    (wrong.length ? '<div class="grouphead"><h3>Where you went wrong</h3><span class="muted">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + '</span></div>' + wrong.map(mistakeCard).join('')
      : (st.done ? '<div class="panel">No wrong answers in this set.' + (st.todo ? ' ' + st.todo + ' still unanswered.' : '') + '</div>' : '<div class="panel">Nothing answered yet in this set.</div>')) +
  '</div>';
  const sel = $('sessJumpSelect');
  if (sel) sel.addEventListener('change', function() { startSession(+this.value); });
}

/* ---------- all mistakes ---------- */
function renderMistakes(){
  const wrong = wrongList();
  let html = '<div class="result"><div><div class="eyebrow">Review</div><h2 style="font-size:24px">My mistakes</h2><p class="muted" style="margin:4px 0 0">Every question whose latest answer was wrong, grouped by session.</p></div>';
  if (!wrong.length){
    html += '<div class="panel">No wrong answers right now. <button class="btn small" type="button" data-home>Pick a session</button></div>';
  } else {
    html += '<div class="rowbtns"><button class="btn primary" type="button" id="practiseAllWrong">Practise all ' + wrong.length + '</button><button class="btn ghost" type="button" data-home>All sessions</button></div>';
    SESS.forEach(s => {
      const ns = wrong.filter(n => byN[n].s === s.n); if (!ns.length) return;
      html += '<div class="grouphead"><h3>S' + s.n + ' · ' + esc(s.name) + '</h3><span class="muted">' + ns.length + ' wrong</span><button class="btn small" type="button" data-practise-session="' + s.n + '">Practise these</button></div>' + ns.map(mistakeCard).join('');
    });
  }
  $('vMistakes').innerHTML = html + '</div>';
}
function practiseWrong(ns, title){
  if (!ns.length) return;
  clearAnswers(ns);
  startSet({kind:'retry', title, sub:'Your earlier answers on these are cleared so you can try them fresh.', ns});
}
function sampleRandom(k){
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const todo = shuffle(Q.filter(q => !ans(q.n)).map(q => q.n));
  let pick = todo.slice(0, k);
  if (pick.length < k){
    const extra = shuffle(Q.filter(q => ans(q.n)).map(q => q.n)).slice(0, k - pick.length);
    clearAnswers(extra); pick = pick.concat(extra);
  }
  return pick.sort((a, b) => a - b);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.id === 'navBackBtn'){ if (navPtr > 0) restoreNavState(navPtr - 1); return; }
  if (t.id === 'navFwdBtn'){ if (navPtr < navStack.length - 1) restoreNavState(navPtr + 1); return; }
  if (t.id === 'homeBtn' || t.hasAttribute('data-home')){ resetArmed = false; show('home'); return; }
  if (t.id === 'mistakesBtn'){ show('mistakes'); return; }
  if (t.dataset.session){ startSession(+t.dataset.session); return; }
  if (t.dataset.gotoSession){ startSession(+t.dataset.gotoSession); return; }
  if (t.dataset.sort){ sortMode = t.dataset.sort; renderHome(); pushNavState(); return; }
  if (t.dataset.review){ const s = sessByN[+t.dataset.review]; const ns = s.qs.filter(n => { const e = ans(n); return e && !e.ok; }); practiseWrong(ns, 'S' + s.n + ' mistakes · ' + s.name); return; }
  if (t.dataset.practiseSession){ const s = sessByN[+t.dataset.practiseSession]; practiseWrong(wrongList().filter(n => byN[n].s === s.n), 'S' + s.n + ' mistakes · ' + s.name); return; }
  if (t.id === 'practiseWrong' || t.id === 'practiseAllWrong'){ practiseWrong(wrongList(), 'All my mistakes'); return; }
  if (t.id === 'random20'){ startSet({kind:'random', title:'Random 20', sub:'Unanswered questions first, drawn from all 16 sessions.', ns:sampleRandom(20)}); return; }
  if (t.id === 'resetBtn'){ resetArmed = true; renderHome(); return; }
  if (t.id === 'resetNo'){ resetArmed = false; renderHome(); return; }
  if (t.id === 'resetYes'){ resetArmed = false; resetAll(); refresh(); toast('All progress cleared'); return; }
  if (t.dataset.opt !== undefined && !t.disabled){ answerQuestion(+t.dataset.q, +t.dataset.opt); return; }
  if (t.dataset.go !== undefined){ goQuestion(+t.dataset.go); return; }
  if (t.dataset.lv){ lvFilter = t.dataset.lv; buildList(); idx = firstOpen(); renderQuiz(); pushNavState(); return; }
  if (t.dataset.st){ stFilter = t.dataset.st; buildList(); idx = firstOpen(); renderQuiz(); pushNavState(); return; }
  if (t.id === 'scrollTopBtn'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (t.id === 'finish' || t.id === 'toResult'){ show('result'); return; }
  if (t.dataset.refToggle){ showRefs = !showRefs; renderQuiz(true); return; }
  if (t.dataset.retryQ){ clearAnswers([+t.dataset.retryQ]); renderQuiz(true); return; }
  if (t.id === 'retryWrong'){ const ns = set.ns.filter(n => { const e = ans(n); return e && !e.ok; }); practiseWrong(ns, set.title.replace(/^(S\d+) · /, '$1 mistakes · ')); return; }
  if (t.id === 'backToQuiz'){ stFilter = 'todo'; lvFilter = 'all'; buildList(); idx = 0; show('quiz'); return; }
  if (t.id === 'restartSet'){ clearAnswers(set.ns); lvFilter = 'all'; stFilter = 'all'; buildList(); idx = 0; show('quiz'); return; }
});

document.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); if (navPtr > 0) restoreNavState(navPtr - 1); return; }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); if (navPtr < navStack.length - 1) restoreNavState(navPtr + 1); return; }
  if (view === 'quiz' && set && set.kind === 'session' && ev.shiftKey) {
    if (ev.key === 'ArrowRight' && set.s < SESS.length) { ev.preventDefault(); startSession(set.s + 1); return; }
    if (ev.key === 'ArrowLeft' && set.s > 1) { ev.preventDefault(); startSession(set.s - 1); return; }
  }
});

/* ---------- boot ---------- */
function start(){
  lsRead();
  show('home');
}
start();
})();
</script>
