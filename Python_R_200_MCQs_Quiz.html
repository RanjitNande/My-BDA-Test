<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Python & R 200 MCQs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Study Console: Topic ledger + summary on the home screen, continuous vertical question list on the quiz stage,
   universal Back/Forward history navigation, and instant explanations. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunken:#E7EDEF; --ink:#13232B; --muted:#56676F; --line:#D2DCE0;
  --accent:#1B5E86; --accent-ink:#FFFFFF; --accent-soft:#DCEAF3;
  --ok:#1C7A4A; --ok-soft:#DCF1E4; --bad:#B23A2E; --bad-soft:#F7E0DC; --todo:#C3CED3;
  --code-bg:#11202A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(19,35,43,.06),0 4px 14px rgba(19,35,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
    --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
    --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#33464F;
    --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
  --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
  --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#33464F;
  --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.nav-arrows{display:inline-flex;gap:4px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--todo);display:inline-block}
.sync[data-s="account"] i{background:var(--ok)}
.sync[data-s="connecting"] i{background:var(--accent)}
.toplinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:8px 14px;font-weight:500;cursor:pointer;min-height:40px;text-align:center;text-decoration:none;color:inherit}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn .count{font-family:var(--font-mono);font-size:12px;opacity:.85}

/* Session Switcher Bar (Forward / Backward between sessions) */
.sessbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;box-shadow:var(--shadow)}
.sessbar select{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:7px;padding:6px 10px;font-weight:600;font-size:13.5px;cursor:pointer;text-overflow:ellipsis}
@media (max-width:600px){.sessbar{grid-template-columns:1fr 1fr}.sessbar select{grid-column:1 / -1;order:-1}}

/* Sticky Quiz Controls & Question Strip */
.qsticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:10;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qfeed{display:flex;flex-direction:column;gap:16px}
.qcard{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 165px)}

/* Home */
.home{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.summary{display:flex;flex-direction:column;gap:18px}
@media (min-width:901px){.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.bigrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack span{display:block;height:100%}
.stack .s-ok{background:var(--ok)} .stack .s-bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.todo{background:var(--todo)}
.lvrows{display:grid;gap:8px}
.lvrow{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.lvrow .stack{height:7px}
.lvrow .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:grid;gap:8px}
.weak h3{font-size:16px;margin-bottom:8px}
.weaklist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.weaklist button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sunken);border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.weaklist button:hover{border-color:var(--accent)}
.weaklist .wname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaklist .wstat{font-family:var(--font-mono);font-size:12px;color:var(--bad);white-space:nowrap}
.empty-note{font-size:13px;color:var(--muted)}
.reset{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.reset .confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

.topics-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.topics-head h2{font-size:24px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.topics-head .seg{margin-left:auto}
.topiclist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.topic{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 84px;gap:14px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--accent)}
.tnum{font-family:var(--font-mono);font-size:13px;color:var(--muted);line-height:1.1}
.tnum b{display:block;font-family:var(--font-display);font-size:24px;color:var(--ink);font-weight:600}
.tbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.tname{font-weight:600;font-size:15px;line-height:1.35}
.tsub{font-size:12.5px;color:var(--muted);line-height:1.4}
.tmeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tbar{height:6px}
.tscore{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tscore small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.tscore.na{color:var(--todo)}
@media (max-width:520px){.topic{grid-template-columns:32px minmax(0,1fr) 66px;gap:10px;padding:12px}.tnum b{font-size:20px}.tscore{font-size:18px}}
.intro{font-size:13.5px;color:var(--muted);max-width:62ch}

/* Quiz */
.quiz{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.qhead .titles{min-width:0;flex:1 1 300px}
.qhead h2{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip{display:flex;gap:5px;width:max-content}
.sq{width:38px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:11.5px;cursor:pointer;color:var(--muted);flex:none}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:600}
.progressline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progressline b{color:var(--ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:520px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--font-mono);font-weight:600;font-size:14px;background:var(--sunken);padding:2px 8px;border-radius:5px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:4px;background:var(--todo);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}
.bars.on1 i:nth-child(-n+1),.bars.on2 i:nth-child(-n+2),.bars.on3 i:nth-child(-n+3){background:var(--accent)}
.missed{font-family:var(--font-mono);font-size:11.5px;color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:1px 8px}
.qmeta .refbtn{margin-left:auto}
.stem{font-size:17px;line-height:1.5;margin:0;white-space:pre-wrap;font-weight:500}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;tab-size:2}
.code .kw{color:var(--code-kw)} .code .st{color:var(--code-str)} .code .cm{color:var(--code-com);font-style:italic} .code .nu{color:var(--code-num)}
.refs{display:grid;gap:10px;background:var(--sunken);border-radius:8px;padding:12px}
.refs .grid-wrap{overflow-x:auto}
.refs pre{margin:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.35}
.refs .cap{font-size:12px;color:var(--muted)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.key{width:28px;height:28px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px}
.otext{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.otext.codey{font-family:var(--font-mono);font-size:13.5px}
.mark{padding-top:3px;font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.feedback{border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-soft)}
.feedback .verdict{font-weight:600;font-size:15px}
.feedback.yes .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback p{margin:0}
.feedback .fbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.qfoot .spacer{flex:1}
@media (max-width:620px){.qhead h2{font-size:19px}}
.nolist{padding:28px;text-align:center;color:var(--muted)}

/* Results + mistakes */
.result{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.scorecard{grid-template-columns:minmax(0,1fr)}}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--font-display);font-size:32px;line-height:1}
.ring .lbl small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mistake .stem{font-size:15px}
.answers{display:grid;gap:6px}
.ans{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;font-size:14px;align-items:start;padding:8px 10px;border-radius:7px}
@media (max-width:520px){.ans{grid-template-columns:minmax(0,1fr);gap:2px}}
.ans .who{font-family:var(--font-mono);font-size:12px;padding-top:2px}
.ans.yours{background:var(--bad-soft)} .ans.yours .who{color:var(--bad)}
.ans.correct{background:var(--ok-soft)} .ans.correct .who{color:var(--ok)}
.explain{font-size:14px;margin:0;color:var(--ink)}
.explain b{font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.grouphead h3{font-size:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.topic,.sq{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a href="index.html" class="btn small ghost">← All Tests</a>
    <div class="nav-arrows" role="group" aria-label="View navigation">
      <button class="btn small" id="navBackBtn" type="button" title="Go Back (Alt+Left)" disabled>← Back</button>
      <button class="btn small" id="navFwdBtn" type="button" title="Go Forward (Alt+Right)" disabled>Forward →</button>
    </div>
    <button class="brand" id="homeBtn" type="button" aria-label="Back to topics"><b>Python &amp; R 200</b><span>PGCP-BDA · Python &amp; R Programming</span></button>
    <div class="toplinks">
      <button class="btn small ghost" id="mistakesBtn" type="button">My mistakes <span class="count" id="mistakesCount">0</span></button>
      <button class="btn small ghost" id="themeBtn" type="button" onclick="togglePortalTheme()">🌙 Dark</button>
    </div>
    <div class="sync" id="sync" data-s="local"><i></i><span id="syncText">Saved in this browser</span></div>
  </div>
</header>
<script>
  (function() {
    const saved = localStorage.getItem('portal_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = saved === 'dark' ? '🌙 Dark' : '☀️ Light';
  })();
  function togglePortalTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    localStorage.setItem('portal_theme', cur);
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = cur === 'dark' ? '🌙 Dark' : '☀️ Light';
  }
</script>

<main class="wrap">
  <section id="vHome"></section>
  <section id="vQuiz" hidden></section>
  <section id="vResult" hidden></section>
  <section id="vMistakes" hidden></section>

orms floor (integer) division?", "code": "", "o": ["/", "//", "%", "**"], "oc": [false, true, false, true], "a": 1, "e": "The // operator performs floor division, returning the largest integer less than or equal to the quotient (e.g., 7 // 2 evaluates to 3)."}, {"n": 3, "s": 1, "lv": "E", "q": "What does the pass statement do in Python?", "code": "", "o": ["Terminates the nearest enclosing loop immediately", "Skips the rest of the current loop iteration", "Acts as a null (no-op) placeholder where a statement is syntactically required", "Raises a PassException at runtime"], "oc": [false, false, true, false], "a": 2, "e": "pass is a null operation in Python; nothing happens when it executes. It is used as a syntactic placeholder in empty function, class, or branch bodies."}, {"n": 4, "s": 1, "lv": "E", "q": "Which of the following variable names is INVALID in Python?", "code": "", "o": ["_total_count", "data2_value", "2nd_value", "MAX_LIMIT"], "oc": [false, false, false, false], "a": 2, "e": "Python identifiers cannot start with a digit. They must start with a letter (a-z, A-Z) or an underscore (_)."}, {"n": 5, "s": 1, "lv": "E", "q": "What is the output of print(2 ** 3 ** 2) in Python?", "code": "", "o": ["64", "512", "36", "81"], "oc": [false, false, false, false], "a": 1, "e": "The exponentiation operator (**) in Python is right-associative, so 3 ** 2 is evaluated first (9), and then 2 ** 9 evaluates to 512."}, {"n": 6, "s": 1, "lv": "M", "q": "What is the result of the floor division expression -7 // 2 in Python?", "code": "", "o": ["-3", "-4", "-3.5", "3"], "oc": [false, false, false, false], "a": 1, "e": "Floor division (//) rounds toward negative infinity. Since -7 / 2 is -3.5, rounding down toward -infinity gives -4."}, {"n": 7, "s": 1, "lv": "M", "q": "In the Session 1 factorial lab algorithm (starting with f = 1, n = 0, and repeating: print n! = f, n = n + 1, f = f * n), what value is printed on the very first iteration?", "code": "", "o": ["1 ! =  1", "0 !  of the expression: print(0 or 'Hello' and 'World')?", "code": "", "o": ["0", "Hello", "World", "True"], "oc": [false, false, false, false], "a": 2, "e": "In Python, 'and' has higher precedence than 'or'. First, 'Hello' and 'World' evaluates to 'World' (since 'Hello' is truthy, 'and' returns the second operand). Then 0 or 'World' returns 'World'."}, {"n": 13, "s": 1, "lv": "T", "q": "In the Session 1 Lab Q2 (printing factorials less than 2,000,000,000 using a while loop), what is the largest n whose factorial n! is strictly less than 2 billion (2,000,000,000)?", "code": "", "o": ["10 (10! = 3,628,800)", "12 (12! = 479,001,600)", "13 (13! = 6,227,020,800)", "15 (15! = 1,307,674,368,000)"], "oc": [true, true, true, true], "a": 1, "e": "12! = 479,001,600, which is less than 2 billion (2,000,000,000), whereas 13! = 6,227,020,800 exceeds 2 billion."}, {"n": 14, "s": 1, "lv": "T", "q": "What happens when the following code is executed?", "code": "x = 5\nif x > 2:\n    if x < 4:\n        print('A')\nelse:\n    print('B')", "o": ["Prints A", "Prints B", "Prints nothing", "Raises IndentationError"], "oc": [false, false, false, false], "a": 2, "e": "Because of indentation, the else block belongs to the outer 'if x > 2:'. Since x > 2 is True, Python enters the outer if, checks x < 4 (which is False), and prints nothing."}, {"n": 15, "s": 2, "lv": "E", "q": "Given s = 'Python', what does s[-1] evaluate to?", "code": "", "o": ["'P'", "'n'", "'o'", "IndexError"], "oc": [false, false, false, false], "a": 1, "e": "Negative indices in Python count from the right end of the sequence, where -1 refers to the last character ('n')."}, {"n": 16, "s": 2, "lv": "E", "q": "How do you reverse a string s in Python using slicing?", "code": "", "o": ["s[0:-1]", "s[::-1]", "s[-1:0]", "s.reverse()"], "oc": [true, true, true, true], "a": 1, "e": "The slice s[::-1] uses a step of -1 with omitted start and stop, traversing the string from right to left and returning a reversed copy."}, {"n": 17, "s": 2, "lv": "E", "q": "Which statement assigns 10 to a, 20 to b, and 30 to c in a single line?", "code": "", "o": ["a, b, c = 10, 20, 30", "a = 10; b = 20; c = 30 only", "int a=10, b=20, c=30", "(a, b) = (10, 20, 30)"], "oc": [false, false, false, true], "a": 0, "e": "Python supports tuple unpacking (multiple assignment) on a single line using a, b, c = 10, 20, 30."}, {"n": 18, "s": 2, "lv": "E", "q": "What is the output of 'abc' * 3?", "code": "", "o": ["'abc3'", "'abcabcabc'", "'aaabbbccc'", "TypeError"], "oc": [false, false, false, false], "a": 1, "e": "The * operator on a string and an integer repeats the string that many times, producing 'abcabcabc'."}, {"n": 19, "s": 2, "lv": "M", "q": "What is the output of s = 'DataScience'; print(s[4:1:-1])?", "code": "", "o": ["'Scia'", "'Sata'", "'Sat'", "'' (empty string)"], "oc": [false, false, false, true], "a": 2, "e": "Starting at index 4 ('S') and stepping backward by -1 down to (but excluding) index 1 ('a'), indices 4, 3, 2 give 'S', 'a', 't' -> 'Sat'."}, {"n": 20, "s": 2, "lv": "M", "q": "What happens when you execute s = 'hello'; s[0] = 'H'?", "code": "", "o": ["s becomes 'Hello'", "Raises TypeError because strings are immutable", "Raises ValueError", "Returns a new string 'Hello' without changing s"], "oc": [false, false, false, false], "a": 1, "e": "Strings in Python are immutable sequences; attempting item assignment raises TypeError: 'str' object does not support item assignment."}, {"n": 21, "s": 2, "lv": "M", "q": "What does f'{3.14159:.2f}' evaluate to?", "code": "", "o": ["'3.14'", "'3.14159'", "'3.1'", "'3.15'"], "oc": [false, false, false, false], "a": 0, "e": "The format specifier :.2f formats a floating-point number rounded to 2 decimal places as '3.14'."}, {"n": 22, "s": 2, "lv": "M", "q": "In Session 2 Lab Q2 (histogram([4, 9, 7])), which expression prints a row of n asterisks for an integer n?", "code": "", "o": ["print('*' + n)", "print('*' * n)", "print(n.repeat('*'))", "print('*' ^ n)"], "oc": [true, true, true, true], "a": 1, "e": "In Python, '*' * n repeats the asterisk character n times, making histogram([4, 9, 7]) concise via for n in items: print('*' * n)."}, {"n": 23, "s": 2, "lv": "M", "q": "In Session 2 Lab Q1 (printing a monthly calendar starting on day d where 0=Sunday/Monday offset), which expression helps determine when to wrap to a new line after every 7 columns?", "code": "", "o": ["(day + start_offset) % 7 == 0", "day // 7 == 1", "day ** 7 == 0", "day & 7 == 0"], "oc": [true, true, true, true], "a": 0, "e": "When printing leading blanks for start_offset and then each day number, checking (day + start_offset) % 7 == 0 identifies the end of each 7-day week row."}, {"n": 24, "s": 2, "lv": "T", "q": "In Session 2 Lab Q3 (phrase palindrome recognizer for 'Go hang a salami I'm a lasagna hog.'), which expression strips punctuation/spaces and normalizes case before checking s == s[::-1]?", "code": "", "o": ["''.join(ch.lower() for ch in text if ch.isalnum())", "text.strip().lower()", "text.replace(' ', '')", "text.split().lower()"], "oc": [true, true, true, true], "a": 0, "e": "Filtering with ch.isalnum() keeps only letters and digits (ignoring spaces, apostrophes, periods, and commas), and .lower() makes the check case-insensitive."}, {"n": 25, "s": 2, "lv": "T", "q": "In Session 2 Lab Q4 (checking if a sentence is a pangram containing all 26 English letters), which expression correctly returns True for any pangram s?", "code": "", "o": ["len(s) >= 26", "set('abcdefghijklmnopqrstuvwxyz') <= set(s.lower())", "s.isalpha() and len(set(s)) == 26", "'a' in s and 'z' in s"], "oc": [true, true, true, false], "a": 1, "e": "Checking whether the set of all 26 lowercase letters is a subset (<=) of set(s.lower()) verifies that every letter 'a' through 'z' appears at least once."}, {"n": 26, "s": 2, "lv": "T", "q": "What is the result of 'hello world'.SwapCase() vs 'hello world'.title()?", "code": "", "o": ["Both are valid and return 'HELLO WORLD' and 'Hello World'", "SwapCase() raises AttributeError (method is swapcase()), while title() returns 'Hello World'", "Both raise AttributeError", "title() capitalizes only the first word"], "oc": [false, true, false, true], "a": 1, "e": "String methods in Python are lowercase: str.swapcase() is valid, whereas SwapCase() raises AttributeError. str.title() capitalizes the first letter of each word."}, {"n": 27, "s": 3, "lv": "E", "q": "Which of the following creates an empty dictionary in Python?", "code": "", "o": ["set()", "{}", "[]", "()"], "oc": [true, true, true, true], "a": 1, "e": "Curly braces {} create an empty dictionary, whereas set() is required to create an empty set."}, {"n": 28, "s": 3, "lv": "E", "q": "Given d = {'a': 1, 'b': 2}, what does d.get('c', 0) return?", "code": "", "o": ["KeyError", "None", "0", "False"], "oc": [false, false, false, false], "a": 2, "e": "dict.get(key, default) returns the value for key if present, or the specified default value (0) instead of raising a KeyError."}, {"n": 29, "s": 3, "lv": "E", "q": "Which dictionary method removes a specified key and returns its corresponding value?", "code": "", "o": ["d.remove(key)", "d.pop(key)", "d.delete(key)", "d.discard(key)"], "oc": [true, true, true, true], "a": 1, "e": "d.pop(key) removes the key-value pair from the dictionary and returns the value associated with that key."}, {"n": 30, "s": 3, "lv": "E", "q": "Which method returns a view of (key, value) tuple pairs from a dictionary d?", "code": "", "o": ["d.pairs()", "d.items()", "d.entries()", "d.keys_values()"], "oc": [true, true, true, true], "a": 1, "e": "d.items() returns a dict_items view object yielding (key, value) tuples."}, {"n": 31, "s": 3, "lv": "M", "q": "Which of the following types CAN be used as a dictionary key in Python?", "code": "", "o": ["list", "dict", "tuple of strings and integers", "set"], "oc": [false, false, false, false], "a": 2, "e": "Dictionary keys must be hashable (immutable). A tuple containing only immutable elements (such as strings and ints) is hashable, unlike lists, dicts, or sets."}, {"n": 32, "s": 3, "lv": "M", "q": "What is the output of {x: x**2 for x in range(1, 5) if x % 2 == 0}?", "code": "", "o": ["{1: 1, 2: 4, 3: 9, 4: 16}", "{2: 4, 4: 16}", "{1: 1, 3: 9}", "[4, 16]"], "oc": [true, true, true, true], "a": 1, "e": "The dictionary comprehension filters range(1, 5) for even numbers (2 and 4) and maps each to its square: {2: 4, 4: 16}."}, {"n": 33, "s": 3, "lv": "M", "q": "In the Session 3 Lab Q1 (ROT-13 cipher using a dictionary `key`), why can the exact same ROT-13 function be used for both encoding and decoding English text?", "code": "", "o": ["Because Python dictionaries automatically invert themselves on second use", "Because the English alphabet has 26 letters and rotating twice by 13 places (13 + 13 = 26) returns the original letter", "Because ROT-13 only shifts vowels", "Because ASCII values of letters are all prime numbers"], "oc": [false, true, false, false], "a": 1, "e": "Since the English alphabet has 26 letters, shifting by 13 is its own inverse: applying ROT-13 a second time shifts by 13 + 13 = 26 (modulo 26 = 0), restoring the original letter."}, {"n": 34, "s": 3, "lv": "M", "q": "In the Session 3 Lab Q1, what does the ROT-13 ciphertext 'Pnrfne pvcure? V zhpu cersre Pnrfne fnynq!' decode to?", "code": "", "o": ["'Python coding? I much prefer Python lists!'", "'Caesar cipher? I much prefer Caesar salad!'", "'Secret message? I love coding in Python!'", "'Rotate thirteen? A very simple cipher!'"], "oc": [false, false, false, false], "a": 1, "e": "Applying the ROT-13 dictionary mapping (P->C, n->a, r->e, f->s, n->a, r->e, etc.) decodes the message to 'Caesar cipher? I much prefer Caesar salad!'."}, {"n": 35, "s": 3, "lv": "M", "q": "How do you encode a string `msg` using the Session 3 ROT-13 dictionary `key` while preserving spaces and punctuation like '?' and '!'?", "code": "", "o": ["''.join(key[ch] for ch in msg)", "''.join(key.get(ch, ch) for ch in  and Files/Plots/Packages/Help/Viewer (bottom-right)."}, {"n": 154, "s": 13, "lv": "E", "q": "In R, which operators compute the remainder (modulo) and integer division respectively?", "code": "", "o": ["% and //", "%% and %/%", "mod and div", "rem and intdiv"], "oc": [true, false, false, false], "a": 1, "e": "In R, `%%` is the modulo (remainder) operator (e.g., `7 %% 2` is `1`) and `%/%` is the integer division operator (e.g., `7 %/% 2` is `3`)."}, {"n": 155, "s": 13, "lv": "M", "q": "What is the starting index of vectors, lists, and data frames in R (compared to Python)?", "code": "", "o": ["0-indexed (starts at 0)", "1-indexed (starts at 1)", "-1-indexed", "Depends on the package loaded"], "oc": [true, true, false, false], "a": 1, "e": "Unlike Python (which is 0-indexed), R is 1-indexed: the first element of a vector `v` is `v[1]`."}, {"n": 156, "s": 13, "lv": "M", "q": "What does the R expression `c(1, 2, 3) + c(10, 20, 30)` return?", "code": "", "o": ["c(1, 2, 3, 10, 20, 30)", "c(11, 22, 33)", "66", "Error: cannot add vectors"], "oc": [true, true, false, false], "a": 1, "e": "Arithmetic operators in R are vectorized element-wise by default, adding `1+10`, `2+20`, and `3+30` to return the numeric vector `11 22 33`."}, {"n": 157, "s": 13, "lv": "M", "q": "What happens in R when you add two vectors of unequal length, such as `c(1, 2) + c(10, 20, 30, 40)`?", "code": "", "o": ["Raises an immediate DimensionError", "R recycles the shorter vector to match the longer vector, returning `c(11, 22, 31, 42)`", "Truncates the longer vector to length 2", "Fills missing positions with NA"], "oc": [false, true, false, false], "a": 1, "e": "R applies vector recycling: the shorter vector `c(1, 2)` is repeated as `c(1, 2, 1, 2)` and added element-wise to produce `11 22 31 42`."}, {"n": 158, "s": 13, "lv": "M", "q": "Which R function runs all the code examples found at the bottom of a function's help page (e.g., for `lm` or `mean`)?", "code": "", "o": ["example(mean)", "demo_help(mean)", "run_doc(mean)", "test(mean)"], "oc": [true, true, true, true], "a": 0, "e": "Calling `example(function_name)` executes the example code section from that function's R documentation right in the console."}, {"n": 159, "s": 13, "lv": "T", "q": "In R, what is the difference between the numeric literal `5` and `5L` (`typeof(5)` vs `typeof(5L)`)?", "code": "", "o": ["`5` has type `'double'` (floating-point) by default, whereas `5L` has type `'integer'`", "Both have type `'integer'`", "`5L` is a 128-bit long float", "`5L` is a character string"], "oc": [true, false, false, false], "a": 0, "e": "In R, bare numbers like `5` are stored as double-precision floating-point (`'double'`) by default; appending `L` (`5L`) creates a 32-bit signed `'integer'`."}, {"n": 160, "s": 13, "lv": "T", "q": "What is the result of `c(0 / 0, 1 / 0, NA + 5)` in R?", "code": "", "o": ["c(0, Inf, 5)", "c(NaN, Inf, NA)", "c(NA, NaN, 0)", "Error: division by zero"], "oc": [true, true, true, false], "a": 1, "e": "In R's IEEE 754 arithmetic, `0 / 0` yields `NaN` (Not a Number), `1 / 0` yields `Inf` (positive infinity), and any arithmetic with `NA` (missing value) propagates `NA`."}, {"n": 161, "s": 13, "lv": "T", "q": "What happens in R if you index a vector with a negative integer, such as `v <- c(10, 20, 30, 40); v[-2]`?", "code": "", "o": ["Returns the second-to-last element (30)", "Returns a vector with the 2nd element excluded (`10 30 40`)", "Returns NA", "Raises an OutOfBounds error"], "oc": [true, true, false, false], "a": 1, "e": "In R, negative indices exclude the specified positions rather than counting from the end: `v[-2]` returns all elements of `v` except the second element."}, {"n": 162, "s": 13, "lv": "T", "q": "What is the difference between `is.na(x)` and `is.nan(x)` in R when `x <- c(NA, NaN, 5)`?", "code": "", "o": ["`is.na(x)` is TRUE for both `NA` and `NaN` (`TRUE TRUE FALSE`), whereas `is.nan(x)` is TRUE only for `NaN` (`FALSE TRUE FALSE`)", "Both return `TRUE TRUE FALSE`", "`is.na(x)` is FALSE for `NaN`", "Both return `FALSE FALSE FALSE`"], "oc": [true, false, true, false], "a": 0, "e": "In R, every `NaN` is considered a missing value (`is.na(NaN)` is `TRUE`), but `NA` is not `NaN` (`is.nan(NA)` is `FALSE`)."}, {"n": 163, "s": 14, "lv": "E", "q": "In Session 15 Lab Q1, which three built-in R functions compute the sum, arithmetic mean, and product of a numeric vector `v`?", "code": "", "o": ["sum(v), mean(v), and prod(v)", "total(v), avg(v), and mult(v)", "add(v), mean(v), and product(v)", "sum(v), average(v), and multiply(v)"], "oc": [true, true, true, true], "a": 0, "e": "Base R provides `sum(v)`, `mean(v)`, and `prod(v)` to compute the sum, mean, and product of vector elements."}, {"n": 164, "s": 14, "lv": "E", "q": "In R (Session 15), which pair of functions installs a package from CRAN and loads it into the current session?", "code": "", "o": ["install.packages('writexl') and library(writexl)", "pip.install('writexl') and import(writexl)", "get.package('writexl') and use(writexl)", "cran.add('writexl') and include(writexl)"], "oc": [true, true, true, true], "a": 0, "e": "`install.packages('pkg')` downloads and installs a package from CRAN, and `library(pkg)` attaches it to the current R session."}, {"n": 165, "s": 14, "lv": "E", "q": "Which R workspace functions list all objects in the current environment and remove an object `x` respectively?", "code": "", "o": ["ls() (or objects()) and rm(x)", "dir() and del(x)", "list_vars() and delete(x)", "show() and clear(x)"], "oc": [true, true, true, true], "a": 0, "e": "`ls()` lists the names of objects in the active workspace environment, and `rm(x)` removes `x` (or `rm(list = ls())` clears all objects)."}, {"n": 166, "s": 14, "lv": "E", "q": "In Session 15 Lab Q5, which function from the `writexl` package exports an R data frame `df` to an Excel `.xlsx` file?", "code": "", "o": ["write_xlsx(df, 'output.xlsx')", "export_excel(df, 'output.xlsx')", "save.xlsx(df, 'output.xlsx')", "to_excel(df, 'output.xlsx')"], "oc": [true, true, true, true], "a": 0, "e": "`writexl::write_xlsx(df, 'output.xlsx')` exports a data frame (or a named list of data frames as multiple sheets) to an `.xlsx` file with zero Java/Perl dependencies."}, {"n": 167, "s": 14, "lv": "M", "q": "In R (Session 15), what happens when you combine mixed atomic types in `c(10, TRUE, 'hello')`?", "code": "", "o": ["Creates a list preserving each type", "Coerces all elements to the most flexible atomic type (`character`), returning `c('10', 'TRUE', 'hello')`", "Raises a TypeError", "Coerces everything to numeric `c(10, 1, NA)`"], "oc": [false, true, false, true], "a": 1, "e": "Atomic vectors created with `c()` must be homogeneous; R coerces elements up the hierarchy `logical -> integer -> double -> character`."}, {"n": 168, "s": 14, "lv": "M", "q": "In Session 15 Lab Q3 & Q4 (creating a list of data frames `df_list <- list(df1, df2)` and accessing each data frame), what is the difference between `df_list[1]` and `df_list[[1]]`?", "code": "", "o": ["`df_list[1]` returns a sublist of length 1, whereas `df_list[[1]]` extracts the actual `data.frame` object itself", "`df_list[1]` extracts the data frame and `df_list[[1]]` extracts the first row", "Both return the exact same object", "`df_list[[1]]` is a syntax error in R"], "oc": [true, true, false, true], "a": 0, "e": "Single brackets `[ ]` on a list always return a sub-list, whereas double brackets `[[ ]]` (or `$name`) extract the underlying element (`df1`) inside the list."}, {"n": 169, "s": 14, "lv": "M", "q": "In Session 15 Lab Q2 (`airquality` built-in dataset, which contains `NA` values in the `Ozone` column), what does `mean(airquality$Ozone)` return if `na.rm = TRUE` is NOT specified?", "code": "", "o": ["The mean of the non-missing Ozone values", "NA", "0", "NaN"], "oc": [false, false, false, false], "a": 1, "e": "By default in R, `mean()`, `sum()`, `sd()`, and `prod()` return `NA` if any element in the vector is `NA`; you must pass `na.rm = TRUE` to ignore missing values."}, {"n": 170, "s": 14, "lv": "M", "q": "In Session 15 Lab Q5, which two R functions provide the statistical summary (Min, 1st Qu., Median, Mean, 3rd Qu., Max) and the internal structure/nature (types and sample values) of a data frame `df`?", "code": "", "o": ["summary(df) and str(df)", "describe(df) and info(df)", "stats(df) and typeof(df)", "mean(df) and dim(df)"], "oc": [true, true, true, true], "a": 0, "e": "`summary(df)` computes five-number summaries + mean (or frequency counts for factors), and `str(df)` displays the compact internal structure, dimensions, and column types."}, {"n": 171, "s": 14, "lv": "M", "q": "In Session 15 Lab Q5, how do you sort a base R data frame `df` by `dept` ascending and then `salary` descending?", "code": "", "o": ["df[order(df$dept, -df$salary), ]", "sort(df, by = c('dept', '-salary'))", "df.sort_values('dept', 'salary')", "order(df$dept, df$salary)"], "oc": [true, true, true, true], "a": 0, "e": "`order(df$dept, -df$salary)` returns the row index permutation that orders `df` by `dept` ascending and `salary` descending, which is passed to `df[row_indices, ]`."}, {"n": 172, "s": 14, "lv": "T", "q": "By default, how does R fill a matrix when you execute `matrix(1:6, nrow = 2, ncol = 3)`?", "code": "", "o": ["Column-wise (by column), unless `byrow = TRUE` is specified", "Row-wise (by row)", "Diagonally", "Randomly"], "oc": [true, true, false, false], "a": 0, "e": "R stores matrices in column-major order, so `matrix(1:6, nrow = 2, ncol = 3)` fills column 1 (`1, 2`), column 2 (`3, 4`), and column 3 (`5, 6`) unless `byrow = TRUE` is passed."}, {"n": 173, "s": 14, "lv": "T", "q": "In R, what is the dangerous pitfall of converting a factor `f <- factor(c('10', '20', '30'))` directly to numeric using `as.numeric(f)`?", "code": "", "o": ["`as.numeric(f)` returns the internal integer level codes `c(1, 2, 3)` instead of `c(10, 20, 30)`; you should use `as.numeric(as.character(f))`", "It raises an error", "It returns `c(NA, NA, NA)`", "It converts them to strings"], "oc": [true, false, true, false], "a": 0, "e": "Factors are stored internally as integer level indices (`1, 2, 3`). Calling `as.numeric(f)` returns those internal codes; converting via `as.numeric(as.character(f))` parses the actual labels."}, {"n": 174, "s": 14, "lv": "T", "q": "What happens in base R when you subset a single column from a data frame or matrix as `df[, 1]` vs `df[, 1, drop = FALSE]`?", "code": "", "o": ["`df[, 1]` simplifies (drops dimensions) to a 1D vector, whereas `df[, 1, drop = FALSE]` preserves it as a 1-column data frame", "Both return a 1-column data frame", "`df[, 1]` returns a list", "`drop = FALSE` deletes the first column"], "oc": [true, false, true, false], "a": 0, "e": "In base R `data.frame` and `matrix` indexing, selecting a single column (`df[, 1]`) defaults to `drop = TRUE`, simplifying the result to a vector unless `drop = FALSE` is specified."}, {"n": 175, "s": 14, "lv": "T", "q": "What is the difference between `library(pkg)` and `require(pkg)` when loading an R package that is NOT installed?", "code": "", "o": ["`library(pkg)` stops with an immediate error, whereas `require(pkg)` emits a warning and returns `FALSE` (designed for use inside conditional checks)", "`require(pkg)` automatically installs the package from CRAN", "`library(pkg)` returns `FALSE` silently", "There is no difference"], "oc": [true, true, true, false], "a": 0, "e": "`library()` throws an error if the package does not exist, whereas `require()` returns a logical `TRUE`/`FALSE` and only gives a warning on failure."}, {"n": 176, "s": 15, "lv": "E", "q": "Which core `tidyverse` package provides the grammar of data manipulation verbs (`filter`, `select`, `mutate`, `arrange`, `summarise`)?", "code": "", "o": ["dplyr", "tidyr", "purrr", "forcats"], "oc": [false, false, false, false], "a": 0, "e": "`dplyr` is the tidyverse package dedicated to data frame manipulation via intuitive verbs."}, {"n": 1 e, false, true, false], "a": 0, "e": "Tidy data requires: (1) each variable forms a column, (2) each observation forms a row, and (3) each value occupies a single cell."}, {"n": 181, "s": 15, "lv": "M", "q": "In `tidyr` (Session 16), which pair of modern functions reshapes data between wide format and long format (superseding `gather()` and `spread()`)?", "code": "", "o": ["pivot_longer() and pivot_wider()", "melt() and cast()", "stack() and unstack()", "lengthen() and widen()"], "oc": [true, true, true, true], "a": 0, "e": "`pivot_longer()` reshapes wide data into long (tidy) format, and `pivot_wider()` reshapes long data into wide format."}, {"n": 182, "s": 15, "lv": "M", "q": "In Session 16 Lab Q1, which R packages are standardly used to read/parse XML files and JSON files respectively in RStudio?", "code": "", "o": ["xml2 (or XML) and jsonlite", "rxml and rjson_core", "bs4 and simplejson", "readr and writexl"], "oc": [true, false, false, false], "a": 0, "e": "`xml2::read_xml()` (or `XML`) reads XML documents and `jsonlite::fromJSON()` parses JSON files directly into R lists/data frames."}, {"n": 183, "s": 15, "lv": "M", "q": "In Session 16 Lab Q2, which tidyverse-ecosystem R package is designed for extracting/scraping data from HTML web pages (similar to Python's BeautifulSoup)?", "code": "", "o": ["rvest", "httr_scrape", "shiny", "knitr"], "oc": [false, false, false, false], "a": 0, "e": "`rvest` (harvest) provides `read_html()`, `html_elements()`, `html_text()`, and `html_table()` for web scraping in R."}, {"n": 184, "s": 15, "lv": "M", "q": "In Session 16 Lab Q3 (calling the `diamonds` dataset in `ggplot2` and plotting a bar graph of `cut`), which `ggplot2` expression creates a bar chart of diamond counts by `cut`?", "code": "", "o": ["ggplot(diamonds, aes(x = cut)) + geom_bar()", "ggplot(diamonds, aes(x = cut)) + geom_histogram()", "plot_bar(diamonds$cut)", "ggplot(diamonds) %>% bar(cut)"], "oc": [true, true, true, true], "a": 0, "e": "`ggplot(diamonds, aes(
