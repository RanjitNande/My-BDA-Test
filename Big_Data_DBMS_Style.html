<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Data 330 MCQs · DBMS Style Study Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunken:#E7EDEF; --ink:#13232B; --muted:#56676F; --line:#D2DCE0;
  --accent:#1B5E86; --accent-ink:#FFFFFF; --accent-soft:#DCEAF3;
  --ok:#1C7A4A; --ok-soft:#DCF1E4; --bad:#B23A2E; --bad-soft:#F7E0DC; --todo:#C5C9D6;
  --code-bg:#11202A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(23,26,43,.06),0 4px 14px rgba(23,26,43,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
    --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
    --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
    --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
  --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
  --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
  --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 74px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:11px;flex-wrap:wrap}
.nav-arrows{display:inline-flex;gap:6px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.toplinks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:8px 14px;font-weight:500;cursor:pointer;min-height:40px;text-align:center;text-decoration:none}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .count{font-family:var(--font-mono);font-size:12px;opacity:.85;background:var(--sunken);padding:1px 6px;border-radius:10px}
.btn.primary .count{background:rgba(255,255,255,.2);color:inherit}

/* Bookmark button & strip indicator */
.bm-btn{margin-left:auto;border-radius:999px;font-family:var(--font-mono);font-size:12px;padding:3px 10px;min-height:28px;color:var(--muted)}
.bm-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sq{position:relative}
.sq.bm::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;border-radius:2px;background:var(--accent)}

/* Home */
.home{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.summary{display:flex;flex-direction:column;gap:18px}
@media (min-width:901px){.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.bigrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack span{display:block;height:100%}
.stack .s-ok{background:var(--ok)} .stack .s-bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.todo{background:var(--todo)}
.lvrows{display:grid;gap:8px}
.lvrow{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.lvrow .stack{height:7px}
.lvrow .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:grid;gap:8px}
.subsets-box{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.subsets-box h3{font-size:15px}
.subset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.subset-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border:1px solid var(--line);background:var(--sunken);border-radius:7px;cursor:pointer;text-align:left}
.subset-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.subset-btn b{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.subset-btn span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.weak h3{font-size:16px;margin-bottom:8px}
.weaklist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.weaklist button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sunken);border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.weaklist button:hover{border-color:var(--accent)}
.weaklist .wname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaklist .wstat{font-family:var(--font-mono);font-size:12px;color:var(--bad);white-space:nowrap}
.empty-note{font-size:13px;color:var(--muted);margin:0}
.reset{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.reset .confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

.topics-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.topics-head h2{font-size:24px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.topics-head .seg{margin-left:auto}
.topiclist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.topic{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) 84px;gap:14px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--accent)}
.tnum{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
.tnum b{display:block;font-family:var(--font-display);font-size:21px;color:var(--ink);font-weight:600;letter-spacing:0;white-space:nowrap}
.tbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.tname{font-weight:600;font-size:15px;line-height:1.35}
.tsub{font-size:12.5px;color:var(--muted);line-height:1.4}
.tmeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tmeta .past{color:var(--accent)}
.tbar{height:6px}
.tscore{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tscore small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.tscore.na{color:var(--todo)}
@media (max-width:520px){.topic{grid-template-columns:48px minmax(0,1fr) 64px;gap:10px;padding:12px}.tnum b{font-size:17px}.tscore{font-size:18px}}
.intro{font-size:13.5px;color:var(--muted);max-width:68ch;margin:0 0 14px}

/* Quiz — Continuous Vertical Feed */
.quiz{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.switcher-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
.switcher-select{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunken);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.qhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.qhead .titles{min-width:0;flex:1 1 300px}
.qhead h2{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--bg);padding-top:6px;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:5px;width:max-content;padding-bottom:4px}
.sq{width:38px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:11.5px;cursor:pointer;color:var(--muted);flex:none}
.sq:hover{border-color:var(--accent);color:var(--ink)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:600}
.progressline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progressline b{color:var(--ink)}
.qfeed{display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:115px;transition:border-color .2s}
.qcard.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:520px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--font-mono);font-weight:600;font-size:14px;background:var(--sunken);padding:2px 8px;border-radius:5px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:4px;background:var(--todo);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}
.bars.on1 i:nth-child(-n+1),.bars.on2 i:nth-child(-n+2),.bars.on3 i:nth-child(-n+3){background:var(--accent)}
.missed{font-family:var(--font-mono);font-size:11.5px;color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:1px 8px}
.pyq{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px}
.sref{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.stem{font-size:16.5px;line-height:1.5;margin:0;white-space:pre-wrap;font-weight:500}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;tab-size:4}
.code .kw{color:var(--code-kw)} .code .st{color:var(--code-str)} .code .cm{color:var(--code-com);font-style:italic} .code .nu{color:var(--code-num)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.key{width:28px;height:28px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px}
.otext{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.otext.codey{font-family:var(--font-mono);font-size:13.5px;white-space:pre-wrap}
.mark{padding-top:3px;font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
@media (max-width:520px){.opt{grid-template-columns:30px minmax(0,1fr)}.mark{grid-column:2;padding-top:0}.mark:empty{display:none}}
.feedback{border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-soft)}
.feedback .verdict{font-weight:600;font-size:15px}
.feedback.yes .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback p{margin:0}
.feedback .fbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.qfoot .spacer{flex:1}
.nolist{padding:28px;text-align:center;color:var(--muted)}

/* Results + mistakes */
.result{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.scorecard{grid-template-columns:minmax(0,1fr)}}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--font-display);font-size:32px;line-height:1}
.ring .lbl small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mistake .stem{font-size:15px}
.answers{display:grid;gap:6px}
.ans{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;font-size:14px;align-items:start;padding:8px 10px;border-radius:7px}
.ans > span{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.ans{grid-template-columns:minmax(0,1fr);gap:2px}}
.ans .who{font-family:var(--font-mono);font-size:12px;padding-top:2px}
.ans.yours{background:var(--bad-soft)} .ans.yours .who{color:var(--bad)}
.ans.correct{background:var(--ok-soft)} .ans.correct .who{color:var(--ok)}
.explain{font-size:14px;margin:0;color:var(--ink)}
.explain b{font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.grouphead h3{font-size:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* Topic group headings on the home list */
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:14px;padding:0 2px}
.topiclist li.ghead:first-child{margin-top:0}
.ghead b{font-family:var(--font-display);font-size:18px;font-weight:600}
.ghead .gno{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ghead .gstat{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quick facts */
.info{max-width:1080px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.info h2{font-size:24px}
.info h3{font-size:18px;margin-bottom:10px}
.info p{margin:0 0 10px;max-width:68ch}
.info p:last-child{margin-bottom:0}
.info ul{margin:0;padding-left:20px;display:grid;gap:7px;max-width:68ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts .panel h3{font-size:17px}
.facts ul{gap:6px;font-size:14px}
.info code{font-family:var(--font-mono);font-size:13px;background:var(--sunken);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.topic,.sq{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">

<script type="application/json" id="qdata">{"groups":[{"n":1,"name":"Big Data Overview","range":"Sessions 1-2"},{"n":2,"name":"Hadoop and HDFS","range":"Sessions 3-8"},{"n":3,"name":"MapReduce and HBase","range":"Sessions 9-10"},{"n":4,"name":"Hive","range":"Sessions 11-14"},{"n":5,"name":"Data Warehousing, ETL and Airflow","range":"Sessions 15-18"},{"n":6,"name":"Apache Spark","range":"Sessions 19-24"},{"n":7,"name":"Kafka and Streaming","range":"Sessions 25-28"},{"n":8,"name":"Spark SQL, MLlib and Cloud","range":"Sessions 29-32"},{"n":9,"name":"Capstone","range":"Session 33"}],"sessions":[{"n":1,"g":1,"name":"Big Data Beyond the Hype","topics":"the Vs of big data, data types and sources, skills, hype and adoption"},{"n":2,"g":1,"name":"Data Repositories and Curation","topics":"sharing and reuse, metadata, FAIR, OAIS, meta-repositories, data rescue, end of the life cycle"},{"n":3,"g":2,"name":"Introduction to Hadoop","topics":"history, evolution, components, comparison with RDBMS, releases, distributions"},{"n":4,"g":2,"name":"HDFS and Its Daemons","topics":"distributed file system, blocks, NameNode, Secondary NameNode, DataNode"},{"n":5,"g":2,"name":"HDFS Architecture","topics":"rebalancing, replication, rack awareness, pipelining, node failure, NameNode HA"},{"n":6,"g":2,"name":"Hadoop Cluster Setup","topics":"operation modes, configuration files, SSH, security, administration, benchmarks"},{"n":7,"g":2,"name":"Hadoop Architecture and Shell","topics":"YARN daemons, Hadoop 1 vs 2, common HDFS shell commands, data locality"},{"n":8,"g":2,"name":"HDFS Data Storage","topics":"read and write anatomy, failures, admin commands, web UI, Java API"},{"n":9,"g":3,"name":"MapReduce","topics":"map and reduce tasks, shuffle and sort, combiner, partitioner, task execution"},{"n":10,"g":3,"name":"HBase","topics":"architecture, regions, write path, shell commands, comparison with RDBMS"},{"n":11,"g":4,"name":"Introduction to Hive","topics":"purpose, metastore, HiveServer2, architecture, comparison with databases"},{"n":12,"g":4,"name":"HiveQL: Types and Tables","topics":"data types, managed and external tables, partitions, buckets, formats, loading, ALTER"},{"n":13,"g":4,"name":"Querying with HiveQL","topics":"sorting, aggregation, joins, map-side joins, views, strict mode, scripts"},{"n":14,"g":4,"name":"Hive Data Manipulation and UDFs","topics":"INSERT, UDF, UDAF and UDTF, HQL scripts, built-in functions"},{"n":15,"g":5,"name":"Data Warehousing and Data Lakes","topics":"OLAP, star and snowflake schemas, facts, SCD, marts, Inmon and Kimball"},{"n":16,"g":5,"name":"ETL Pipelines and ETL vs ELT","topics":"staging, medallion layers, incremental loads, idempotence, lake layout"},{"n":17,"g":5,"name":"Apache Airflow Fundamentals","topics":"DAGs, operators, sensors, hooks, connections, scheduler, XCom"},{"n":18,"g":5,"name":"Airflow and Informatica in Practice","topics":"trigger rules, retries, executors, scheduling, managed Airflow, Informatica"},{"n":19,"g":6,"name":"Spark Overview and Initialization","topics":"history, components, driver, cluster managers, SparkSession"},{"n":20,"g":6,"name":"RDDs and Key-Value Pairs","topics":"transformations and actions, lazy evaluation, external datasets, shuffles"},{"n":21,"g":6,"name":"DataFrames and Structured Streaming","topics":"RDD vs DataFrame vs Dataset, DataFrame operations, streaming basics"},{"n":22,"g":6,"name":"Spark Job Optimization","topics":"caching and persistence, shared variables, partitioning, broadcast joins, deployment"},{"n":23,"g":6,"name":"Spark with and without Hadoop","topics":"MapReduce in Spark, HDFS and YARN, S3, JDBC"},{"n":24,"g":6,"name":"EDA with PySpark","topics":"schemas, summary statistics, nulls, type casts, frequencies, correlation"},{"n":25,"g":7,"name":"Introduction to Kafka","topics":"topics, partitions, offsets, brokers, replication, consumer groups, KRaft"},{"n":26,"g":7,"name":"Spark Streaming Architecture and APIs","topics":"DStreams, micro-batches, windows, watermarks, triggers, sinks"},{"n":27,"g":7,"name":"Kafka with Spark","topics":"Kafka source and sink, offsets, JSON parsing, managed Kafka services"},{"n":28,"g":7,"name":"Kafka Producers, Consumers and Connect","topics":"acks, keys, offsets, CLI tools, Kafka Connect"},{"n":29,"g":8,"name":"Spark SQL and Window Functions","topics":"temporary views, ranking, LAG, running totals, frames, NTILE"},{"n":30,"g":8,"name":"Spark MLlib","topics":"Transformers and Estimators, feature tools, pipelines, algorithms, tuning"},{"n":31,"g":8,"name":"Predictive Analysis","topics":"regression and classification, evaluation metrics, overfitting, leakage"},{"n":32,"g":8,"name":"Spark on the Cloud","topics":"Databricks, EMR, Dataproc, autoscaling, dynamic allocation, cost"},{"n":33,"g":9,"name":"Capstone: End-to-End Pipeline","topics":"Airflow operators, HDFS ingestion, triggering Spark, XCom, validation"}],"questions":[{"n":1,"s":1,"lv":"E","q":"Which of these was NOT one of the original \"3 Vs\" of big data described by Doug Laney?","code":"","lang":"","chk":0,"o":["Volume","Velocity","Variety","Veracity"],"oc":[false,false,false,false],"a":3,"e":"Laney's 2001 note named volume, velocity and variety. Veracity (how trustworthy the data is) and value were added later to make the \"5 Vs\"."},{"n":2,"s":1,"lv":"E","q":"Data stored as JSON or XML documents is an example of ______ data.","code":"","lang":"","chk":0,"o":["unstructured","semi-structured","transactional","structured"],"oc":[false,false,false,false],"a":1,"e":"JSON and XML carry tags or keys that describe the data, but they do not force a fixed table schema. That makes them semi-structured."},{"n":3,"s":1,"lv":"E","q":"Which of these is an example of unstructured data?","code":"","lang":"","chk":0,"o":["A CSV file with a header row","Rows of a relational table with fixed columns","An Excel sheet of student marks","Video recordings from CCTV cameras"],"oc":[false,false,false,false],"a":3,"e":"Video, audio, images and free text have no predefined data model. Tables, CSV files and spreadsheets have fixed columns and are structured."},{"n":4,"s":1,"lv":"E","q":"In the context of big data, \"velocity\" refers to ______.","code":"","lang":"","chk":0,"o":["the accuracy of the data","the total size of the data","the speed at which data is generated and must be processed","the number of different data formats"],"oc":[false,false,false,false],"a":2,"e":"Velocity is about data arriving fast, often continuously (clickstreams, sensors, trades), so it must be handled in near real time. Size is volume and different formats are variety."},{"n":5,"s":1,"lv":"M","q":"\"Veracity\" in big data refers to ______.","code":"","lang":"","chk":0,"o":["the business value of the data","the quality and trustworthiness of the data","the size of the data","the speed of data arrival"],"oc":[false,false,false,false],"a":1,"e":"Veracity covers noise, bias, missing values and inconsistency. Analysis built on untrustworthy data gives untrustworthy results, however large the data set."},{"n":6,"s":1,"lv":"E","q":"Web server logs, GPS traces and readings from IoT sensors are examples of ______ data.","code":"","lang":"","chk":0,"o":["master","human-generated","machine-generated","reference"],"oc":[false,false,false,false],"a":2,"e":"These records are produced automatically by devices and software, often in huge volumes. Social media posts and emails are examples of human-generated data."},{"n":7,"s":1,"lv":"M","q":"Point out the wrong statement about big data.","code":"","lang":"","chk":0,"o":["Big data has value only when it is analysed to support decisions","Big data usually needs distributed storage and processing","Big data can be structured, semi-structured or unstructured","Data is \"big data\" only when its size crosses one terabyte"],"oc":[false,false,false,false],"a":3,"e":"There is no fixed size threshold. Data is \"big\" when its volume, speed or variety is more than traditional tools can handle, which is why the hype around size alone is misleading."},{"n":8,"s":1,"lv":"M","q":"In the Gartner hype cycle, which phase comes right after the \"peak of inflated expectations\"?","code":"","lang":"","chk":0,"o":["Innovation trigger","Slope of enlightenment","Trough of disillusionment","Plateau of productivity"],"oc":[false,false,false,false],"a":2,"e":"The phases are innovation trigger, peak of inflated expectations, trough of disillusionment, slope of enlightenment and plateau of productivity. Big data went through this cycle before settling into everyday use."},{"n":9,"s":1,"lv":"T","q":"Which list is in increasing order of size?","code":"","lang":"","chk":0,"o":["Gigabyte, terabyte, exabyte, petabyte, zettabyte","Gigabyte, petabyte, terabyte, exabyte, zettabyte","Terabyte, gigabyte, petabyte, zettabyte, exabyte","Gigabyte, terabyte, petabyte, exabyte, zettabyte"],"oc":[false,false,false,false],"a":3,"e":"Each unit is 1000 (or 1024) times the previous one: GB, TB, PB, EB, ZB. Big data volumes are usually spoken of in petabytes and beyond."},{"n":10,"s":1,"lv":"M","q":"Point out the correct statement about big data adoption in organisations.","code":"","lang":"","chk":0,"o":["Installing Hadoop automatically produces business value","Only internet companies can benefit from big data","Projects often fail because of skill gaps, poor data quality and unclear business goals rather than technology alone","Big data adoption needs no change to business processes"],"oc":[false,false,false,false],"a":2,"e":"Adoption needs skilled people (data engineers, analysts, data scientists), trustworthy data and a clear business question. Tools alone do not create value."},{"n":11,"s":2,"lv":"E","q":"Data curation is best described as ______.","code":"","lang":"","chk":0,"o":["converting all data into a single file format","the active management of data across its life cycle so it stays findable, usable and preserved for reuse","encrypting data before storing it","deleting data that is older than one year"],"oc":[false,false,false,false],"a":1,"e":"Curation covers selecting, describing (metadata), preserving and providing access to data, so that others can find, trust and reuse it later."},{"n":12,"s":2,"lv":"E","q":"What do the letters of the FAIR data principles stand for?","code":"","lang":"","chk":0,"o":["Fast, Accurate, Indexed, Reliable","Formatted, Archived, Identified, Recorded","Findable, Accessible, Interoperable, Reusable","Free, Available, Integrated, Readable"],"oc":[false,false,false,false],"a":2,"e":"The FAIR principles guide how research data should be shared so that people and machines can find it, access it, combine it with other data and reuse it."},{"n":13,"s":2,"lv":"E","q":"Which persistent identifier is commonly given to a published dataset so that it can be cited?","code":"","lang":"","chk":0,"o":["IP address","Port number","MAC address","DOI (Digital Object Identifier)"],"oc":[false,false,false,false],"a":3,"e":"A DOI keeps pointing to the dataset even if its web address changes, so citations do not break. Agencies such as DataCite issue DOIs for datasets."},{"n":14,"s":2,"lv":"E","q":"Which of these is metadata about a dataset?","code":"","lang":"","chk":0,"o":["The rows of a sales table","The creator, creation date, file format and licence of the dataset","The temperature values recorded by a sensor","The pixels of a satellite image"],"oc":[false,false,false,false],"a":1,"e":"Metadata is data that describes data. Without it, a repository user cannot tell where data came from, what it means or whether it may be reused."},{"n":15,"s":2,"lv":"M","q":"What is a registry of research data repositories, such as re3data.org, used for?","code":"","lang":"","chk":0,"o":["Storing the data files themselves","Running analytics jobs on the data","Replacing institutional repositories","Finding a suitable repository for a subject, by its policies, licences and access conditions"],"oc":[false,false,false,false],"a":3,"e":"Such meta-repositories describe repositories rather than holding data, so researchers can choose where to deposit data and find where data in their field is kept."},{"n":16,"s":2,"lv":"M","q":"In the OAIS reference model for digital archives, what is the package that a producer submits to the archive called?","code":"","lang":"","chk":0,"o":["Archival Information Package (AIP)","Dissemination Information Package (DIP)","Submission Information Package (SIP)","Metadata Information Package (MIP)"],"oc":[false,false,false,false],"a":2,"e":"The producer submits a SIP, the archive stores it as an AIP and delivers a DIP to users. There is no MIP in OAIS."},{"n":17,"s":2,"lv":"M","q":"\"Data rescue\" refers to ______.","code":"","lang":"","chk":0,"o":["restoring a deleted file from the recycle bin","recovering data at risk of loss, such as old tapes, paper records or obsolete formats, and making it usable again","compressing data to save space","encrypting data to protect it from hackers"],"oc":[false,false,false,false],"a":1,"e":"Valuable scientific data often sits on decaying media or in formats no software can read. Rescue projects digitise, migrate and document it so it can be disseminated and reused."},{"n":18,"s":2,"lv":"M","q":"Point out the wrong statement about data sharing and reuse.","code":"","lang":"","chk":0,"o":["A licence such as CC0 or CC-BY states how data may be reused","Sensitive data may need to be anonymised before it is shared","Sharing raw files without documentation is enough to guarantee reuse","Data needs clear metadata to be reusable by others"],"oc":[false,false,false,false],"a":2,"e":"Undocumented data is rarely reused, because others cannot interpret it. Documentation, licences and privacy protection are what make shared data usable."},{"n":19,"s":2,"lv":"T","q":"Point out the correct statement about the end of the data life cycle.","code":"","lang":"","chk":0,"o":["Deleting a dataset needs no record or justification","Data that is no longer needed can be appraised and then transferred, deaccessioned or deleted under a documented retention policy","A repository must keep every dataset forever","Once data is published it can never be withdrawn"],"oc":[false,false,false,false],"a":1,"e":"Keeping everything forever is costly. Curation includes deciding, through appraisal and policy, what to keep, migrate, hand over or dispose of, and recording that decision."},{"n":20,"s":2,"lv":"T","q":"In the DCC curation life cycle model, which action comes immediately after \"appraise and select\"?","code":"","lang":"","chk":0,"o":["Store","Access, use and reuse","Ingest","Transform"],"oc":[false,false,false,false],"a":2,"e":"The sequential actions are: conceptualise, create or receive, appraise and select, ingest, preservation action, store, access use and reuse, and transform."},{"n":21,"s":3,"lv":"E","q":"Hadoop was created by ______.","code":"","lang":"","chk":0,"o":["Jay Kreps and Neha Narkhede","Doug Cutting and Mike Cafarella","Matei Zaharia","Linus Torvalds"],"oc":[false,false,false,false],"a":1,"e":"Hadoop began as part of the Nutch web-crawler project led by Doug Cutting and Mike Cafarella. Zaharia created Spark, and Kreps and Narkhede created Kafka."},{"n":22,"s":3,"lv":"E","q":"Hadoop is written mainly in ______.","code":"","lang":"","chk":0,"o":["C++","Scala","Python","Java"],"oc":[false,false,false,false],"a":3,"e":"The Hadoop framework is written in Java, which is why its configuration and APIs are Java-based. Spark and Kafka are written mainly in Scala."},{"n":23,"s":3,"lv":"E","q":"Hadoop's design was inspired by which two Google papers?","code":"","lang":"","chk":0,"o":["Bigtable and Dremel","The Google File System (GFS) and MapReduce","PageRank and Caffeine","Spanner and Borg"],"oc":[false,false,false,false],"a":1,"e":"HDFS follows the GFS paper (2003) and Hadoop MapReduce follows the MapReduce paper (2004). Bigtable later inspired HBase."},{"n":24,"s":3,"lv":"E","q":"Hadoop grew out of which open-source project?","code":"","lang":"","chk":0,"o":["Apache Kafka","Apache Spark","Apache Nutch","Apache Hive"],"oc":[false,false,false,false],"a":2,"e":"Nutch needed a way to store and process web-scale crawl data. Its distributed file system and MapReduce code were split out into Hadoop in 2006."},{"n":25,"s":3,"lv":"M","q":"Which modules make up the core of Apache Hadoop 3?","code":"","lang":"","chk":0,"o":["Spark, Kafka, Flume and Sqoop","Hadoop Common, HDFS, YARN and MapReduce","HDFS, Hive, Pig and HBase","NameNode, DataNode and Secondary NameNode only"],"oc":[false,false,false,false],"a":1,"e":"These four are the core project. Hive, HBase, Pig, Spark and Kafka are separate projects in the wider Hadoop ecosystem."},{"n":26,"s":3,"lv":"E","q":"Which component was introduced in Hadoop 2 to separate resource management from data processing?","code":"","lang":"","chk":0,"o":["Hive","HDFS","ZooKeeper","YARN"],"oc":[false,false,false,false],"a":3,"e":"In Hadoop 1, MapReduce's JobTracker did both jobs. YARN took over resource management, so engines other than MapReduce, such as Spark and Tez, can share the cluster."},{"n":27,"s":3,"lv":"M","q":"Point out the correct statement comparing Hadoop with a traditional RDBMS.","code":"","lang":"","chk":0,"o":["An RDBMS scales out more easily to thousands of commodity servers","Hadoop uses schema-on-read, while an RDBMS uses schema-on-write","Hadoop requires data to be stored in normalised tables","Hadoop is designed for frequent small updates to individual rows"],"oc":[false,false,false,false],"a":1,"e":"Hadoop stores raw files and applies structure when data is read, and it favours large batch scans over write-once data. An RDBMS checks data against its schema on load and is built for interactive reads and updates."},{"n":28,"s":3,"lv":"M","q":"Which major feature was introduced in Hadoop 3?","code":"","lang":"","chk":0,"o":["The Secondary NameNode","YARN","Erasure coding in HDFS","The MapReduce programming model"],"oc":[false,false,false,false],"a":2,"e":"Erasure coding gives the same fault tolerance as 3-way replication with about 1.5 times storage overhead instead of 3 times. YARN came in Hadoop 2; MapReduce and the Secondary NameNode existed in Hadoop 1."},{"n":29,"s":3,"lv":"E","q":"Which of these is NOT a Hadoop distribution or managed Hadoop service?","code":"","lang":"","chk":0,"o":["Cloudera Data Platform","Azure HDInsight","Amazon EMR","Apache Tomcat"],"oc":[false,false,false,false],"a":3,"e":"Tomcat is a Java web server. Cloudera (which merged with Hortonworks), Amazon EMR, Azure HDInsight and Google Dataproc all package or host Hadoop."},{"n":30,"s":3,"lv":"M","q":"Point out the wrong statement about the Hadoop ecosystem.","code":"","lang":"","chk":0,"o":["Kafka is a distributed event-streaming platform","HBase gives random, real-time read and write access to data","YARN is Hadoop's storage layer","Hive lets users query data with a SQL-like language"],"oc":[false,false,false,false],"a":2,"e":"HDFS is the storage layer. YARN manages cluster resources and schedules applications."},{"n":31,"s":4,"lv":"E","q":"HDFS is designed for ______.","code":"","lang":"","chk":0,"o":["low-latency transactional workloads","very large files with write-once, read-many streaming access","many small files that are updated randomly","data that is kept only in memory"],"oc":[false,false,false,false],"a":1,"e":"HDFS favours high throughput over low latency. Files are written once (appends are allowed) and read many times in large sequential scans."},{"n":32,"s":4,"lv":"E","q":"What is the default HDFS block size in Hadoop 2 and Hadoop 3?","code":"","lang":"","chk":0,"o":["64 MB","1 GB","4 KB","128 MB"],"oc":[false,false,false,false],"a":3,"e":"The default (dfs.blocksize) is 128 MB. Hadoop 1 used 64 MB. Large blocks keep seek time small compared with transfer time and keep the NameNode's metadata small."},{"n":33,"s":4,"lv":"E","q":"What is the default replication factor in HDFS?","code":"","lang":"","chk":0,"o":["3","1","2","5"],"oc":[false,false,false,false],"a":0,"e":"dfs.replication defaults to 3, so each block is stored on three DataNodes. It can be changed for the cluster or for each file."},{"n":34,"s":4,"lv":"E","q":"Which HDFS daemon stores the file system namespace (the directory tree and file-to-block mapping)?","code":"","lang":"","chk":0,"o":["DataNode","NameNode","ResourceManager","NodeManager"],"oc":[false,false,false,false],"a":1,"e":"The NameNode is the master that holds all metadata. It does not store file data; the blocks themselves live on DataNodes."},{"n":35,"s":4,"lv":"E","q":"Which HDFS daemon stores the actual data blocks on its local disks?","code":"","lang":"","chk":0,"o":["DataNode","JournalNode","NameNode","Secondary NameNode"],"oc":[false,false,false,false],"a":0,"e":"DataNodes store and serve blocks, send heartbeats and block reports to the NameNode, and carry out its instructions to create, delete or replicate blocks."},{"n":36,"s":4,"lv":"M","q":"Point out the correct statement about the Secondary NameNode.","code":"","lang":"","chk":0,"o":["It replaces failed DataNodes","It keeps a copy of every data block","It periodically merges the edit log into the fsimage to create a checkpoint","It automatically takes over when the NameNode fails"],"oc":[false,false,false,false],"a":2,"e":"Despite its name, the Secondary NameNode is not a standby. It performs checkpoints so the edit log does not grow without limit and NameNode restarts stay fast."},{"n":37,"s":4,"lv":"M","q":"In which two files does the NameNode persist the namespace on disk?","code":"","lang":"","chk":0,"o":["blk_ files and .meta files","part-r-00000 and _SUCCESS","core-site.xml and hdfs-site.xml","fsimage and the edit log"],"oc":[false,false,false,false],"a":3,"e":"fsimage is a snapshot of the namespace and the edit log records every change made since that snapshot. Block files and their .meta checksum files live on DataNodes."},{"n":38,"s":4,"lv":"T","q":"A 300 MB file is stored in HDFS with a 128 MB block size. How many blocks does it use, and how much disk space does its last block take on each DataNode?","code":"","lang":"","chk":1,"o":["3 blocks; the last block takes 44 MB","3 blocks; the last block takes 64 MB","3 blocks; the last block takes 128 MB","2 blocks; the last block takes 172 MB"],"oc":[false,false,false,false],"a":0,"e":"300 MB needs ceil(300 / 128) = 3 blocks: 128, 128 and 44 MB. A block smaller than the block size uses only as much disk as its data, not a full 128 MB."},{"n":39,"s":4,"lv":"M","q":"With the default replication factor, how much raw disk space does a 300 MB file use across the cluster?","code":"","lang":"","chk":1,"o":["1152 MB","384 MB","300 MB","900 MB"],"oc":[false,false,false,false],"a":3,"e":"Each byte is stored three times, so 300 x 3 = 900 MB. Partly filled blocks do not take up a full block, so 3 x 384 MB is wrong."},{"n":40,"s":4,"lv":"M","q":"Why does HDFS handle millions of small files poorly?","code":"","lang":"","chk":0,"o":["Every file, directory and block is held as an object in the NameNode's memory, so huge numbers of small files exhaust it","DataNodes cannot store files smaller than 128 MB","Small files cannot be replicated","The client cannot read files smaller than one block"],"oc":[false,false,false,false],"a":0,"e":"Each namespace object takes roughly 150 bytes of NameNode heap. Millions of small files also mean millions of map tasks. Small files are usually merged, or packed into SequenceFiles or HAR archives."},{"n":41,"s":5,"lv":"E","q":"By default, how often does a DataNode send a heartbeat to the NameNode?","code":"","lang":"","chk":0,"o":["Every 3 seconds","Every 30 seconds","Every 10 minutes","Every 6 hours"],"oc":[false,false,false,false],"a":0,"e":"dfs.heartbeat.interval is 3 seconds. Full block reports, listing every block a DataNode holds, are sent far less often (every 6 hours by default)."},{"n":42,"s":5,"lv":"T","q":"With replication factor 3 and a writer running on a DataNode, where does HDFS's default rack-aware policy place the replicas?","code":"","lang":"","chk":0,"o":["All three on the same DataNode","First on the writer's node, second on a node in a different rack, third on another node in the same rack as the second","All three on nodes in the writer's rack","Each replica on a different rack"],"oc":[false,false,false,false],"a":1,"e":"This placement survives the loss of a whole rack while only one block transfer crosses racks. If the client is outside the cluster, the first replica goes to a randomly chosen node."},{"n":43,"s":5,"lv":"M","q":"Why does HDFS spread the replicas of a block across more than one rack?","code":"","lang":"","chk":0,"o":["To reduce the number of DataNodes needed","To make every write faster","So the data survives the failure of an entire rack, such as a switch or power failure","Because a rack can hold only one replica"],"oc":[false,false,false,false],"a":2,"e":"Machines in one rack share a switch and power supply. Keeping at least one replica on another rack protects the data, while the default policy limits slower cross-rack traffic."},{"n":44,"s":5,"lv":"M","q":"New DataNodes are added to a cluster and they hold almost no data. Which tool spreads existing blocks evenly across the DataNodes?","code":"","lang":"","chk":0,"o":["hdfs fsck","hdfs balancer","hdfs dfs -setrep","hdfs namenode -format"],"oc":[false,false,false,false],"a":1,"e":"The balancer moves blocks from over-used to under-used DataNodes until each node's usage is within a threshold (10% by default) of the cluster average."},{"n":45,"s":5,"lv":"M","q":"What does the NameNode do when a DataNode stops sending heartbeats?","code":"","lang":"","chk":0,"o":["It waits for an administrator to copy the blocks by hand","It shuts down the whole cluster","It deletes all files that had blocks on that DataNode","It marks the DataNode dead and re-replicates its blocks from the remaining replicas to other DataNodes"],"oc":[false,false,false,false],"a":3,"e":"Blocks that drop below their replication factor are queued for re-replication. No data is lost as long as at least one replica survives."},{"n":46,"s":5,"lv":"T","q":"With default settings, roughly how long after its last heartbeat is a DataNode declared dead?","code":"","lang":"","chk":1,"o":["About 10 minutes 30 seconds","3 seconds","30 seconds","6 hours"],"oc":[false,false,false,false],"a":0,"e":"The timeout is 2 x the recheck interval (5 minutes) + 10 x the heartbeat interval (3 seconds) = 630 seconds. The delay avoids needless re-replication after a brief network glitch."},{"n":47,"s":5,"lv":"T","q":"In HDFS High Availability, how does the Standby NameNode keep its namespace in step with the Active NameNode?","code":"","lang":"","chk":0,"o":["It reads checkpoints from the Secondary NameNode","It asks every DataNode for a copy of each file","It receives the edits from the ResourceManager","It reads the edit log written to a group of JournalNodes"],"oc":[false,false,false,false],"a":3,"e":"With the Quorum Journal Manager, the Active writes each edit to a majority of JournalNodes and the Standby replays them. DataNodes report blocks to both NameNodes, so the Standby can take over quickly."},{"n":48,"s":5,"lv":"M","q":"Which component triggers automatic failover between NameNodes in an HA cluster?","code":"","lang":"","chk":0,"o":["The Secondary NameNode","The balancer","The ZKFailoverController (ZKFC), working with ZooKeeper","The NodeManager"],"oc":[false,false,false,false],"a":2,"e":"A ZKFC runs beside each NameNode, monitors its health and uses a ZooKeeper lock to elect the active one. Fencing makes sure the old active cannot keep writing."},{"n":49,"s":5,"lv":"T","q":"Point out the wrong statement about HDFS High Availability.","code":"","lang":"","chk":0,"o":["A Secondary NameNode is still needed for checkpoints in an HA cluster","Only one NameNode is active at any time","Fencing stops a former active NameNode from causing a split-brain","JournalNodes are deployed in odd numbers, usually three or more"],"oc":[false,false,false,false],"a":0,"e":"In an HA cluster the Standby NameNode performs the checkpoints, so a Secondary NameNode is not used. An odd number of JournalNodes lets a majority be reached when one fails."},{"n":50,"s":5,"lv":"M","q":"How are the three replicas of a block written to HDFS?","code":"","lang":"","chk":0,"o":["The NameNode receives the data and copies it to the DataNodes","The client sends the data to all three DataNodes at the same time","The client sends data to the first DataNode, which forwards it to the second, which forwards it to the third","The DataNodes download the block from the NameNode after the write"],"oc":[false,false,false,false],"a":2,"e":"This is the write pipeline. Data flows along the chain of DataNodes in packets, and acknowledgements travel back in the reverse direction."},{"n":51,"s":6,"lv":"E","q":"In which Hadoop mode do all daemons run on a single machine, each in its own JVM?","code":"","lang":"","chk":0,"o":["Pseudo-distributed mode","Fully distributed mode","Standalone (local) mode","Safe mode"],"oc":[false,false,false,false],"a":0,"e":"Pseudo-distributed mode simulates a cluster on one machine using HDFS and YARN. Standalone mode runs no daemons at all, and safe mode is a NameNode state, not a run mode."},{"n":52,"s":6,"lv":"M","q":"Point out the correct statement about Hadoop's standalone (local) mode.","code":"","lang":"","chk":0,"o":["It is the recommended mode for production","It needs at least three machines","HDFS and YARN daemons run on one machine","No daemons run, the local file system is used and the job runs in a single JVM"],"oc":[false,false,false,false],"a":3,"e":"Standalone is the default after unpacking Hadoop and is used for quick testing and debugging of MapReduce programs."},{"n":53,"s":6,"lv":"E","q":"In which configuration file is fs.defaultFS (the address of the NameNode) set?","code":"","lang":"","chk":0,"o":["yarn-site.xml","hdfs-site.xml","core-site.xml","mapred-site.xml"],"oc":[false,false,false,false],"a":2,"e":"core-site.xml holds settings shared by all Hadoop components, such as fs.defaultFS = hdfs://namenode:9000."},{"n":54,"s":6,"lv":"E","q":"In which configuration file is the default replication factor, dfs.replication, set?","code":"","lang":"","chk":0,"o":["mapred-site.xml","hdfs-site.xml","core-site.xml","yarn-site.xml"],"oc":[false,false,false,false],"a":1,"e":"hdfs-site.xml holds HDFS settings such as dfs.replication, dfs.blocksize and the NameNode and DataNode storage directories."},{"n":55,"s":6,"lv":"M","q":"To make MapReduce jobs run on YARN, mapreduce.framework.name is set to \"yarn\" in ______.","code":"","lang":"","chk":0,"o":["core-site.xml","yarn-site.xml","hdfs-site.xml","mapred-site.xml"],"oc":[false,false,false,false],"a":3,"e":"mapred-site.xml configures MapReduce. yarn-site.xml configures YARN itself, for example yarn.nodemanager.aux-services = mapreduce_shuffle."},{"n":56,"s":6,"lv":"E","q":"Which command lists the Java processes, such as NameNode and DataNode, running on a machine?","code":"","lang":"","chk":0,"o":["jps","top -h","jstack","hdfs dfs -ls"],"oc":[false,false,false,false],"a":0,"e":"jps (Java Virtual Machine Process Status) lists running JVMs by class name. It is the usual quick check that the daemons started."},{"n":57,"s":6,"lv":"M","q":"Which command initialises a brand-new HDFS file system on the NameNode, erasing any existing metadata?","code":"","lang":"","chk":0,"o":["start-yarn.sh","hdfs dfsadmin -report","hdfs dfs -mkdir /","hdfs namenode -format"],"oc":[false,false,false,false],"a":3,"e":"Formatting creates an empty namespace and is done once when a cluster is set up. Running it on a live cluster loses track of all existing files."},{"n":58,"s":6,"lv":"E","q":"Hadoop's secure mode authenticates users and services using ______.","code":"","lang":"","chk":0,"o":["SNMP","Telnet","Kerberos","FTP"],"oc":[false,false,false,false],"a":2,"e":"Without Kerberos, Hadoop trusts the user name the client reports. Kerberos gives strong authentication; service-level authorisation and HDFS permissions then control access."},{"n":59,"s":6,"lv":"M","q":"Why is passwordless SSH set up from the master to the worker nodes when installing Hadoop?","code":"","lang":"","chk":0,"o":["Because YARN containers run inside SSH sessions","So scripts such as start-dfs.sh and start-yarn.sh can start daemons on the workers without asking for passwords","Because HDFS transfers blocks over SSH","So that clients can log in to the NameNode web UI"],"oc":[false,false,false,false],"a":1,"e":"The start and stop scripts log in to every host listed in the workers file. Block transfers and RPC use Hadoop's own protocols, not SSH."},{"n":60,"s":6,"lv":"T","q":"Which pair is commonly used to benchmark a Hadoop cluster?","code":"","lang":"","chk":0,"o":["PuTTY and SSH","jps and fsck","TestDFSIO and TeraSort","Beeline and Hue"],"oc":[false,false,false,false],"a":2,"e":"TestDFSIO measures HDFS read and write throughput. TeraGen, TeraSort and TeraValidate generate, sort and check a large dataset to test the whole MapReduce pipeline."},{"n":61,"s":7,"lv":"E","q":"Which YARN daemon runs on the master and allocates cluster resources to applications?","code":"","lang":"","chk":0,"o":["ApplicationMaster","DataNode","NodeManager","ResourceManager"],"oc":[false,false,false,false],"a":3,"e":"The ResourceManager has a scheduler (FIFO, Capacity or Fair) and an applications manager. It decides which application gets containers on which nodes."},{"n":62,"s":7,"lv":"E","q":"Which YARN daemon runs on every worker node and launches and monitors containers there?","code":"","lang":"","chk":0,"o":["NodeManager","JobTracker","NameNode","ResourceManager"],"oc":[false,false,false,false],"a":0,"e":"The NodeManager reports the node's resources to the ResourceManager and starts, monitors and kills containers on that node."},{"n":63,"s":7,"lv":"M","q":"For each YARN application, which component negotiates containers from the ResourceManager and works with NodeManagers to run its tasks?","code":"","lang":"","chk":0,"o":["The Secondary NameNode","The ApplicationMaster","The JournalNode","The NameNode"],"oc":[false,false,false,false],"a":1,"e":"Every application, for example a MapReduce job or a Spark application, gets its own ApplicationMaster running in a container. This keeps job-level logic out of the ResourceManager."},{"n":64,"s":7,"lv":"T","q":"In Hadoop 1, which daemon handled both cluster resource management and MapReduce job scheduling?","code":"","lang":"","chk":0,"o":["NodeManager","ApplicationMaster","ResourceManager","JobTracker"],"oc":[false,false,false,false],"a":3,"e":"In Hadoop 1, the JobTracker on the master and TaskTrackers on the workers did everything. That design limited scalability, and YARN split the work in Hadoop 2."},{"n":65,"s":7,"lv":"E","q":"Which command copies a file from the local file system into HDFS?","code":"","lang":"","chk":0,"o":["hdfs dfs -get sales.csv /data/","hdfs dfs -put sales.csv /data/","hdfs dfs -cat sales.csv /data/","hdfs dfs -getmerge sales.csv /data/"],"oc":[true,true,true,true],"a":1,"e":"-put (or -copyFromLocal) uploads local files to HDFS. -get (or -copyToLocal) downloads them, and -cat prints a file's contents."},{"n":66,"s":7,"lv":"M","q":"Which command concatenates all the files of an HDFS directory into one file on the local file system?","code":"","lang":"","chk":0,"o":["hdfs dfs -getmerge /out/wordcount result.txt","hdfs dfs -cat /out/wordcount > /out/result.txt","hdfs dfs -appendToFile /out/wordcount result.txt","hdfs dfs -merge /out/wordcount result.txt"],"oc":[true,true,true,true],"a":0,"e":"-getmerge is handy for collecting the part-r-* files of a job's output into one local file. There is no -merge command, and -appendToFile goes the other way, from local files into HDFS."},{"n":67,"s":7,"lv":"E","q":"Which command changes the replication factor of a file that already exists in HDFS?","code":"","lang":"","chk":0,"o":["hdfs dfs -du 2 /data/sales.csv","hdfs dfs -chmod 2 /data/sales.csv","hdfs dfs -replicate 2 /data/sales.csv","hdfs dfs -setrep 2 /data/sales.csv"],"oc":[true,true,true,true],"a":3,"e":"-setrep changes the replication of existing files (add -w to wait for it to finish). dfs.replication applies only to files created afterwards."},{"n":68,"s":7,"lv":"E","q":"What does  hdfs dfs -mkdir -p /data/2026/raw  do?","code":"","lang":"","chk":0,"o":["Prints the directories along the path","Creates the directory only if /data/2026 already exists","Creates /data/2026/raw, also creating any parent directories that are missing","Creates the directory with private permissions"],"oc":[false,false,false,false],"a":2,"e":"Like the Linux mkdir -p, the -p option creates the whole path and does not fail if the directory already exists."},{"n":69,"s":7,"lv":"T","q":"Which command checks the health of HDFS and reports missing, corrupt or under-replicated blocks?","code":"","lang":"","chk":0,"o":["hdfs dfs -du /","hdfs fsck /","hdfs dfs -count /","jps"],"oc":[true,true,true,true],"a":1,"e":"fsck asks the NameNode for block information; with -files -blocks -locations it also shows where each block lives. Unlike Linux fsck, it only reports and does not repair."},{"n":70,"s":7,"lv":"M","q":"Point out the correct statement about how Hadoop processes large datasets.","code":"","lang":"","chk":0,"o":["It requires the whole dataset to fit in memory","It can process only data stored in a relational database","It moves the computation to the nodes where the data blocks are stored","It moves all the data to one central server before processing"],"oc":[false,false,false,false],"a":2,"e":"This is data locality. Shipping a small program to the data is far cheaper than shipping terabytes across the network, so the scheduler prefers nodes that hold the input blocks."},{"n":71,"s":8,"lv":"M","q":"When a client opens an HDFS file to read it, what does the NameNode send back?","code":"","lang":"","chk":0,"o":["Only the file size","The addresses of the DataNodes holding each block, sorted by distance from the client","The contents of the first block","The contents of the whole file"],"oc":[false,false,false,false],"a":1,"e":"The client then reads each block directly from the closest DataNode. File data never passes through the NameNode, which keeps it from becoming a bottleneck."},{"n":72,"s":8,"lv":"M","q":"Point out the correct statement about writing a file to HDFS.","code":"","lang":"","chk":0,"o":["The Secondary NameNode writes the second replica","The client writes to local disk and the NameNode uploads the file later","All data first goes to the NameNode, which forwards it to the DataNodes","The client streams data in packets to a pipeline of DataNodes; the data does not pass through the NameNode"],"oc":[false,false,false,false],"a":3,"e":"The client only asks the NameNode which DataNodes should receive each block. The DataNodes then receive the packets in a chain and acknowledge them."},{"n":73,"s":8,"lv":"T","q":"A DataNode in the write pipeline fails while a block is being written. What happens?","code":"","lang":"","chk":0,"o":["The pipeline is rebuilt without the failed node, the write continues on the remaining DataNodes, and the NameNode later creates another replica","The block is written only to the NameNode","The whole write fails and the client must start again","The client waits until the failed DataNode restarts"],"oc":[false,false,false,false],"a":0,"e":"Unacknowledged packets are put back in the data queue so nothing is lost. The partial block on the failed node gets a new identity so it is deleted when that node returns, and the under-replicated block is re-replicated afterwards."},{"n":74,"s":8,"lv":"M","q":"While reading a block, a client finds that its checksum does not match. What does it do?","code":"","lang":"","chk":0,"o":["Stops reading and deletes the file","Reports the corrupt block to the NameNode and reads the block from another DataNode holding a replica","Repairs the block on that DataNode itself","Ignores the error and returns the data"],"oc":[false,false,false,false],"a":1,"e":"HDFS checksums every block. The NameNode then re-replicates a good copy and removes the corrupt replica."},{"n":75,"s":8,"lv":"E","q":"On which default port is the NameNode web UI served in Hadoop 3?","code":"","lang":"","chk":0,"o":["4040","8088","9870","9092"],"oc":[false,false,false,false],"a":2,"e":"Hadoop 3 uses 9870 (Hadoop 2 used 50070). 8088 is the YARN ResourceManager UI, 4040 is a running Spark application's UI and 9092 is a Kafka broker."},{"n":76,"s":8,"lv":"E","q":"Which Java class is the main entry point for working with HDFS from a program?","code":"","lang":"","chk":0,"o":["org.apache.hadoop.hbase.client.Table","java.sql.DriverManager","org.apache.spark.sql.SparkSession","org.apache.hadoop.fs.FileSystem"],"oc":[true,true,true,true],"a":3,"e":"FileSystem.get(conf) returns an object for the configured file system. Its methods include open(), create(), delete(), mkdirs() and listStatus()."},{"n":77,"s":8,"lv":"M","q":"In the HDFS Java API, what does fs.open(path) return?","code":"","lang":"","chk":0,"o":["FSDataInputStream","FSDataOutputStream","ResultSet","BufferedWriter"],"oc":[true,true,true,true],"a":0,"e":"FSDataInputStream supports seek() to jump to any position. fs.create() returns an FSDataOutputStream, which writes sequentially."},{"n":78,"s":8,"lv":"T","q":"What does the following Java code do?","code":"Configuration conf = new Configuration();\nFileSystem fs = FileSystem.get(URI.create(\"hdfs://nn:9000/\"), conf);\nFSDataOutputStream out = fs.create(new Path(\"/user/ravi/notes.txt\"));\nout.writeUTF(\"hello\");\nout.close();","lang":"java","chk":0,"o":["Appends \"hello\" to the end of an existing /user/ravi/notes.txt only","Creates /user/ravi/notes.txt in HDFS, replacing it if it exists, and writes \"hello\" into it","Reads /user/ravi/notes.txt and prints \"hello\"","Copies notes.txt from HDFS to the local file system"],"oc":[false,false,false,false],"a":1,"e":"create(Path) overwrites an existing file by default; there is an overload with overwrite = false. Appending needs fs.append()."},{"n":79,"s":8,"lv":"M","q":"While the NameNode is in safe mode, ______.","code":"","lang":"","chk":0,"o":["blocks are deleted to free space","no client can read or write","clients can read files, but no changes to the namespace are allowed","DataNodes stop sending heartbeats"],"oc":[false,false,false,false],"a":2,"e":"On startup the NameNode stays in safe mode until enough block reports arrive. An administrator can use hdfs dfsadmin -safemode get, enter or leave."},{"n":80,"s":8,"lv":"M","q":"Which command shows the configured capacity, the space used and the live and dead DataNodes of a cluster?","code":"","lang":"","chk":0,"o":["jps","hdfs dfs -tail /","hdfs dfs -ls /","hdfs dfsadmin -report"],"oc":[true,true,true,true],"a":3,"e":"dfsadmin is the administrator command. -report prints cluster totals followed by a section for each DataNode."},{"n":81,"s":9,"lv":"E","q":"In what order do the phases of a MapReduce job run?","code":"","lang":"","chk":0,"o":["Map, then shuffle and sort, then reduce","Reduce, then shuffle and sort, then map","Shuffle, then map, then reduce","Map and reduce at the same time, then sort"],"oc":[false,false,false,false],"a":0,"e":"Mappers turn input records into intermediate key-value pairs. The framework groups and sorts them by key (shuffle and sort), and reducers then process each key with all of its values."},{"n":82,"s":9,"lv":"M","q":"With the default TextInputFormat, what key and value does the mapper receive for each record?","code":"","lang":"","chk":0,"o":["A null key, and the line","The file name, and the whole file","The line number, and the first word of the line","The byte offset of the line in the file, and the line itself"],"oc":[false,false,false,false],"a":3,"e":"TextInputFormat's RecordReader gives a LongWritable byte offset as the key and a Text line as the value. Word count ignores the key."},{"n":83,"s":9,"lv":"M","q":"What is a combiner in MapReduce?","code":"","lang":"","chk":0,"o":["A local \"mini-reducer\" that aggregates map output on the map side to cut the data sent to reducers","The class that decides which reducer receives a key","A component that merges the output files of all reducers","A tool that combines small input files"],"oc":[false,false,false,false],"a":0,"e":"For word count, a combiner can turn many (word, 1) pairs into (word, n) before the shuffle. Hadoop may run it zero, one or many times, so it must not change the final result."},{"n":84,"s":9,"lv":"E","q":"Which component decides which reducer receives each intermediate key?","code":"","lang":"","chk":0,"o":["The RecordReader","The partitioner","The combiner","The OutputFormat"],"oc":[false,false,false,false],"a":1,"e":"The default HashPartitioner sends a key to reducer (hash(key) & Integer.MAX_VALUE) mod numReduceTasks, so every occurrence of a key reaches the same reducer."},{"n":85,"s":9,"lv":"T","q":"Point out the correct statement about map output.","code":"","lang":"","chk":0,"o":["It is written to the local disk of the node running the map task, not to HDFS","It is kept only in memory and never written to disk","It is sent straight to the NameNode","It is written to HDFS with replication factor 3"],"oc":[false,false,false,false],"a":0,"e":"Map output is temporary and is deleted once the job succeeds, so replicating it in HDFS would waste resources. It is buffered in memory, spilled to local disk and then fetched by reducers."},{"n":86,"s":9,"lv":"M","q":"What is the default number of reduce tasks for a MapReduce job?","code":"","lang":"","chk":0,"o":["1","0","The number of input splits","The number of DataNodes"],"oc":[false,false,false,false],"a":0,"e":"mapreduce.job.reduces defaults to 1, which gives a single sorted output file. It is usually set higher for large jobs. The number of map tasks follows the number of input splits."},{"n":87,"s":9,"lv":"T","q":"A MapReduce job is run with the number of reducers set to 0. What happens?","code":"","lang":"","chk":0,"o":["Mapper output is discarded","The job fails with an error","It becomes a map-only job: mapper output is written directly to HDFS and there is no shuffle or sort","Hadoop uses one reducer anyway"],"oc":[false,false,false,false],"a":2,"e":"Map-only jobs suit filtering or format conversion that needs no grouping. Their output files are named part-m-00000 and so on, instead of part-r-00000."},{"n":88,"s":9,"lv":"T","q":"A word-count job reads a file with three lines:  \"deer bear river\",  \"car car river\"  and  \"deer car bear\".  What does the reducer output, in order?","code":"","lang":"","chk":1,"o":["bear 2, car 3, deer 2, river 2","car 3, bear 2, deer 2, river 2","deer 2, bear 2, river 2, car 3","bear 1, car 1, deer 1, river 1"],"oc":[true,true,true,true],"a":0,"e":"The shuffle delivers keys to each reducer in sorted order, so a single reducer writes them alphabetically. \"car\" appears three times; each other word appears twice."},{"n":89,"s":9,"lv":"T","q":"What happens if the output directory given to a MapReduce job already exists in HDFS?","code":"","lang":"","chk":0,"o":["The new output is appended to the old files","The old output is overwritten","Hadoop creates a new directory with a different name","The job fails at submission with a FileAlreadyExistsException"],"oc":[false,false,false,false],"a":3,"e":"Hadoop refuses to overwrite earlier results by mistake. The directory has to be removed (hdfs dfs -rm -r) or a new path given."},{"n":90,"s":9,"lv":"M","q":"What is speculative execution in MapReduce?","code":"","lang":"","chk":0,"o":["Running reducers before all mappers have started","Running every task twice to check the results","Launching a duplicate copy of a slow task on another node and using whichever copy finishes first","Guessing the output of a task without running it"],"oc":[false,false,false,false],"a":2,"e":"One slow node (a straggler) can hold up a whole job. When the first copy of a task finishes, the other copy is killed."},{"n":91,"s":10,"lv":"E","q":"HBase is a ______.","code":"","lang":"","chk":0,"o":["message queue for streaming data","column-family-oriented NoSQL database that runs on top of HDFS","relational database that uses SQL tables","data warehouse queried with HiveQL"],"oc":[false,false,false,false],"a":1,"e":"HBase stores sparse tables whose columns are grouped into column families, and gives fast random reads and writes on top of HDFS."},{"n":92,"s":10,"lv":"E","q":"HBase is modelled on which Google system?","code":"","lang":"","chk":0,"o":["Bigtable","Borg","Dremel","Spanner"],"oc":[false,false,false,false],"a":0,"e":"Bigtable, described in Google's 2006 paper, is a sparse, distributed, sorted map. HBase is its open-source implementation on Hadoop."},{"n":93,"s":10,"lv":"E","q":"Which HBase component serves read and write requests for the regions of a table?","code":"","lang":"","chk":0,"o":["ZooKeeper","NameNode","HMaster","RegionServer"],"oc":[false,false,false,false],"a":3,"e":"Tables are split into regions, and each region is served by one RegionServer. The HMaster assigns regions and handles schema changes, but data requests do not pass through it."},{"n":94,"s":10,"lv":"M","q":"Which service does HBase use for coordination, such as tracking live servers and the location of the hbase:meta table?","code":"","lang":"","chk":0,"o":["Kafka","ZooKeeper","YARN","Hive metastore"],"oc":[false,false,false,false],"a":1,"e":"Clients ask ZooKeeper where hbase:meta is, then read meta to find the RegionServer for a row. ZooKeeper also detects failed servers and elects the active HMaster."},{"n":95,"s":10,"lv":"M","q":"Where is an HBase write recorded first?","code":"","lang":"","chk":0,"o":["Directly in an HFile on HDFS","In the hbase:meta table","In the Write-Ahead Log (WAL), and then in the in-memory MemStore","In ZooKeeper"],"oc":[false,false,false,false],"a":2,"e":"The WAL lets edits be replayed if a RegionServer crashes. When the MemStore fills up, it is flushed to a new HFile on HDFS."},{"n":96,"s":10,"lv":"M","q":"How are the rows of an HBase table ordered?","code":"","lang":"","chk":0,"o":["In the order they were inserted","By the timestamp of the latest cell","In no particular order","Sorted by row key, in byte (lexicographic) order"],"oc":[false,false,false,false],"a":3,"e":"Sorted row keys make range scans efficient. Row-key design is therefore the most important part of HBase schema design; for example \"row10\" sorts before \"row2\"."},{"n":97,"s":10,"lv":"E","q":"Which HBase shell command returns all the cells of a single row?","code":"","lang":"","chk":0,"o":["get 'emp', 'r1'","scan 'emp'","describe 'emp'","put 'emp', 'r1'"],"oc":[true,true,true,true],"a":0,"e":"get fetches one row by its key. scan reads many rows (optionally a range), put writes a cell, and describe shows the table's column families."},{"n":98,"s":10,"lv":"E","q":"What must be done to an HBase table before it can be dropped in the shell?","code":"","lang":"","chk":0,"o":["It must be truncated","It must be disabled","Its column families must be deleted","It must be scanned"],"oc":[false,false,false,false],"a":1,"e":"The sequence is disable 'emp' and then drop 'emp'. Disabling takes the table's regions offline so they can be removed safely."},{"n":99,"s":10,"lv":"T","q":"Point out the wrong statement comparing HBase with an RDBMS.","code":"","lang":"","chk":0,"o":["HBase scales horizontally by splitting tables into regions","HBase has no native support for SQL joins","HBase supports multi-row ACID transactions just like an RDBMS","Only column families are fixed when a table is created; columns can be added freely"],"oc":[false,false,false,false],"a":2,"e":"HBase guarantees atomicity only within a single row. Tools such as Apache Phoenix add a SQL layer, but joins and multi-row transactions are not native features."},{"n":100,"s":10,"lv":"T","q":"Which combination uniquely identifies a cell value in HBase?","code":"","lang":"","chk":0,"o":["Row key only","Row key, column family, column qualifier and timestamp","Table name and column family only","Region name and row key"],"oc":[false,false,false,false],"a":1,"e":"A cell's address is (row, family:qualifier, version). Several timestamped versions of the same column can be kept, and get returns the newest one by default."},{"n":101,"s":11,"lv":"E","q":"Hive was originally developed at ______.","code":"","lang":"","chk":0,"o":["Facebook","LinkedIn","Google","Yahoo"],"oc":[false,false,false,false],"a":0,"e":"Facebook built Hive so analysts could query data in Hadoop with SQL instead of writing Java MapReduce code. It became an Apache project in 2008."},{"n":102,"s":11,"lv":"E","q":"What is Hive?","code":"","lang":"","chk":0,"o":["A tool for moving data between Hadoop and relational databases","A NoSQL database for real-time random reads and writes","A distributed message broker","A data warehouse system on Hadoop that lets users query data with a SQL-like language called HiveQL"],"oc":[false,false,false,false],"a":3,"e":"Hive turns HiveQL queries into MapReduce, Tez or Spark jobs. Random reads and writes describe HBase, data transfer describes Sqoop, and the message broker is Kafka."},{"n":103,"s":11,"lv":"E","q":"Where does Hive keep table schemas, column types and partition information?","code":"","lang":"","chk":0,"o":["In ZooKeeper","In the metastore, which is backed by a relational database","In HBase","In the header of each data file"],"oc":[false,false,false,false],"a":1,"e":"Data files in HDFS hold only the data. The metastore records which directory belongs to which table and how to read it."},{"n":104,"s":11,"lv":"M","q":"Why is MySQL or PostgreSQL normally used for the Hive metastore instead of the default embedded Derby database?","code":"","lang":"","chk":0,"o":["Derby is not open source","Derby cannot store table names","Embedded Derby allows only one active connection, so only one session can use Hive at a time","Hive refuses to start with Derby"],"oc":[false,false,false,false],"a":2,"e":"The embedded Derby metastore is fine for testing on one machine. Shared clusters use an external database through a metastore service."},{"n":105,"s":11,"lv":"E","q":"Which Hive component lets remote clients submit queries over JDBC or ODBC?","code":"","lang":"","chk":0,"o":["The metastore database","The NameNode","The Hive CLI","HiveServer2"],"oc":[false,false,false,false],"a":3,"e":"HiveServer2 accepts concurrent, authenticated connections from Beeline, BI tools and applications."},{"n":106,"s":11,"lv":"M","q":"Point out the correct statement comparing Hive with a traditional RDBMS.","code":"","lang":"","chk":0,"o":["Hive is designed for low-latency OLTP workloads","Hive stores data only in its own proprietary format","Hive applies a table's schema when the data is read (schema-on-read)","Hive checks primary-key constraints when data is loaded"],"oc":[false,false,false,false],"a":2,"e":"LOAD DATA just moves files; a mismatch shows up as NULLs when the data is queried. Hive is for batch analytics, and it can read plain text, ORC, Parquet, Avro and other formats."},{"n":107,"s":11,"lv":"E","q":"What is the default warehouse directory for managed Hive tables in HDFS?","code":"","lang":"","chk":0,"o":["/user/hive/warehouse","/hive/data","/tmp/hive","/var/lib/hive"],"oc":[true,true,true,true],"a":0,"e":"hive.metastore.warehouse.dir defaults to /user/hive/warehouse. Each database and table gets its own subdirectory under it."},{"n":108,"s":11,"lv":"E","q":"Which of these is NOT an execution engine that Hive can use?","code":"","lang":"","chk":0,"o":["Tez","Spark","ZooKeeper","MapReduce"],"oc":[false,false,false,false],"a":2,"e":"hive.execution.engine can be mr, tez or spark. ZooKeeper is a coordination service."},{"n":109,"s":11,"lv":"M","q":"Which Hive component parses a query, checks it against the metastore and produces the execution plan?","code":"","lang":"","chk":0,"o":["Beeline","The compiler","The executor","The SerDe"],"oc":[false,false,false,false],"a":1,"e":"The driver receives the query, the compiler builds a plan, the optimizer improves it and the execution engine runs it. A SerDe only serialises and deserialises rows."},{"n":110,"s":11,"lv":"E","q":"Which command-line client is recommended for connecting to HiveServer2?","code":"","lang":"","chk":0,"o":["Beeline","Grunt","PuTTY","Hue"],"oc":[false,false,false,false],"a":0,"e":"Beeline is a JDBC client, for example beeline -u jdbc:hive2://host:10000. Hue is a web interface, and Grunt is Pig's shell."},{"n":111,"s":12,"lv":"E","q":"Which of these is a complex (collection) data type in Hive?","code":"","lang":"","chk":0,"o":["TIMESTAMP","VARCHAR","ARRAY","DECIMAL"],"oc":[false,false,false,false],"a":2,"e":"Hive's complex types are ARRAY, MAP, STRUCT and UNIONTYPE. The other three are primitive types."},{"n":112,"s":12,"lv":"E","q":"What happens when an EXTERNAL table is dropped in Hive?","code":"","lang":"","chk":0,"o":["The metadata and the data files are both deleted","Only the table's metadata is removed; the data files stay in place","Only the data files are deleted","Nothing happens until the database is dropped"],"oc":[false,false,false,false],"a":1,"e":"Hive does not own an external table's files, so other tools can keep using them. Dropping a managed (internal) table deletes both metadata and data."},{"n":113,"s":12,"lv":"T","q":"What does  LOAD DATA INPATH '/staging/sales.csv' INTO TABLE sales  do, given that the path is in HDFS (no LOCAL keyword)?","code":"","lang":"","chk":0,"o":["Parses the file and inserts each row with a validity check","Copies the file and leaves the original in /staging","Moves the file from /staging into the table's directory","Fails, because LOAD DATA works only with local files"],"oc":[false,false,false,false],"a":2,"e":"Without LOCAL, Hive moves the HDFS file. With LOCAL, it copies the file from the local file system. In both cases the data is not checked against the schema."},{"n":114,"s":12,"lv":"M","q":"How is a partitioned Hive table stored in HDFS?","code":"","lang":"","chk":0,"o":["All partitions share one file with an index","Partitions exist only in the metastore, not in HDFS","Each partition becomes a separate Hive database","Each partition value gets its own subdirectory, such as .../sales/country=IN/"],"oc":[false,false,false,false],"a":3,"e":"When a query filters on the partition column, Hive reads only the matching directories. This is partition pruning."},{"n":115,"s":12,"lv":"E","q":"What is the default storage format of a Hive table?","code":"","lang":"","chk":0,"o":["TEXTFILE","AVRO","PARQUET","ORC"],"oc":[false,false,false,false],"a":0,"e":"Unless STORED AS says otherwise (or hive.default.fileformat is changed), tables are plain text files."},{"n":116,"s":12,"lv":"M","q":"Which storage format is columnar, was created for Hive and has built-in lightweight indexes and compression?","code":"","lang":"","chk":0,"o":["TEXTFILE","CSV","SEQUENCEFILE","ORC"],"oc":[false,false,false,false],"a":3,"e":"ORC (Optimized Row Columnar) stores min and max statistics per stripe so readers can skip data. It is also required for Hive ACID tables. SequenceFile is a row-oriented binary format."},{"n":117,"s":12,"lv":"T","q":"What is the default field delimiter for a Hive text table created without a ROW FORMAT clause?","code":"","lang":"","chk":0,"o":["\\001 (Ctrl-A)","Comma","Pipe (|)","Tab"],"oc":[false,false,false,false],"a":0,"e":"The defaults are \\001 between fields, \\002 between collection items and \\003 between map keys and values. CSV data needs ROW FORMAT DELIMITED FIELDS TERMINATED BY ','."},{"n":118,"s":12,"lv":"M","q":"Which statement adds a new column to an existing Hive table?","code":"","lang":"","chk":0,"o":["ALTER TABLE emp INSERT COLUMN email STRING;","ALTER emp NEW COLUMN (email STRI
