lse,false],"a":0,"e":"Source connectors bring data into Kafka and sink connectors deliver it out. They run in Connect worker processes, not inside the brokers."},{"n":279,"s":28,"lv":"M","q":"What is the difference between Kafka Connect's standalone and distributed modes?","code":"","lang":"","chk":0,"o":["There is no difference","Standalone needs a cluster of workers","Standalone is one worker configured with local files; distributed runs several workers that share the connectors' tasks and are managed through a REST API","Distributed mode cannot recover from a worker failure"],"oc":[false,false,false,false],"a":2,"e":"Distributed mode rebalances tasks when workers join or fail and stores its configuration and offsets in Kafka topics. Its REST API listens on port 8083 by default."},{"n":280,"s":28,"lv":"M","q":"In Kafka Connect, which component converts between the bytes stored in Kafka and Connect's internal data format, for example JSON or Avro?","code":"","lang":"","chk":0,"o":["Converter","Broker","Partitioner","Consumer group"],"oc":[false,false,false,false],"a":0,"e":"key.converter and value.converter choose classes such as JsonConverter or AvroConverter. Single message transforms (SMTs) can also make small changes to each record."},{"n":281,"s":29,"lv":"E","q":"What does  spark.sql(\"SELECT dept, count(*) FROM emp GROUP BY dept\")  return?","code":"","lang":"","chk":0,"o":["An RDD of strings","A pandas DataFrame","A DataFrame","A Python list"],"oc":[false,false,false,false],"a":2,"e":"SQL and the DataFrame API compile to the same optimised plans and can be mixed freely. Call show() or collect() to see the rows."},{"n":282,"s":29,"lv":"T","q":"Point out the correct statement about temporary views in Spark SQL.","code":"","lang":"","chk":0,"o":["Temporary views are stored permanently in the Hive metastore","A global temporary view is visible to other Spark applications","Temporary views copy the DataFrame's data to disk","createOrReplaceTempView is visible only in the current SparkSession; createGlobalTempView is visible to all sessions in the application through the global_temp database"],"oc":[false,false,false,false],"a":3,"e":"Both kinds of view disappear when their session or application ends. A global view is queried as global_temp.view_name."},{"n":283,"s":29,"lv":"T","q":"The emp view has the rows (IT, Asha, 70), (IT, Ravi, 90), (IT, Meena, 90) and (HR, John, 60). In this query, what are r and d for Asha?","code":"SELECT name,\n       RANK()       OVER (PARTITION BY dept ORDER BY sal DESC) AS r,\n       DENSE_RANK() OVER (PARTITION BY dept ORDER BY sal DESC) AS d\nFROM emp;","lang":"sql","chk":1,"o":["r = 3, d = 3","r = 3, d = 2","r = 2, d = 3","r = 2, d = 2"],"oc":[true,true,true,true],"a":1,"e":"Ravi and Meena tie at rank 1. RANK skips the next number, so Asha is 3; DENSE_RANK leaves no gap, so Asha is 2."},{"n":284,"s":29,"lv":"M","q":"The sales view has the rows (1, 100), (2, 150) and (3, 120) for (month, amt). What values does the diff column hold, in month order?","code":"SELECT month, amt - LAG(amt) OVER (ORDER BY month) AS diff\nFROM sales;","lang":"sql","chk":1,"o":["NULL, 50, -30","100, 50, -30","0, 50, -30","50, -30, NULL"],"oc":[true,true,true,true],"a":0,"e":"LAG returns the previous row's value. The first month has no previous row, so LAG is NULL and the subtraction gives NULL. LEAD looks at the next row instead."},{"n":285,"s":29,"lv":"T","q":"The view t has the rows (day, amt) = (1, 10), (2, 20), (2, 30) and (3, 40). What running values do the two rows with day = 2 get?","code":"SELECT day, amt, SUM(amt) OVER (ORDER BY day) AS running\nFROM t;","lang":"sql","chk":1,"o":["20 and 30","60 and 60","30 and 60","50 and 50"],"oc":[true,true,true,true],"a":1,"e":"With ORDER BY and no frame clause, the frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which includes all rows tied with the current one. Use ROWS BETWEEN ... to get a strict row-by-row running total."},{"n":286,"s":29,"lv":"M","q":"Which window frame gives a 3-row moving average, the current row and the two before it?","code":"","lang":"","chk":0,"o":["AVG(amt) OVER (ORDER BY day ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING)","AVG(amt) OVER (PARTITION BY 3)","AVG(amt) OVER (ORDER BY day ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)","AVG(amt) OVER (ORDER BY day RANGE 3)"],"oc":[true,true,true,true],"a":2,"e":"ROWS frames count physical rows. In the DataFrame API the same frame is Window.orderBy(\"day\").rowsBetween(-2, 0)."},{"n":287,"s":29,"lv":"T","q":"NTILE(4) OVER (ORDER BY score) is applied to 10 rows. How many rows go into each of the four groups, in order?","code":"","lang":"","chk":1,"o":["3, 2, 3, 2","3, 3, 2, 2","4, 2, 2, 2","2, 2, 3, 3"],"oc":[true,true,true,true],"a":1,"e":"10 rows / 4 groups = 2 with remainder 2, so the first two groups get one extra row each."},{"n":288,"s":29,"lv":"T","q":"Why does  SELECT * FROM emp WHERE ROW_NUMBER() OVER (ORDER BY sal DESC) = 1  fail?","code":"","lang":"","chk":1,"o":["ROW_NUMBER needs a PARTITION BY clause","The query needs GROUP BY sal","Window functions are evaluated after WHERE, so they must be computed in a subquery or CTE and filtered outside it","Spark SQL does not support ROW_NUMBER"],"oc":[false,false,false,false],"a":2,"e":"Write SELECT * FROM (SELECT *, ROW_NUMBER() OVER (...) AS rn FROM emp) WHERE rn = 1. The same applies to every window function."},{"n":289,"s":29,"lv":"E","q":"What does df.explain() show?","code":"","lang":"","chk":0,"o":["The schema only","The rows of the DataFrame","The Spark UI address","The physical plan Spark will use to execute the query"],"oc":[false,false,false,false],"a":3,"e":"explain(True) or explain(\"extended\") also shows the parsed, analysed and optimised logical plans produced by Catalyst. It is useful for spotting shuffles and broadcast joins."},{"n":290,"s":29,"lv":"M","q":"To keep exactly one highest-paid employee per department, even when two share the top salary, which function should be used?","code":"","lang":"","chk":0,"o":["RANK()","ROW_NUMBER()","DENSE_RANK()","NTILE(1)"],"oc":[false,false,false,false],"a":1,"e":"ROW_NUMBER always gives distinct numbers 1, 2, 3 within a partition. RANK and DENSE_RANK both give tied rows the value 1, so filtering on 1 would return both."},{"n":291,"s":30,"lv":"E","q":"Which is the primary machine learning API in Spark today?","code":"","lang":"","chk":0,"o":["spark.ml, which is based on DataFrames","spark.mllib, which is based on RDDs","Spark Streaming","GraphX"],"oc":[false,false,false,false],"a":0,"e":"The RDD-based spark.mllib package is in maintenance mode. New features go into spark.ml, which works with DataFrames and Pipelines."},{"n":292,"s":30,"lv":"M","q":"Point out the correct statement about Transformers and Estimators in Spark ML.","code":"","lang":"","chk":0,"o":["Both only work on RDDs","A Model cannot be used to transform data","A Transformer has transform(), which turns one DataFrame into another; an Estimator has fit(), which learns from data and returns a Model","An Estimator has transform(), and a Transformer has fit()"],"oc":[false,false,false,false],"a":2,"e":"LogisticRegression is an Estimator; calling fit() returns a LogisticRegressionModel, which is a Transformer that adds prediction columns."},{"n":293,"s":30,"lv":"E","q":"What does VectorAssembler do?","code":"","lang":"","chk":0,"o":["Converts strings to numbers","Splits a vector into separate columns","Scales features to a standard range","Combines several columns into a single vector column, usually called \"features\""],"oc":[false,false,false,false],"a":3,"e":"Spark ML algorithms expect all the inputs in one vector column. StringIndexer converts strings, and StandardScaler or MinMaxScaler handle scaling."},{"n":294,"s":30,"lv":"M","q":"What does StringIndexer do?","code":"","lang":"","chk":0,"o":["It maps each category string to a numeric index; by default the most frequent value gets 0.0","It sorts the strings alphabetically","It removes duplicate strings","It splits sentences into words"],"oc":[false,false,false,false],"a":0,"e":"Algorithms need numbers, so category labels are indexed first. OneHotEncoder can then turn the index into a vector, and Tokenizer is the transformer that splits text into words."},{"n":295,"s":30,"lv":"T","q":"The column cat holds the values a, b, a, c, a, b. With default settings, which index does this code give to \"b\"?","code":"from pyspark.ml.feature import StringIndexer\nmodel = StringIndexer(inputCol=\"cat\", outputCol=\"idx\").fit(df)\nout = model.transform(df)","lang":"py","chk":1,"o":["1.0","0.0","2.0","3.0"],"oc":[false,false,false,false],"a":0,"e":"The default ordering is frequencyDesc: a appears 3 times (0.0), b twice (1.0) and c once (2.0)."},{"n":296,"s":30,"lv":"M","q":"What does Pipeline.fit() return?","code":"","lang":"","chk":0,"o":["The training DataFrame with no changes","An Estimator that still needs to be fitted","A PipelineModel that applies all the fitted stages in order","A list of predictions"],"oc":[false,false,false,false],"a":2,"e":"A pipeline chains stages such as indexers, an assembler and a model. Fitting it once learns every stage, and the PipelineModel can be saved and reused on new data."},{"n":297,"s":30,"lv":"M","q":"Which column names do most Spark ML estimators use by default?","code":"","lang":"","chk":1,"o":["\"input\" and \"output\"","\"data\" and \"result\"","\"x\" and \"y\"","\"features\" for inputs and \"label\" for the target, producing a \"prediction\" column"],"oc":[false,false,false,false],"a":3,"e":"They can be changed with setFeaturesCol(), setLabelCol() and setPredictionCol(). Classifiers also add rawPrediction and probability columns."},{"n":298,"s":30,"lv":"E","q":"Which Spark ML algorithm is used for clustering?","code":"","lang":"","chk":0,"o":["LinearRegression","LogisticRegression","KMeans","RandomForestClassifier"],"oc":[false,false,false,false],"a":2,"e":"Clustering groups unlabelled rows by similarity. The other three are supervised algorithms that need a label column."},{"n":299,"s":30,"lv":"M","q":"What is the ALS algorithm in Spark MLlib used for?","code":"","lang":"","chk":0,"o":["Time-series forecasting only","Collaborative filtering, such as recommending products from user ratings","Text tokenisation","Image classification"],"oc":[false,false,false,false],"a":1,"e":"Alternating Least Squares factorises the sparse user-item rating matrix into user and item factors and uses them to predict missing ratings."},{"n":300,"s":30,"lv":"T","q":"A CrossValidator uses a ParamGridBuilder with 3 values of regParam and 2 values of maxIter, and numFolds = 5. How many models does it fit while choosing the best parameters?","code":"","lang":"","chk":1,"o":["30","6","11","5"],"oc":[false,false,false,false],"a":0,"e":"There are 3 x 2 = 6 parameter combinations, each fitted on 5 folds, giving 30 fits. The best combination is then refitted once on the full training data."},{"n":301,"s":31,"lv":"E","q":"Predicting the selling price of a house from its features is a ______ problem.","code":"","lang":"","chk":0,"o":["association rule","regression","classification","clustering"],"oc":[false,false,false,false],"a":1,"e":"Regression predicts a continuous number. Predicting a category, such as spam or not spam, is classification."},{"n":302,"s":31,"lv":"E","q":"Deciding whether a transaction is fraudulent (yes or no) is a ______ problem.","code":"","lang":"","chk":0,"o":["binary classification","clustering","regression","dimensionality reduction"],"oc":[false,false,false,false],"a":0,"e":"The model chooses between two classes. LogisticRegression, DecisionTreeClassifier and RandomForestClassifier are common choices in Spark ML."},{"n":303,"s":31,"lv":"M","q":"What does  train, test = df.randomSplit([0.8, 0.2], seed=42)  do?","code":"","lang":"","chk":0,"o":["Creates 42 random samples","Splits the columns into two groups","Takes the first 80% of rows for training","Randomly splits the rows into about 80% for training and 20% for testing, repeatably because of the seed"],"oc":[false,false,false,false],"a":3,"e":"The model is trained on one part and evaluated on rows it has never seen. The proportions are approximate because each row is assigned at random."},{"n":304,"s":31,"lv":"E","q":"A model scores 99% accuracy on its training data but only 70% on test data. What is this called?","code":"","lang":"","chk":0,"o":["Underfitting","Normalisation","Overfitting","Data leakage"],"oc":[false,false,false,false],"a":2,"e":"The model has memorised the training data, noise included, instead of learning general patterns. Regularisation, simpler models and more data help."},{"n":305,"s":31,"lv":"M","q":"What is the default metric of BinaryClassificationEvaluator in Spark ML?","code":"","lang":"","chk":1,"o":["rmse","f1","accuracy","areaUnderROC"],"oc":[false,false,false,false],"a":3,"e":"The other option is areaUnderPR. MulticlassClassificationEvaluator defaults to f1, and RegressionEvaluator defaults to rmse."},{"n":306,"s":31,"lv":"M","q":"What is the default metric of RegressionEvaluator in Spark ML?","code":"","lang":"","chk":1,"o":["areaUnderROC","accuracy","rmse","silhouette"],"oc":[false,false,false,false],"a":2,"e":"Root mean squared error is in the same units as the label. mse, mae and r2 can be chosen with setMetricName()."},{"n":307,"s":31,"lv":"T","q":"A classifier's confusion matrix shows TP = 40, FP = 10, FN = 20 and TN = 30. What are its precision and recall?","code":"","lang":"","chk":1,"o":["Precision 0.80, recall 0.67","Precision 0.80, recall 0.40","Precision 0.67, recall 0.80","Precision 0.70, recall 0.70"],"oc":[false,false,false,false],"a":0,"e":"Precision = TP / (TP + FP) = 40 / 50, the share of predicted positives that are correct. Recall = TP / (TP + FN) = 40 / 60, the share of actual positives found."},{"n":308,"s":31,"lv":"M","q":"A MultilayerPerceptronClassifier is created with layers=[4, 5, 3]. What does this mean?","code":"","lang":"","chk":0,"o":["4 hidden layers with 5 neurons each","The model trains for 4, 5 and 3 iterations","3 input features and 4 output classes","4 input features, one hidden layer of 5 neurons, and 3 output classes"],"oc":[false,false,false,false],"a":3,"e":"The first number must match the size of the features vector and the last must match the number of classes. This feedforward neural network is Spark ML's built-in deep learning model."},{"n":309,"s":31,"lv":"M","q":"For which kind of algorithm does feature scaling with StandardScaler usually matter most?","code":"","lang":"","chk":0,"o":["Counting distinct values","Distance-based and gradient-based algorithms, such as k-means and logistic regression","Decision trees and random forests","String indexing"],"oc":[false,false,false,false],"a":1,"e":"Features on large scales dominate distances and gradients. Tree-based models split on one feature at a time and are largely unaffected by scaling."},{"n":310,"s":31,"lv":"T","q":"Point out the correct practice when building a predictive model in Spark.","code":"","lang":"","chk":0,"o":["Split the data first, fit the preprocessing pipeline on the training set only, then apply it to the test set","Fit the scaler and indexers on the full data, then split it","Choose hyperparameters by looking at the test set results repeatedly","Evaluate the model on its training data"],"oc":[false,false,false,false],"a":0,"e":"Fitting preprocessing on all the data lets test-set information leak into training, which makes results look better than they will be in real use. Use cross-validation on the training data to tune."},{"n":311,"s":32,"lv":"E","q":"Databricks was founded by ______.","code":"","lang":"","chk":0,"o":["the creators of Kafka","Amazon Web Services","the original creators of Apache Spark","the creators of Hadoop"],"oc":[false,false,false,false],"a":2,"e":"Databricks was founded in 2013 by the team behind Spark at UC Berkeley, and offers a managed Spark platform with notebooks, clusters and Delta Lake."},{"n":312,"s":32,"lv":"E","q":"Which AWS service provides managed Hadoop and Spark clusters?","code":"","lang":"","chk":0,"o":["Amazon Route 53","Amazon EMR","Amazon RDS","Amazon Lambda"],"oc":[false,false,false,false],"a":1,"e":"EMR (Elastic MapReduce) sets up Hadoop, Spark, Hive and other tools on EC2, and also offers EMR Serverless and EMR on EKS."},{"n":313,"s":32,"lv":"E","q":"Which Google Cloud service provides managed Spark and Hadoop clusters?","code":"","lang":"","chk":0,"o":["Dataproc","Firestore","Cloud Functions","BigQuery"],"oc":[false,false,false,false],"a":0,"e":"Dataproc starts Spark and Hadoop clusters in about a minute and can delete them after a job. Azure's equivalents include HDInsight and Synapse Spark pools."},{"n":314,"s":32,"lv":"T","q":"On Amazon EMR, which node type is best suited to Spot Instances because it stores no HDFS data?","code":"","lang":"","chk":0,"o":["Primary (master) node","Gateway node","Core node","Task node"],"oc":[false,false,false,false],"a":3,"e":"Core nodes run HDFS DataNodes, so losing one can lose data. Task nodes only run computation, so losing a Spot task node just means its tasks are rerun."},{"n":315,"s":32,"lv":"M","q":"What does cluster autoscaling do on a cloud Spark platform?","code":"","lang":"","chk":0,"o":["Copies data between regions","Makes every job run in the same time","Adds or removes worker nodes automatically as the workload changes","Upgrades the Spark version automatically"],"oc":[false,false,false,false],"a":2,"e":"Autoscaling adds nodes when tasks are waiting and removes idle nodes, so you pay for capacity only while it is needed."},{"n":316,"s":32,"lv":"M","q":"What does setting spark.dynamicAllocation.enabled=true do?","code":"","lang":"","chk":0,"o":["Lets the driver move between machines","Turns on caching for every DataFrame","Gives every job a fixed number of executors","Lets an application request more executors when it has a backlog of tasks and release idle ones"],"oc":[false,false,false,false],"a":3,"e":"Dynamic allocation needs the external shuffle service or shuffle tracking, so that shuffle files survive when executors are removed."},{"n":317,"s":32,"lv":"M","q":"Interactive clusters are often left running overnight with nobody using them. Which setting most directly cuts that cost?","code":"","lang":"","chk":0,"o":["Increasing the number of executor cores","Auto-termination after a period of inactivity","Turning on caching","Using a larger driver node"],"oc":[false,false,false,false],"a":1,"e":"Cloud clusters are billed while they run, whether busy or idle. Databricks, EMR and Dataproc can all stop a cluster after a set idle time."},{"n":318,"s":32,"lv":"M","q":"Why is data usually kept in object storage, such as S3, ADLS or GCS, when Spark runs in the cloud?","code":"","lang":"","chk":0,"o":["Object storage is faster than memory","Spark cannot read HDFS in the cloud","Storage is separated from compute, so clusters can be created for a job and deleted afterwards without losing data","Object storage runs the Spark executors"],"oc":[false,false,false,false],"a":2,"e":"HDFS on cluster disks disappears with the cluster. Durable object storage lets many short-lived or differently sized clusters share the same data."},{"n":319,"s":32,"lv":"M","q":"On Databricks, how does a job cluster differ from an all-purpose cluster?","code":"","lang":"","chk":0,"o":["A job cluster cannot run Spark","A job cluster is created for one job run and terminated when it ends, and is billed at a lower rate","There is no difference","A job cluster is shared by many users for interactive notebooks"],"oc":[false,false,false,false],"a":1,"e":"All-purpose clusters suit interactive work in notebooks. Scheduled production jobs are cheaper on job clusters, which exist only while the job runs."},{"n":320,"s":32,"lv":"T","q":"Point out the wrong statement about Spot (preemptible) instances.","code":"","lang":"","chk":0,"o":["The cloud provider can reclaim them at short notice","They cost much less than on-demand instances","Spark can recompute lost partitions when Spot executors disappear","They are a safe choice for the driver or primary node of a long-running job"],"oc":[false,false,false,false],"a":3,"e":"If the driver or primary node is reclaimed, the whole application or cluster fails. Spot capacity is best used for executors or task nodes, while the driver stays on on-demand machines."},{"n":321,"s":33,"lv":"E","q":"Which parameter of Airflow's BashOperator holds the shell command to run?","code":"","lang":"","chk":0,"o":["python_callable","bash_command","cmd_args","sql"],"oc":[true,true,true,true],"a":1,"e":"For example, BashOperator(task_id=\"ingest\", bash_command=\"hdfs dfs -put -f /in/sales.csv /raw/\"). The task fails if the command exits with a non-zero code."},{"n":322,"s":33,"lv":"E","q":"Which parameter of Airflow's PythonOperator names the function to run?","code":"","lang":"","chk":0,"o":["script","bash_command","function_name","python_callable"],"oc":[true,true,true,true],"a":3,"e":"You pass the function object itself, for example PythonOperator(task_id=\"clean\", python_callable=clean_data). Arguments go in op_args or op_kwargs."},{"n":323,"s":33,"lv":"M","q":"In the ingestion task  bash_command=\"hdfs dfs -put -f /in/sales.csv /raw/sales/\",  why is -f used?","code":"","lang":"","chk":0,"o":["It overwrites the file if it already exists, so rerunning the task does not fail","It deletes the local file after copying","It forces the file to be compressed","It makes the copy faster"],"oc":[false,false,false,false],"a":0,"e":"Without -f, -put fails when the target file exists, which breaks retries and backfills. Overwriting makes the step idempotent."},{"n":324,"s":33,"lv":"M","q":"Which of these is a standard way for an Airflow DAG to start a Spark job?","code":"","lang":"","chk":0,"o":["A Hive view","A Kafka console producer","SparkSubmitOperator, or a BashOperator that runs spark-submit","An HBase shell command"],"oc":[false,false,false,false],"a":2,"e":"SparkSubmitOperator comes from the Apache Spark provider package and uses an Airflow Connection for the Spark master. Calling spark-submit from a BashOperator also works."},{"n":325,"s":33,"lv":"M","q":"A pipeline must wait for a file, ingest it into HDFS, transform it with Spark and then validate the result. Which dependency line is correct?","code":"","lang":"","chk":0,"o":["validate >> spark_transform >> ingest >> wait_for_file","wait_for_file >> ingest >> spark_transform >> validate","[wait_for_file, ingest, spark_transform, validate]","ingest >> wait_for_file >> validate >> spark_transform"],"oc":[true,true,true,true],"a":1,"e":"Each step needs the previous one's output, so the tasks form a chain. A bare list sets no dependencies at all."},{"n":326,"s":33,"lv":"T","q":"A PythonOperator's function ends with  return 1250.  What happens to this value?","code":"","lang":"","chk":0,"o":["It is pushed to XCom with the key return_value, so later tasks can pull it","It is written to HDFS","It is discarded","It becomes the exit code of the worker"],"oc":[false,false,false,false],"a":0,"e":"Downstream tasks can read it with ti.xcom_pull(task_ids=\"count\"). This suits small values such as row counts or file paths."},{"n":327,"s":33,"lv":"M","q":"What does {{ ds }} become in  bash_command=\"spark-submit etl.py --date {{ ds }}\" ?","code":"","lang":"","chk":0,"o":["The DAG's start_date, always","The name of the DAG","The current time on the worker","The run's logical date in YYYY-MM-DD format"],"oc":[false,false,false,false],"a":3,"e":"Airflow renders Jinja templates before the task runs. Passing the logical date lets the Spark job process exactly one day's partition, which also makes backfills work."},{"n":328,"s":33,"lv":"M","q":"Point out the correct statement about using Airflow with a streaming Kafka job.","code":"","lang":"","chk":0,"o":["Airflow orchestrates batch steps such as starting or checking the stream job; the Spark streaming job itself processes the messages continuously","Airflow should run one task for every Kafka message","Airflow replaces Spark Structured Streaming","Kafka can run only when Airflow is running"],"oc":[false,false,false,false],"a":0,"e":"Airflow schedules and monitors work that has a start and an end. Continuous, per-message processing belongs in the streaming engine."},{"n":329,"s":33,"lv":"M","q":"A validation task finds that today's output has no rows. How should it signal this to Airflow?","code":"","lang":"","chk":0,"o":["Print a warning and return normally","Raise an exception, so the task fails and the downstream tasks do not run","Mark the next task as skipped by editing the database","Delete the DAG"],"oc":[false,false,false,false],"a":1,"e":"A failed task stops the tasks that depend on it (trigger rule all_success) and can send alerts. AirflowFailException fails the task without retrying it."},{"n":330,"s":33,"lv":"E","q":"Where must DAG files be placed so that the Airflow scheduler picks them up?","code":"","lang":"","chk":0,"o":["In HDFS under /user/airflow","In the Kafka logs directory","In the Spark jars directory","In the DAGs folder set by dags_folder in the Airflow configuration"],"oc":[false,false,false,false],"a":3,"e":"The scheduler regularly scans the DAGs folder and parses the Python files in it. A DAG with an import error appears as a broken DAG in the UI."}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const Q = DATA.questions;
const TOTAL = Q.length;
const byN = {}; Q.forEach(q => { byN[q.n] = q; });
const LV = {E:'Easy', M:'Medium', T:'Tough'};
const LVBARS = {E:1, M:2, T:3};
const GROUPS = DATA.groups;
const SESS = DATA.sessions.map(s => ({
  n:s.n, g:s.g, label:'S' + String(s.n).padStart(2, '0'), short:String(s.n), name:s.name, topics:s.topics,
  qs: Q.filter(q => q.s === s.n).map(q => q.n)
}));
const sessByN = {}; SESS.forEach(s => { sessByN[s.n] = s; });
const CHECKED = Q.filter(q => q.chk).length;
const MOCK_SIZE = 40;

/* 40-Question Subset Divisions (9 subsets across 330 questions) */
const SUBSETS = [];
for (let i = 0; i < TOTAL; i += 40){
  const start = i + 1;
  const end = Math.min(i + 40, TOTAL);
  const tNum = SUBSETS.length + 1;
  const qs = [];
  for (let qn = start; qn <= end; qn++) qs.push(qn);
  const sFirst = byN[start].s, sLast = byN[end].s;
  SUBSETS.push({
    t: tNum,
    label: 'Test ' + tNum,
    title: 'Test ' + tNum + ' · Q' + start + '–Q' + end,
    sub: 'Sessions ' + sFirst + '–' + sLast + ' (' + qs.length + ' questions)',
    qs
  });
}
const subsetByT = {}; SUBSETS.forEach(tb => { subsetByT[tb.t] = tb; });

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
const KW = {
  java: /^(abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|null|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|true|false|var)$/,
  py: /^(from|import|as|def|return|lambda|for|in|if|elif|else|print|True|False|None|and|or|not|with|try|except|class|while|is)$/,
  sql: /^(select|from|where|group|by|order|having|join|on|as|over|partition|rows|range|between|and|or|not|null|is|insert|into|overwrite|table|create|external|stored|load|data|local|inpath|limit|lateral|view|distinct|case|when|then|else|end|desc|asc|preceding|following|current|row|unbounded|union|all|with)$/i,
  sh: /^$/
};
const COMMENT = {java: '//', py: '#', sh: '#', sql: '--'};
function highlight(code, lang){
  const kw = KW[lang] || KW.java, cm = COMMENT[lang] || '//';
  const cmRe = cm === '//' ? '\\/\\/[^\\n]*' : cm === '--' ? '--[^\\n]*' : '#[^\\n]*';
  const re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|' + cmRe + '|\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?[LlFf]?)\\b|\\b[A-Za-z_]\\w*\\b)', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const tk = m[0];
    if (tk[0] === '"' || tk[0] === "'") out += '<span class="st">' + esc(tk) + '</span>';
    else if (tk.startsWith(cm)) out += '<span class="cm">' + esc(tk) + '</span>';
    else if (/^\d/.test(tk)) out += '<span class="nu">' + esc(tk) + '</span>';
    else if (kw.test(tk)) out += '<span class="kw">' + esc(tk) + '</span>';
    else out += esc(tk);
    last = m.index + tk.length;
  }
  return out + esc(code.slice(last));
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}

/* ---------- progress store ---------- */
const LS_KEY = 'bigdata330-progress-v1';
let store = {a:{}, bm:{}, resetAt:0};
function lsRead(){
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s){
      const o = JSON.parse(s);
      if (o && typeof o.a === 'object') store = {
        a: o.a,
        bm: (o.bm && typeof o.bm === 'object') ? o.bm : {},
        resetAt: o.resetAt || 0
      };
    }
  } catch(e){}
}
function lsWrite(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){}
}
function ans(n){ const e = store.a[n]; return (e && e.c >= 0) ? e : null; }
function record(n, choice){
  const q = byN[n], ok = choice === q.a, e = store.a[n] || {};
  store.a[n] = {c:choice, ok, t:Date.now(), w:(e.w || 0) + (ok ? 0 : 1), r:(e.r || 0) + (ok ? 1 : 0)};
  persist();
}
function clearAnswers(ns){
  const t = Date.now();
  ns.forEach(n => { const e = store.a[n]; if (e && e.c >= 0) store.a[n] = Object.assign({}, e, {c:-1, ok:false, t}); });
  persist();
}
function resetAll(){ store = {a:{}, bm:{}, resetAt:Date.now()}; persist(); }
function stats(ns){
  let ok = 0, bad = 0;
  ns.forEach(n => { const e = ans(n); if (e){ if (e.ok) ok++; else bad++; } });
  return {ok, bad, done: ok + bad, total: ns.length, todo: ns.length - ok - bad};
}
function wrongList(){ return Q.filter(q => { const e = ans(q.n); return e && !e.ok; }).map(q => q.n); }
function isBookmarked(n){ return !!(store.bm && store.bm[n]); }
function toggleBookmark(n){
  if (!store.bm || typeof store.bm !== 'object') store.bm = {};
  if (store.bm[n]) delete store.bm[n];
  else store.bm[n] = 1;
  persist();
}
function bookmarkList(){ return Q.filter(q => isBookmarked(q.n)).map(q => q.n); }
function persist(){
  lsWrite();
  $('mistakesCount').textContent = wrongList().length;
  $('bookmarksCount').textContent = bookmarkList().length;
}

/* Browser-like Back / Forward navigation stack */
let navHistory = [];
let navIndex = -1;
let isNavigatingHistory = false;

function cloneState(){
  return {
    view,
    sortMode,
    set: set ? JSON.parse(JSON.stringify(set)) : null,
    lvFilter,
    stFilter,
    scrollY: window.scrollY || 0
  };
}
function pushHistory(){
  if (isNavigatingHistory) return;
  const snap = cloneState();
  if (navIndex >= 0 && navIndex < navHistory.length){
    navHistory[navIndex].scrollY = window.scrollY || 0;
  }
  navHistory = navHistory.slice(0, navIndex + 1);
  navHistory.push(snap);
  navIndex = navHistory.length - 1;
  updateNavButtons();
}
function updateNavButtons(){
  $('navBackBtn').disabled = navIndex <= 0;
  $('navFwdBtn').disabled = navIndex >= navHistory.length - 1;
}
function restoreState(snap){
  isNavigatingHistory = true;
  view = snap.view;
  sortMode = snap.sortMode || 'syllabus';
  set = snap.set ? JSON.parse(JSON.stringify(snap.set)) : null;
  lvFilter = snap.lvFilter || 'all';
  stFilter = snap.stFilter || 'all';
  if (set) buildList();
  applyViewVisibility();
  refresh();
  window.scrollTo(0, snap.scrollY || 0);
  isNavigatingHistory = false;
  updateNavButtons();
}
function navBack(){
  if (navIndex > 0){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex--;
    restoreState(navHistory[navIndex]);
  }
}
function navForward(){
  if (navIndex < navHistory.length - 1){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex++;
    restoreState(navHistory[navIndex]);
  }
}

/* ---------- quiz (continuous vertical feed) ---------- */
function startSet(s){
  set = s;
  lvFilter = 'all';
  stFilter = 'all';
  buildList();
  activeQ = list[0] || null;
  show('quiz');
}
function startSession(n){
  const s = sessByN[n];
  startSet({kind:'session', s:n, title:'Session ' + s.n + ' · ' + s.name, sub:s.topics, ns:s.qs.slice()});
}
function startSubset(tNum){
  const tb = subsetByT[tNum];
  startSet({kind:'subset', t:tNum, title:tb.title, sub:tb.sub, ns:tb.qs.slice()});
}
function buildList(){
  if (!set) { list = []; return; }
  list = set.ns.filter(n => {
    const q = byN[n], e = ans(n);
    if (lvFilter !== 'all' && q.lv !== lvFilter) return false;
    if (stFilter === 'todo' && e) return false;
    if (stFilter === 'wrong' && !(e && !e.ok)) return false;
    if (stFilter === 'bm' && !isBookmarked(n)) return false;
    return true;
  });
}

const KIND = {session:'Session', subset:'40-Question Subset Test', random:'Mixed practice', mock:'Mock paper', retry:'Mistake practice', bookmark:'Bookmark practice'};

function buildSwitcherBar(){
  let prevDisabled = true, nextDisabled = true;
  let prevLabel = '◄ Prev', nextLabel = 'Next ►';
  if (set.kind === 'session'){
    prevDisabled = set.s <= 1;
    nextDisabled = set.s >= SESS.length;
    if (!prevDisabled) prevLabel = '◄ S' + (set.s - 1);
    if (!nextDisabled) nextLabel = 'S' + (set.s + 1) + ' ►';
  } else if (set.kind === 'subset'){
    prevDisabled = set.t <= 1;
    nextDisabled = set.t >= SUBSETS.length;
    if (!prevDisabled) prevLabel = '◄ Test ' + (set.t - 1);
    if (!nextDisabled) nextLabel = 'Test ' + (set.t + 1) + ' ►';

  const sessOpts = SESS.map(s => {
    const st = stats(s.qs);

    return '<option value="s:' + s.n + '"' + sel + '>' + s.label + ' · ' + esc(s.name) + ' (' + st.done + '/' + st.total + ')</option>';
  }).join('');

  const subOpts = SUBSETS.map(tb => {
    const st = stats(tb.qs);

function lvlBadge(q){ return '<span class="lvl"><span class="bars on' + LVBARS[q.lv] + '"><i></i><i></i><i></i></span>' + LV[q.lv] + '</span>'; }

function renderCardInner(q){
  const e = ans(q.n);
  const opts = q.o.map((t, i) => {
    let cls = 'opt', mark = '';
    if (e){
      if (i === q.a){ cls += ' right'; mark = i === e.c ? '✓ Your answer' : '✓ Correct'; }
      else if (i === e.c){ cls += ' wrong'; mark = '✗ Your answer'; }
      else cls += ' dim';
    }
    return '<li><button type="button" class="' + cls + '" data-q="' + q.n + '" data-opt="' + i + '"' + (e ? ' disabled' : '') + '><span class="key">' + 'ABCD'[i] + '</span><span class="otext' + (q.oc[i] ? ' codey' : '') + '">' + esc(t) + '</span><span class="mark">' + mark + '</span></button></li>';
  }).join('');
  const all = store.a[q.n];
  const missed = all && all.w ? '<span class="missed">missed ' + all.w + '×</span>' : '';
  let fb = '';
  if (e){
    fb = '<div class="feedback ' + (e.ok ? 'yes' : 'no') + '" role="status"><div class="verdict">' + (e.ok ? 'Correct. Answer ' + 'ABCD'[q.a] : 'Wrong. You chose ' + 'ABCD'[e.c] + ', the answer is ' + 'ABCD'[q.a]) + '</div>' +
      (e.ok ? '' : '<p><b>' + 'ABCD'[q.a] + '.</b> <span' + (q.oc[q.a] ? ' class="mono"' : '') + '>' + esc(q.o[q.a]) + '</span></p>') +
      '<p>' + esc(q.e) + '</p><div class="fbrow"><button class="btn small ghost" type="button" data-retry-one="' + q.n + '">Try this one again</button></div></div>';
  }
  return metaRow(q, missed) +
    '<p class="stem">' + esc(q.q) + '</p>' +
    (q.code ? '<pre class="code">' + highlight(q.code, q.lang) + '</pre>' : '') +
    '<ol class="opts">' + opts + '</ol>' + fb;
}
function renderCard(q){
  return '<article class="qcard" id="qcard-' + q.n + '">' + renderCardInner(q) + '</article>';
}

/* Update single card + top metrics in place so continuous vertical feed never loses scroll position */
function updateCardInPlace(n){
  const cardEl = $('qcard-' + n);
  if (cardEl && byN[n]){
    cardEl.innerHTML = renderCardInner(byN[n]);
  }
  const sqEl = $('sq-' + n);
  if (sqEl){
    const e = ans(n);
    const bmCls = isBookmarked(n) ? ' bm' : '';
    sqEl.className = 'sq' + (e ? (e.ok ? ' ok' : ' bad') : '') + bmCls + (n === activeQ ? ' cur' : '');
  }
  if (set){
    const st = stats(set.ns);
    const pl = $('quizProgressLine');
    if (pl){
      pl.innerHTML = '<span><b>' + st.done + '</b> of ' + st.total + ' answered</span><span><i class="dot ok"></i><b>' + st.ok + '</b> right</span><span><i class="dot bad"></i><b>' + st.bad + '</b> wrong</span>' + (st.done ? '<span><b>' + pct(st.ok, st.done) + '%</b> accuracy</span>' : '');
    }
    const sw = $('quizStackWrap');
    if (sw) sw.innerHTML = stackBar(st);
    const bmFilterBtn = document.querySelector('#stSeg button[data-st="bm"]');
    if (bmFilterBtn){
      const bmInSet = set.ns.filter(qn => isBookmarked(qn)).length;
      bmFilterBtn.textContent = '★ Bookmarked (' + bmInSet + ')';
    }
  }
}

function handleBookmarkToggle(qn){
  if (!byN[qn]) return;
  const wasBm = isBookmarked(qn);
  toggleBookmark(qn);
  toast(wasBm ? 'Removed Q' + qn + ' from bookmarks' : '★ Bookmarked Q' + qn);
  if (view === 'quiz'){
    if (stFilter === 'bm' && wasBm){
      buildList();
      renderQuiz();
    } else {
      updateCardInPlace(qn);
    }
  } else if (view === 'bookmarks'){
    renderBookmarks();
  } else if (view === 'result'){
    renderResult();
  } else if (view === 'mistakes'){
    renderMistakes();
  }
}

function answerQuestion(qn, choice){
  if (!byN[qn] || ans(qn)) return;
  activeQ = qn;
  record(qn, choice);
  if (stFilter !== 'all'){
    renderQuiz();
  } else {
    updateCardInPlace(qn);
  }
}

function jumpToQuestion(qn){
  activeQ = qn;
  document.querySelectorAll('.sq.cur').forEach(el => el.classList.remove('cur'));
  const sqEl = $('sq-' + qn);
  if (sqEl) sqEl.classList.add('cur');
  const cardEl = $('qcard-' + qn);
  if (cardEl){
    cardEl.scrollIntoView({behavior: 'smooth', block: 'start'});
    cardEl.classList.add('flash');
    setTimeout(() => cardEl.classList.remove('flash'), 900);
  }
}

/* ---------- results ---------- */
function ring(ok, total){
  const r = 54, c = 2 * Math.PI * r, f = total ? ok / total : 0;
  return '<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--sunken)" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '"/></svg>' +
    '<div class="lbl"><div><b>' + ok + '/' + total + '</b><small>correct</small></div></div></div>';
}
function mistakeCard(n){
  const q = byN[n], e = ans(n), all = store.a[n];
  return '<article class="mistake">' + metaRow(q, all && all.w > 1 ? '<span class="missed">missed ' + all.w + '×</span>' : '') +
    '<p class="stem">' + esc(q.q) + '</p>' + (q.code ? '<pre class="code">' + highlight(q.code, q.lang) + '</pre>' : '') +
    '<div class="answers"><div class="ans yours"><span class="who">You chose ' + 'ABCD'[e.c] + '</span><span class="' + (q.oc[e.c] ? 'mono' : '') + '">' + esc(q.o[e.c]) + '</span></div>' +
    '<div class="ans correct"><span class="who">Correct: ' + 'ABCD'[q.a] + '</span><span class="' + (q.oc[q.a] ? 'mono' : '') + '">' + esc(q.o[q.a]) + '</span></div></div>' +
    '<p class="explain"><b>Why:</b> ' + esc(q.e) + '</p></article>';
}
function renderResult(){
  const st = stats(set.ns);
  const wrong = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
  const lvRows = ['E', 'M', 'T'].map(l => {
    const ns = set.ns.filter(n => byN[n].lv === l); if (!ns.length) return '';
    const s = stats(ns);
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(s) + '<span class="num">' + s.ok + '/' + s.total + '</span></div>';
  }).join('');
  $('vResult').innerHTML =
  '<div class="result">' +
    '<div><div class="eyebrow">Result</div><h2 style="font-size:24px">' + esc(set.title) + '</h2></div>' +
    '<div class="panel scorecard">' + ring(st.ok, st.total) +
      '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' +
        '<div class="legend"><span><i class="dot ok"></i>Right <b>' + st.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + st.bad + '</b></span><span><i class="dot todo"></i>Skipped <b>' + st.todo + '</b></span>' + (st.done ? '<span>Accuracy <b>' + pct(st.ok, st.done) + '%</b></span>' : '') + '</div>' +
        '<div class="lvrows">' + lvRows + '</div>' +
        '<div class="rowbtns">' + (wrong.length ? '<button class="btn primary" type="button" id="retryWrong">Retry the ' + wrong.length + ' wrong</button>' : '') +
          (st.todo ? '<button class="btn" type="button" id="backToQuiz">Answer the ' + st.todo + ' skipped</button>' : '') +
          '<button class="btn" type="button" id="restartSet">Restart this set</button><button class="btn ghost" type="button" data-home>All sessions</button></div>' +
      '</div></div>' +
    (wrong.length ? '<div class="grouphead"><h3>Where you went wrong</h3><span class="muted">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + '</span></div>' + wrong.map(mistakeCard).join('')
      : (st.done ? '<div class="panel">No wrong answers in this set.' + (st.todo ? ' ' + st.todo + ' still unanswered.' : '') + '</div>' : '<div class="panel">Nothing answered yet in this set.</div>')) +
  '</div>';
}

function sampleRandom(k){
  const todo = shuffle(Q.filter(q => !ans(q.n)).map(q => q.n));
  let pick = todo.slice(0, k);
  if (pick.length < k){
    const extra = shuffle(Q.filter(q => ans(q.n)).map(q => q.n)).slice(0, k - pick.length);
    clearAnswers(extra); pick = pick.concat(extra);
  }
  return pick.sort((a, b) => a - b);
}
function sampleMock(){
  const freshFirst = ns => shuffle(ns.slice()).sort((a, b) => (ans(a) ? 1 : 0) - (ans(b) ? 1 : 0));
  const picked = SESS.map(s => freshFirst(s.qs)[0]);
  const rest = freshFirst(Q.map(q => q.n).filter(n => !picked.includes(n)));
  const usedTwice = new Set();
  for (const n of rest){
    if (picked.length >= MOCK_SIZE) break;
    const s = byN[n].s; if (usedTwice.has(s)) continue;
    usedTwice.add(s); picked.push(n);
  }
  clearAnswers(picked.filter(n => ans(n)));
  return picked.sort((a, b) => a - b);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;

  if (t.id === 'themeBtn'){
    const next = getActiveTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    return;
  }
  if (t.id === 'navBackBtn'){ navBack(); return; }
  if (t.id === 'navFwdBtn'){ navForward(); return; }
  if (t.id === 'brandBtn' || t.id === 'consoleHomeBtn' || t.hasAttribute('data-home')){ resetArmed = false; show('home'); return; }
  if (t.id === 'mistakesBtn'){ show('mistakes'); return; }
  if (t.id === 'bookmarksBtn'){ show('bookmarks'); return; }
  if (t.id === 'infoBtn'){ show('info'); return; }

  if (t.dataset.bm !== undefined){
    handleBookmarkToggle(+t.dataset.bm);
    return;
  }

  if (t.id === 'mock40' || t.id === 'mock40Info'){
    startSet({kind:'mock', title:'Mock paper · 40 questions', sub:'One question from every session, plus seven more from the larger blocks.', ns:sampleMock()});
    return;
  }
  if (t.dataset.session){ startSession(+t.dataset.session); return; }
  if (t.dataset.subset){ startSubset(+t.dataset.subset); return; }
  if (t.dataset.sort){ sortMode = t.dataset.sort; renderHome(); return; }
  if (t.dataset.review){
    const s = sessByN[+t.dataset.review];
    const ns = s.qs.filter(n => { const e = ans(n); return e && !e.ok; });
    practiseWrong(ns, s.label + ' mistakes · ' + s.name);
    return;
  }
  if (t.dataset.practiseSession){
    const s = sessByN[+t.dataset.practiseSession];
    practiseWrong(wrongList().filter(n => byN[n].s === s.n), s.label + ' mistakes · ' + s.name);
    return;
  }
  if (t.dataset.practiseBmSession){
    const s = sessByN[+t.dataset.practiseBmSession];
    practiseBookmarked(bookmarkList().filter(n => byN[n].s === s.n), s.label + ' bookmarked · ' + s.name);
    return;
  }
  if (t.id === 'practiseWrong' || t.id === 'practiseAllWrong'){ practiseWrong(wrongList(), 'All my mistakes'); return; }
  if (t.id === 'practiseBm' || t.id === 'practiseAllBm'){ practiseBookmarked(bookmarkList(), 'All bookmarked questions'); return; }
  if (t.id === 'random20'){ startSet({kind:'random', title:'Random 20', sub:'Unanswered questions first, drawn from all ' + SESS.length + ' sessions.', ns:sampleRandom(20)}); return; }
  if (t.id === 'resetBtn'){ resetArmed = true; renderHome(); return; }
  if (t.id === 'resetNo'){ resetArmed = false; renderHome(); return; }
  if (t.id === 'resetYes'){ resetArmed = false; resetAll(); refresh(); toast('All progress cleared'); return; }

  if (t.dataset.opt !== undefined && t.dataset.q !== undefined && !t.disabled){
    answerQuestion(+t.dataset.q, +t.dataset.opt);
    return;
  }
  if (t.dataset.jump !== undefined){
    jumpToQuestion(+t.dataset.jump);
    return;
  }
  if (t.dataset.retryOne !== undefined){
    const qn = +t.dataset.retryOne;
    clearAnswers([qn]);
    if (stFilter !== 'all') renderQuiz();
    else updateCardInPlace(qn);
    return;
  }
  if (t.dataset.lv){ lvFilter = t.dataset.lv; buildList(); renderQuiz(); return; }
  if (t.dataset.st){ stFilter = t.dataset.st; buildList(); renderQuiz(); return; }
  if (t.id === 'prevSetBtn'){
    if (set && set.kind === 'session' && set.s > 1) startSession(set.s - 1);
    else if (set && set.kind === 'subset' && set.t > 1) startSubset(set.t - 1);
    return;
  }
  if (t.id === 'nextSetBtn'){
    if (set && set.kind === 'session' && set.s < SESS.length) startSession(set.s + 1);
    else if (set && set.kind === 'subset' && set.t < SUBSETS.length) startSubset(set.t + 1);
    return;
  }
  if (t.id === 'scrollTopBtn'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (t.id === 'finish' || t.id === 'toResult'){ show('result'); return; }
  if (t.id === 'retryWrong'){
    const ns = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
    practiseWrong(ns, set.kind === 'session' ? set.title.replace(' · ', ' mistakes · ') : 'Mistakes from ' + set.title);
    return;
  }
  if (t.id === 'backToQuiz'){ stFilter = 'todo'; lvFilter = 'all'; buildList(); show('quiz'); return; }
  if (t.id === 'restartSet' || t.id === 'restartSetQuiz'){
    clearAnswers(set.ns);
    lvFilter = 'all';
    stFilter = 'all';
    buildList();
    show('quiz');
    toast('Set answers cleared');
    return;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t && t.id === 'switcherSelect'){
    const val = t.value;
    if (val.startsWith('s:')) startSession(+val.slice(2));
    else if (val.startsWith('t:')) startSubset(+val.slice(2));
  }
});

/* ---------- boot ---------- */
initTheme();
lsRead();
show('home');
})();
</script>
</body>
</html>
