NG);","ALTER TABLE emp ADD COLUMNS (email STRING);","UPDATE TABLE emp ADD email STRING;"],"oc":[true,true,true,true],"a":2,"e":"ADD COLUMNS appends columns to the schema; existing rows read the new column as NULL. RENAME TO, CHANGE and REPLACE COLUMNS are other ALTER TABLE forms."},{"n":119,"s":12,"lv":"T","q":"Point out the correct statement about dynamic partitioning in Hive.","code":"","lang":"","chk":0,"o":["The partition column must also be declared as a normal column in CREATE TABLE","Partition column values are stored inside the data files","Dynamic partitioning needs no settings at all","The partition values are taken from the last column(s) of the SELECT in the INSERT statement"],"oc":[false,false,false,false],"a":3,"e":"In INSERT ... PARTITION (country) SELECT ..., country, the trailing column supplies the value. Fully dynamic inserts need hive.exec.dynamic.partition.mode = nonstrict, and partition values live in directory names, not in the files."},{"n":120,"s":12,"lv":"T","q":"What is the main purpose of bucketing a Hive table with CLUSTERED BY (id) INTO 8 BUCKETS?","code":"","lang":"","chk":0,"o":["To sort the table's data in descending order of id","To split data into a fixed number of files by a hash of id, which helps sampling and bucket map joins","To create one directory for every distinct id value","To limit the table to 8 rows"],"oc":[false,false,false,false],"a":1,"e":"Rows go to a bucket by a hash of id modulo 8. Unlike partitioning, the number of files stays fixed even when the column has many distinct values."},{"n":121,"s":13,"lv":"M","q":"Point out the correct statement about ORDER BY and SORT BY in Hive.","code":"","lang":"","chk":0,"o":["SORT BY produces a total order, while ORDER BY sorts within each reducer","Both always use a single reducer","ORDER BY produces a total order through a single reducer, while SORT BY sorts only within each reducer","Both produce exactly the same result in every case"],"oc":[false,false,false,false],"a":2,"e":"ORDER BY is slow on large data because one reducer handles everything. SORT BY with several reducers gives several sorted files that are not ordered with respect to each other."},{"n":122,"s":13,"lv":"M","q":"In Hive, CLUSTER BY dept is shorthand for ______.","code":"","lang":"","chk":0,"o":["ORDER BY dept","DISTRIBUTE BY dept SORT BY dept","PARTITIONED BY dept","GROUP BY dept"],"oc":[false,false,false,false],"a":1,"e":"CLUSTER BY sends rows with the same dept to the same reducer and sorts them within it. To sort by other columns, write DISTRIBUTE BY and SORT BY separately."},{"n":123,"s":13,"lv":"M","q":"What does DISTRIBUTE BY control in a Hive query?","code":"","lang":"","chk":0,"o":["Which reducer each row goes to; rows with the same value go to the same reducer","Which partition directory a row is written to","How many mappers are used","The sort order of the final output"],"oc":[false,false,false,false],"a":0,"e":"DISTRIBUTE BY is the HiveQL way of choosing the partitioner's key. It is often combined with SORT BY."},{"n":124,"s":13,"lv":"M","q":"How does a map-side join (MAPJOIN) work in Hive?","code":"","lang":"","chk":0,"o":["The large table is broadcast to every reducer","The small table is loaded into memory on every mapper and the join is done in the map phase, with no reduce phase","Both tables are sorted and joined in a single reducer","The join is done inside the metastore"],"oc":[false,false,false,false],"a":1,"e":"Avoiding the shuffle makes the join much faster when one table is small. Hive converts joins automatically when hive.auto.convert.join is on and the table is under the size threshold."},{"n":125,"s":13,"lv":"T","q":"In a common (reduce-side) join in Hive, which table should be written last in the JOIN clause for best performance?","code":"","lang":"","chk":0,"o":["The table with the most columns","The smallest table","The order makes no difference","The largest table"],"oc":[false,false,false,false],"a":3,"e":"Hive buffers the rows of the earlier tables in memory in the reducer and streams the last table through it. Putting the largest table last (or using the STREAMTABLE hint) keeps memory use low."},{"n":126,"s":13,"lv":"M","q":"What does a LEFT SEMI JOIN return in Hive?","code":"","lang":"","chk":0,"o":["Matching rows with columns from both tables","Rows of the left table that have no match in the right table","Rows of the left table that have a match in the right table, with columns from the left table only","All rows from both tables"],"oc":[false,false,false,false],"a":2,"e":"LEFT SEMI JOIN is Hive's efficient form of WHERE ... IN (subquery) or EXISTS. Each matching left row is returned once, and the right table's columns cannot be selected."},{"n":127,"s":13,"lv":"M","q":"Point out the correct statement about a view in Hive.","code":"","lang":"","chk":0,"o":["It stores only a query; selecting from it runs that query against the underlying tables","It is the same thing as an external table","Data can be loaded into it with LOAD DATA","It stores a copy of the data that refreshes every hour"],"oc":[false,false,false,false],"a":0,"e":"A view is a logical, read-only object used to hide complexity or restrict columns. Materialized views, which do store results, are a separate feature added in Hive 3."},{"n":128,"s":13,"lv":"T","q":"logs is partitioned by dt, and Hive runs in strict mode. Which query is rejected?","code":"","lang":"","chk":0,"o":["SELECT count(*) FROM logs WHERE dt = '2026-01-01';","SELECT * FROM logs WHERE dt = '2026-01-01' ORDER BY ts LIMIT 100;","SELECT * FROM logs WHERE dt = '2026-01-01' LIMIT 10;","SELECT * FROM logs ORDER BY ts;"],"oc":[true,true,true,true],"a":3,"e":"Strict mode blocks queries that scan every partition of a partitioned table, ORDER BY without LIMIT, and Cartesian products. The rejected query does the first two."},{"n":129,"s":13,"lv":"T","q":"Table emp(dept, sal) holds the rows (IT, 100), (IT, 200), (HR, 300) and (HR, NULL). What does this query return for dept HR?","code":"SELECT dept, count(*), count(sal), avg(sal)\nFROM emp\nGROUP BY dept;","lang":"sql","chk":1,"o":["HR 2 1 300.0","HR 2 2 300.0","HR 1 1 300.0","HR 2 2 150.0"],"oc":[true,true,true,true],"a":0,"e":"count(*) counts rows (2), but count(sal) and avg(sal) ignore NULLs, so they see only the value 300. The average is 300 / 1, not 300 / 2."},{"n":130,"s":13,"lv":"M","q":"Which HiveQL clause passes rows through an external program, such as a Python script, to act as a custom mapper or reducer?","code":"","lang":"","chk":0,"o":["SELECT ... EXECUTE 'script'","SELECT ... WITH SCRIPT 'script'","CALL script(...)","SELECT TRANSFORM(...) USING 'script' AS (...)"],"oc":[true,true,true,true],"a":3,"e":"TRANSFORM streams each row to the script's standard input as tab-separated text and reads the output rows back. The script is shipped to the nodes with ADD FILE."},{"n":131,"s":14,"lv":"E","q":"What is the difference between INSERT INTO and INSERT OVERWRITE in Hive?","code":"","lang":"","chk":0,"o":["Both replace","Both append","INSERT INTO appends rows; INSERT OVERWRITE replaces the existing data of the table or partition","INSERT INTO replaces data; INSERT OVERWRITE appends"],"oc":[false,false,false,false],"a":2,"e":"INSERT OVERWRITE is common in daily batch loads because rerunning it for a partition gives the same result instead of duplicate rows."},{"n":132,"s":14,"lv":"M","q":"Which kind of Hive function is explode(), which turns one input row into several output rows?","code":"","lang":"","chk":0,"o":["UDAF (user-defined aggregate function)","UDTF (user-defined table-generating function)","UDF (user-defined function)","Window function"],"oc":[false,false,false,false],"a":1,"e":"A UDF maps one row to one value, a UDAF maps many rows to one value (like sum), and a UDTF maps one row to many rows."},{"n":133,"s":14,"lv":"M","q":"A Java UDF has been packaged in udfs.jar as the class com.acme.Mask. Which statements make it usable in a Hive session?","code":"","lang":"","chk":0,"o":["REGISTER udfs.jar;  DEFINE mask com.acme.Mask;","IMPORT udfs.jar;  CREATE FUNCTION com.acme.Mask;","LOAD JAR udfs.jar;  USE FUNCTION mask;","ADD JAR udfs.jar;  CREATE TEMPORARY FUNCTION mask AS 'com.acme.Mask';"],"oc":[true,true,true,true],"a":3,"e":"ADD JAR puts the class on the session's classpath and CREATE TEMPORARY FUNCTION gives it a name. REGISTER and DEFINE are Pig commands."},{"n":134,"s":14,"lv":"M","q":"A simple Hive UDF written with the classic API extends org.apache.hadoop.hive.ql.exec.UDF. Which method does it implement?","code":"","lang":"","chk":0,"o":["execute()","process()","evaluate()","map()"],"oc":[true,true,true,true],"a":2,"e":"Hive finds evaluate() by reflection, and evaluate can be overloaded for different argument types. Newer UDFs extend GenericUDF and implement initialize() and evaluate()."},{"n":135,"s":14,"lv":"E","q":"How do you run a file of HiveQL statements from the shell?","code":"","lang":"","chk":0,"o":["hive -f etl.hql","hive -e etl.hql","hive -run etl.hql","hive -s etl.hql"],"oc":[true,true,true,true],"a":0,"e":"-f runs the statements in a file. -e runs a query given as a quoted string. Beeline accepts the same -f and -e options."},{"n":136,"s":14,"lv":"T","q":"A script is started with  hive --hivevar dt=2026-01-01 -f load.hql.  How is the variable written inside load.hql?","code":"","lang":"","chk":0,"o":["@dt","${hivevar:dt}","$dt$","{{ dt }}"],"oc":[true,true,true,true],"a":1,"e":"Hive substitutes ${hivevar:dt} (also ${dt}) before running the statement. --hiveconf values are referenced as ${hiveconf:name}."},{"n":137,"s":14,"lv":"M","q":"Which statement appends rows from a staging table to an existing Hive table without removing its current data?","code":"","lang":"","chk":0,"o":["INSERT INTO TABLE sales SELECT * FROM stage_sales;","TRUNCATE TABLE sales;","INSERT OVERWRITE TABLE sales SELECT * FROM stage_sales;","LOAD DATA INPATH '/stage' OVERWRITE INTO TABLE sales;"],"oc":[true,true,true,true],"a":0,"e":"INSERT INTO adds new files next to the table's existing ones. The OVERWRITE forms replace the existing data, and TRUNCATE empties the table."},{"n":138,"s":14,"lv":"T","q":"What does this HiveQL query return?","code":"SELECT concat('big', '_', upper('data')),\n       substr('Hadoop', 2, 3),\n       size(split('a,b,c', ','));","lang":"sql","chk":1,"o":["big_DATA doo 3","big_DATA ado 3","BIG_DATA ado 2","big_data Had 3"],"oc":[true,true,true,true],"a":1,"e":"substr positions start at 1, so substr('Hadoop', 2, 3) takes three characters from the second: \"ado\". split gives an array of three elements, and size() counts them."},{"n":139,"s":14,"lv":"T","q":"emp has two rows: ('Asha', ['java', 'sql', 'spark']) and ('Ravi', ['python']). How many rows does this query return?","code":"SELECT name, skill\nFROM emp LATERAL VIEW explode(skills) s AS skill;","lang":"sql","chk":1,"o":["4","2","3","5"],"oc":[false,false,false,false],"a":0,"e":"explode() makes one row per array element (3 for Asha and 1 for Ravi), and LATERAL VIEW joins each of them back to its source row."},{"n":140,"s":14,"lv":"T","q":"The city column holds the values Pune, Mumbai, Pune and NULL. What does this query return?","code":"SELECT size(collect_set(city)), size(collect_list(city))\nFROM customers;","lang":"sql","chk":1,"o":["2 4","2 3","3 3","3 4"],"oc":[true,true,true,true],"a":1,"e":"Both aggregate functions skip NULLs. collect_set also removes duplicates, giving {Pune, Mumbai}, while collect_list keeps both Pune values."},{"n":141,"s":15,"lv":"E","q":"Bill Inmon defined a data warehouse as a ______ collection of data that supports management decisions.","code":"","lang":"","chk":0,"o":["single-source, current-only, editable and small","real-time, normalised, volatile and transactional","unstructured, raw, temporary and private","subject-oriented, integrated, time-variant and non-volatile"],"oc":[false,false,false,false],"a":3,"e":"A warehouse is organised around subjects such as sales or customers, integrates many sources, keeps history (time-variant) and is not updated row by row like an operational system (non-volatile)."},{"n":142,"s":15,"lv":"E","q":"A data warehouse is designed mainly for which kind of workload?","code":"","lang":"","chk":0,"o":["Serving web pages","Real-time message delivery","OLAP: analytical queries that scan and aggregate large amounts of historical data","OLTP: many short transactions that insert and update single rows"],"oc":[false,false,false,false],"a":2,"e":"Operational (OLTP) databases run the business day to day. The warehouse copies their data and is optimised for read-heavy analysis and reporting."},{"n":143,"s":15,"lv":"E","q":"What does a star schema consist of?","code":"","lang":"","chk":0,"o":["A single table holding all attributes","A central fact table joined to denormalised dimension tables","Dimension tables normalised into several levels of sub-tables","Several fact tables with no dimension tables"],"oc":[false,false,false,false],"a":1,"e":"Drawn out, the fact table sits in the middle with dimensions such as date, product and store around it. Denormalised dimensions mean fewer joins and simpler queries."},{"n":144,"s":15,"lv":"M","q":"How does a snowflake schema differ from a star schema?","code":"","lang":"","chk":0,"o":["Its fact table is denormalised into the dimension tables","It can only be used in a data lake","Its dimension tables are normalised into further related tables","It has no fact table"],"oc":[false,false,false,false],"a":2,"e":"For example, a product dimension may be split into product, category and department tables. This saves space but needs more joins than a star schema."},{"n":145,"s":15,"lv":"M","q":"What does a fact table typically contain?","code":"","lang":"","chk":0,"o":["Configuration settings of the warehouse","Descriptive text attributes, such as customer name and city","Only primary keys","Numeric measures, such as sales amount and quantity, plus foreign keys to the dimension tables"],"oc":[false,false,false,false],"a":3,"e":"Facts are the measurable events of the business. Descriptive attributes used for filtering and grouping belong in dimension tables."},{"n":146,"s":15,"lv":"M","q":"Point out the correct statement about a data lake.","code":"","lang":"","chk":0,"o":["It cannot store images, logs or JSON files","It is just another name for a data mart","It stores raw data of any type in its native format and applies a schema when the data is read","It accepts only cleaned, structured data that fits a fixed schema"],"oc":[false,false,false,false],"a":2,"e":"A lake keeps structured, semi-structured and unstructured data cheaply, usually in object storage or HDFS, and lets each use case decide how to interpret it (schema-on-read)."},{"n":147,"s":15,"lv":"T","q":"A customer moves from Pune to Delhi. Which slowly changing dimension type keeps the old row and inserts a new row, so that past sales still show Pune?","code":"","lang":"","chk":0,"o":["Type 2","Type 1","Type 3","Type 0"],"oc":[false,false,false,false],"a":0,"e":"Type 2 adds a new row with a new surrogate key, effective dates or a current flag. Type 1 overwrites the old value and loses history; Type 3 keeps only the previous value in an extra column."},{"n":148,"s":15,"lv":"E","q":"What is a data mart?","code":"","lang":"","chk":0,"o":["The metadata catalogue of a warehouse","A subject-specific subset of warehouse data built for one department or business area","A raw landing zone in a data lake","A backup copy of the operational database"],"oc":[false,false,false,false],"a":1,"e":"For example, a sales mart serves only the sales team. In Kimball's approach, the warehouse is the set of conformed data marts."},{"n":149,"s":15,"lv":"T","q":"Point out the correct statement comparing the Inmon and Kimball approaches.","code":"","lang":"","chk":0,"o":["Inmon builds a normalised enterprise warehouse first (top-down); Kimball builds dimensional data marts first (bottom-up)","Neither uses dimension tables","Kimball builds a normalised enterprise warehouse first; Inmon builds dimensional data marts first","Both forbid the use of star schemas"],"oc":[false,false,false,false],"a":0,"e":"Kimball delivers usable marts sooner and connects them through conformed dimensions. Inmon's central 3NF warehouse feeds marts later and focuses on one integrated version of the data."},{"n":150,"s":15,"lv":"M","q":"A data lake that has no metadata, governance or quality checks, so that nobody can find or trust its data, is often called a ______.","code":"","lang":"","chk":0,"o":["lakehouse","data mart","data cube","data swamp"],"oc":[false,false,false,false],"a":3,"e":"Cataloguing, access control, data quality rules and lineage keep a lake usable. A lakehouse adds warehouse features, such as ACID tables, on top of lake storage."},{"n":151,"s":16,"lv":"E","q":"What does ETL stand for?","code":"","lang":"","chk":0,"o":["Extract, Transform, Load","Encode, Transmit, Log","Extract, Transfer, Link","Evaluate, Test, Launch"],"oc":[false,false,false,false],"a":0,"e":"Data is extracted from sources, transformed (cleaned, joined, aggregated) and loaded into the target warehouse."},{"n":152,"s":16,"lv":"M","q":"How does ELT differ from ETL?","code":"","lang":"","chk":0,"o":["In ELT, data is transformed before it is extracted","In ELT, raw data is loaded into the target first and transformed there using the target system's own compute","ELT can be used only with on-premises databases","In ELT, data is never transformed"],"oc":[false,false,false,false],"a":1,"e":"ELT suits cloud warehouses and lakehouses, which have plenty of scalable compute. It also keeps the raw data for reprocessing later."},{"n":153,"s":16,"lv":"M","q":"Why has ELT become popular with cloud data warehouses?","code":"","lang":"","chk":0,"o":["Cloud warehouses cannot store raw data","ELT needs no target system at all","They provide scalable compute, so transformations can run inside the warehouse after loading","ELT avoids the need for SQL"],"oc":[false,false,false,false],"a":2,"e":"Systems such as BigQuery, Snowflake and Redshift separate storage from compute and scale on demand. Loading raw data first and transforming it with SQL removes the need for a separate transformation server."},{"n":154,"s":16,"lv":"M","q":"In an ETL pipeline, what is the staging area?","code":"","lang":"","chk":0,"o":["The source operational database","An intermediate store where extracted data is held, cleaned and transformed before it is loaded into the warehouse","The dashboard tool","The final reporting layer used by business users"],"oc":[false,false,false,false],"a":1,"e":"Staging separates extraction from loading, lets data be checked and reconciled, and avoids putting load on the source systems while transformations run."},{"n":155,"s":16,"lv":"M","q":"In the medallion architecture of a data lake or lakehouse, what do the bronze, silver and gold layers hold?","code":"","lang":"","chk":0,"o":["Data of three different file sizes","Data from three different source systems","Hot, warm and cold backups","Raw ingested data, cleaned and conformed data, and business-level aggregated data"],"oc":[false,false,false,false],"a":3,"e":"Each layer refines the one before it. Reports and machine learning read from the silver and gold layers, while bronze keeps the raw data for reprocessing."},{"n":156,"s":16,"lv":"T","q":"A nightly pipeline should load only the orders that were added or changed since the previous run. What is this approach called?","code":"","lang":"","chk":0,"o":["Schema evolution","Bulk truncate and reload","Incremental load, using a watermark column such as last_updated or change data capture (CDC)","Full load"],"oc":[false,false,false,false],"a":2,"e":"The pipeline stores the highest timestamp (or log position) it processed and next time extracts only newer changes. This is much cheaper than reloading the whole table every night."},{"n":157,"s":16,"lv":"M","q":"Why should each step of a data pipeline be idempotent?","code":"","lang":"","chk":0,"o":["So that it uses less memory","So that it runs faster","So that it needs no input data","So that running it again after a failure gives the same result instead of duplicate or corrupted data"],"oc":[false,false,false,false],"a":3,"e":"Orchestrators retry failed tasks and rerun past dates. Steps that overwrite a partition, or upsert by key, can be repeated safely."},{"n":158,"s":16,"lv":"E","q":"In a dimensional warehouse, what is a surrogate key?","code":"","lang":"","chk":0,"o":["A system-generated key, usually an integer, used instead of the source system's natural key","A password used to access the warehouse","The customer's email address","A key copied unchanged from the source system"],"oc":[false,false,false,false],"a":0,"e":"Surrogate keys protect the warehouse from changes in source keys and make SCD Type 2 possible, since one customer can have several dimension rows."},{"n":159,"s":16,"lv":"T","q":"Sales files in a data lake are stored under paths such as /sales/dt=2026-11-13/. What is the main benefit of this layout?","code":"","lang":"","chk":0,"o":["It encrypts each day's data separately","It prevents duplicate rows","Queries that filter on dt read only the matching folders (partition pruning)","It compresses the files automatically"],"oc":[false,false,false,false],"a":2,"e":"Engines such as Hive, Spark and Trino map dt=... folders to a partition column. A filter like dt = '2026-11-13' then skips every other day's files."},{"n":160,"s":16,"lv":"M","q":"Why are columnar formats such as Parquet and ORC preferred for analytics tables in a data lake?","code":"","lang":"","chk":0,"o":["They are human-readable text files","They can be edited in place one row at a time","They store each row as a separate file","Queries read only the columns they need, and similar values stored together compress well"],"oc":[false,false,false,false],"a":3,"e":"Analytical queries usually touch a few columns of very wide tables. Columnar files also hold statistics that let engines skip blocks of data."},{"n":161,"s":17,"lv":"E","q":"In Apache Airflow, a workflow is defined as a ______.","code":"","lang":"","chk":0,"o":["linked list of jobs","DAG (directed acyclic graph) of tasks","cron table only","SQL stored procedure"],"oc":[false,false,false,false],"a":1,"e":"The edges of the DAG are task dependencies, and \"acyclic\" means no task can depend on itself directly or indirectly."},{"n":162,"s":17,"lv":"E","q":"In which language are Airflow DAGs written?","code":"","lang":"","chk":0,"o":["Python","Java","XML","Scala"],"oc":[false,false,false,false],"a":0,"e":"DAG files are Python scripts placed in the DAGs folder. Because they are code, workflows can be versioned, tested and generated dynamically."},{"n":163,"s":17,"lv":"E","q":"What is an operator in Airflow?","code":"","lang":"","chk":0,"o":["A user with admin rights","The service that decides when DAGs run","A template for a single unit of work, such as running a shell command or a Python function","The database that stores task history"],"oc":[false,false,false,false],"a":2,"e":"Instantiating an operator in a DAG creates a task. Examples are BashOperator, PythonOperator, EmailOperator and SQL operators."},{"n":164,"s":17,"lv":"M","q":"What does a sensor do in Airflow?","code":"","lang":"","chk":0,"o":["It waits until a condition is met, such as a file arriving or another task finishing, and then succeeds","It monitors CPU usage of the workers","It transforms data in memory","It sends alerts when a task fails"],"oc":[false,false,false,false],"a":0,"e":"Sensors are a special kind of operator. FileSensor, ExternalTaskSensor and S3KeySensor are common examples; poke_interval and timeout control how often they check and how long they wait."},{"n":165,"s":17,"lv":"M","q":"What is a hook in Airflow?","code":"","lang":"","chk":0,"o":["A way to pause a DAG","A task that runs after every DAG","A reusable interface to an external system, such as a database or S3, that uses the credentials stored in a Connection","The scheduler's main loop"],"oc":[false,false,false,false],"a":2,"e":"Operators use hooks internally, for example a Postgres operator uses PostgresHook. A hook can also be called from a PythonOperator to run custom logic."},{"n":166,"s":17,"lv":"M","q":"Where does Airflow keep Connections, such as database host, login and password, and how do tasks refer to them?","code":"","lang":"","chk":0,"o":["In the scheduler's log files","In XCom","Hard-coded inside every DAG file","In the metadata database (or a secrets backend), referenced by a conn_id"],"oc":[false,false,false,false],"a":3,"e":"Keeping credentials out of DAG code is safer and lets the same DAG run against different environments."},{"n":167,"s":17,"lv":"E","q":"What does  extract >> transform >> load  mean in an Airflow DAG?","code":"","lang":"","chk":0,"o":["extract runs first, then transform, then load","The output of extract is piped directly into load","load runs first, then transform, then extract","All three tasks run at the same time"],"oc":[false,false,false,false],"a":0,"e":">> sets a downstream dependency, like set_downstream(). It controls order only; data is not passed automatically between tasks."},{"n":168,"s":17,"lv":"T","q":"Which statement describes these dependencies, assuming default settings?","code":"a >> [b, c]\n[b, c] >> d","lang":"py","chk":0,"o":["a, b, c and d run one after another","d runs as soon as either b or c succeeds","b runs after c, and d runs after a","b and c run after a, possibly in parallel, and d runs only after both b and c succeed"],"oc":[false,false,false,false],"a":3,"e":"A list on one side of >> fans out or fans in. The default trigger rule is all_success, so d waits until every upstream task has succeeded."},{"n":169,"s":17,"lv":"M","q":"What does the Airflow scheduler do?","code":"","lang":"","chk":0,"o":["It monitors DAGs and queues task instances when their schedule and upstream dependencies are satisfied","It writes task logs to HDFS","It runs the web user interface","It stores DAG files"],"oc":[false,false,false,false],"a":0,"e":"The scheduler hands ready tasks to the executor, which runs them on workers. The webserver shows the results and the metadata database records task states."},{"n":170,"s":17,"lv":"M","q":"What is XCom used for in Airflow?","code":"","lang":"","chk":0,"o":["Moving large datasets between tasks","Passing small pieces of data, such as a file name or row count, between tasks","Scheduling DAG runs","Storing Connections"],"oc":[false,false,false,false],"a":1,"e":"XComs are stored in the metadata database, so they are meant for small values. Large data should be written to storage such as S3 or HDFS and passed by reference."},{"n":171,"s":18,"lv":"E","q":"What is the default trigger rule of an Airflow task?","code":"","lang":"","chk":0,"o":["all_done","none_failed","one_success","all_success"],"oc":[false,false,false,false],"a":3,"e":"By default a task runs only when all of its upstream tasks have succeeded. all_done, for example, is useful for clean-up tasks that must run whatever happens."},{"n":172,"s":18,"lv":"M","q":"default_args contains retries=3 and retry_delay=timedelta(minutes=5). What happens when a task fails?","code":"","lang":"","chk":0,"o":["The task is skipped","Airflow waits 3 minutes and fails it","Airflow retries it up to 3 more times, waiting 5 minutes between attempts, before marking it failed","The whole DAG is deleted"],"oc":[false,false,false,false],"a":2,"e":"Between attempts the task is in the up_for_retry state. Values in default_args apply to every task in the DAG unless a task overrides them."},{"n":173,"s":18,"lv":"M","q":"What is the advantage of running a sensor in \"reschedule\" mode instead of \"poke\" mode?","code":"","lang":"","chk":0,"o":["It never times out","It frees its worker slot between checks instead of holding it while it waits","It checks the condition more often","It runs on the scheduler instead of a worker"],"oc":[false,false,false,false],"a":1,"e":"In poke mode a sensor occupies a worker for its whole wait, which can block other tasks when many sensors wait for hours. Reschedule mode releases the slot until the next check."},{"n":174,"s":18,"lv":"E","q":"Which of these is a managed Apache Airflow service?","code":"","lang":"","chk":0,"o":["Google BigQuery","Amazon Redshift","Amazon MWAA","Azure Blob Storage"],"oc":[false,false,false,false],"a":2,"e":"Amazon Managed Workflows for Apache Airflow and Google Cloud Composer run the scheduler, webserver, workers and metadata database for you. Redshift and BigQuery are data warehouses."},{"n":175,"s":18,"lv":"M","q":"Which Airflow executor runs each task in its own Kubernetes pod?","code":"","lang":"","chk":0,"o":["KubernetesExecutor","LocalExecutor","SequentialExecutor","DebugExecutor"],"oc":[false,false,false,false],"a":0,"e":"KubernetesExecutor starts a pod for every task and removes it afterwards. CeleryExecutor sends tasks to a pool of long-running workers, and LocalExecutor runs tasks as processes on one machine."},{"n":176,"s":18,"lv":"T","q":"In Airflow 2, a DAG has start_date 1 January 2026 and the @daily schedule. When is the DAG run for the data interval of 1 January triggered?","code":"","lang":"","chk":0,"o":["Only when it is triggered by hand","At midnight at the start of 1 January","At noon on 1 January","At midnight at the start of 2 January, when that interval ends"],"oc":[false,false,false,false],"a":3,"e":"Airflow 2 runs a DAG run after its data interval closes, so all of 1 January's data exists. Its logical date ({{ ds }}) is still 2026-01-01."},{"n":177,"s":18,"lv":"M","q":"In Informatica PowerCenter, which client tool is used to build mappings (source to target data flows)?","code":"","lang":"","chk":0,"o":["Designer","Repository Manager","Administrator console","Workflow Monitor"],"oc":[false,false,false,false],"a":0,"e":"Mappings are built in the Designer (Mapping Designer). The Workflow Manager wraps them in sessions and workflows, and the Workflow Monitor tracks their runs."},{"n":178,"s":18,"lv":"M","q":"Which of these Informatica transformations is active, meaning it can change the number of rows passing through it?","code":"","lang":"","chk":0,"o":["Stored Procedure","Filter","Expression","Sequence Generator"],"oc":[false,false,false,false],"a":1,"e":"Filter drops rows that fail its condition. Expression, Sequence Generator and Stored Procedure are passive: one row out for each row in."},{"n":179,"s":18,"lv":"M","q":"A DAG with catchup=True is switched on today, but its start_date is 10 days ago. What does the scheduler do?","code":"","lang":"","chk":0,"o":["It deletes the old intervals","It runs only today's interval","It creates DAG runs for all the missed intervals since the start_date","It refuses to run the DAG"],"oc":[false,false,false,false],"a":2,"e":"Catch-up fills in each past schedule interval, which is useful for loading historical data. With catchup=False, only the latest interval is scheduled."},{"n":180,"s":18,"lv":"T","q":"Point out the wrong statement about automating a data pipeline with Airflow.","code":"","lang":"","chk":0,"o":["Connections keep credentials out of DAG code","Tasks should be idempotent so that retries are safe","A sensor can make a DAG wait for an upstream file","Large datasets should be passed between tasks through XCom"],"oc":[false,false,false,false],"a":3,"e":"XCom values live in the metadata database and are meant for small values. Large data belongs in external storage, and tasks pass its location."},{"n":181,"s":19,"lv":"E","q":"Apache Spark was originally developed at ______.","code":"","lang":"","chk":0,"o":["UC Berkeley's AMPLab","LinkedIn","Yahoo","Facebook"],"oc":[false,false,false,false],"a":0,"e":"Matei Zaharia started Spark at the AMPLab in 2009. It was donated to the Apache Software Foundation and became a top-level project in 2014."},{"n":182,"s":19,"lv":"E","q":"Spark itself is written mainly in ______.","code":"","lang":"","chk":0,"o":["R","Scala","C++","Python"],"oc":[false,false,false,false],"a":1,"e":"Spark's core runs on the JVM and is written in Scala. Python (PySpark), Java, R and SQL users reach the same engine through its APIs."},{"n":183,"s":19,"lv":"E","q":"Since Spark 2.0, what is the single entry point for working with DataFrames and Spark SQL?","code":"","lang":"","chk":0,"o":["HiveContext","SQLContext","SparkSession","StreamingContext"],"oc":[false,false,false,false],"a":2,"e":"SparkSession combines the older SQLContext and HiveContext and gives access to the SparkContext through spark.sparkContext."},{"n":184,"s":19,"lv":"M","q":"Point out the correct statement about Apache Spark.","code":"","lang":"","chk":0,"o":["One engine supports batch jobs, interactive SQL, streaming and machine learning","Spark keeps every intermediate result on disk, like MapReduce","Spark can be programmed only in Java","Spark can run only on top of Hadoop YARN"],"oc":[false,false,false,false],"a":0,"e":"Spark SQL, Structured Streaming, MLlib and GraphX are libraries on the same core engine. Spark can also run on its own cluster manager or Kubernetes, and supports Scala, Java, Python, R and SQL."},{"n":185,"s":19,"lv":"M","q":"What is the role of the driver program in a Spark application?","code":"","lang":"","chk":0,"o":["It stores the cached RDD partitions","It runs main(), creates the SparkContext, turns the job into a plan of stages and tasks, and schedules them on executors","It runs the tasks on each partition of the data","It replaces the cluster manager"],"oc":[false,false,false,false],"a":1,"e":"Executors on the worker nodes run the tasks and hold cached data. The driver coordinates them, and if the driver dies the application ends."},{"n":186,"s":19,"lv":"E","q":"Which Spark component is used for graph processing, such as PageRank?","code":"","lang":"","chk":0,"o":["GraphX","Spark SQL","MLlib","Structured Streaming"],"oc":[false,false,false,false],"a":0,"e":"GraphX provides a graph API and algorithms on top of RDDs. MLlib is for machine learning and Spark SQL for structured data."},{"n":187,"s":19,"lv":"M","q":"Which of these is NOT a cluster manager that Spark can run on?","code":"","lang":"","chk":0,"o":["Kubernetes","Spark standalone","ZooKeeper","Hadoop YARN"],"oc":[false,false,false,false],"a":2,"e":"ZooKeeper is a coordination service. It can give a standalone Spark master high availability, but it does not allocate cluster resources."},{"n":188,"s":19,"lv":"M","q":"What does  .master(\"local[*]\")  mean when a SparkSession is created?","code":"","lang":"","chk":0,"o":["Connect to a cluster master named \"local\"","Run Spark on every node of the cluster","Run Spark with exactly one thread","Run Spark on this machine with as many worker threads as it has logical cores"],"oc":[false,false,false,false],"a":3,"e":"local runs one thread, local[4] runs four threads and local[*] uses all cores. It is convenient for development and testing."},{"n":189,"s":19,"lv":"T","q":"What is the output of the following PySpark code?","code":"from pyspark.sql import SparkSession\ns1 = SparkSession.builder.appName(\"A\").getOrCreate()\ns2 = SparkSession.builder.appName(\"B\").getOrCreate()\nprint(s1 is s2, s1.sparkContext is s2.sparkContext)","lang":"py","chk":1,"o":["False True","True True","False False","True False"],"oc":[true,true,true,true],"a":1,"e":"getOrCreate() returns the session that already exists instead of building a new one. A JVM can have only one active SparkContext, so both names refer to the same objects."},{"n":190,"s":19,"lv":"E","q":"On which port does a running Spark application serve its web UI by default?","code":"","lang":"","chk":0,"o":["9870","8088","9092","4040"],"oc":[false,false,false,false],"a":3,"e":"The driver's UI shows jobs, stages, storage and executors on port 4040, or 4041 and above if 4040 is busy. 8088 is YARN's ResourceManager UI."},{"n":191,"s":20,"lv":"E","q":"What does RDD stand for?","code":"","lang":"","chk":0,"o":["Resilient Distributed Dataset","Reliable Data Directory","Replicated Distributed Database","Random Data Distribution"],"oc":[false,false,false,false],"a":0,"e":"An RDD is Spark's basic abstraction: an immutable collection of records split into partitions that are processed in parallel."},{"n":192,"s":20,"lv":"M","q":"Point out the wrong statement about RDDs.","code":"","lang":"","chk":0,"o":["Lost partitions can be recomputed from the RDD's lineage","An RDD can be modified in place after it is created","Transformations on an RDD are evaluated lazily","An RDD is divided into partitions processed in parallel"],"oc":[false,false,false,false],"a":1,"e":"RDDs are immutable; every transformation returns a new RDD. Lineage (the chain of transformations) is what makes them resilient."},{"n":193,"s":20,"lv":"E","q":"Which of these RDD operations is an action?","code":"","lang":"","chk":0,"o":["map()","flatMap()","filter()","collect()"],"oc":[true,true,true,true],"a":3,"e":"Actions such as collect, count, reduce, take and saveAsTextFile return a result to the driver or write output, which starts a job. Transformations only describe a new RDD."},{"n":194,"s":20,"lv":"M","q":"What is the output of the following PySpark code?","code":"rdd = sc.parallelize([1, 2, 3, 4, 5])\nprint(rdd.map(lambda x: x * 2).filter(lambda x: x > 4).collect())","lang":"py","chk":1,"o":["[2, 4, 6, 8, 10]","[5]","[6, 8, 10]","[3, 4, 5]"],"oc":[true,true,true,true],"a":2,"e":"map doubles each element to 2, 4, 6, 8, 10, and filter keeps only the values greater than 4."},{"n":195,"s":20,"lv":"T","q":"What is the output of the following PySpark code?","code":"lines = sc.parallelize([\"big data\", \"spark is fast\"])\nprint(lines.map(lambda l: l.split()).count(),\n      lines.flatMap(lambda l: l.split()).count())","lang":"py","chk":1,"o":["2 2","5 5","5 2","2 5"],"oc":[true,true,true,true],"a":3,"e":"map gives one element (a list of words) per line, so there are still 2 elements. flatMap flattens the lists into the 5 individual words."},{"n":196,"s":20,"lv":"M","q":"What is the output of the following PySpark code?","code":"pairs = sc.parallelize([(\"a\", 1), (\"b\", 2), (\"a\", 3), (\"b\", 4), (\"c\", 5)])\nprint(sorted(pairs.reduceByKey(lambda x, y: x + y).collect()))","lang":"py","chk":1,"o":["[('a', 3), ('b', 4), ('c', 5)]","[('a', 4), ('b', 6), ('c', 5)]","[('a', [1, 3]), ('b', [2, 4]), ('c', [5])]","[('a', 1), ('b', 2), ('c', 5)]"],"oc":[true,true,true,true],"a":1,"e":"reduceByKey merges all the values of each key with the given function: a = 1 + 3, b = 2 + 4, and c keeps 5. Grouping the values into lists is what groupByKey does."},{"n":197,"s":20,"lv":"M","q":"Why is reduceByKey usually preferred to groupByKey for aggregating values by key?","code":"","lang":"","chk":0,"o":["It combines values within each partition before the shuffle, so much less data crosses the network","It returns the values in sorted order","It works on DataFrames only","It does not cause a shuffle at all"],"oc":[false,false,false,false],"a":0,"e":"groupByKey sends every value over the network and holds all of a key's values in memory, which can cause out-of-memory errors for keys with many values."},{"n":198,"s":20,"lv":"M","q":"The folder data/ contains 3 text files with 10 lines each. What does  sc.textFile(\"data/\").count()  return?","code":"","lang":"","chk":1,"o":["30","3","10","1"],"oc":[false,false,false,false],"a":0,"e":"textFile accepts a file, a directory or a wildcard, and creates one element per line across all the files. wholeTextFiles would give one (filename, content) pair per file instead."},{"n":199,"s":20,"lv":"T","q":"The path /data/missing.txt does not exist. What happens when this PySpark code runs?","code":"rdd = sc.textFile(\"/data/missing.txt\")\nwords = rdd.flatMap(lambda l: l.split())\nprint(\"defined\")\nprint(words.count())","lang":"py","chk":1,"o":["It prints \"defined\" and then 0","The error is raised on the first line, before anything is printed","It prints \"defined\", and then count() fails because the input path does not exist","It prints \"defined\" and then None"],"oc":[false,false,false,false],"a":2,"e":"Transformations are lazy, so Spark does not even look for the file until an action needs the data. The error therefore appears at count()."},{"n":200,"s":20,"lv":"M","q":"Which of these transformations causes a shuffle (a wide transformation)?","code":"","lang":"","chk":0,"o":["map()","groupByKey()","filter()","flatMap()"],"oc":[true,true,true,true],"a":1,"e":"Narrow transformations produce each output partition from one input partition. groupByKey, reduceByKey, join and distinct must move data between partitions, which starts a new stage."},{"n":201,"s":21,"lv":"E","q":"What is a Spark DataFrame?","code":"","lang":"","chk":0,"o":["A distributed collection of rows organised into named columns, like a table","A stream of messages from Kafka","A file format for storing data","A single-machine pandas table"],"oc":[false,false,false,false],"a":0,"e":"A DataFrame has a schema, so Spark knows the column names and types and can optimise queries. In Scala it is a Dataset[Row]."},{"n":202,"s":21,"lv":"T","q":"Point out the correct statement about RDDs, DataFrames and Datasets.","code":"","lang":"","chk":0,"o":["RDD operations are optimised by the Catalyst optimizer","DataFrames have no schema","Datasets are available only in Python","The typed Dataset API is available in Scala and Java; Python and R use DataFrames"],"oc":[false,false,false,false],"a":3,"e":"A Dataset checks types at compile time, which Python cannot do. DataFrames and Datasets go through Catalyst; plain RDD code does not."},{"n":203,"s":21,"lv":"M","q":"Which Spark component optimises DataFrame and SQL queries but not plain RDD code?","code":"","lang":"","chk":0,"o":["The Catalyst optimizer","The DAG scheduler","The block manager","The shuffle service"],"oc":[false,false,false,false],"a":0,"e":"Catalyst rewrites the logical plan (for example by pushing filters down and pruning columns) and picks a physical plan. Tungsten then generates efficient code. RDD lambdas are opaque to it."},{"n":204,"s":21,"lv":"M","q":"What is the output of the following PySpark code?","code":"df = spark.createDataFrame(\n    [(\"Asha\", \"IT\", 50000), (\"Ravi\", \"HR\", 40000), (\"Meena\", \"IT\", 60000)],\n    [\"name\", \"dept\", \"salary\"])\nprint([r.name for r in df.filter(df.salary > 45000).select(\"name\").collect()])","lang":"py","chk":1,"o":["['Asha', 'Ravi', 'Meena']","['Ravi']","['Asha', 'Meena']","['Meena']"],"oc":[true,true,true,true],"a":2,"e":"filter keeps the rows whose salary is above 45000, which are Asha (50000) and Meena (60000)."},{"n":205,"s":21,"lv":"M","q":"Using the same DataFrame of Asha (IT, 50000), Ravi (HR, 40000) and Meena (IT, 60000), what does this code print?","code":"from pyspark.sql import functions as F\nout = df.groupBy(\"dept\").agg(F.avg(\"salary\").alias(\"avg\")).orderBy(\"dept\")\nprint([(r.dept, r.avg) for r in out.collect()])","lang":"py","chk":1,"o":["[('HR', 40000.0), ('IT', 60000.0)]","[('HR', 40000.0), ('IT', 55000.0)]","[('IT', 55000.0), ('HR', 40000.0)]","[('HR', 40000), ('IT', 110000)]"],"oc":[true,true,true,true],"a":1,"e":"IT averages (50000 + 60000) / 2 = 55000.0, and avg always returns a double. orderBy(\"dept\") puts HR before IT."},{"n":206,"s":21,"lv":"M","q":"What does  df.withColumn(\"bonus\", df.salary * 0.1)  do?","code":"","lang":"","chk":0,"o":["Fails, because new columns must be added with SQL","Replaces the salary column with bonus","Adds the bonus column to df in place","Returns a new DataFrame with an extra bonus column; df itself is unchanged"],"oc":[false,false,false,false],"a":3,"e":"DataFrames are immutable, so the result must be assigned, for example df2 = df.withColumn(...). If a column with that name already exists, it is replaced in the new DataFrame."},{"n":207,"s":21,"lv":"T","q":"What is the output of the following PySpark code?","code":"df2 = spark.createDataFrame([(1, \"a\"), (1, \"a\"), (2, \"b\"), (2, \"c\")], [\"id\", \"v\"])\nprint(df2.distinct().count(), df2.dropDuplicates([\"id\"]).count())","lang":"py","chk":1,"o":["2 2","3 3","3 2","4 2"],"oc":[true,true,true,true],"a":2,"e":"distinct() removes only rows that are identical in every column, leaving (1, a), (2, b) and (2, c). dropDuplicates([\"id\"]) keeps one row per id."},{"n":208,"s":21,"lv":"M","q":"How does Structured Streaming model a live data stream?","code":"","lang":"","chk":0,"o":["As a set of files that must be loaded by hand","As an unbounded table to which new rows keep being appended, queried incrementally","As a single RDD that never changes","As a fixed-size array that is overwritten"],"oc":[false,false,false,false],"a":1,"e":"You write the same DataFrame or SQL query you would write for static data, and Spark runs it incrementally as new data arrives."},{"n":209,"s":21,"lv":"M","q":"Which Structured Streaming output mode writes the entire updated result table to the sink on every trigger?","code":"","lang":"","chk":0,"o":["overwrite","update","append","complete"],"oc":[false,false,false,false],"a":3,"e":"complete mode suits small aggregation results. append writes only new rows that will never change, and update writes only the rows that changed since the last trigger."},{"n":210,"s":21,"lv":"T","q":"Point out the wrong statement about Structured Streaming.","code":"","lang":"","chk":1,"o":["Watermarks let the engine drop state for data that is too late","A checkpoint location lets a query recover after a failure","A streaming DataFrame can be displayed with df.show() like a static DataFrame","It processes data in micro-batches by default"],"oc":[false,false,false,false],"a":2,"e":"Calling show() on a streaming DataFrame raises an error saying that queries with streaming sources must be executed with writeStream.start(). The console sink is used to look at a stream's output."},{"n":211,"s":22,"lv":"M","q":"For an RDD, cache() is the same as calling persist() with which storage level?","code":"","lang":"","chk":1,"o":["OFF_HEAP","MEMORY_ONLY","MEMORY_AND_DISK","DISK_ONLY"],"oc":[false,false,false,false],"a":1,"e":"With MEMORY_ONLY, partitions that do not fit in memory are recomputed when needed. Other levels can be chosen with persist(StorageLevel...); DataFrames cache with a memory-and-disk level by default."},{"n":212,"s":22,"lv":"E","q":"How do you remove a cached RDD from memory before Spark evicts it on its own?","code":"","lang":"","chk":0,"o":["rdd.unpersist()","del rdd.cache","rdd.clear()","rdd.delete()"],"oc":[true,true,true,true],"a":0,"e":"Otherwise Spark drops cached partitions in least-recently-used order when it needs memory. Calling unpersist() frees memory as soon as the data is no longer needed."},{"n":213,"s":22,"lv":"M","q":"What is a broadcast variable in Spark?","code":"","lang":"","chk":0,"o":["A value that changes on every task","A variable that is written to HDFS","A read-only value sent once to each executor and cached there, instead of being shipped with every task","A variable that tasks can add to and the driver reads"],"oc":[false,false,false,false],"a":2,"e":"Broadcasting a lookup table of, say, 50 MB avoids sending a copy inside every task closure. Tasks read it through bc.value."},{"n":214,"s":22,"lv":"M","q":"Point out the correct statement about accumulators.","code":"","lang":"","chk":0,"o":["Accumulators can only hold strings","Tasks can read the current total of an accumulator","Accumulators are read-only values sent to executors","Tasks can only add to an accumulator, and only the driver can read its value"],"oc":[false,false,false,false],"a":3,"e":"Accumulators are used for counters and sums, such as counting bad records. Updates made inside actions are applied exactly once; updates made inside transformations can be applied again if tasks are rerun."},{"n":215,"s":22,"lv":"T","q":"What is the output of the following PySpark code?","code":"acc = sc.accumulator(0)\ndef tag(x):\n    acc.add(1)\n    return x\nrdd = sc.parallelize(range(5)).map(tag)\nprint(acc.value)\nrdd.count()\nrdd.count()\nprint(acc.value)","lang":"py","chk":1,"o":["10 10","0 10","5 10","0 5"],"oc":[true,true,true,true],"a":1,"e":"Nothing runs until the first action, so the first print shows 0. The RDD is not cached, so each count() reruns map() and adds 5 again, giving 10. Accumulator updates in transformations can be counted more than once."},{"n":216,"s":22,"lv":"M","q":"Point out the correct statement about repartition() and coalesce().","code":"","lang":"","chk":0,"o":["They are exactly the same","coalesce() always does a full shuffle","repartition() can only reduce the number of partitions","coalesce() reduces the number of partitions without a full shuffle; repartition() always does a full shuffle and can increase or decrease it"],"oc":[false,false,false,false],"a":3,"e":"coalesce merges existing partitions, which is cheap, for example before writing fewer output files. repartition redistributes all data evenly across the new number of partitions."},{"n":217,"s":22,"lv":"T","q":"What is the output of the following PySpark code?","code":"rdd = sc.parallelize(range(100), 8)\nprint(rdd.coalesce(2).getNumPartitions(),\n      rdd.coalesce(16).getNumPartitions(),\n      rdd.repartition(16).getNumPartitions())","lang":"py","chk":1,"o":["2 16 16","2 8 16","8 8 16","2 16 8"],"oc":[true,true,true,true],"a":1,"e":"coalesce cannot increase the number of partitions without a shuffle, so asking for 16 leaves 8. repartition always shuffles and gives exactly 16."},{"n":218,"s":22,"lv":"M","q":"Below what default size does Spark SQL automatically broadcast a table in a join?","code":"","lang":"","chk":1,"o":["10 MB","1 GB","128 MB","1 MB"],"oc":[false,false,false,false],"a":0,"e":"spark.sql.autoBroadcastJoinThreshold defaults to 10 MB. The small side is copied to every executor, so the large side does not have to be shuffled. The broadcast() hint forces it."},{"n":219,"s":22,"lv":"M","q":"What is the default value of spark.sql.shuffle.partitions, the number of partitions used after a shuffle in DataFrame joins and aggregations?","code":"","lang":"","chk":1,"o":["The number of cores","8","200","1000"],"oc":[false,false,false,false],"a":2,"e":"200 is often too many for small data and too few for very large data, so it is commonly tuned. Adaptive query execution can also merge small shuffle partitions at run time."},{"n":220,"s":22,"lv":"T","q":"What does  spark-submit --master yarn --deploy-mode cluster app.py  do differently from client mode?","code":"","lang":"","chk":0,"o":["The job runs in local mode","The driver runs inside the cluster (in YARN's ApplicationMaster container) instead of on the machine that submitted the job","The job runs without any executors","The executors run on the submitting machine"],"oc":[false,false,false,false],"a":1,"e":"Cluster mode suits production jobs: closing the submitting terminal does not kill the driver. Client mode keeps the driver local, which is handy for interactive work and debugging."},{"n":221,"s":23,"lv":"M","q":"What is the output of this word count written in PySpark?","code":"text = sc.parallelize([\"to be or not to be\"])\ncounts = (text.flatMap(lambda l: l.split())\n              .map(lambda w: (w, 1))\n              .reduceByKey(lambda a, b: a + b))\nprint(sorted(counts.collect()))","lang":"py","chk":1,"o":["[('to', 2), ('be', 2), ('or', 1), ('not', 1)]","[('to be or not to be', 1)]","[('be', 1), ('not', 1), ('or', 1), ('to', 1)]","[('be', 2), ('not', 1), ('or', 1), ('to', 2)]"],"oc":[true,true,true,true],"a":3,"e":"flatMap splits the line into words, map turns each word into (word, 1) and reduceByKey adds the ones. sorted() orders the pairs by word."},{"n":222,"s":23,"lv":"M","q":"In that word count, which Spark operation plays the role of MapReduce's shuffle-and-reduce step?","code":"","lang":"","chk":0,"o":["flatMap","map","reduceByKey","parallelize"],"oc":[true,true,true,true],"a":2,"e":"flatMap and map do the work of the map phase. reduceByKey groups the pairs by key across partitions (the shuffle) and combines their values (the reduce)."},{"n":223,"s":23,"lv":"M","q":"Point out the correct statement about running Spark without Hadoop.","code":"","lang":"","chk":0,"o":["Spark can run on its own standalone cluster manager and read local files or cloud storage such as S3","Spark cannot start unless HDFS is installed","Without Hadoop, Spark can run only in Python","Spark needs YARN to run any job"],"oc":[false,false,false,false],"a":0,"e":"Spark uses Hadoop's client libraries to read many formats, but HDFS and YARN are optional. Databricks and many Kubernetes setups run Spark with object storage instead."},{"n":224,"s":23,"lv":"M","q":"When Spark is run together with Hadoop, what does it usually take from Hadoop?","code":"","lang":"","chk":0,"o":["HBase as its scheduler","MapReduce as its execution engine","Hive as its programming language","HDFS for storage and YARN for resource management"],"oc":[false,false,false,false],"a":3,"e":"Spark replaces MapReduce as the processing engine, but it can read data from HDFS with data locality and share the cluster with other jobs through YARN."},{"n":225,"s":23,"lv":"M","q":"Which statement about Spark is false?","code":"","lang":"","chk":0,"o":["Spark includes its own distributed file system that replaces HDFS","Spark can read data from HDFS","Spark can run under YARN","Spark can read data from Amazon S3"],"oc":[false,false,false,false],"a":0,"e":"Spark is a processing engine and has no storage system of its own. It reads and writes HDFS, S3, ADLS, local files, databases and more."},{"n":226,"s":23,"lv":"E","q":"Which URI scheme reads data from Amazon S3 through the Hadoop S3A connector?","code":"","lang":"","chk":0,"o":["file://bucket/data/","hdfs://bucket/data/","s3a://bucket/data/","jdbc://bucket/data/"],"oc":[true,true,true,true],"a":2,"e":"s3a:// is the maintained Hadoop connector for S3. hdfs:// reads HDFS and file:// reads the local file system. Amazon EMR also accepts s3:// through EMRFS."},{"n":227,"s":23,"lv":"T","q":"To submit Spark applications to a Hadoop YARN cluster, what must Spark be able to find?","code":"","lang":"","chk":0,"o":["A running Kafka broker","The Hive metastore password","The HBase master address","The Hadoop configuration directory, through HADOOP_CONF_DIR or YARN_CONF_DIR"],"oc":[false,false,false,false],"a":3,"e":"The configuration files tell Spark where the ResourceManager and the HDFS NameNode are. With --master yarn, Spark reads those addresses from the configuration instead of the URL."},{"n":228,"s":23,"lv":"E","q":"In a Spark JDBC read, which option names the database table to read?","code":"","lang":"","chk":0,"o":["dbtable","subscribe","path","tablename"],"oc":[true,true,true,true],"a":0,"e":"A typical read is spark.read.format(\"jdbc\").option(\"url\", ...).option(\"dbtable\", \"emp\").option(\"user\", ...).option(\"password\", ...).load(). The database's JDBC driver JAR must be on Spark's classpath."},{"n":229,"s":23,"lv":"T","q":"A Spark JDBC read uses partitionColumn=\"id\", lowerBound=1, upperBound=1000 and numPartitions=4. Point out the correct statement.","code":"","lang":"","chk":0,"o":["Spark reads the table four times","Rows with id below 1 or above 1000 are filtered out","lowerBound and upperBound only set the partition stride; rows with id outside 1 to 1000 are still read","The id column must be a string"],"oc":[false,false,false,false],"a":2,"e":"The bounds decide how the id range is split among the 4 parallel queries. Rows outside the range fall into the first or last partition, so a filter must be added explicitly if rows should be excluded."},{"n":230,"s":23,"lv":"M","q":"Why is Spark much faster than MapReduce for iterative algorithms such as k-means?","code":"","lang":"","chk":0,"o":["Spark uses a faster programming language","MapReduce writes intermediate results to HDFS between jobs, while Spark can keep the working dataset in memory across iterations","MapReduce cannot run more than one iteration","Spark skips the shuffle phase"],"oc":[false,false,false,false],"a":1,"e":"Each pass of an iterative algorithm reads the same data. Caching it in memory avoids repeated disk reads and job start-up costs."},{"n":231,"s":24,"lv":"E","q":"Which DataFrame method prints the column names, data types and nullability of a DataFrame as a tree?","code":"","lang":"","chk":0,"o":["show()","columns()","printSchema()","describe()"],"oc":[true,true,true,true],"a":2,"e":"printSchema() is usually the first EDA step after loading data. df.columns returns just the column names, and df.dtypes returns (name, type) pairs."},{"n":232,"s":24,"lv":"M","q":"people.csv contains the header \"name,age\" and the rows \"Asha,23\" and \"Ravi,31\". What does this code print?","code":"df = spark.read.csv(\"people.csv\", header=True)\nprint(df.dtypes)","lang":"py","chk":1,"o":["[('_c0', 'string'), ('_c1', 'string')]","[('name', 'string'), ('age', 'bigint')]","[('name', 'string'), ('age', 'int')]","[('name', 'string'), ('age', 'string')]"],"oc":[true,true,true,true],"a":3,"e":"Without inferSchema=True, every CSV column is read as a string. Add inferSchema=True (one extra pass over the data) or give an explicit schema to get numeric types."},{"n":233,"s":24,"lv":"E","q":"Which statistics does df.describe() compute for numeric columns?","code":"","lang":"","chk":0,"o":["count, mean, stddev, min and max","The data type of each column","The 25th, 50th and 75th percentiles only","Only the number of null values"],"oc":[false,false,false,false],"a":0,"e":"df.summary() returns the same statistics plus the 25%, 50% and 75% percentiles."},{"n":234,"s":24,"lv":"T","q":"What is the output of the following PySpark code?","code":"df = spark.createDataFrame([(1, None), (2, 5.0), (None, 7.0)], \"id INT, score DOUBLE\")\nprint(df.na.drop().count(),\n      df.na.drop(subset=[\"score\"]).count(),\n      df.na.fill(0).filter(\"score = 0\").count())","lang":"py","chk":1,"o":["2 2 0","1 2 1","3 2 1","1 1 1"],"oc":[true,true,true,true],"a":1,"e":"na.drop() removes rows with a null in any column, which leaves only (2, 5.0). With subset=[\"score\"] only the first row is removed. na.fill(0) replaces nulls in numeric columns, so one score becomes 0."},{"n":235,"s":24,"lv":"M","q":"Which expression converts the string column age to an integer column?","code":"","lang":"","chk":0,"o":["df.withColumn(\"age\", F.col(\"age\").cast(\"int\"))","df.convert(\"age\", \"int\")","df.age.toInt()","df.withColumn(\"age\", int(df.age))"],"oc":[true,true,true,true],"a":0,"e":"cast() changes a column's type inside Spark. Python's int() cannot be applied to a Column, and DataFrames have no convert or toInt methods."},{"n":236,"s":24,"lv":"M","q":"What does this expression compute?","code":"df.select([F.count(F.when(F.col(c).isNull(), c)).alias(c) for c in df.columns])","lang":"py","chk":0,"o":["The total number of rows, repeated for each column","The number of null values in each column","The number of non-null values in each column","The number of distinct values in each column"],"oc":[false,false,false,false],"a":1,"e":"when() gives a value only for rows where the column is null, and count() counts the values that are not null, so each output column holds that column's null count."},{"n":237,"s":24,"lv":"E","q":"Which code shows how many rows there are for each city?","code":"","lang":"","chk":0,"o":["df.city.count()","df.count(\"city\").show()","df.groupBy(\"city\").count().show()","df.select(\"city\").distinct().show()"],"oc":[true,true,true,true],"a":2,"e":"groupBy followed by count() gives a frequency table, one of the most common EDA steps for categorical columns. distinct() lists the cities without counting them."},{"n":238,"s":24,"lv":"T","q":"What does  df.approxQuantile(\"salary\", [0.5], 0.0)  return?","code":"","lang":"","chk":0,"o":["The mean of salary","The value at row number 0.5","Half of the rows of the DataFrame","The exact median of salary, because the relative error is 0"],"oc":[false,false,false,false],"a":3,"e":"approxQuantile takes a list of probabilities and a relative error. An error of 0 computes exact quantiles, which costs more on large data."},{"n":239,"s":24,"lv":"M","q":"What does  df.stat.corr(\"height\", \"weight\")  return?","code":"","lang":"","chk":0,"o":["The covariance matrix of all columns","The Pearson correlation coefficient between the two columns","The number of rows where both columns are equal","A scatter plot of the two columns"],"oc":[false,false,false,false],"a":1,"e":"The value lies between -1 and 1 and measures how strongly the two columns are linearly related. Plots are usually drawn after converting a sample with toPandas()."},{"n":240,"s":24,"lv":"T","q":"What is the output of the following PySpark code?","code":"from pyspark.sql import functions as F\ndf = spark.createDataFrame([(\"a\", 10), (\"b\", 20), (\"a\", 30), (\"c\", None)], \"k STRING, v INT\")\nr = df.agg(F.count(\"*\"), F.count(\"v\"), F.avg(\"v\"), F.countDistinct(\"k\")).first()\nprint(list(r))","lang":"py","chk":1,"o":["[4, 3, 20.0, 3]","[4, 3, 15.0, 4]","[3, 3, 20.0, 3]","[4, 4, 15.0, 3]"],"oc":[true,true,true,true],"a":0,"e":"count(\"*\") counts all 4 rows, but count(\"v\") and avg(\"v\") ignore the null, so the average is 60 / 3 = 20.0. There are 3 distinct values of k."},{"n":241,"s":25,"lv":"E","q":"Apache Kafka was originally developed at ______.","code":"","lang":"","chk":0,"o":["Facebook","UC Berkeley","Twitter","LinkedIn"],"oc":[false,false,false,false],"a":3,"e":"Jay Kreps, Neha Narkhede and Jun Rao built Kafka at LinkedIn to handle activity streams. It was open-sourced in 2011 and became an Apache top-level project in 2012."},{"n":242,"s":25,"lv":"E","q":"What is Apache Kafka?","code":"","lang":"","chk":0,"o":["A distributed event-streaming platform that stores streams of records in a fault-tolerant, partitioned log","A cluster resource manager","A batch processing engine that replaces MapReduce","A relational database for transactions"],"oc":[false,false,false,false],"a":0,"e":"Producers publish records to topics, Kafka stores them durably for a retention period, and any number of consumers read them at their own pace."},{"n":243,"s":25,"lv":"E","q":"In Kafka, what identifies the position of a record within a partition?","code":"","lang":"","chk":0,"o":["Its key","The broker id","Its offset, a sequential number unique within that partition","Its timestamp"],"oc":[false,false,false,false],"a":2,"e":"Each partition is an append-only log, and offsets increase by one for each new record. Consumers track their progress by offset."},{"n":244,"s":25,"lv":"M","q":"Kafka guarantees the order of records ______.","code":"","lang":"","chk":0,"o":["within a single partition only","across all partitions of a topic","never","across all topics in the cluster"],"oc":[false,false,false,false],"a":0,"e":"Records in different partitions are read in parallel, so there is no global order. To keep related events in order, give them the same key so they land in the same partition."},{"n":245,"s":25,"lv":"E","q":"What is a Kafka broker?","code":"","lang":"","chk":0,"o":["A client that writes records","A schema registry","A client that reads records","A Kafka server that stores topic partitions and serves producer and consumer requests"],"oc":[false,false,false,false],"a":3,"e":"A Kafka cluster is a set of brokers. Each partition is stored on one or more brokers, according to its replication factor."},{"n":246,"s":25,"lv":"M","q":"Point out the correct statement about Kafka replication.","code":"","lang":"","chk":0,"o":["Followers keep different data from the leader","All replicas accept writes at the same time","Each partition has one leader replica that handles reads and writes, and follower replicas that copy it","Replication is done by the producer sending to every broker"],"oc":[false,false,false,false],"a":2,"e":"Followers that are fully caught up form the in-sync replica set (ISR). If the leader fails, a member of the ISR becomes the new leader."},{"n":247,"s":25,"lv":"T","q":"A topic has 3 partitions, and a consumer group of 5 consumers subscribes to it. How many consumers in the group receive records?","code":"","lang":"","chk":0,"o":["3","5","1","15"],"oc":[false,false,false,false],"a":0,"e":"Within a group, each partition is assigned to exactly one consumer, so at most 3 consumers can be busy and the other 2 sit idle. Adding partitions is how a group's parallelism is raised."},{"n":248,"s":25,"lv":"M","q":"For how long does Kafka keep records by default?","code":"","lang":"","chk":0,"o":["Forever","7 days (168 hours)","Until a consumer reads them","24 hours"],"oc":[false,false,false,false],"a":1,"e":"log.retention.hours defaults to 168. Reading a record does not delete it, which is why many consumer groups can read the same data. Retention can also be set by size, or replaced by log compaction."},{"n":249,"s":25,"lv":"M","q":"In recent Kafka versions, which mechanism manages cluster metadata in place of ZooKeeper?","code":"","lang":"","chk":0,"o":["KRaft, a built-in Raft-based controller quorum","The Hive metastore","The producer client","YARN"],"oc":[false,false,false,false],"a":0,"e":"KRaft moves metadata management into Kafka itself, which simplifies deployment and scales to more partitions. Kafka 4.0 removed ZooKeeper mode entirely."},{"n":250,"s":25,"lv":"E","q":"On which port does a Kafka broker listen by default?","code":"","lang":"","chk":0,"o":["2181","9092","4040","8083"],"oc":[false,false,false,false],"a":1,"e":"2181 is ZooKeeper's client port, 8083 is the Kafka Connect REST API and 4040 is a Spark application's UI."},{"n":251,"s":26,"lv":"M","q":"In the older Spark Streaming (DStream) API, what is a DStream?","code":"","lang":"","chk":0,"o":["A continuous sequence of RDDs, one for each batch interval","A Kafka topic","A single RDD that grows forever","A DataFrame with a streaming schema"],"oc":[false,false,false,false],"a":0,"e":"Spark Streaming cuts the input into small batches and processes each one as an RDD. Structured Streaming, built on DataFrames, is the newer API."},{"n":252,"s":26,"lv":"M","q":"What does the 5 mean in  ssc = StreamingContext(sc, 5) ?","code":"","lang":"","chk":0,"o":["Data is kept for 5 minutes","5 executors are used","The batch interval is 5 seconds","5 receivers are started"],"oc":[false,false,false,false],"a":2,"e":"Every 5 seconds the data received so far becomes one RDD of the DStream and is processed as a small batch job."},{"n":253,"s":26,"lv":"E","q":"In Structured Streaming, which call actually starts a streaming query?","code":"","lang":"","chk":0,"o":["spark.readStream.load()","df.writeStream...start()","df.show()","df.collect()"],"oc":[true,true,true,true],"a":1,"e":"readStream only defines the source, and nothing runs until writeStream...start() returns a StreamingQuery. Then call awaitTermination() so the program keeps running."},{"n":254,"s":26,"lv":"T","q":"Events are grouped with  window(col(\"ts\"), \"10 minutes\", \"5 minutes\").  Into how many windows does a single event at 10:07 fall?","code":"","lang":"","chk":1,"o":["2","1","5","10"],"oc":[false,false,false,false],"a":0,"e":"Windows are 10 minutes long and start every 5 minutes, so they overlap. The event at 10:07 belongs to [10:00, 10:10) and to [10:05, 10:15). In general an event falls into window length divided by slide windows."},{"n":255,"s":26,"lv":"M","q":"What does  withWatermark(\"ts\", \"10 minutes\")  do in a streaming aggregation?","code":"","lang":"","chk":0,"o":["It filters out events newer than 10 minutes","It delays every result by exactly 10 minutes","It keeps all state forever","It lets Spark drop state, and ignore data, more than 10 minutes older than the latest event time seen"],"oc":[false,false,false,false],"a":3,"e":"Without a watermark, state for old windows would grow forever. The watermark tells Spark how late data may arrive before a window is considered final."},{"n":256,"s":26,"lv":"M","q":"What does  .trigger(processingTime=\"30 seconds\")  set for a streaming query?","code":"","lang":"","chk":0,"o":["Checkpoints are deleted every 30 seconds","The query stops after 30 seconds","A micro-batch is started every 30 seconds","Each record is processed 30 seconds after it arrives"],"oc":[false,false,false,false],"a":2,"e":"Without a trigger, Spark starts the next micro-batch as soon as the previous one finishes. availableNow processes the data available now and then stops."},{"n":257,"s":26,"lv":"M","q":"What is stored in a streaming query's checkpointLocation?","code":"","lang":"","chk":0,"o":["The progress (source offsets) and state needed to restart the query after a failure","The final output data","The Spark UI logs","The source code of the application"],"oc":[false,false,false,false],"a":0,"e":"On restart, Spark reads the checkpoint and resumes from where it stopped, which is the basis of its fault-tolerance guarantees. The checkpoint should be on reliable storage such as HDFS or S3."},{"n":258,"s":26,"lv":"E","q":"Which Structured Streaming sink prints each micro-batch's output and is meant only for debugging?","code":"","lang":"","chk":0,"o":["parquet","foreachBatch","console","kafka"],"oc":[false,false,false,false],"a":2,"e":"The console sink prints to the driver's standard output. The memory sink, which stores results in an in-memory table, is also for testing only."},{"n":259,"s":26,"lv":"M","q":"What is the difference between event time and processing time?","code":"","lang":"","chk":0,"o":["Event time is measured in batches; processing time in seconds","They are always identical","Event time is when Spark processes the record; processing time is when it was created","Event time is when the event happened, carried in the data; processing time is when Spark processes it"],"oc":[false,false,false,false],"a":3,"e":"Network delays and outages make data arrive late or out of order. Windowing on event time, with a watermark, gives correct results even then."},{"n":260,"s":26,"lv":"M","q":"What does foreachBatch let a Structured Streaming query do?","code":"","lang":"","chk":0,"o":["Read from several sources at once","Run any batch DataFrame code, such as a JDBC write, on the output of each micro-batch","Run a query only once","Process each record one at a time on the driver"],"oc":[false,false,false,false],"a":1,"e":"foreachBatch gives you each micro-batch as an ordinary DataFrame plus a batch id. That lets you reuse batch writers for sinks that have no streaming connector."},{"n":261,"s":27,"lv":"M","q":"Which code reads the Kafka topic \"orders\" as a streaming DataFrame?","code":"","lang":"","chk":0,"o":["sc.textFile(\"kafka://orders\")","spark.read.kafka(\"orders\")","spark.readStream.table(\"orders\").option(\"broker\", \"host:9092\")","spark.readStream.format(\"kafka\").option(\"kafka.bootstrap.servers\", \"host:9092\").option(\"subscribe\", \"orders\").load()"],"oc":[true,true,true,true],"a":3,"e":"The Kafka source needs the bootstrap servers and one of subscribe, subscribePattern or assign. Kafka client options are passed with the kafka. prefix."},{"n":262,"s":27,"lv":"M","q":"Why is  CAST(value AS STRING)  usually applied after reading from Kafka in Spark?","code":"","lang":"","chk":0,"o":["Kafka stores only integers","The key and value columns arrive as binary","The cast removes duplicate messages","Spark cannot read strings from Kafka"],"oc":[false,false,false,false],"a":1,"e":"Kafka stores bytes, and the source DataFrame has binary key and value columns plus topic, partition, offset, timestamp and timestampType. After the cast, JSON can be parsed with from_json()."},{"n":263,"s":27,"lv":"M","q":"What must be added to a Spark application to use the Kafka source and sink?","code":"","lang":"","chk":0,"o":["The Hive JDBC driver","Nothing; Kafka support is built into Spark core","The HBase client library","The spark-sql-kafka-0-10 connector package, for example with --packages"],"oc":[false,false,false,false],"a":3,"e":"The connector is a separate module. Its version must match the Spark and Scala versions in use."},{"n":264,"s":27,"lv":"T","q":"If startingOffsets is not set, where does a new streaming query on a Kafka topic start reading?","code":"","lang":"","chk":0,"o":["At a random position","At the latest offsets, so only new records are read","At the earliest offsets","At offset 1000"],"oc":[false,false,false,false],"a":1,"e":"For streaming queries the default is \"latest\". Set startingOffsets to \"earliest\" to read existing data, or give exact offsets per partition. Batch reads default to \"earliest\"."},{"n":265,"s":27,"lv":"M","q":"Which column must a DataFrame have to be written to Kafka with Spark's Kafka sink?","code":"","lang":"","chk":0,"o":["value","timestamp","offset","partition"],"oc":[false,false,false,false],"a":0,"e":"value (string or binary) is required; key is optional. The target topic comes from the topic option or a topic column."},{"n":266,"s":27,"lv":"M","q":"Records in a Kafka topic are JSON strings. Which function turns the value into structured columns?","code":"","lang":"","chk":0,"o":["split(col(\"value\"), \",\")","from_json(col(\"value\").cast(\"string\"), schema)","to_json(col(\"value\"))","explode(col(\"value\"))"],"oc":[true,true,true,true],"a":1,"e":"from_json parses a JSON string using a schema you supply, producing a struct whose fields can be selected, for example parsed.*. to_json does the reverse."},{"n":267,"s":27,"lv":"T","q":"Point out the correct statement about how Structured Streaming tracks its progress on Kafka.","code":"","lang":"","chk":0,"o":["Spark stores the processed offsets in the query's checkpoint and does not rely on committed consumer-group offsets","Spark commits every offset to Kafka and reads it back on restart","Spark always starts from the earliest offset after a restart","Kafka tracks Spark's progress through ZooKeeper"],"oc":[false,false,false,false],"a":0,"e":"Keeping offsets in the checkpoint together with the state lets Spark restart from exactly where it stopped. With a replayable source and an idempotent sink, this gives end-to-end exactly-once results."},{"n":268,"s":27,"lv":"M","q":"Which of these is NOT a managed Apache Kafka service?","code":"","lang":"","chk":0,"o":["Aiven for Apache Kafka","Confluent Cloud","Amazon MSK","Amazon SQS"],"oc":[false,false,false,false],"a":3,"e":"Amazon SQS is a message queue with its own API, not Kafka. MSK, Confluent Cloud and Aiven run real Kafka clusters for you."},{"n":269,"s":27,"lv":"M","q":"In what order are the stages of a typical Kafka-to-Spark stream processing application?","code":"","lang":"","chk":0,"o":["Write to a sink, read from Kafka, then aggregate","Checkpoint, then read from Kafka, with no transformation","Read from Kafka, parse and transform, aggregate with windows and a watermark, write to a sink with a checkpoint","Aggregate, read from Kafka, then parse"],"oc":[false,false,false,false],"a":2,"e":"The DataFrame is built step by step from the source, and writeStream with a checkpointLocation starts the query at the end."},{"n":270,"s":27,"lv":"M","q":"Which Kafka source option subscribes to every topic whose name starts with \"logs-\"?","code":"","lang":"","chk":0,"o":["subscribePattern = \"logs-.*\"","subscribe = \"logs-*\"","assign = \"logs-\"","topic = \"logs-%\""],"oc":[true,true,true,true],"a":0,"e":"subscribePattern takes a Java regular expression, and new topics that match are picked up. subscribe takes a comma-separated list of exact topic names."},{"n":271,"s":28,"lv":"M","q":"What does setting acks=all on a Kafka producer mean?","code":"","lang":"","chk":0,"o":["Every consumer must read the record before it is acknowledged","The leader waits until all in-sync replicas have the record before acknowledging it","Only the leader must write the record","The producer does not wait for any acknowledgement"],"oc":[false,false,false,false],"a":1,"e":"acks=all gives the strongest durability. acks=1 waits only for the leader, and acks=0 does not wait at all, which is fastest but can lose data."},{"n":272,"s":28,"lv":"M","q":"Why would a producer give a key, such as customer_id, to each record?","code":"","lang":"","chk":0,"o":["The key makes the record expire sooner","Keyed records skip replication","The key encrypts the record","Records with the same key go to the same partition, which keeps them in order"],"oc":[false,false,false,false],"a":3,"e":"The default partitioner hashes the key to choose a partition. All events for one customer therefore stay in order and are handled by the same consumer."},{"n":273,"s":28,"lv":"M","q":"Where does Kafka store the offsets that consumer groups commit?","code":"","lang":"","chk":0,"o":["In the producer","In the Hive metastore","In the internal topic __consumer_offsets","In each consumer's local disk only"],"oc":[false,false,false,false],"a":2,"e":"Committed offsets tell a consumer group where to resume after a restart or rebalance. Older Kafka versions kept them in ZooKeeper."},{"n":274,"s":28,"lv":"M","q":"A new consumer group starts with auto.offset.reset=earliest and has no committed offsets. Where does it start reading?","code":"","lang":"","chk":0,"o":["From the middle of each partition","It fails to start","Only from new records","From the beginning of each partition"],"oc":[false,false,false,false],"a":3,"e":"The default is latest, which reads only records produced after the consumer starts. The setting applies only when the group has no committed offset or the offset has been deleted."},{"n":275,"s":28,"lv":"E","q":"What does this command do?","code":"kafka-console-consumer.sh --bootstrap-server localhost:9092 \\\n    --topic orders --from-beginning","lang":"sh","chk":0,"o":["Creates the orders topic","Prints every record of the orders topic from the start, and then keeps printing new ones","Deletes the orders topic","Sends records typed on the keyboard to the orders topic"],"oc":[false,false,false,false],"a":1,"e":"The console consumer is handy for checking that data is arriving. kafka-console-producer.sh sends typed lines, and kafka-topics.sh creates or describes topics."},{"n":276,"s":28,"lv":"T","q":"A cluster has only 1 broker. What happens when this command is run?","code":"kafka-topics.sh --create --topic orders --partitions 3 \\\n    --replication-factor 2 --bootstrap-server localhost:9092","lang":"sh","chk":0,"o":["It fails, because the replication factor cannot be larger than the number of brokers","It creates the topic and starts a second broker","It creates both replicas on the same broker","It creates the topic with replication factor 1"],"oc":[false,false,false,false],"a":0,"e":"Each replica of a partition must be on a different broker. Kafka reports an InvalidReplicationFactorException; on a single-broker test setup use --replication-factor 1."},{"n":277,"s":28,"lv":"E","q":"What is Kafka Connect?","code":"","lang":"","chk":0,"o":["A command-line tool for creating topics","A Spark library for reading Kafka","A framework for streaming data between Kafka and other systems through ready-made source and sink connectors","The protocol consumers use to join a group"],"oc":[false,false,false,false],"a":2,"e":"Connect moves data in and out of Kafka through configuration instead of hand-written producer and consumer code. Kafka Streams is the library for processing data inside Kafka."},{"n":278,"s":28,"lv":"M","q":"A JDBC source connector and an S3 sink connector run in Kafka Connect. Point out the correct statement.","code":"","lang":"","chk":0,"o":["The JDBC source copies database rows into Kafka topics, and the S3 sink copies topic data out to S3","The source connector reads Kafka topics and the sink writes to Kafka","Both copy data from S3 into the database","Connectors run inside the Kafka brokers"],"oc":[false,false,fa
