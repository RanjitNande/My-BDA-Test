CASE statement of stored programs ends with END CASE. The CASE expression used inside a query ends with END only."}, {"n": 136, "s": 11, "lv": "T", "q": "What will be the output of the following code?", "code": "DELIMITER //\nCREATE PROCEDURE w()\nBEGIN\n  DECLARE i INT DEFAULT 1;\n  DECLARE s INT DEFAULT 0;\n  WHILE i <= 5 DO\n    SET s = s + i;\n    SET i = i + 2;\n  END WHILE;\n  SELECT s, i;\nEND //\nDELIMITER ;\nCALL w();", "o": ["9, 5", "9, 7", "4, 5", "15, 6"], "oc": [false, false, false, false], "a": 1, "e": "i takes the values 1, 3 and 5, so s = 1 + 3 + 5 = 9. After the last pass i becomes 7 and the condition 7 <= 5 fails."}, {"n": 137, "s": 11, "lv": "T", "q": "What will be the output of the following code?", "code": "DELIMITER //\nCREATE PROCEDURE r()\nBEGIN\n  DECLARE i INT DEFAULT 10;\n  REPEAT\n    SET i = i + 1;\n  UNTIL i > 5 END REPEAT;\n  SELECT i;\nEND //\nDELIMITER ;\nCALL r();", "o": ["The loop never ends", "10", "6", "11"], "oc": [false, false, false, false], "a": 3, "e": "REPEAT executes its body once before testing the condition. i becomes 11, and 11 > 5 is true, so the loop ends after one pass."}, {"n": 138, "s": 11, "lv": "T", "q": "What will be the output of the following code?", "code": "DELIMITER //\nCREATE PROCEDURE l()\nBEGIN\n  DECLARE i INT DEFAULT 0;\n  DECLARE s INT DEFAULT 0;\n  lp: LOOP\n    SET i = i + 1;\n    IF i = 3 THEN ITERATE lp; END IF;\n    IF i > 5 THEN LEAVE lp; END IF;\n    SET s = s + i;\n  END LOOP;\n  SELECT s;\nEND //\nDELIMITER ;\nCALL l();", "o": ["15", "12", "10", "9"], "oc": [false, false, false, false], "a": 1, "e": "ITERATE skips the addition when i is 3, and LEAVE ends the loop when i reaches 6. s = 1 + 2 + 4 + 5 = 12."}, {"n": 139, "s": 12, "lv": "E", "q": "The keyword used to transfer control, together with a value, from a stored function back to its caller is ______.", "code": "", "o": ["LEAVE", "GOTO", "EXIT", "RETURN"], "oc": [false, false, false, false], "a": 3, "e": "A stored function declares its result type with RETURNS and sends the value back with RETURN."}, {"n": 140, "s": 12, "lv": "E", "q": "Which of the following functions returns the current date and time?", "code": "", "o": ["CURTIME()", "NOW()", "TIMESTAMP()", "CURDATE()"], "oc": [false, false, false, false], "a": 1, "e": "NOW() and CURRENT_TIMESTAMP return the date and time. CURDATE() returns only the date and CURTIME() only the time."}, {"n": 141, "s": 12, "lv": "E", "q": "Which function joins two or more strings into one?", "code": "", "o": ["MERGE()", "CONCAT()", "APPEND()", "JOIN()"], "oc": [false, false, false, false], "a": 1, "e": "CONCAT('My', 'SQL') returns 'MySQL'."}, {"n": 142, "s": 12, "lv": "E", "q": "Which function returns the remainder of a division?", "code": "", "o": ["DIV()", "ROUND()", "REM()", "MOD()"], "oc": [false, false, false, false], "a": 3, "e": "MOD(17, 5) returns 2. The % operator does the same."}, {"n": 143, "s": 12, "lv": "M", "q": "What will be the output of the following query?", "code": "SELECT CONCAT(UPPER(SUBSTR('cdac', 1, 1)), LOWER(SUBSTR('CDAC', 2)));", "o": ["Cd", "Cdac", "CDAC", "cDAC"], "oc": [false, false, false, false], "a": 1, "e": "Nested functions are evaluated from the innermost outwards: SUBSTR first, then UPPER and LOWER, and CONCAT last. SUBSTR('cdac', 1, 1) is 'c' and SUBSTR('CDAC', 2) is 'DAC'."}, {"n": 144, "s": 12, "lv": "M", "q": "Which of the following is a wrong statement about stored functions and stored procedures in MySQL?", "code": "", "o": ["A stored function must return exactly one value", "A stored procedure can have IN, OUT and INOUT parameters", "A stored function can be used inside a SELECT statement", "A stored function is executed with the CALL statement"], "oc": [false, false, false, false], "a": 3, "e": "A function is used in an expression, for example SELECT fn(5). CALL is used only for procedures. Function parameters are always IN."}, {"n": 145, "s": 12, "lv": "M", "q": "What will be the output of the following query?", "code": "SELECT DATEDIFF('2026-03-01', '2026-02-01'), YEAR('2026-11-10'), MONTHNAME('2026-11-10');", "o": ["1, 2026, Nov", "28, 2026, November", "30, 2026, November", "28, 2026, 11"], "oc": [false, false, false, false], "a": 1, "e": "DATEDIFF returns the number of days between the two dates (February 2026 has 28 days). YEAR extracts the year and MONTHNAME gives the full month name."}, {"n": 146, "s": 12, "lv": "T", "q": "What will be the output of the following query?", "code": "SELECT CONCAT('A', NULL, 'B'), IFNULL(NULL, 'X'),\n       SUBSTRING('DATABASE', 5, 3), INSTR('DATABASE', 'A');", "o": ["NULL, X, ABA, 1", "NULL, X, BAS, 2", "AB, X, BAS, 2", "AB, NULL, BAS, 2"], "oc": [false, false, false, false], "a": 1, "e": "CONCAT returns NULL if any argument is NULL. IFNULL returns its second argument when the first is NULL. String positions start at 1, so SUBSTRING from position 5 for 3 characters is 'BAS', and the first 'A' is at position 2."}, {"n": 147, "s": 12, "lv": "T", "q": "What will be the output of the following query?", "code": "SELECT ROUND(15.567, 1), TRUNCATE(15.567, 1), ROUND(-2.5), CEIL(2.1), FLOOR(-2.1);", "o": ["15.5, 15.5, -3, 2, -3", "15.6, 15.5, -2, 3, -2", "15.6, 15.5, -3, 3, -3", "15.6, 15.6, -2, 3, -2"], "oc": [false, false, false, false], "a": 2, "e": "ROUND rounds to the nearest value (half away from zero for exact numbers, so -2.5 gives -3). TRUNCATE just cuts off digits. CEIL goes up to 3 and FLOOR goes down to -3."}, {"n": 148, "s": 12, "lv": "T", "q": "What will be the output of the last statement?", "code": "DELIMITER //\nCREATE FUNCTION grade(m INT) RETURNS CHAR(1) DETERMINISTIC\nBEGIN\n  RETURN CASE WHEN m >= 75 THEN 'A'\n              WHEN m >= 50 THEN 'B'\n              ELSE 'C' END;\nEND //\nDELIMITER ;\nSELECT grade(80), grade(75), grade(49);", "o": ["A, B, C", "A, B, B", "Error, because a function cannot contain CASE", "A, A, C"], "oc": [false, false, false, false], "a": 3, "e": "CASE returns the result of the first condition that is true. 80 and 75 both satisfy m >= 75, and 49 satisfies neither condition."}, {"n": 149, "s": 13, "lv": "E", "q": "What is the correct order of the steps in the life cycle of a cursor?", "code": "", "o": ["OPEN, DECLARE, FETCH, CLOSE", "DECLARE, FETCH, OPEN, CLOSE", "OPEN, FETCH, DECLARE, CLOSE", "DECLARE, OPEN, FETCH, CLOSE"], "oc": [false, false, false, false], "a": 3, "e": "A cursor is declared, opened, fetched from row by row, and finally closed."}, {"n": 150, "s": 13, "lv": "E", "q": "What does the statement OPEN cursor_name do?", "code": "", "o": ["It closes the cursor", "It fetches the next row of the cursor", "It declares the cursor", "It opens a previously declared cursor and executes its SELECT statement"], "oc": [false, false, false, false], "a": 3, "e": "OPEN runs the query of the cursor and positions it before the first row."}, {"n": 151, "s": 13, "lv": "E", "q": "What happens when a FETCH statement finds a row?", "code": "", "o": ["It loads the values of the current row into the variables and moves to the next row", "It displays the row on the screen", "It opens the cursor", "It closes the cursor"], "oc": [false, false, false, false], "a": 0, "e": "FETCH cursor_name INTO variables; reads one row at a time."}, {"n": 152, "s": 13, "lv": "E", "q": "A cursor is used to ______.", "code": "", "o": ["speed up SELECT statements", "define a constraint", "process the rows returned by a query one row at a time inside a stored program", "create a backup of a table"], "oc": [false, false, false, false], "a": 2, "e": "SQL normally works on whole sets of rows; a cursor allows row-by-row processing."}, {"n": 153, "s": 13, "lv": "M", "q": "Which of the following is a wrong statement about cursors in MySQL?", "code": "", "o": ["A MySQL cursor is non-scrollable", "A MySQL cursor is asensitive", "A MySQL cursor can move backwards to fetch the previous row", "A MySQL cursor is read-only"], "oc": [false, false, false, false], "a": 2, "e": "MySQL cursors are read-only, non-scrollable (rows are fetched only in forward order, without skipping) and asensitive."}, {"n": 154, "s": 13, "lv": "M", "q": "Why is a NOT FOUND handler declared when working with a cursor?", "code": "", "o": ["Because an error is raised if the table does not exist in the database", "Because it handles the situation in which the cursor does not find any more rows", "Because an error is raised if the WHERE condition fails", "Because an error is raised if the SELECT list contains an unknown column"], "oc": [false, false, false, false], "a": 1, "e": "When FETCH goes past the last row, a NOT FOUND condition is raised. The handler usually sets a flag that is used to leave the loop."}, {"n": 155, "s": 13, "lv": "M", "q": "In a BEGIN ... END block, in which order must the declarations be written?", "code": "", "o": ["Any order is allowed", "Cursors, then variables, then handlers", "Handlers, then cursors, then variables", "Variables and conditions, then cursors, then handlers"], "oc": [false, false, false, false], "a": 3, "e": "MySQL requires variable and condition declarations first, cursor declarations next and handler declarations last."}, {"n": 156, "s": 13, "lv": "T", "q": "Refer to the EMP table. What will be the output of the following code?", "code": "DELIMITER //\nCREATE PROCEDURE c1()\nBEGIN\n  DECLARE done INT DEFAULT 0;\n  DECLARE v INT;\n  DECLARE total INT DEFAULT 0;\n  DECLARE cur CURSOR FOR SELECT sal FROM emp WHERE deptno = 20 ORDER BY empno;\n  DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;\n  OPEN cur;\n  rd: LOOP\n    FETCH cur INTO v;\n    IF done = 1 THEN LEAVE rd; END IF;\n    SET total = total + v;\n  END LOOP;\n  CLOSE cur;\n  SELECT total;\nEND //\nDELIMITER ;\nCALL c1();", "o": ["5000", "19000", "14000", "9000"], "oc": [false, false, false, false], "a": 2, "e": "The cursor returns 5000, 4000 and 5000. The done flag is tested immediately after each FETCH, so the loop is left as soon as no row is found. 5000 + 4000 + 5000 = 14000."}, {"n": 157, "s": 13, "lv": "T", "q": "Refer to the EMP table. The loop below tests the done flag after the addition. What will be the output?", "code": "DELIMITER //\nCREATE PROCEDURE c2()\nBEGIN\n  DECLARE done INT DEFAULT 0;\n  DECLARE v INT;\n  DECLARE total INT DEFAULT 0;\n  DECLARE cur CURSOR FOR SELECT sal FROM emp WHERE deptno = 20 ORDER BY empno;\n  DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;\n  OPEN cur;\n  rd: LOOP\n    FETCH cur INTO v;\n    SET total = total + v;\n    IF done = 1 THEN LEAVE rd; END IF;\n  END LOOP;\n  CLOSE cur;\n  SELECT total;\nEND //\nDELIMITER ;\nCALL c2();", "o": ["NULL", "9000", "14000", "19000"], "oc": [false, false, false, false], "a": 3, "e": "When the fourth FETCH finds no row, v keeps its previous value (5000) and the CONTINUE handler lets execution go on, so the last salary is added a second time: 14000 + 5000 = 19000. The flag must be tested immediately after FETCH."}, {"n": 158, "s": 13, "lv": "T", "q": "Which of the following is true about an asensitive cursor?", "code": "", "o": ["The server may or may not make a copy of the result set, so changes made to the data while the cursor is open may or may not be seen", "It can be used to update the rows of the underlying table", "It always works on a temporary copy of the data, so it never sees later changes", "It can be scrolled both forwards and backwards"], "oc": [false, false, false, false], "a": 0, "e": "Asensitive means the cursor may work directly on the actual data. Because no copy has to be made, it is faster than an insensitive cursor, which always works on a temporary copy."}, {"n": 159, "s": 14, "lv": "E", "q": "A trigger is a stored program that ______.", "code": "", "o": ["must be called explicitly using CALL", "runs only when a SELECT statement is executed", "is executed automatically when an INSERT, UPDATE or DELETE occurs on its table", "runs once every time the server starts"], "oc": [false, false, false, false], "a": 2, "e": "A trigger is associated with a table and fires on a DML event."}, {"n": 160, "s": 14, "lv": "E", "q": "Triggers are not supported for ______.", "code": "", "o": ["views", "insert", "update", "delete"], "oc": [false, false, false, false], "a": 0, "e": "In MySQL a trigger can be created only on a permanent table, not on a view or a temporary table."}, {"n": 161, "s": 14, "lv": "E", "q": "Which statement is used to create a trigger?", "code": "", "o": ["ADD TRIGGER", "CREATE EVENT", "MAKE TRIGGER", "CREATE TRIGGER"], "oc": [false, true, false, true], "a": 3, "e": "CREATE TRIGGER name {BEFORE | AFTER} {INSERT | UPDATE | DELETE} ON table FOR EACH ROW body;"}, {"n": 162, "s": 14, "lv": "E", "q": "Which statement removes a trigger?", "code": "", "o": ["DROP TRIGGER", "DELETE TRIGGER", "REMOVE TRIGGER", "CLEAR TRIGGER"], "oc": [true, true, false, false], "a": 0, "e": "Database objects are removed with DROP: DROP TRIGGER trigger_name;"}, {"n": 163, "s": 14, "lv": "M", "q": "In the trigger definition below, abc, def, ghi and jkl are respectively ______.", "code": "CREATE TRIGGER abc BEFORE def ON ghi FOR EACH ROW jkl;", "o": ["trigger name, table name, DML operation, trigger body", "trigger body, DML operation, table name, trigger name", "table name, DML operation, trigger name, trigger body", "trigger name, DML operation, table name, trigger body"], "oc": [false, false, false, false], "a": 3, "e": "The order is: trigger name, timing (BEFORE or AFTER), event (INSERT, UPDATE or DELETE), ON table name, FOR EACH ROW, trigger body."}, {"n": 164, "s": 14, "lv": "M", "q": "Inside a trigger, which of the following is correct about the OLD and NEW row aliases?", "code": "", "o": ["OLD and NEW can be used only in AFTER triggers", "An INSERT trigger has only NEW, a DELETE trigger has only OLD, and an UPDATE trigger has both", "Every trigger has both OLD and NEW", "An INSERT trigger has only OLD and a DELETE trigger has only NEW"], "oc": [false, false, false, false], "a": 1, "e": "An inserted row has no old version and a deleted row has no new version. An update has both."}, {"n": 165, "s": 14, "lv": "M", "q": "Which of the following is a wrong statement about triggers in MySQL?", "code": "", "o": ["A trigger can be defined to fire BEFORE or AFTER the triggering event", "MySQL supports statement-level triggers written with FOR EACH STATEMENT", "A trigger is always associated with one table", "MySQL triggers are row-level triggers, written with FOR EACH ROW"], "oc": [false, false, false, false], "a": 1, "e": "MySQL supports only row-level triggers: the body runs once for each affected row."}, {"n": 166, "s": 14, "lv": "T", "q": "What will be the output of the last statement?", "code": "CREATE TABLE s (id INT, marks INT);\nCREATE TRIGGER t1 BEFORE INSERT ON s FOR EACH ROW\n  SET NEW.marks = IF(NEW.marks > 100, 100, NEW.marks);\nINSERT INTO s VALUES (1, 150), (2, 80);\nSELECT SUM(marks) FROM s;", "o": ["100", "Error", "180", "230"], "oc": [false, false, false, false], "a": 2, "e": "A BEFORE INSERT trigger can change the values of the NEW row before it is stored. 150 is reduced to 100 and 80 is unchanged: 100 + 80 = 180."}, {"n": 167, "s": 14, "lv": "T", "q": "What will be the output of the last statement?", "code": "CREATE TABLE a (id INT);\nCREATE TABLE log (n INT);\nCREATE TRIGGER t2 AFTER DELETE ON a FOR EACH ROW\n  INSERT INTO log VALUES (OLD.id);\nINSERT INTO a VALUES (1), (2), (3);\nDELETE FROM a WHERE id >= 2;\nTRUNCATE TABLE a;\nSELECT COUNT(*) FROM log;", "o": ["2", "3", "1", "0"], "oc": [false, false, false, false], "a": 0, "e": "The DELETE removes two rows, and the row-level trigger fires once for each. TRUNCATE removes the last row but does not fire DELETE triggers."}, {"n": 168, "s": 14, "lv": "T", "q": "What happens when the following statements are executed?", "code": "CREATE TABLE s (id INT, marks INT);\nCREATE TRIGGER t3 AFTER INSERT ON s FOR EACH ROW\n  SET NEW.marks = 0;", "o": ["The trigger is created and fails only when a row is inserted", "The trigger is created but the SET statement is ignored", "The CREATE TRIGGER statement fails, because the NEW row cannot be modified in an AFTER trigger", "The trigger is created and every inserted row gets marks = 0"], "oc": [false, false, false, false], "a": 2, "e": "By the time an AFTER trigger runs, the row has already been stored. NEW values can be changed only in a BEFORE trigger."}, {"n": 169, "s": 15, "lv": "E", "q": "Which statement is used to define an error handler in a stored program?", "code": "", "o": ["SET HANDLER", "DECLARE ... HANDLER", "CREATE HANDLER", "ON ERROR"], "oc": [false, false, true, false], "a": 1, "e": "DECLARE action HANDLER FOR condition statement;"}, {"n": 170, "s": 15, "lv": "E", "q": "Which are the two handler actions supported by MySQL?", "code": "", "o": ["TRY and CATCH", "RESUME and ABORT", "CONTINUE and EXIT", "COMMIT and ROLLBACK"], "oc": [false, false, false, false], "a": 2, "e": "CONTINUE carries on with the next statement after the handler runs; EXIT leaves the BEGIN ... END block in which the handler is declared."}, {"n": 171, "s": 15, "lv": "E", "q": "To raise your own error in a MySQL stored program by setting an SQLSTATE, the ______ keyword is used.", "code": "", "o": ["DECLARE", "SIGNAL", "THROW", "SQLEXCEPTION"], "oc": [false, false, false, false], "a": 1, "e": "SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'message'; raises a user-defined error."}, {"n": 172, "s": 15, "lv": "M", "q": "In the statement below, abc, def and ghi are respectively ______.", "code": "DECLARE abc HANDLER FOR def ghi;", "o": ["statement, condition value, handler action", "handler action, condition value, statement", "handler name, table name, statement", "condition value, handler action, statement"], "oc": [false, false, false, false], "a": 1, "e": "The syntax is DECLARE handler_action HANDLER FOR condition_value statement; for example DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = 1;"}, {"n": 173, "s": 15, "lv": "M", "q": "The condition NOT FOUND in a handler declaration is shorthand for the class of SQLSTATE values that begin with ______.", "code": "", "o": ["'00'", "'02'", "'45'", "'01'"], "oc": [false, false, false, false], "a": 1, "e": "'00' means success, '01' is SQLWARNING and '02' is NOT FOUND. SQLEXCEPTION covers all other classes."}, {"n": 174, "s": 15, "lv": "T", "q": "What will be the output of the last statement?", "code": "CREATE TABLE t (id INT PRIMARY KEY);\nSET @e = 0;\nDELIMITER //\nCREATE PROCEDURE h1()\nBEGIN\n  DECLARE CONTINUE HANDLER FOR SQLEXCEPTION SET @e = @e + 1;\n  INSERT INTO t VALUES (1);\n  INSERT INTO t VALUES (1);\n  INSERT INTO t VALUES (2);\nEND //\nDELIMITER ;\nCALL h1();\nSELECT COUNT(*), @e FROM t;", "o": ["1, 0", "2, 1", "1, 1", "3, 0"], "oc": [false, false, false, false], "a": 1, "e": "The second INSERT fails with a duplicate key error. The CONTINUE handler counts the error and execution carries on with the third INSERT, so the rows 1 and 2 are stored."}, {"n": 175, "s": 15, "lv": "T", "q": "What will be the output of the last statement?", "code": "CREATE TABLE t (id INT PRIMARY KEY);\nSET @e = 0;\nDELIMITER //\nCREATE PROCEDURE h2()\nBEGIN\n  DECLARE EXIT HANDLER FOR SQLEXCEPTION SET @e = @e + 1;\n  INSERT INTO t VALUES (1);\n  INSERT INTO t VALUES (1);\n  INSERT INTO t VALUES (2);\nEND //\nDELIMITER ;\nCALL h2();\nSELECT COUNT(*), @e FROM t;", "o": ["0, 1", "2, 1", "3, 0", "1, 1"], "oc": [false, false, false, false], "a": 3, "e": "With an EXIT handler, the handler statement runs and then the BEGIN ... END block is left, so the third INSERT is never executed. Only row 1 is stored."}, {"n": 176, "s": 15, "lv": "T", "q": "What is the result of the CALL statement?", "code": "DELIMITER //\nCREATE PROCEDURE chk(IN age INT)\nBEGIN\n  IF age < 18 THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Too young';\n  END IF;\n  SELECT 'OK';\nEND //\nDELIMITER ;\nCALL chk(15);", "o": ["An error is raised with the message 'Too young'", "A warning is shown and then OK", "OK", "NULL"], "oc": [false, false, false, false], "a": 0, "e": "SIGNAL with SQLSTATE '45000' (the general user-defined exception) raises an error, and because no handler is declared the procedure stops."}, {"n": 177, "s": 16, "lv": "E", "q": "MongoDB belongs to which category of NoSQL databases?", "code": "", "o": ["Graph store", "Key-value store", "Document store", "Column-oriented store"], "oc": [false, false, false, false], "a": 2, "e": "MongoDB stores data as JSON-like documents."}, {"n": 178, "s": 16, "lv": "E", "q": "A table and a row of an RDBMS correspond to which terms in MongoDB?", "code": "", "o": ["Database and collection", "Document and field", "Collection and document", "Field and value"], "oc": [false, false, false, false], "a": 2, "e": "Table = collection, row (tuple) = document, column = field."}, {"n": 179, "s": 16, "lv": "E", "q": "Which of the following is NOT a NoSQL database?", "code": "", "o": ["Cassandra", "Redis", "Oracle", "MongoDB"], "oc": [false, false, false, false], "a": 2, "e": "Oracle is a relational DBMS."}, {"n": 180, "s": 16, "lv": "E", "q": "In which format does MongoDB store documents internally?", "code": "", "o": ["CSV", "YAML", "XML", "BSON"], "oc": [false, false, false, false], "a": 3, "e": "BSON is a binary encoding of JSON-like documents that supports additional data types such as Date and ObjectId."}, {"n": 181, "s": 16, "lv": "M", "q": "In the CAP theorem, the letters C, A and P stand for ______.", "code": "", "o": ["Consistency, Atomicity, Performance", "Concurrency, Atomicity, Persistence", "Capacity, Availability, Partitioning", "Consistency, Availability, Partition tolerance"], "oc": [false, false, false, false], "a": 3, "e": "The CAP theorem says that a distributed system can guarantee at most two of these three properties at the same time."}, {"n": 182, "s": 16, "lv": "M", "q": "Which of the following pairings of a database with its NoSQL category is wrong?", "code": "", "o": ["Cassandra : graph store", "Redis : key-value store", "MongoDB : document store", "Neo4j : graph store"], "oc": [false, false, false, false], "a": 0, "e": "Cassandra is a column-oriented (wide-column) store."}, {"n": 183, "s": 16, "lv": "M", "q": "JSON documents in which different documents may have different fields are an example of ______ data.", "code": "", "o": ["semi-structured", "relational", "structured", "unstructured"], "oc": [false, false, false, false], "a": 0, "e": "Structured data has a fixed schema (tables), semi-structured data is self-describing (JSON, XML), and unstructured data has no model (images, video, free text)."}, {"n": 184, "s": 16, "lv": "T", "q": "Which of the following is a true statement about MongoDB documents?", "code": "", "o": ["BSON supports fewer data types than JSON", "All documents of a collection must have exactly the same fields", "Every document must have an _id field that is unique within its collection; MongoDB adds one automatically if it is not supplied", "The maximum size of a BSON document is 16 KB"], "oc": [false, false, false, false], "a": 2, "e": "_id is the primary key. Collections have a flexible schema, the maximum document size is 16 MB, and BSON has more types than JSON."}, {"n": 185, "s": 16, "lv": "T", "q": "Which of the following correctly describes the BASE model followed by many NoSQL databases?", "code": "", "o": ["Backup, Archive, Store, Encrypt", "Basically Available, Soft state, Eventual consistency", "Basic Atomicity, Strict consistency, Exclusive locking", "Balanced Availability, Serializable Execution"], "oc": [false, false, false, false], "a": 1, "e": "BASE gives up immediate consistency for availability: all copies of the data become consistent eventually, not at once as under ACID."}, {"n": 186, "s": 16, "lv": "T", "q": "Which of the following is a wrong statement?", "code": "", "o": ["Relational databases traditionally scale vertically by upgrading the server", "NoSQL databases usually allow a flexible schema", "All NoSQL databases require a fixed schema to be defined before data can be inserted", "NoSQL databases generally scale horizontally by adding more servers"], "oc": [false, false, false, false], "a": 2, "e": "Most NoSQL databases are schema-less or schema-flexible. A predefined schema is a property of relational databases."}, {"n": 187, "s": 17, "lv": "E", "q": "Which method inserts a single document into a MongoDB collection?", "code": "", "o": ["db.collection.create()", "db.collection.put()", "db.collection.add()", "db.collection.insertOne()"], "oc": [true, true, true, true], "a": 3, "e": "insertOne() adds one document and insertMany() adds an array of documents."}, {"n": 188, "s": 17, "lv": "E", "q": "Which command returns all the documents of the collection users?", "code": "", "o": ["SELECT * FROM users", "db.users.select()", "db.users.getAll()", "db.users.find()"], "oc": [true, true, true, true], "a": 3, "e": "find() with no filter returns every document."}, {"n": 189, "s": 17, "lv": "E", "q": "Select the correct query to display users in descending order of age.", "code": "", "o": ["db.users.find().sort({age: -1})", "db.users.find().sort({age: 1})", "db.users.find().order({age: \"desc\"})", "db.users.find().limit()"], "oc": [true, true, true, true], "a": 0, "e": "In sort(), 1 means ascending and -1 means descending."}, {"n": 190, "s": 17, "lv": "E", "q": "What is the primary key in MongoDB?", "code": "", "o": ["The first field of every document", "The _id field, a unique identifier for each document in a collection", "A key used to encrypt and decrypt data", "A key that indexes all the fields of a collection"], "oc": [false, false, false, false], "a": 1, "e": "Every document has an _id, which is unique in its collection and indexed automatically."}, {"n": 191, "s": 17, "lv": "E", "q": "In the aggregation pipeline, which stage filters documents in the same way as find()?", "code": "", "o": ["$match", "$sort", "$group", "$project"], "oc": [false, false, false, false], "a": 0, "e": "$match filters documents, $group groups them, $project reshapes fields and $sort orders them."}, {"n": 192, "s": 17, "lv": "E", "q": "In the mongo shell, which keyword is typed to iterate the cursor and display more documents?", "code": "", "o": ["more", "it", "next", "cursor"], "oc": [false, false, false, false], "a": 1, "e": "The shell shows 20 documents at a time; typing it shows the next batch."}, {"n": 193, "s": 17, "lv": "M", "q": "Which query finds the users whose age is greater than 25?", "code": "", "o": ["db.users.find({age > 25})", "db.users.find({age: {$gt: 25}})", "db.users.find({age: {$gte: 25}})", "db.users.find({$gt: {age: 25}})"], "oc": [true, true, true, true], "a": 1, "e": "A comparison operator is written inside a sub-document for the field: {field: {$operator: value}}. $gte would also include 25."}, {"n": 194, "s": 17, "lv": "M", "q": "Which statement creates a unique index on the field email of the collection users?", "code": "", "o": ["db.users.createUniqueIndex(\"email\")", "db.users.createIndex({email: \"unique\"})", "db.users.addIndex({email: 1}, {unique: true})", "db.users.createIndex({email: 1}, {unique: true})"], "oc": [true, true, true, true], "a": 3, "e": "createIndex() takes the key specification and an options document. A compound index lists several fields: {city: 1, age: -1}."}, {"n": 195, "s": 17, "lv": "M", "q": "What does the option {upsert: true} do in an update operation?", "code": "", "o": ["It updates all the matching documents", "It inserts a new document if no document matches the filter", "It makes the update run inside a transaction", "It replaces the whole document"], "oc": [false, false, false, false], "a": 1, "e": "Upsert = update if a matching document is found, otherwise insert."}, {"n": 196, "s": 17, "lv": "M", "q": "What does the following query return?", "code": "db.users.find({}, {name: 1, _id: 0})", "o": ["All fields of all documents except name", "Only the documents that have name equal to 1", "Only the name field of every document", "The name and _id fields of every document"], "oc": [false, false, false, false], "a": 2, "e": "The second argument of find() is the projection: 1 includes a field and 0 excludes it. _id is included by default unless it is set to 0."}, {"n": 197, "s": 17, "lv": "T", "q": "What does the last statement return?", "code": "db.u.insertMany([\n  {_id: 1, n: \"A\", age: 30}, {_id: 2, n: \"B\", age: 25},\n  {_id: 3, n: \"C\", age: 35}, {_id: 4, n: \"D\", age: 25}]);\ndb.u.find({age: {$gte: 25, $lt: 35}}, {n: 1, _id: 0}).sort({age: -1, n: 1}).skip(1).limit(2)", "o": ["{ n: \"D\" } and { n: \"B\" }", "{ n: \"A\" } and { n: \"B\" }", "{ n: \"C\" } and { n: \"A\" }", "{ n: \"B\" } and { n: \"D\" }"], "oc": [false, false, false, false], "a": 3, "e": "The filter keeps A (30), B (25) and D (25). Sorting by age descending and then name ascending gives A, B, D. skip(1) drops A and limit(2) returns B and D."}, {"n": 198, "s": 17, "lv": "T", "q": "What does the last statement return?", "code": "db.c.insertOne({_id: 1, tags: [\"a\", \"b\"]});\ndb.c.updateOne({_id: 1}, {$push: {tags: \"a\"}});\ndb.c.updateOne({_id: 1}, {$addToSet: {tags: \"b\"}});\ndb.c.updateOne({_id: 1}, {$pull: {tags: \"a\"}});\ndb.c.findOne({_id: 1}).tags", "o": ["[ \"b\" ]", "[ \"a\", \"b\" ]", "[ \"b\", \"a\" ]", "[ \"b\", \"b\" ]"], "oc": [false, false, false, false], "a": 0, "e": "$push always appends, giving [\"a\", \"b\", \"a\"]. $addToSet adds a value only if it is not already present, so nothing changes. $pull removes every occurrence of \"a\"."}, {"n": 199, "s": 17, "lv": "T", "q": "What does the last statement return?", "code": "db.s.updateOne({_id: \"x\"}, {$inc: {c: 5}}, {upsert: true});\ndb.s.updateOne({_id: \"x\"}, {$inc: {c: 2}, $set: {f: 1}});\ndb.s.updateMany({c: {$gt: 100}}, {$set: {f: 9}});\ndb.s.find().toArray()", "o": ["One document: { _id: \"x\", c: 7, f: 1 }", "One document: { _id: \"x\", c: 7, f: 9 }", "One document: { _id: \"x\", c: 2, f: 1 }", "An empty array, because the first update matches nothing"], "oc": [false, false, false, false], "a": 0, "e": "No document matches the first update, so upsert inserts { _id: \"x\", c: 5 }. The second update adds 2 to c and sets f. The third matches nothing, because c is not greater than 100."}, {"n": 200, "s": 17, "lv": "T", "q": "What does the last statement return?", "code": "db.p.insertMany([\n  {_id: 1, q: 5, t: \"x\"}, {_id: 2, q: 15, t: \"y\"},\n  {_id: 3, q: 25, t: \"x\"}, {_id: 4, q: 35, t: \"z\"}]);\ndb.p.deleteMany({$or: [{q: {$lt: 10}}, {t: {$in: [\"z\"]}}]});\ndb.p.replaceOne({_id: 2}, {q: 1});\ndb.p.find({}, {_id: 0}).sort({q: 1}).toArray()", "o": ["{ q: 1 } and { q: 25, t: \"x\" }", "{ q: 15, t: \"y\" } and { q: 25, t: \"x\" }", "{ q: 1, t: \"y\" } and { q: 25, t: \"x\" }", "{ q: 1 } only"], "oc": [false, false, false, false], "a": 0, "e": "deleteMany removes the documents with _id 1 (q < 10) and _id 4 (t is \"z\"). replaceOne replaces the whole document except _id, so the field t disappears from document 2."}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const Q = DATA.questions;
const TOTAL_Q = Q.length;
const byN = {}; Q.forEach(q => { byN[q.n] = q; });
const LV = {E:'Easy', M:'Medium', T:'Tough'};
const LVBARS = {E:1, M:2, T:3};
const SESS = DATA.sessions.map(s => {
  const i = s.title.indexOf(': ');
  const qs = Q.filter(q => q.s === s.n).map(q => q.n);
  return {n:s.n, refs:s.refs, name: i > 0 ? s.title.slice(0, i) : s.title, topics: i > 0 ? s.title.slice(i + 2) : '', qs};
});
const sessByN = {}; SESS.forEach(s => { sessByN[s.n] = s; });

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
const SQLKW = /^(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|FULL|NATURAL|USING|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|DISTINCT|UNION|ALL|ANY|EXISTS|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|ALTER|DROP|TRUNCATE|RENAME|TO|ADD|COLUMN|MODIFY|CHANGE|PRIMARY|FOREIGN|KEY|REFERENCES|UNIQUE|CHECK|DEFAULT|CONSTRAINT|AUTO_INCREMENT|INT|INTEGER|BIGINT|VARCHAR|CHAR|DECIMAL|DATE|TEXT|BEGIN|END|DECLARE|PROCEDURE|FUNCTION|RETURNS|RETURN|CALL|IF|THEN|ELSE|ELSEIF|CASE|WHEN|WHILE|DO|LOOP|LEAVE|ITERATE|REPEAT|UNTIL|CURSOR|FOR|OPEN|FETCH|CLOSE|HANDLER|CONTINUE|EXIT|FOUND|SQLEXCEPTION|SQLSTATE|SIGNAL|RESIGNAL|TRIGGER|BEFORE|AFTER|EACH|ROW|NEW|OLD|DELIMITER|START|TRANSACTION|COMMIT|ROLLBACK|SAVEPOINT|GRANT|REVOKE|WITH|RECURSIVE|OVER|PARTITION|ROWS|BETWEEN|LIKE|DESC|ASC|COUNT|SUM|AVG|MIN|MAX|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|COALESCE|IFNULL|CONCAT|DETERMINISTIC|READS|SQL|DATA|OUT|INOUT|TEMPORARY|ENGINE|SHOW|DESCRIBE|USE|DATABASE|TRUE|FALSE|def|return|if|elif|else|for|while|break|continue|pass|import|from|as|class|try|except|finally|raise|with|yield|lambda|and|or|not|in|is|None|True|False|self|super|async|await|global|nonlocal|del|assert|function|library|require|install|packages|c|list|data|frame|matrix|factor|NA|NaN|NULL|Inf|TRUE|FALSE|print|range|len|set|dict|tuple|int|float|str|bool|sum|min|max|sorted|zip|map|filter|open|ggplot|aes|geom_bar|geom_point|coord_polar|facet_wrap|group_by|summarise|mutate|select|filter|arrange|pivot_longer|pivot_wider|public|private|protected|static|final|void|new|this|extends|implements|interface|abstract|throws|throw|catch|synchronized|volatile|transient|package|boolean|byte|short|long|double|char|switch|case|default|do|instanceof|enum|System|out|println|String|StringBuilder|List|ArrayList|Set|HashSet|Map|HashMap|IntStream|LocalDate|Thread|PreparedStatement)$/;
function highlight(code){
  const re = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|--[^\n]*|\/\/[^\n]*|#[^\n]*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]+\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (t[0] === "'" || t[0] === '"') out += '<span class="st">' + esc(t) + '</span>';
    else if (t.startsWith('--') || t.startsWith('//') || t[0] === '#') out += '<span class="cm">' + esc(t) + '</span>';
    else if (/^\d/.test(t)) out += '<span class="nu">' + esc(t) + '</span>';
    else if (SQLKW.test(t)) out += '<span class="kw">' + esc(t) + '</span>';
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}
function asciiTable(rows){
  const w = rows[0].map((_, c) => Math.max(...rows.map(r => String(r[c]).length)));
  const line = '+' + w.map(x => '-'.repeat(x + 2)).join('+') + '+';
  const fmt = r => '| ' + r.map((v, c) => { const s = String(v); return /^\d+$/.test(s) ? s.padStart(w[c]) : s.padEnd(w[c]); }).join(' | ') + ' |';
  return [line, fmt(rows[0]), line, ...rows.slice(1).map(fmt), line].join('\n') + '\n' + (rows.length - 1) + ' rows in set';
}
let toastTimer = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }

/* ---------- progress store ---------- */
const LS_KEY = 'dbms200-progress-v1';
let store = {a:{}, resetAt:0};
function lsRead(){ try { const s = localStorage.getItem(LS_KEY); if (s){ const o = JSON.parse(s); if (o && typeof o.a === 'object') store = {a:o.a, resetAt:o.resetAt || 0}; } } catch(e){} }
function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){} }
function ans(n){ const e = store.a[n]; return (e && e.c >= 0) ? e : null; }
function record(n, choice){
  const q = byN[n], ok = choice === q.a, e = store.a[n] || {};
  store.a[n] = {c:choice, ok, t:Date.now(), w:(e.w || 0) + (ok ? 0 : 1), r:(e.r || 0) + (ok ? 1 : 0)};
  persist();
}
function clearAnswers(ns){
  const t = Date.now();
  ns.forEach(n => { const e = store.a[n]; if (e && e.c >= 0) store.a[n] = Object.assign({}, e, {c:-1, ok:false, t}); });
  persist();
}
function resetAll(){ store = {a:{}, resetAt:Date.now()}; persist(); }
function stats(ns){
  let ok = 0, bad = 0;
  ns.forEach(n => { const e = ans(n); if (e){ if (e.ok) ok++; else bad++; } });
  return {ok, bad, done: ok + bad, total: ns.length, todo: ns.length - ok - bad};
}
function wrongList(){ return Q.filter(q => { const e = ans(q.n); return e && !e.ok; }).map(q => q.n); }

let ref = null, remoteOn = false, dirty = false, saveTimer = null, writing = Promise.resolve(), retried = false;
function setSync(s){
  const el = $('sync'); el.dataset.s = s;
  $('syncText').textContent = s === 'account' ? 'Saved to your account' : s === 'connecting' ? 'Connecting…' : 'Saved in this browser';
}
function persist(){
  lsWrite();
  $('mistakesCount').textContent = wrongList().length;
  if (remoteOn){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
}
function flush(){
  if (!dirty || !ref || !remoteOn) return;
  dirty = false;
  const body = JSON.parse(JSON.stringify(store));
  writing = writing.then(() => ref.set(body)).then(() => { retried = false; setSync('account'); }, err => {
    if (err && err.code === 'unavailable' && !retried){ retried = true; dirty = true; saveTimer = setTimeout(flush, 2500 + Math.random() * 2500); }
    else { remoteOn = false; setSync('local'); }
  });
}

/* ---------- view state & universal history stack ---------- */
let view = 'home';
let sortMode = 'syllabus';
let resetArmed = false;
let set = null;          // {title, sub, kind, s, ns}
let lvFilter = 'all';    // all | E | M | T
let stFilter = 'all';    // all | todo | wrong
let list = [];           // question numbers currently in filtered list
let idx = 0;             // active question index in list
let showRefs = false;

let navStack = [];
let navPtr = -1;
let suppressPush = false;

function captureSnapshot() {
  return {
    view,
    sortMode,
    set: set ? JSON.parse(JSON.stringify(set)) : null,
    lvFilter,
    stFilter,
    idx,
    scrollY: window.scrollY
  };
}

function pushNavState() {
  if (suppressPush) return;
  const snap = captureSnapshot();
  if (navPtr >= 0) {
    const cur = navStack[navPtr];
    if (cur && cur.view === snap.view && cur.lvFilter === snap.lvFilter && cur.stFilter === snap.stFilter &&
        cur.sortMode === snap.sortMode && ((cur.set && snap.set && cur.set.title === snap.set.title) || (!cur.set && !snap.set))) {
      navStack[navPtr] = snap;
      updateNavButtons();
      return;
    }
  }
  navStack = navStack.slice(0, navPtr + 1);
  navStack.push(snap);
  navPtr = navStack.length - 1;
  try { history.pushState({navPtr}, ''); } catch(e) {}
  updateNavButtons();
}

function restoreNavState(targetPtr) {
  if (targetPtr < 0 || targetPtr >= navStack.length) return;
  if (navPtr >= 0 && navStack[navPtr]) {
    navStack[navPtr].scrollY = window.scrollY;
  }
  navPtr = targetPtr;
  const snap = navStack[navPtr];
  suppressPush = true;
  view = snap.view;
  sortMode = snap.sortMode || 'syllabus';
  set = snap.set ? JSON.parse(JSON.stringify(snap.set)) : null;
  lvFilter = snap.lvFilter || 'all';
  stFilter = snap.stFilter || 'all';
  if (set) buildList();
  idx = snap.idx || 0;
  $('vHome').hidden = view !== 'home';
  $('vQuiz').hidden = view !== 'quiz';
  $('vResult').hidden = view !== 'result';
  $('vMistakes').hidden = view !== 'mistakes';
  refresh();
  updateNavButtons();
  setTimeout(() => {
    window.scrollTo({top: snap.scrollY || 0, behavior: 'auto'});
    suppressPush = false;
  }, 10);
}

function updateNavButtons() {
  const backBtn = $('navBackBtn');
  const fwdBtn = $('navFwdBtn');
  if (backBtn) backBtn.disabled = navPtr <= 0;
  if (fwdBtn) fwdBtn.disabled = navPtr >= navStack.length - 1;
}

window.addEventListener('popstate', ev => {
  if (ev.state && typeof ev.state.navPtr === 'number') {
    restoreNavState(ev.state.navPtr);
  }
});

function show(v, skipScrollTop){
  if (navPtr >= 0 && navStack[navPtr]) {
    navStack[navPtr].scrollY = window.scrollY;
  }
  view = v;
  $('vHome').hidden = v !== 'home'; $('vQuiz').hidden = v !== 'quiz'; $('vResult').hidden = v !== 'result'; $('vMistakes').hidden = v !== 'mistakes';
  refresh();
  if (!skipScrollTop) window.scrollTo(0, 0);
  pushNavState();
}

function refresh(){
  $('mistakesCount').textContent = wrongList().length;
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'result') renderResult();
  else if (view === 'mistakes') renderMistakes();
  updateNavButtons();
}

/* ---------- home ---------- */
function stackBar(st, cls){
  const t = st.total || 1;
  return '<div class="stack ' + (cls || '') + '" role="img" aria-label="' + st.ok + ' right, ' + st.bad + ' wrong, ' + st.todo + ' not answered"><span class="s-ok" style="width:' + (100 * st.ok / t) + '%"></span><span class="s-bad" style="width:' + (100 * st.bad / t) + '%"></span></div>';
}
function renderHome(){
  const all = stats(Q.map(q => q.n));
  const acc = all.done ? pct(all.ok, all.done) : null;
  const lvRows = ['E', 'M', 'T'].map(l => {
    const st = stats(Q.filter(q => q.lv === l).map(q => q.n));
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(st) + '<span class="num">' + st.ok + '/' + st.done + ' · ' + st.total + '</span></div>';
  }).join('');
  const weak = SESS.map(s => ({s, st: stats(s.qs)})).filter(x => x.st.bad > 0)
    .sort((a, b) => (a.st.ok / a.st.done) - (b.st.ok / b.st.done) || b.st.bad - a.st.bad).slice(0, 5);
  const weakHtml = weak.length
    ? '<ul class="weaklist">' + weak.map(x => '<li><button type="button" data-review="' + x.s.n + '"><span class="wname">S' + x.s.n + ' · ' + esc(x.s.name) + '</span><span class="wstat">' + x.st.bad + ' wrong · ' + pct(x.st.ok, x.st.done) + '%</span></button></li>').join('') + '</ul>'
    : '<p class="empty-note">Answer a few questions and your weakest sessions will show up here, worst first.</p>';
  const wrongN = wrongList().length;
  const order = SESS.slice();
  if (sortMode === 'weak') order.sort((a, b) => {
    const A = stats(a.qs), B = stats(b.qs);
    const ka = A.done ? A.ok / A.done : 2, kb = B.done ? B.ok / B.done : 2;
    return ka - kb || a.n - b.n;
  });
  const topics = order.map(s => {
    const st = stats(s.qs);
    const lv = {E:0, M:0, T:0}; s.qs.forEach(n => lv[byN[n].lv]++);
    const score = st.done ? '<div class="tscore">' + pct(st.ok, st.done) + '%<small>' + st.done + '/' + st.total + ' done</small></div>' : '<div class="tscore na">—<small>not started</small></div>';
    return '<li><button class="topic" type="button" data-session="' + s.n + '">' +
      '<span class="tnum">S<b>' + String(s.n).padStart(2, '0') + '</b></span>' +
      '<span class="tbody"><span class="tname">' + esc(s.name) + '</span>' +
      (s.topics ? '<span class="tsub">' + esc(s.topics) + '</span>' : '') +
      '<span class="tmeta"><span>Q' + s.qs[0] + '–Q' + s.qs[s.qs.length - 1] + '</span><span>' + s.qs.length + ' questions</span><span>E' + lv.E + ' M' + lv.M + ' T' + lv.T + '</span></span>' +
      stackBar(st, 'tbar') + '</span>' + score + '</button></li>';
  }).join('');
  $('vHome').innerHTML =
  '<div class="home">' +
    '<aside class="summary panel">' +
      '<div><div class="eyebrow">Overall</div><div class="bigrow"><div class="big">' + (acc === null ? '—' : acc + '<small>%</small>') + '</div><div class="muted" style="padding-bottom:4px">accuracy on ' + all.done + ' of ' + TOTAL_Q + ' answered</div></div></div>' +
      stackBar(all) +
      '<div class="legend"><span><i class="dot ok"></i>Right <b>' + all.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + all.bad + '</b></span><span><i class="dot todo"></i>Left <b>' + all.todo + '</b></span></div>' +
      '<div><div class="eyebrow" style="margin-bottom:8px">By difficulty · right/answered · total</div><div class="lvrows">' + lvRows + '</div></div>' +
      '<div class="actions">' +
        '<button class="btn primary" type="button" id="practiseWrong"' + (wrongN ? '' : ' disabled') + '>Practise my mistakes <span class="count">' + wrongN + '</span></button>' +
        '<button class="btn" type="button" id="random20">Random 20 from all sessions</button>' +
      '</div>' +
      '<div class="weak"><h3>Where you lose marks</h3>' + weakHtml + '</div>' +
      '<div class="reset">' + (resetArmed
        ? '<div class="confirm"><span>Clear every answer?</span><button class="btn small" type="button" id="resetYes">Yes, clear</button><button class="btn small ghost" type="button" id="resetNo">Cancel</button></div>'
        : '<button class="btn small ghost" type="button" id="resetBtn"' + (all.done || wrongN ? '' : ' disabled') + '>Reset all progress</button>') + '</div>' +
    '</aside>' +
    '<section>' +
      '<div class="topics-head"><div><div class="eyebrow">Pick a session</div><h2>17 sessions · 200 questions</h2></div>' +
        '<div class="seg" role="group" aria-label="Order sessions"><button type="button" data-sort="syllabus" aria-pressed="' + (sortMode === 'syllabus') + '">Syllabus order</button><button type="button" data-sort="weak" aria-pressed="' + (sortMode === 'weak') + '">Weakest first</button></div></div>' +
      '<p class="intro">Answer one session at a time in a continuous vertical list. You see right or wrong as soon as you tap an option, with the explanation from the answer key. Output questions were run on MySQL 8.0.36 and MongoDB 8.0.</p>' +
      '<ul class="topiclist">' + topics + '</ul>' +
    '</section>' +
  '</div>';
}

/* ---------- quiz (Continuous Vertical List) ---------- */
function startSet(s){ set = s; lvFilter = 'all'; stFilter = 'all'; buildList(); idx = firstOpen(); show('quiz'); }
function startSession(n){
  const s = sessByN[n];
  if (!s) return;
  startSet({kind:'session', s:n, title:'S' + n + ' · ' + s.name, sub:s.topics, ns:s.qs.slice()});
}
function firstOpen(){ const i = list.findIndex(n => !ans(n)); return i < 0 ? 0 : i; }
function buildList(){
  list = set.ns.filter(n => {
    const q = byN[n], e = ans(n);
    if (lvFilter !== 'all' && q.lv !== lvFilter) return false;
    if (stFilter === 'todo' && e) return false;
    if (stFilter === 'wrong' && !(e && !e.ok)) return false;
    return true;
  });
}

function renderSessionSwitcherBar() {
  if (set.kind !== 'session') return '';
  const curS = set.s;
  const prevS = curS > 1 ? sessByN[curS - 1] : null;
  const nextS = curS < SESS.length ? sessByN[curS + 1] : null;
  const optionsHtml = SESS.map(s => {
    const st = stats(s.qs);
    return '<option value="' + s.n + '"' + (s.n === curS ? ' selected' : '') + '>S' + String(s.n).padStart(2, '0') + ' · ' + esc(s.name) + ' (' + st.done + '/' + st.total + ')</option>';
  }).join('');
  return '<div class="sessbar">' +
    '<button type="button" class="btn small" id="prevSessBtn"' + (prevS ? ' data-goto-session="' + prevS.n + '"' : ' disabled') + '>◀ ' + (prevS ? 'S' + prevS.n : 'Prev') + '</button>' +
    '<select id="sessJumpSelect" aria-label="Jump to session">' + optionsHtml + '</select>' +
    '<button type="button" class="btn small" id="nextSessBtn"' + (nextS ? ' data-goto-session="' + nextS.n + '"' : ' disabled') + '>' + (nextS ? 'S' + nextS.n : 'Next') + ' ▶</button>' +
  '</div>';
}

function renderQuiz(preserveScroll){
  const prevY = window.scrollY;
  const st = stats(set.ns);
  const lvCounts = {E:0, M:0, T:0}; set.ns.forEach(n => lvCounts[byN[n].lv]++);
  const lvSeg = '<div class="seg" role="group" aria-label="Difficulty">' + [['all', 'All ' + set.ns.length]].concat(['E', 'M', 'T'].filter(l => lvCounts[l]).map(l => [l, LV[l] + ' ' + lvCounts[l]]))
    .map(([k, label]) => '<button type="button" data-lv="' + k + '" aria-pressed="' + (lvFilter === k) + '">' + label + '</button>').join('') + '</div>';
  const stSeg = '<div class="seg" role="group" aria-label="Show"><button type="button" data-st="all" aria-pressed="' + (stFilter === 'all') + '">All</button><button type="button" data-st="todo" aria-pressed="' + (stFilter === 'todo') + '">Not answered</button><button type="button" data-st="wrong" aria-pressed="' + (stFilter === 'wrong') + '">Wrong</button></div>';
  const strip = list.map((n, i) => {
    const e = ans(n);
    return '<button type="button" class="sq' + (e ? (e.ok ? ' ok' : ' bad') : '') + (i === idx ? ' cur' : '') + '" data-go="' + i + '" aria-label="Jump to Question ' + n + (e ? (e.ok ? ', right' : ', wrong') : ', not answered') + '">' + n + '</button>';
  }).join('');
  
  let cardsHtml;
  if (!list.length){
    cardsHtml = '<div class="qcard nolist">No questions match this filter. <button class="btn small" type="button" data-st="all">Show all</button></div>';
  } else {
    if (idx >= list.length) idx = list.length - 1;
    cardsHtml = '<div class="qfeed">' + list.map(n => renderCard(byN[n])).join('') + '</div>';
  }

  const nextS = (set.kind === 'session' && set.s < SESS.length) ? sessByN[set.s + 1] : null;
  const prevS = (set.kind === 'session' && set.s > 1) ? sessByN[set.s - 1] : null;

  $('vQuiz').innerHTML =
  '<div class="quiz">' +
    renderSessionSwitcherBar() +
    '<div class="qhead"><div class="titles"><div class="eyebrow">' + (set.kind === 'session' ? 'Session' : set.kind === 'random' ? 'Mixed practice' : 'Mistake practice') + '</div><h2>' + esc(set.title) + '</h2>' + (set.sub ? '<div class="muted" style="font-size:13px">' + esc(set.sub) + '</div>' : '') + '</div>' +
      '<button class="btn small" type="button" id="toResult">See result</button></div>' +
    '<div class="progressline"><span><b>' + st.done + '</b> of ' + st.total + ' answered</span><span><i class="dot ok"></i><b>' + st.ok + '</b> right</span><span><i class="dot bad"></i><b>' + st.bad + '</b> wrong</span>' + (st.done ? '<span><b>' + pct(st.ok, st.done) + '%</b> accuracy</span>' : '') + '</div>' +
    stackBar(st) +
    '<div class="qsticky">' +
      '<div class="filters">' + lvSeg + stSeg + '</div>' +
      '<div class="strip-wrap"><div class="strip">' + strip + '</div></div>' +
    '</div>' +
    cardsHtml +
    (list.length ? '<div class="qfoot">' +
      (prevS ? '<button class="btn" type="button" data-goto-session="' + prevS.n + '">◀ Session ' + prevS.n + '</button>' : '<button class="btn" type="button" data-home>← All sessions</button>') +
      '<button class="btn ghost small" type="button" id="scrollTopBtn">↑ Top</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" type="button" id="finish">See result scorecard</button>' +
      (nextS ? '<button class="btn primary" type="button" data-goto-session="' + nextS.n + '">Session ' + nextS.n + ' ▶</button>' : '') +
    '</div>' : '') +
  '</div>';

  const sel = $('sessJumpSelect');
  if (sel) sel.addEventListener('change', function() { startSession(+this.value); });

  if (preserveScroll) {
    window.scrollTo({top: prevY, behavior: 'auto'});
  }
}

function lvlBadge(q){ return '<span class="lvl"><span class="bars on' + LVBARS[q.lv] + '"><i></i><i></i><i></i></span>' + LV[q.lv] + '</span>'; }
function refsBlock(){
  if (!DATA.tables || !DATA.tables.EMP) return '';
  return '<div class="refs"><div class="cap mono">mysql&gt; SELECT * FROM emp;</div><div class="grid-wrap"><pre>' + esc(asciiTable(DATA.tables.EMP)) + '</pre></div>' +
    '<div class="cap mono">mysql&gt; SELECT * FROM dept;</div><div class="grid-wrap"><pre>' + esc(asciiTable(DATA.tables.DEPT)) + '</pre></div></div>';
}
function needsRefs(q){ return sessByN[q.s] && sessByN[q.s].refs && /\b(EMP|DEPT)\b/.test(q.q) && /Refer to|on the EMP|views are created/.test(q.q); }

function renderCard(q){
  const e = ans(q.n);
  const opts = q.o.map((t, i) => {
    let cls = 'opt', mark = '';
    if (e){
      if (i === q.a){ cls += ' right'; mark = i === e.c ? '✓ Your answer' : '✓ Correct'; }
      else if (i === e.c){ cls += ' wrong'; mark = '✗ Your answer'; }
      else cls += ' dim';
    }
    return '<li><button type="button" class="' + cls + '" data-q="' + q.n + '" data-opt="' + i + '"' + (e ? ' disabled' : '') + '><span class="key">' + 'ABCD'[i] + '</span><span class="otext' + (q.oc[i] ? ' codey' : '') + '">' + esc(t) + '</span><span class="mark">' + mark + '</span></button></li>';
  }).join('');
  const all = store.a[q.n];
  const missed = all && all.w ? '<span class="missed">missed ' + all.w + '×</span>' : '';
  const refs = needsRefs(q);
  let fb = '';
  if (e){
    fb = '<div class="feedback ' + (e.ok ? 'yes' : 'no') + '" role="status"><div class="verdict">' + (e.ok ? 'Correct. Answer ' + 'ABCD'[q.a] : 'Wrong. You chose ' + 'ABCD'[e.c] + ', the answer is ' + 'ABCD'[q.a]) + '</div>' +
      (e.ok ? '' : '<p><b>' + 'ABCD'[q.a] + '.</b> ' + esc(q.o[q.a]) + '</p>') +
      '<p>' + esc(q.e) + '</p><div class="fbrow"><button class="btn small ghost" type="button" data-retry-q="' + q.n + '">Try this one again</button></div></div>';
  }
  return '<article class="qcard" id="qcard-' + q.n + '" data-qno="' + q.n + '">' +
    '<div class="qmeta"><span class="qno">Q' + q.n + '</span>' + lvlBadge(q) + '<span class="muted" style="font-size:12.5px">S' + q.s + '</span>' + missed +
      (refs ? '<button class="btn small refbtn" type="button" data-ref-toggle="' + q.n + '" aria-expanded="' + showRefs + '">' + (showRefs ? 'Hide' : 'Show') + ' EMP &amp; DEPT</button>' : '') + '</div>' +
    '<p class="stem">' + esc(q.q) + '</p>' +
    (refs && showRefs ? refsBlock() : '') +
    (q.code ? '<pre class="code">' + highlight(q.code) + '</pre>' : '') +
    '<ol class="opts">' + opts + '</ol>' + fb +
  '</article>';
}

function answerQuestion(qNum, choiceIdx){
  if (ans(qNum)) return;
  record(qNum, choiceIdx);
  const pos = list.indexOf(qNum);
  if (pos >= 0) idx = pos;
  renderQuiz(true);
}

function goQuestion(i){
  if (i < 0 || i >= list.length) return;
  idx = i;
  const qNum = list[i];
  document.querySelectorAll('.sq').forEach((btn, bIdx) => btn.classList.toggle('cur', bIdx === i));
  const card = $('qcard-' + qNum);
  if (card) card.scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* Update active question pill in sticky strip while scrolling vertically */
window.addEventListener('scroll', () => {
  if (view !== 'quiz' || !list.length) return;
  const cards = document.querySelectorAll('.qcard[data-qno]');
  let activeQ = list[0];
  const threshold = 220;
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    if (rect.top <= threshold) {
      activeQ = +cards[i].dataset.qno;
    } else {
      break;
    }
  }
  const newIdx = list.indexOf(activeQ);
  if (newIdx >= 0 && newIdx !== idx) {
    idx = newIdx;
    const sqs = document.querySelectorAll('.sq');
    sqs.forEach((btn, bIdx) => btn.classList.toggle('cur', bIdx === idx));
    const cur = sqs[idx];
    if (cur) {
      const w = cur.parentElement.parentElement;
      w.scrollLeft = cur.offsetLeft - w.clientWidth / 2 + cur.clientWidth / 2;
    }
  }
}, {passive: true});

/* ---------- results ---------- */
function ring(ok, total){
  const r = 54, c = 2 * Math.PI * r, f = total ? ok / total : 0;
  return '<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--sunken)" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '"/></svg>' +
    '<div class="lbl"><div><b>' + ok + '/' + total + '</b><small>correct</small></div></div></div>';
}
function mistakeCard(n){
  const q = byN[n], e = ans(n), all = store.a[n];
  return '<article class="mistake"><div class="qmeta"><span class="qno">Q' + q.n + '</span>' + lvlBadge(q) + '<span class="muted" style="font-size:12.5px">S' + q.s + '</span>' + (all && all.w > 1 ? '<span class="missed">missed ' + all.w + '×</span>' : '') + '</div>' +
    '<p class="stem">' + esc(q.q) + '</p>' + (q.code ? '<pre class="code">' + highlight(q.code) + '</pre>' : '') +
    '<div class="answers"><div class="ans yours"><span class="who">You chose ' + 'ABCD'[e.c] + '</span><span class="' + (q.oc[e.c] ? 'mono' : '') + '">' + esc(q.o[e.c]) + '</span></div>' +
    '<div class="ans correct"><span class="who">Correct: ' + 'ABCD'[q.a] + '</span><span class="' + (q.oc[q.a] ? 'mono' : '') + '">' + esc(q.o[q.a]) + '</span></div></div>' +
    '<p class="explain"><b>Why:</b> ' + esc(q.e) + '</p></article>';
}
function renderResult(){
  const st = stats(set.ns);
  const wrong = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
  const lvRows = ['E', 'M', 'T'].map(l => {
    const ns = set.ns.filter(n => byN[n].lv === l); if (!ns.length) return '';
    const s = stats(ns);
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(s) + '<span class="num">' + s.ok + '/' + s.total + '</span></div>';
  }).join('');
  const nextS = (set.kind === 'session' && set.s < SESS.length) ? sessByN[set.s + 1] : null;
  $('vResult').innerHTML =
  '<div class="result">' +
    renderSessionSwitcherBar() +
    '<div><div class="eyebrow">Result</div><h2 style="font-size:24px">' + esc(set.title) + '</h2></div>' +
    '<div class="panel scorecard">' + ring(st.ok, st.total) +
      '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' +
        '<div class="legend"><span><i class="dot ok"></i>Right <b>' + st.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + st.bad + '</b></span><span><i class="dot todo"></i>Skipped <b>' + st.todo + '</b></span>' + (st.done ? '<span>Accuracy <b>' + pct(st.ok, st.done) + '%</b></span>' : '') + '</div>' +
        '<div class="lvrows">' + lvRows + '</div>' +
        '<div class="rowbtns">' + (wrong.length ? '<button class="btn primary" type="button" id="retryWrong">Retry the ' + wrong.length + ' wrong</button>' : '') +
          (st.todo ? '<button class="btn" type="button" id="backToQuiz">Answer the ' + st.todo + ' skipped</button>' : '') +
          (nextS ? '<button class="btn primary" type="button" data-goto-session="' + nextS.n + '">Next: Session ' + nextS.n + ' ▶</button>' : '') +
          '<button class="btn" type="button" id="restartSet">Restart this set</button><button class="btn ghost" type="button" data-home>All sessions</button></div>' +
      '</div></div>' +
    (wrong.length ? '<div class="grouphead"><h3>Where you went wrong</h3><span class="muted">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + '</span></div>' + wrong.map(mistakeCard).join('')
      : (st.done ? '<div class="panel">No wrong answers in this set.' + (st.todo ? ' ' + st.todo + ' still unanswered.' : '') + '</div>' : '<div class="panel">Nothing answered yet in this set.</div>')) +
  '</div>';
  const sel = $('sessJumpSelect');
  if (sel) sel.addEventListener('change', function() { startSession(+this.value); });
}

/* ---------- all mistakes ---------- */
function renderMistakes(){
  const wrong = wrongList();
  let html = '<div class="result"><div><div class="eyebrow">Review</div><h2 style="font-size:24px">My mistakes</h2><p class="muted" style="margin:4px 0 0">Every question whose latest answer was wrong, grouped by session.</p></div>';
  if (!wrong.length){
    html += '<div class="panel">No wrong answers right now. <button class="btn small" type="button" data-home>Pick a session</button></div>';
  } else {
    html += '<div class="rowbtns"><button class="btn primary" type="button" id="practiseAllWrong">Practise all ' + wrong.length + '</button><button class="btn ghost" type="button" data-home>All sessions</button></div>';
    SESS.forEach(s => {
      const ns = wrong.filter(n => byN[n].s === s.n); if (!ns.length) return;
      html += '<div class="grouphead"><h3>S' + s.n + ' · ' + esc(s.name) + '</h3><span class="muted">' + ns.length + ' wrong</span><button class="btn small" type="button" data-practise-session="' + s.n + '">Practise these</button></div>' + ns.map(mistakeCard).join('');
    });
  }
  $('vMistakes').innerHTML = html + '</div>';
}
function practiseWrong(ns, title){
  if (!ns.length) return;
  clearAnswers(ns);
  startSet({kind:'retry', title, sub:'Your earlier answers on these are cleared so you can try them fresh.', ns});
}
function sampleRandom(k){
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const todo = shuffle(Q.filter(q => !ans(q.n)).map(q => q.n));
  let pick = todo.slice(0, k);
  if (pick.length < k){
    const extra = shuffle(Q.filter(q => ans(q.n)).map(q => q.n)).slice(0, k - pick.length);
    clearAnswers(extra); pick = pick.concat(extra);
  }
  return pick.sort((a, b) => a - b);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.id === 'navBackBtn'){ if (navPtr > 0) restoreNavState(navPtr - 1); return; }
  if (t.id === 'navFwdBtn'){ if (navPtr < navStack.length - 1) restoreNavState(navPtr + 1); return; }
  if (t.id === 'homeBtn' || t.hasAttribute('data-home')){ resetArmed = false; show('home'); return; }
  if (t.id === 'mistakesBtn'){ show('mistakes'); return; }
  if (t.dataset.session){ startSession(+t.dataset.session); return; }
  if (t.dataset.gotoSession){ startSession(+t.dataset.gotoSession); return; }
  if (t.dataset.sort){ sortMode = t.dataset.sort; renderHome(); pushNavState(); return; }
  if (t.dataset.review){ const s = sessByN[+t.dataset.review]; const ns = s.qs.filter(n => { const e = ans(n); return e && !e.ok; }); practiseWrong(ns, 'S' + s.n + ' mistakes · ' + s.name); return; }
  if (t.dataset.practiseSession){ const s = sessByN[+t.dataset.practiseSession]; practiseWrong(wrongList().filter(n => byN[n].s === s.n), 'S' + s.n + ' mistakes · ' + s.name); return; }
  if (t.id === 'practiseWrong' || t.id === 'practiseAllWrong'){ practiseWrong(wrongList(), 'All my mistakes'); return; }
  if (t.id === 'random20'){ startSet({kind:'random', title:'Random 20', sub:'Unanswered questions first, drawn from all 17 sessions.', ns:sampleRandom(20)}); return; }
  if (t.id === 'resetBtn'){ resetArmed = true; renderHome(); return; }
  if (t.id === 'resetNo'){ resetArmed = false; renderHome(); return; }
  if (t.id === 'resetYes'){ resetArmed = false; resetAll(); refresh(); toast('All progress cleared'); return; }
  if (t.dataset.opt !== undefined && !t.disabled){ answerQuestion(+t.dataset.q, +t.dataset.opt); return; }
  if (t.dataset.go !== undefined){ goQuestion(+t.dataset.go); return; }
  if (t.dataset.lv){ lvFilter = t.dataset.lv; buildList(); idx = firstOpen(); renderQuiz(); pushNavState(); return; }
  if (t.dataset.st){ stFilter = t.dataset.st; buildList(); idx = firstOpen(); renderQuiz(); pushNavState(); return; }
  if (t.id === 'scrollTopBtn'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (t.id === 'finish' || t.id === 'toResult'){ show('result'); return; }
  if (t.dataset.refToggle){ showRefs = !showRefs; renderQuiz(true); return; }
  if (t.dataset.retryQ){ clearAnswers([+t.dataset.retryQ]); renderQuiz(true); return; }
  if (t.id === 'retryWrong'){ const ns = set.ns.filter(n => { const e = ans(n); return e && !e.ok; }); practiseWrong(ns, set.title.replace(/^(S\d+) · /, '$1 mistakes · ')); return; }
  if (t.id === 'backToQuiz'){ stFilter = 'todo'; lvFilter = 'all'; buildList(); idx = 0; show('quiz'); return; }
  if (t.id === 'restartSet'){ clearAnswers(set.ns); lvFilter = 'all'; stFilter = 'all'; buildList(); idx = 0; show('quiz'); return; }
});

document.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); if (navPtr > 0) restoreNavState(navPtr - 1); return; }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); if (navPtr < navStack.length - 1) restoreNavState(navPtr + 1); return; }
  if (view === 'quiz' && set && set.kind === 'session' && ev.shiftKey) {
    if (ev.key === 'ArrowRight' && set.s < SESS.length) { ev.preventDefault(); startSession(set.s + 1); return; }
    if (ev.key === 'ArrowLeft' && set.s > 1) { ev.preventDefault(); startSession(set.s - 1); return; }
  }
});

/* ---------- boot ---------- */
function start(){
  lsRead();
  show('home');
}
start();
})();
</script>
