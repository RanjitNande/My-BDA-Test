<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linux & Cloud Computing · 318 MCQs Study Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunken:#E7EDEF; --ink:#13232B; --muted:#56676F; --line:#D2DCE0;
  --accent:#1B5E86; --accent-ink:#FFFFFF; --accent-soft:#DCEAF3;
  --ok:#1C7A4A; --ok-soft:#DCF1E4; --bad:#B23A2E; --bad-soft:#F7E0DC; --todo:#C5C9D6;
  --code-bg:#11202A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(23,26,43,.06),0 4px 14px rgba(23,26,43,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
    --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
    --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
    --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#142128; --sunken:#1A2A32; --ink:#E2EBEE; --muted:#93A5AD; --line:#293B44;
  --accent:#72B6E0; --accent-ink:#06141C; --accent-soft:#17324A;
  --ok:#5CC98F; --ok-soft:#163626; --bad:#F08C80; --bad-soft:#3D1F1C; --todo:#363C55;
  --code-bg:#09131A; --code-ink:#D9E5EA; --code-kw:#86C8EC; --code-str:#E8C47A; --code-com:#7E949D; --code-num:#B9A6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 74px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:11px;flex-wrap:wrap}
.nav-arrows{display:inline-flex;gap:6px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.toplinks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:8px 14px;font-weight:500;cursor:pointer;min-height:40px;text-align:center;text-decoration:none}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .count{font-family:var(--font-mono);font-size:12px;opacity:.85;background:var(--sunken);padding:1px 6px;border-radius:10px}
.btn.primary .count{background:rgba(255,255,255,.2);color:inherit}

/* Bookmark button & strip indicator */
.bm-btn{margin-left:auto;border-radius:999px;font-family:var(--font-mono);font-size:12px;padding:3px 10px;min-height:28px;color:var(--muted)}
.bm-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sq{position:relative}
.sq.bm::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;border-radius:2px;background:var(--accent)}

/* Home */
.home{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.summary{display:flex;flex-direction:column;gap:18px}
@media (min-width:901px){.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.bigrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack span{display:block;height:100%}
.stack .s-ok{background:var(--ok)} .stack .s-bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.todo{background:var(--todo)}
.lvrows{display:grid;gap:8px}
.lvrow{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.lvrow .stack{height:7px}
.lvrow .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:grid;gap:8px}
.subsets-box{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.subsets-box h3{font-size:15px}
.subset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.subset-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border:1px solid var(--line);background:var(--sunken);border-radius:7px;cursor:pointer;text-align:left}
.subset-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.subset-btn b{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.subset-btn span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.weak h3{font-size:16px;margin-bottom:8px}
.weaklist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.weaklist button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sunken);border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.weaklist button:hover{border-color:var(--accent)}
.weaklist .wname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaklist .wstat{font-family:var(--font-mono);font-size:12px;color:var(--bad);white-space:nowrap}
.empty-note{font-size:13px;color:var(--muted);margin:0}
.reset{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.reset .confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

.topics-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.topics-head h2{font-size:24px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.topics-head .seg{margin-left:auto}
.topiclist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.topic{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) 84px;gap:14px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--accent)}
.tnum{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
.tnum b{display:block;font-family:var(--font-display);font-size:21px;color:var(--ink);font-weight:600;letter-spacing:0;white-space:nowrap}
.tbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.tname{font-weight:600;font-size:15px;line-height:1.35}
.tsub{font-size:12.5px;color:var(--muted);line-height:1.4}
.tmeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tmeta .past{color:var(--accent)}
.tbar{height:6px}
.tscore{text-align:right;font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tscore small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.tscore.na{color:var(--todo)}
@media (max-width:520px){.topic{grid-template-columns:48px minmax(0,1fr) 64px;gap:10px;padding:12px}.tnum b{font-size:17px}.tscore{font-size:18px}}
.intro{font-size:13.5px;color:var(--muted);max-width:68ch;margin:0 0 14px}

/* Quiz — Continuous Vertical Feed */
.quiz{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.switcher-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
.switcher-select{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunken);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.qhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.qhead .titles{min-width:0;flex:1 1 300px}
.qhead h2{font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--bg);padding-top:6px;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:5px;width:max-content;padding-bottom:4px}
.sq{width:38px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:11.5px;cursor:pointer;color:var(--muted);flex:none}
.sq:hover{border-color:var(--accent);color:var(--ink)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:600}
.progressline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progressline b{color:var(--ink)}
.qfeed{display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:115px;transition:border-color .2s}
.qcard.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:520px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--font-mono);font-weight:600;font-size:14px;background:var(--sunken);padding:2px 8px;border-radius:5px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:4px;background:var(--todo);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}
.bars.on1 i:nth-child(-n+1),.bars.on2 i:nth-child(-n+2),.bars.on3 i:nth-child(-n+3){background:var(--accent)}
.missed{font-family:var(--font-mono);font-size:11.5px;color:var(--bad);border:1px solid var(--bad);border-radius:20px;padding:1px 8px}
.pyq{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px}
.sref{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.stem{font-size:16.5px;line-height:1.5;margin:0;white-space:pre-wrap;font-weight:500}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;tab-size:4}
.code .kw{color:var(--code-kw)} .code .st{color:var(--code-str)} .code .cm{color:var(--code-com);font-style:italic} .code .nu{color:var(--code-num)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.key{width:28px;height:28px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px}
.otext{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.otext.codey{font-family:var(--font-mono);font-size:13.5px;white-space:pre-wrap}
.mark{padding-top:3px;font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
@media (max-width:520px){.opt{grid-template-columns:30px minmax(0,1fr)}.mark{grid-column:2;padding-top:0}.mark:empty{display:none}}
.feedback{border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.feedback.no{border-left-color:var(--bad);background:var(--bad-soft)}
.feedback .verdict{font-weight:600;font-size:15px}
.feedback.yes .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback p{margin:0}
.feedback .fbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.qfoot .spacer{flex:1}
.nolist{padding:28px;text-align:center;color:var(--muted)}

/* Results + mistakes */
.result{max-width:820px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.scorecard{grid-template-columns:minmax(0,1fr)}}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--font-display);font-size:32px;line-height:1}
.ring .lbl small{display:block;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mistake .stem{font-size:15px}
.answers{display:grid;gap:6px}
.ans{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;font-size:14px;align-items:start;padding:8px 10px;border-radius:7px}
.ans > span{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.ans{grid-template-columns:minmax(0,1fr);gap:2px}}
.ans .who{font-family:var(--font-mono);font-size:12px;padding-top:2px}
.ans.yours{background:var(--bad-soft)} .ans.yours .who{color:var(--bad)}
.ans.correct{background:var(--ok-soft)} .ans.correct .who{color:var(--ok)}
.explain{font-size:14px;margin:0;color:var(--ink)}
.explain b{font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.grouphead h3{font-size:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* Topic group headings on the home list */
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:14px;padding:0 2px}
.topiclist li.ghead:first-child{margin-top:0}
.ghead b{font-family:var(--font-display);font-size:18px;font-weight:600}
.ghead .gno{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ghead .gstat{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quick facts */
.info{max-width:1080px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.info h2{font-size:24px}
.info h3{font-size:18px;margin-bottom:10px}
.info p{margin:0 0 10px;max-width:68ch}
.info p:last-child{margin-bottom:0}
.info ul{margin:0;padding-left:20px;display:grid;gap:7px;max-width:68ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts .panel h3{font-size:17px}
.facts ul{gap:6px;font-size:14px}
.info code{font-family:var(--font-mono);font-size:13px;background:var(--sunken);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.topic,.sq{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">

dispersed resources across administrative domains to solve large tasks."}, {"n": 240, "s": 4, "lv": "M", "q": "Which one of the following statements is not true?", "code": "", "lang": "", "chk": 0, "o": ["The popularization of the Internet actually enabled most cloud computing systems.", "Cloud computing makes the long-held dream of utility as a payment possible for you, with an infinitely scalable, universally available system, pay what you use.", "Soft computing addresses a real paradigm in the way in which the system is deployed.", "All of the mentioned"], "oc": [false, false, false, false], "a": 2, "e": "Cloud computing—not soft computing—addresses the deployment paradigm of scalable, pay-as-you-go utility computing."}, {"n": 241, "s": 4, "lv": "E", "q": "In how many parts we can broadly divide the architecture of the Cloud?", "code": "", "lang": "", "chk": 0, "o": ["4", "3", "2", "5"], "oc": [false, false, false, false], "a": 2, "e": "Cloud computing architecture is broadly divided into 2 parts: the Front End (client side) and the Back End (cloud provider side)."}, {"n": 242, "s": 4, "lv": "E", "q": "Which one of the following refers to the user's part of the Cloud Computing system?", "code": "", "lang": "", "chk": 0, "o": ["back End", "Management", "Infrastructure", "Front End"], "oc": [false, false, false, false], "a": 3, "e": "The Front End includes the client's device, browser, or application used to access the cloud system."}, {"n": 243, "s": 4, "lv": "M", "q": "In which one of the following phases, IT Architecture Development came?", "code": "", "lang": "", "chk": 0, "o": ["Strategy Phase", "Planning Phase", "Deployment Phase", "Development Phase"], "oc": [false, false, false, false], "a": 1, "e": "In the cloud adoption lifecycle, IT Architecture Development is part of the Planning Phase."}, {"n": 244, "s": 4, "lv": "M", "q": "Managed IT services are based on the concept of which one of the following?", "code": "", "lang": "", "chk": 0, "o": ["Virtualization", "Utility Computing", "Grid Computing", "SOA"], "oc": [false, false, false, false], "a": 1, "e": "Utility computing delivers metered IT services on a pay-per-use basis, forming the basis of managed IT services."}, {"n": 245, "s": 4, "lv": "M", "q": "In which one of the following, a strategy record or Document is created respectively to the events, conditions a user may face while applying cloud computing mode.", "code": "", "lang": "", "chk": 0, "o": ["Cloud Computing Value Proposition", "Cloud Computing Strategy Planning", "Planning Phase", "Business Architecture Development"], "oc": [false, false, false, false], "a": 1, "e": "Cloud Computing Strategy Planning produces the strategy document addressing conditions and events encountered during cloud adoption."}, {"n": 246, "s": 4, "lv": "M", "q": "What is Business Architecture Development?", "code": "", "lang": "", "chk": 0, "o": ["We recognize the risks that might be caused by cloud computing application from a business perspective.", "We identify the applications that support the business processes and the technologies required to support enterprise applications and data systems.", "We formulate all kinds of plans that are required to transform the current business to cloud computing modes.", "None of the above."], "oc": [false, false, false, false], "a": 0, "e": "In the cloud planning model, Business Architecture Development identifies risks posed by cloud applications from a business perspective."}, {"n": 247, "s": 4, "lv": "M", "q": "Which one of the following refers to the non-functional requirements like disaster recovery, security, reliability, etc.", "code": "", "lang": "", "chk": 0, "o": ["Service Development", "Quality of service", "Plan Development", "Technical Service"], "oc": [false, false, false, false], "a": 1, "e": "Quality of Service (QoS) covers non-functional requirements such as security, reliability, availability, and disaster recovery."}, {"n": 248, "s": 4, "lv": "M", "q": "Which of the following forms the basis for almost all web services stacks?", "code": "", "lang": "", "chk": 0, "o": ["WSDL", "SOAP", "UDDI", "VMCC. SOA"], "oc": [false, false, false, false], "a": 1, "e": "SOAP (Simple Object Access Protocol) forms the messaging foundation for traditional XML-based web services stacks."}, {"n": 249, "s": 4, "lv": "M", "q": "Which one of the following statement is true about Grid Computing?", "code": "", "lang": "", "chk": 0, "o": ["Pieces combine small tasks into complex tasks", "The subscription tier plays an important role in grid computing.", "Breaks complex tasks into small operations", "Both A and C"], "oc": [false, false, false, false], "a": 2, "e": "Grid computing breaks complex computational problems into smaller tasks distributed across multiple nodes."}, {"n": 250, "s": 4, "lv": "E", "q": "Through which, the backend and front-end are connected with each other?", "code": "", "lang": "", "chk": 0, "o": ["Browser", "Database", "Network", "Both A and B"], "oc": [false, false, false, false], "a": 2, "e": "The Front End and Back End of a cloud system communicate with each other over a network (typically the Internet)."}, {"n": 251, "s": 4, "lv": "E", "q": "Which of the following has many features of that is now known as cloud computing?", "code": "", "lang": "", "chk": 0, "o": ["Web Service", "Softwares", "All of the mentioned", "Internet"], "oc": [false, false, false, false], "a": 3, "e": "The Internet itself pioneered many distributed, on-demand service features now central to cloud computing."}, {"n": 252, "s": 4, "lv": "M", "q": "Which of the following is the most commonly used model for description and discovery and is also used with SOAP messaging?", "code": "", "lang": "", "chk": 0, "o": ["DHML", "VMC", "WSDL", "SOA"], "oc": [false, false, false, false], "a": 2, "e": "WSDL (Web Services Description Language) describes SOAP web services and their endpoints for discovery and integration."}, {"n": 253, "s": 4, "lv": "E", "q": "Which one of the following can be considered as the example of the Front-end?", "code": "", "lang": "", "chk": 0, "o": ["Web Browser", "Google Compute Engine", "Cisco Metapod", "Amazon Web Services"], "oc": [false, false, false, false], "a": 0, "e": "A Web Browser runs on the user's client machine and acts as the Front-end interface to cloud services."}, {"n": 254, "s": 4, "lv": "M", "q": "Grid Computing Model", "code": "", "lang": "", "chk": 0, "o": ["SOA Model", "virtual isolation Model", "Pay-per-Use model", "Both A and C"], "oc": [false, false, false, false], "a": 2, "e": "The test bank links this prompt to the Pay-per-Use model (also associated with utility/grid resource metering)."}, {"n": 255, "s": 4, "lv": "E", "q": "Which one of the following refers to the Distributed Computing, in which several sets of computers distributed on multiple geographical locations and are connected with each other to achieve a common goal?", "code": "", "lang": "", "chk": 0, "o": ["Virtualization", "SOA", "Grid Computing", "Utility Computing"], "oc": [false, false, false, false], "a": 2, "e": "Grid Computing connects geographically distributed computers to work together toward a common computational goal."}, {"n": 256, "s": 4, "lv": "M", "q": "Which of the following is one of the backend's built-in components of cloud computing?", "code": "", "lang": "", "chk": 0, "o": ["Security", "Application", "Storage", "Service"], "oc": [false, false, false, false], "a": 0, "e": "Security (along with Management) is a built-in back-end component of the cloud computing architecture."}, {"n": 257, "s": 4, "lv": "E", "q": "Which one of the following can be considered as a utility is a dream that dates from the beginning of the computing industry itself?", "code": "", "lang": "", "chk": 0, "o": ["Computing", "Model", "Software", "All of the mentioned"], "oc": [false, false, false, false], "a": 0, "e": "\"Computing as a utility\" (John McCarthy's 1961 vision) dates from the early days of the computing industry."}, {"n": 258, "s": 4, "lv": "M", "q": "How many phases are present in Cloud Computing Planning?", "code": "", "lang": "", "chk": 0, "o": ["2", "3", "4", "5"], "oc": [false, false, false, false], "a": 1, "e": "Cloud Computing Planning consists of 3 phases: Strategy Phase, Planning Phase, and Deployment Phase."}, {"n": 259, "s": 4, "lv": "M", "q": "Cloud computing architecture is a combination of?", "code": "", "lang": "", "chk": 0, "o": ["service-oriented architecture and grid computing", "Utility computing and event-driven architecture.", "Service-oriented architecture and event-driven architecture.", "Virtualization and event-driven architecture"], "oc": [false, false, false, false], "a": 2, "e": "This test bank keys Cloud computing architecture as a combination of Service-oriented architecture (SOA) and event-driven architecture."}, {"n": 260, "s": 4, "lv": "E", "q": "On which one of the following utility computing is based?", "code": "", "lang": "", "chk": 0, "o": ["Grid Computing Model", "SOA Model", "virtual isolation Model", "Pay-per-Use model"], "oc": [false, false, false, false], "a": 3, "e": "Utility computing is based on the Pay-per-Use (metered billing) model."}, {"n": 261, "s": 4, "lv": "M", "q": "Which of the following provides the Graphic User Interface (GUI) for interaction with the cloud?", "code": "", "lang": "", "chk": 0, "o": ["Client", "Client Infrastructure", "Application", "Server"], "oc": [false, false, false, false], "a": 1, "e": "Client Infrastructure (part of the Front End) provides the GUI components needed to interact with the cloud."}, {"n": 262, "s": 4, "lv": "M", "q": "Which of the following is an essential concept related to Cloud?", "code": "", "lang": "", "chk": 0, "o": ["Reliability", "Abstraction", "Productivity", "All of the mentioned"], "oc": [false, false, false, false], "a": 1, "e": "Abstraction (hiding underlying physical infrastructure complexity) is a foundational concept of cloud computing."}, {"n": 263, "s": 4, "lv": "E", "q": "Which one of the following technology works behind the cloud computing platform?", "code": "", "lang": "", "chk": 0, "o": ["Virtualization", "SOA", "Grid Computing", "All of the above"], "oc": [false, false, false, false], "a": 3, "e": "Cloud computing builds on Virtualization, Service-Oriented Architecture (SOA), and Grid Computing."}, {"n": 264, "s": 4, "lv": "E", "q": "Cloud computing is a kind of abstraction which is based on the notion of combining physical resources and represents them as _________ resources to users.", "code": "", "lang": "", "chk": 0, "o": ["Real", "Cloud", "Virtual", "none of the mentioned"], "oc": [false, false, false, false], "a": 2, "e": "Cloud computing pools physical resources and presents them as virtual resources to users."}, {"n": 265, "s": 4, "lv": "E", "q": "What type of computing technology refers to services and applications that typically run on a distributed network through virtualized resources?", "code": "", "lang": "", "chk": 0, "o": ["Distributed Computing", "Cloud Computing", "Soft Computing", "Parallel Computing"], "oc": [false, false, false, false], "a": 1, "e": "Cloud Computing delivers services and applications over a distributed network using virtualized resources."}, {"n": 266, "s": 4, "lv": "M", "q": "In the Planning Phase, Which of the following is the correct step for performing the analysis?", "code": "", "lang": "", "chk": 0, "o": ["Cloud Computing Value Proposition", "Cloud Computing Strategy Planning", "Both Cloud Computing Value Proposition and Cloud Computing Strategy Planning", "Business Architecture Development"], "oc": [false, false, false, false], "a": 2, "e": "Analysis in the Planning Phase includes both Cloud Computing Value Proposition and Cloud Computing Strategy Planning."}, {"n": 267, "s": 4, "lv": "E", "q": "By whom is the backend commonly used?", "code": "", "lang": "", "chk": 0, "o": ["Client", "User", "Stockholders", "service provider"], "oc": [false, false, false, false], "a": 3, "e s to how cloud services are procured and delivered by external/internal providers."}, {"n": 313, "s": 6, "lv": "E", "q": "The Force.com and Windows Azure are examples of which of the following?", "code": "", "lang": "", "chk": 0, "o": ["IaaS", "PaaS", "SaaS", "Both A and B"], "oc": [false, false, false, false], "a": 1, "e": "Salesforce's Force.com and Windows Azure (App Services) are classic examples of Platform as a Service (PaaS)."}, {"n": 314, "s": 6, "lv": "M", "q": "Which one of the following options can be considered as the Cloud?", "code": "", "lang": "", "chk": 0, "o": ["Hadoop", "Intranet", "Web Applications", "All of the mentioned"], "oc": [false, false, false, false], "a": 0, "e": "In this question bank, Hadoop (distributed cloud-scale processing/storage) is keyed as the cloud option over local intranets or standalone web apps."}, {"n": 315, "s": 6, "lv": "M", "q": "Which of the following statement is not true?", "code": "", "lang": "", "chk": 0, "o": ["Through cloud computing, one can begin with very small and become big in a rapid manner.", "All applications benefit from deployment in the Cloud.", "Cloud computing is revolutionary, even though the technology it is built on is evolutionary.", "None of the mentioned"], "oc": [false, false, false, false], "a": 1, "e": "Not all applications benefit from cloud deployment—for example, legacy apps with strict local hardware or latency constraints may not fit."}, {"n": 316, "s": 6, "lv": "M", "q": "Which one of the following is a phase of the Deployment process?", "code": "", "lang": "", "chk": 0, "o": ["Selecting Cloud Computing Provider", "IT Architecture Development", "Business Architecture Development", "Transformation Plan Development"], "oc": [false, false, false, false], "a": 3, "e": "In the Cloud Deployment process, Transformation Plan Development is keyed as a deployment phase step."}, {"n": 317, "s": 6, "lv": "M", "q": "Which of the following can be considered PaaS offering?", "code": "", "lang": "", <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const Q = DATA.questions;
const TOTAL = Q.length;
const byN = {}; Q.forEach(q => { byN[q.n] = q; });
const LV = {E:'Easy', M:'Medium', T:'Tough'};
const LVBARS = {E:1, M:2, T:3};
const GROUPS = DATA.groups;
const SESS = DATA.sessions.map(s => ({
  n:s.n, g:s.g, label:'S' + String(s.n).padStart(2, '0'), short:String(s.n), name:s.name, topics:s.topics,
  qs: Q.filter(q => q.s === s.n).map(q => q.n)
}));
const sessByN = {}; SESS.forEach(s => { sessByN[s.n] = s; });
const CHECKED = Q.filter(q => q.chk).length;
const MOCK_SIZE = 40;

/* 40-Question Subset Divisions (9 subsets across 330 questions) */
const SUBSETS = [];
for (let i = 0; i < TOTAL; i += 40){
  const start = i + 1;
  const end = Math.min(i + 40, TOTAL);
  const tNum = SUBSETS.length + 1;
  const qs = [];
  for (let qn = start; qn <= end; qn++) qs.push(qn);
  const sFirst = byN[start].s, sLast = byN[end].s;
  SUBSETS.push({
    t: tNum,
    label: 'Test ' + tNum,
    title: 'Test ' + tNum + ' · Q' + start + '–Q' + end,
    sub: 'Sessions ' + sFirst + '–' + sLast + ' (' + qs.length + ' questions)',
    qs
  });
}
const subsetByT = {}; SUBSETS.forEach(tb => { subsetByT[tb.t] = tb; });

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
const KW = {
  java: /^(abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|null|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|true|false|var)$/,
  py: /^(from|import|as|def|return|lambda|for|in|if|elif|else|print|True|False|None|and|or|not|with|try|except|class|while|is)$/,
  sql: /^(select|from|where|group|by|order|having|join|on|as|over|partition|rows|range|between|and|or|not|null|is|insert|into|overwrite|table|create|external|stored|load|data|local|inpath|limit|lateral|view|distinct|case|when|then|else|end|desc|asc|preceding|following|current|row|unbounded|union|all|with)$/i,
  sh: /^$/
};
const COMMENT = {java: '//', py: '#', sh: '#', sql: '--'};
function highlight(code, lang){
  const kw = KW[lang] || KW.java, cm = COMMENT[lang] || '//';
  const cmRe = cm === '//' ? '\\/\\/[^\\n]*' : cm === '--' ? '--[^\\n]*' : '#[^\\n]*';
  const re = new RegExp('("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|' + cmRe + '|\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?[LlFf]?)\\b|\\b[A-Za-z_]\\w*\\b)', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const tk = m[0];
    if (tk[0] === '"' || tk[0] === "'") out += '<span class="st">' + esc(tk) + '</span>';
    else if (tk.startsWith(cm)) out += '<span class="cm">' + esc(tk) + '</span>';
    else if (/^\d/.test(tk)) out += '<span class="nu">' + esc(tk) + '</span>';
    else if (kw.test(tk)) out += '<span class="kw">' + esc(tk) + '</span>';
    else out += esc(tk);
    last = m.index + tk.length;
  }
  return out + esc(code.slice(last));
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400); }

/* ---------- theme switcher ---------- */
const THEME_KEY = 'portal_theme';
function getActiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'dark' || attr === 'light') return attr;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = $('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '🌙 Dark' : '☀️ Light';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}
function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){}
  if (saved === 'dark' || saved === 'light') applyTheme(saved);
  else applyTheme(getActiveTheme());
}

/* ---------- progress store ---------- */
const LS_KEY = 'linuxcloud318-progress-v1';
let store = {a:{}, bm:{}, resetAt:0};
function lsRead(){
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s){
      const o = JSON.parse(s);
      if (o && typeof o.a === 'object') store = {
        a: o.a,
        bm: (o.bm && typeof o.bm === 'object') ? o.bm : {},
        resetAt: o.resetAt || 0
      };
    }
  } catch(e){}
}
function lsWrite(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){}
}
function ans(n){ const e = store.a[n]; return (e && e.c >= 0) ? e : null; }
function record(n, choice){
  const q = byN[n], ok = choice === q.a, e = store.a[n] || {};
  store.a[n] = {c:choice, ok, t:Date.now(), w:(e.w || 0) + (ok ? 0 : 1), r:(e.r || 0) + (ok ? 1 : 0)};
  persist();
}
function clearAnswers(ns){
  const t = Date.now();
  ns.forEach(n => { const e = store.a[n]; if (e && e.c >= 0) store.a[n] = Object.assign({}, e, {c:-1, ok:false, t}); });
  persist();
}
function resetAll(){ store = {a:{}, bm:{}, resetAt:Date.now()}; persist(); }
function stats(ns){
  let ok = 0, bad = 0;
  ns.forEach(n => { const e = ans(n); if (e){ if (e.ok) ok++; else bad++; } });
  return {ok, bad, done: ok + bad, total: ns.length, todo: ns.length - ok - bad};
}
function wrongList(){ return Q.filter(q => { const e = ans(q.n); return e && !e.ok; }).map(q => q.n); }
function isBookmarked(n){ return !!(store.bm && store.bm[n]); }
function toggleBookmark(n){
  if (!store.bm || typeof store.bm !== 'object') store.bm = {};
  if (store.bm[n]) delete store.bm[n];
  else store.bm[n] = 1;
  persist();
}
function bookmarkList(){ return Q.filter(q => isBookmarked(q.n)).map(q => q.n); }
function persist(){
  lsWrite();
  $('mistakesCount').textContent = wrongList().length;
  $('bookmarksCount').textContent = bookmarkList().length;
}

/* ---------- view & history navigation state ---------- */
let view = 'home';       // home | quiz | result | mistakes | bookmarks | info
let sortMode = 'syllabus';
let resetArmed = false;
let set = null;          // {title, sub, kind, s, t, ns}
let lvFilter = 'all';    // all | E | M | T
let stFilter = 'all';    // all | todo | wrong | bm
let list = [];           // filtered question numbers in current set
let activeQ = null;      // last clicked/jumped question number

/* Browser-like Back / Forward navigation stack */
let navHistory = [];
let navIndex = -1;
let isNavigatingHistory = false;

function cloneState(){
  return {
    view,
    sortMode,
    set: set ? JSON.parse(JSON.stringify(set)) : null,
    lvFilter,
    stFilter,
    scrollY: window.scrollY || 0
  };
}
function pushHistory(){
  if (isNavigatingHistory) return;
  const snap = cloneState();
  if (navIndex >= 0 && navIndex < navHistory.length){
    navHistory[navIndex].scrollY = window.scrollY || 0;
  }
  navHistory = navHistory.slice(0, navIndex + 1);
  navHistory.push(snap);
  navIndex = navHistory.length - 1;
  updateNavButtons();
}
function updateNavButtons(){
  $('navBackBtn').disabled = navIndex <= 0;
  $('navFwdBtn').disabled = navIndex >= navHistory.length - 1;
}
function restoreState(snap){
  isNavigatingHistory = true;
  view = snap.view;
  sortMode = snap.sortMode || 'syllabus';
  set = snap.set ? JSON.parse(JSON.stringify(snap.set)) : null;
  lvFilter = snap.lvFilter || 'all';
  stFilter = snap.stFilter || 'all';
  if (set) buildList();
  applyViewVisibility();
  refresh();
  window.scrollTo(0, snap.scrollY || 0);
  isNavigatingHistory = false;
  updateNavButtons();
}
function navBack(){
  if (navIndex > 0){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex--;
    restoreState(navHistory[navIndex]);
  }
}
function navForward(){
  if (navIndex < navHistory.length - 1){
    navHistory[navIndex].scrollY = window.scrollY || 0;
    navIndex++;
    restoreState(navHistory[navIndex]);
  }
}

function applyViewVisibility(){
  $('vHome').hidden = view !== 'home';
  $('vQuiz').hidden = view !== 'quiz';
  $('vResult').hidden = view !== 'result';
  $('vMistakes').hidden = view !== 'mistakes';
  $('vBookmarks').hidden = view !== 'bookmarks';
  $('vInfo').hidden = view !== 'info';

  $('allTestsLink').hidden = false;
  $('consoleHomeBtn').hidden = view === 'home';
  $('brandTitle').textContent = 'Linux & Cloud 318';
  $('brandSub').textContent = 'CCEE · Linux Programming & Cloud Computing (PGCP-BDA)';
}

function show(v){
  if ((v === 'quiz' || v === 'result') && !set) v = 'home';
  view = v;
  applyViewVisibility();
  refresh();
  window.scrollTo(0, 0);
  pushHistory();
}

function refresh(){
  $('mistakesCount').textContent = wrongList().length;
  $('bookmarksCount').textContent = bookmarkList().length;
  if (view === 'home') renderHome();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'result') renderResult();
  else if (view === 'mistakes') renderMistakes();
  else if (view === 'bookmarks') renderBookmarks();
  else if (view === 'info') renderInfo();
}

function stackBar(st, cls){
  const t = st.total || 1;
  return '<div class="stack ' + (cls || '') + '" role="img" aria-label="' + st.ok + ' right, ' + st.bad + ' wrong, ' + st.todo + ' not answered"><span class="s-ok" style="width:' + (100 * st.ok / t) + '%"></span><span class="s-bad" style="width:' + (100 * st.bad / t) + '%"></span></div>';
}

/* ---------- console home ---------- */
function renderHome(){
  const all = stats(Q.map(q => q.n));
  const acc = all.done ? pct(all.ok, all.done) : null;
  const lvRows = ['E', 'M', 'T'].map(l => {
    const st = stats(Q.filter(q => q.lv === l).map(q => q.n));
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(st) + '<span class="num">' + st.ok + '/' + st.done + ' · ' + st.total + '</span></div>';
  }).join('');

  const subsetBtns = SUBSETS.map(tb => {
    const st = stats(tb.qs);
    return '<button type="button" class="subset-btn" data-subset="' + tb.t + '">' +
      '<b>' + esc(tb.label) + '</b>' +
      '<span>Q' + tb.qs[0] + '–' + tb.qs[tb.qs.length - 1] + ' · ' + st.done + '/' + st.total + '</span>' +
    '</button>';
  }).join('');

  const weak = SESS.map(s => ({s, st: stats(s.qs)})).filter(x => x.st.bad > 0)
    .sort((a, b) => (a.st.ok / a.st.done) - (b.st.ok / b.st.done) || b.st.bad - a.st.bad).slice(0, 5);
  const weakHtml = weak.length
    ? '<ul class="weaklist">' + weak.map(x => '<li><button type="button" data-review="' + x.s.n + '"><span class="wname">' + x.s.label + ' · ' + esc(x.s.name) + '</span><span class="wstat">' + x.st.bad + ' wrong · ' + pct(x.st.ok, x.st.done) + '%</span></button></li>').join('') + '</ul>'
    : '<p class="empty-note">Answer a few questions and your weakest sessions will show up here, worst first.</p>';
  const wrongN = wrongList().length;
  const bmN = bookmarkList().length;
  const order = SESS.slice();
  if (sortMode === 'weak') order.sort((a, b) => {
    const A = stats(a.qs), B = stats(b.qs);
    const ka = A.done ? A.ok / A.done : 2, kb = B.done ? B.ok / B.done : 2;
    return ka - kb || a.n - b.n;
  });
  let lastG = 0;
  const topics = order.map(s => {
    const st = stats(s.qs);
    const lv = {E:0, M:0, T:0}; s.qs.forEach(n => lv[byN[n].lv]++);
    const chk = s.qs.filter(n => byN[n].chk).length;
    const bmSess = s.qs.filter(n => isBookmarked(n)).length;
    const qRange = 'Q' + s.qs[0] + '–Q' + s.qs[s.qs.length - 1];
    const score = st.done ? '<div class="tscore">' + pct(st.ok, st.done) + '%<small>' + st.done + '/' + st.total + ' done</small></div>' : '<div class="tscore na">—<small>not started</small></div>';
    let head = '';
    if (sortMode !== 'weak' && s.g !== lastG){
      lastG = s.g;
      const G = GROUPS[s.g - 1];
      const gs = stats(Q.filter(q => sessByN[q.s].g === s.g).map(q => q.n));
      head = '<li class="ghead"><span class="gno">' + esc(G.range) + '</span><b>' + esc(G.name) + '</b><span class="gstat">' + gs.done + '/' + gs.total + ' done' + (gs.done ? ' · ' + pct(gs.ok, gs.done) + '%' : '') + '</span></li>';
    }
    return head + '<li><button class="topic" type="button" data-session="' + s.n + '">' +
      '<span class="tnum">Session<b>' + String(s.n).padStart(2, '0') + '</b></span>' +
      '<span class="tbody"><span class="tname">' + esc(s.name) + '</span>' +
      '<span class="tsub">' + esc(s.topics) + '</span>' +
      '<span class="tmeta"><span>' + qRange + '</span><span>' + s.qs.length + ' questions</span><span>E' + lv.E + ' M' + lv.M + ' T' + lv.T + '</span>' +
      (chk ? '<span class="past">' + chk + ' code-checked</span>' : '') +
      (bmSess ? '<span class="past">★ ' + bmSess + ' saved</span>' : '') + '</span>' +
      stackBar(st, 'tbar') + '</span>' + score + '</button></li>';
  }).join('');

  $('vHome').innerHTML =
  '<div class="home">' +
    '<aside class="summary panel">' +
      '<div><div class="eyebrow">Overall</div><div class="bigrow"><div class="big">' + (acc === null ? '—' : acc + '<small>%</small>') + '</div><div class="muted" style="padding-bottom:4px">accuracy on ' + all.done + ' of ' + TOTAL + ' answered</div></div></div>' +
      stackBar(all) +
      '<div class="legend"><span><i class="dot ok"></i>Right <b>' + all.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + all.bad + '</b></span><span><i class="dot todo"></i>Left <b>' + all.todo + '</b></span></div>' +
      '<div><div class="eyebrow" style="margin-bottom:8px">By difficulty · right/answered · total</div><div class="lvrows">' + lvRows + '</div></div>' +
      '<div class="actions">' +
        '<button class="btn primary" type="button" id="mock40">Mock paper: 40 from all sessions</button>' +
        '<button class="btn" type="button" id="practiseWrong"' + (wrongN ? '' : ' disabled') + '>Practise my mistakes <span class="count">' + wrongN + '</span></button>' +
        '<button class="btn" type="button" id="practiseBm"' + (bmN ? '' : ' disabled') + '>★ Practise bookmarked <span class="count">' + bmN + '</span></button>' +
        '<button class="btn" type="button" id="random20">Random 20 from all sessions</button>' +
      '</div>' +
      '<div class="subsets-box">' +
        '<div class="eyebrow">40-Question Test Subsets</div>' +
        '<div class="subset-grid">' + subsetBtns + '</div>' +
      '</div>' +
      '<div class="weak"><h3>Where you lose marks</h3>' + weakHtml + '</div>' +
      '<div class="reset">' + (resetArmed
        ? '<div class="confirm"><span>Clear every answer?</span><button class="btn small" type="button" id="resetYes">Yes, clear</button><button class="btn small ghost" type="button" id="resetNo">Cancel</button></div>'
        : '<button class="btn small ghost" type="button" id="resetBtn"' + (all.done || wrongN ? '' : ' disabled') + '>Reset all progress</button>') + '</div>' +
    '</aside>' +
    '<section>' +
      '<div class="topics-head"><div><div class="eyebrow">Pick a session</div><h2>' + SESS.length + ' sessions · ' + TOTAL + ' questions</h2></div>' +
        '<div class="seg" role="group" aria-label="Order sessions"><button type="button" data-sort="syllabus" aria-pressed="' + (sortMode !== 'weak') + '">Syllabus order</button><button type="button" data-sort="weak" aria-pressed="' + (sortMode === 'weak') + '">Weakest first</button></div></div>' +
      '<p class="intro">All ' + TOTAL + ' given MCQs from your Linux &amp; Cloud Computing question banks, organized strictly by your PGCP-BDA syllabus (Part I: Linux Programming &amp; Part II: Cloud Computing). Includes continuous vertical feed, 40-question subset tests, ★ bookmarks, mistake tracking, and full Answer Key in Quick facts.</p>' +
      '<ul class="topiclist">' + topics + '</ul>' +
    '</section>' +
  '</div>';
}

/* ---------- quiz (continuous vertical feed) ---------- */
function startSet(s){
  set = s;
  lvFilter = 'all';
  stFilter = 'all';
  buildList();
  activeQ = list[0] || null;
  show('quiz');
}
function startSession(n){
  const s = sessByN[n];
  startSet({kind:'session', s:n, title:'Session ' + s.n + ' · ' + s.name, sub:s.topics, ns:s.qs.slice()});
}
function startSubset(tNum){
  const tb = subsetByT[tNum];
  startSet({kind:'subset', t:tNum, title:tb.title, sub:tb.sub, ns:tb.qs.slice()});
}
function buildList(){
  if (!set) { list = []; return; }
  list = set.ns.filter(n => {
    const q = byN[n], e = ans(n);
    if (lvFilter !== 'all' && q.lv !== lvFilter) return false;
    if (stFilter === 'todo' && e) return false;
    if (stFilter === 'wrong' && !(e && !e.ok)) return false;
    if (stFilter === 'bm' && !isBookmarked(n)) return false;
    return true;
  });
}

const KIND = {session:'Session', subset:'40-Question Subset Test', random:'Mixed practice', mock:'Mock paper', retry:'Mistake practice', bookmark:'Bookmark practice'};

function buildSwitcherBar(){
  let prevDisabled = true, nextDisabled = true;
  let prevLabel = '◄ Prev', nextLabel = 'Next ►';
  if (set.kind === 'session'){
    prevDisabled = set.s <= 1;
    nextDisabled = set.s >= SESS.length;
    if (!prevDisabled) prevLabel = '◄ S' + (set.s - 1);
    if (!nextDisabled) nextLabel = 'S' + (set.s + 1) + ' ►';
  } else if (set.kind === 'subset'){
    prevDisabled = set.t <= 1;
    nextDisabled = set.t >= SUBSETS.length;
    if (!prevDisabled) prevLabel = '◄ Test ' + (set.t - 1);
    if (!nextDisabled) nextLabel = 'Test ' + (set.t + 1) + ' ►';
  }

  const sessOpts = SESS.map(s => {
    const st = stats(s.qs);
    const sel = set.kind === 'session' && set.s === s.n ? ' selected' : '';
    return '<option value="s:' + s.n + '"' + sel + '>' + s.label + ' · ' + esc(s.name) + ' (' + st.done + '/' + st.total + ')</option>';
  }).join('');

  const subOpts = SUBSETS.map(tb => {
    const st = stats(tb.qs);
    const sel = set.kind === 'subset' && set.t === tb.t ? ' selected' : '';
    return '<option value="t:' + tb.t + '"' + sel + '>' + esc(tb.title) + ' (' + st.done + '/' + st.total + ')</option>';
  }).join('');

  const customOpt = (set.kind !== 'session' && set.kind !== 'subset')
    ? '<option value="custom" selected>' + esc(set.title) + ' (' + stats(set.ns).done + '/' + set.ns.length + ')</option>'
    : '';

  return '<div class="switcher-bar">' +
    '<button class="btn small" type="button" id="prevSetBtn"' + (prevDisabled ? ' disabled' : '') + '>' + prevLabel + '</button>' +
    '<select class="switcher-select" id="switcherSelect" aria-label="Switch session or subset test">' +
      customOpt +
      '<optgroup label="33 Syllabus Sessions (10 Qs each)">' + sessOpts + '</optgroup>' +
      '<optgroup label="40-Question Test Subsets (9 Tests)">' + subOpts + '</optgroup>' +
    '</select>' +
    '<button class="btn small" type="button" id="nextSetBtn"' + (nextDisabled ? ' disabled' : '') + '>' + nextLabel + '</button>' +
    '<button class="btn small primary" type="button" id="toResult">See result</button>' +
  '</div>';
}

function renderQuiz(){
  const st = stats(set.ns);
  const bmInSet = set.ns.filter(n => isBookmarked(n)).length;
  const lvCounts = {E:0, M:0, T:0}; set.ns.forEach(n => lvCounts[byN[n].lv]++);
  const lvSeg = '<div class="seg" role="group" aria-label="Difficulty">' +
    [['all', 'All ' + set.ns.length]].concat(['E', 'M', 'T'].filter(l => lvCounts[l]).map(l => [l, LV[l] + ' ' + lvCounts[l]]))
    .map(([k, label]) => '<button type="button" data-lv="' + k + '" aria-pressed="' + (lvFilter === k) + '">' + label + '</button>').join('') + '</div>';
  const stSeg = '<div class="seg" id="stSeg" role="group" aria-label="Show">' +
    '<button type="button" data-st="all" aria-pressed="' + (stFilter === 'all') + '">All</button>' +
    '<button type="button" data-st="todo" aria-pressed="' + (stFilter === 'todo') + '">Not answered</button>' +
    '<button type="button" data-st="wrong" aria-pressed="' + (stFilter === 'wrong') + '">Wrong</button>' +
    '<button type="button" data-st="bm" aria-pressed="' + (stFilter === 'bm') + '">★ Bookmarked (' + bmInSet + ')</button></div>';

  const strip = list.map(n => {
    const e = ans(n);
    const bmCls = isBookmarked(n) ? ' bm' : '';
    return '<button type="button" id="sq-' + n + '" class="sq' + (e ? (e.ok ? ' ok' : ' bad') : '') + bmCls + (n === activeQ ? ' cur' : '') + '" data-jump="' + n + '" aria-label="Jump to Question ' + n + '">' + n + '</button>';
  }).join('');

  let feedHtml;
  if (!list.length){
    feedHtml = '<div class="qcard nolist">No questions match this filter. <button class="btn small" type="button" data-st="all">Show all</button></div>';
  } else {
    feedHtml = '<div class="qfeed" id="qfeed">' + list.map(n => renderCard(byN[n])).join('') + '</div>';
  }

  $('vQuiz').innerHTML =
  '<div class="quiz">' +
    buildSwitcherBar() +
    '<div class="qhead"><div class="titles"><div class="eyebrow">' + (KIND[set.kind] || 'Practice') + '</div><h2>' + esc(set.title) + '</h2>' + (set.sub ? '<div class="muted" style="font-size:13px">' + esc(set.sub) + '</div>' : '') + '</div></div>' +
    '<div class="progressline" id="quizProgressLine"><span><b>' + st.done + '</b> of ' + st.total + ' answered</span><span><i class="dot ok"></i><b>' + st.ok + '</b> right</span><span><i class="dot bad"></i><b>' + st.bad + '</b> wrong</span>' + (st.done ? '<span><b>' + pct(st.ok, st.done) + '%</b> accuracy</span>' : '') + '</div>' +
    '<div id="quizStackWrap">' + stackBar(st) + '</div>' +
    '<div class="filters">' + lvSeg + stSeg + '</div>' +
    '<div class="strip-wrap"><div class="strip">' + strip + '</div></div>' +
    feedHtml +
    (list.length ? '<div class="qfoot">' +
      '<button class="btn" type="button" id="scrollTopBtn">↑ Top of feed</button>' +
      '<button class="btn ghost" type="button" id="restartSetQuiz">Restart this set</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn primary" type="button" id="finish">Finish and see result →</button>' +
    '</div>' : '') +
  '</div>';
}

function lvlBadge(q){ return '<span class="lvl"><span class="bars on' + LVBARS[q.lv] + '"><i></i><i></i><i></i></span>' + LV[q.lv] + '</span>'; }
function metaRow(q, extra){
  const bm = isBookmarked(q.n);
  const bmBtn = '<button type="button" class="btn small ghost bm-btn' + (bm ? ' on' : '') + '" data-bm="' + q.n + '" aria-pressed="' + bm + '">' + (bm ? '★ Bookmarked' : '☆ Bookmark') + '</button>';
  return '<div class="qmeta"><span class="qno">Q' + q.n + '</span>' + lvlBadge(q) + '<span class="sref">S' + q.s + ' · ' + esc(sessByN[q.s].name) + '</span>' +
    (q.chk ? '<span class="pyq" title="This answer was checked by running the code or calculation">Checked by running code</span>' : '') + (extra || '') + bmBtn + '</div>';
}
function renderCardInner(q){
  const e = ans(q.n);
  const opts = q.o.map((t, i) => {
    let cls = 'opt', mark = '';
    if (e){
      if (i === q.a){ cls += ' right'; mark = i === e.c ? '✓ Your answer' : '✓ Correct'; }
      else if (i === e.c){ cls += ' wrong'; mark = '✗ Your answer'; }
      else cls += ' dim';
    }
    return '<li><button type="button" class="' + cls + '" data-q="' + q.n + '" data-opt="' + i + '"' + (e ? ' disabled' : '') + '><span class="key">' + 'ABCD'[i] + '</span><span class="otext' + (q.oc[i] ? ' codey' : '') + '">' + esc(t) + '</span><span class="mark">' + mark + '</span></button></li>';
  }).join('');
  const all = store.a[q.n];
  const missed = all && all.w ? '<span class="missed">missed ' + all.w + '×</span>' : '';
  let fb = '';
  if (e){
    fb = '<div class="feedback ' + (e.ok ? 'yes' : 'no') + '" role="status"><div class="verdict">' + (e.ok ? 'Correct. Answer ' + 'ABCD'[q.a] : 'Wrong. You chose ' + 'ABCD'[e.c] + ', the answer is ' + 'ABCD'[q.a]) + '</div>' +
      (e.ok ? '' : '<p><b>' + 'ABCD'[q.a] + '.</b> <span' + (q.oc[q.a] ? ' class="mono"' : '') + '>' + esc(q.o[q.a]) + '</span></p>') +
      '<p>' + esc(q.e) + '</p><div class="fbrow"><button class="btn small ghost" type="button" data-retry-one="' + q.n + '">Try this one again</button></div></div>';
  }
  return metaRow(q, missed) +
    '<p class="stem">' + esc(q.q) + '</p>' +
    (q.code ? '<pre class="code">' + highlight(q.code, q.lang) + '</pre>' : '') +
    '<ol class="opts">' + opts + '</ol>' + fb;
}
function renderCard(q){
  return '<article class="qcard" id="qcard-' + q.n + '">' + renderCardInner(q) + '</article>';
}

/* Update single card + top metrics in place so continuous vertical feed never loses scroll position */
function updateCardInPlace(n){
  const cardEl = $('qcard-' + n);
  if (cardEl && byN[n]){
    cardEl.innerHTML = renderCardInner(byN[n]);
  }
  const sqEl = $('sq-' + n);
  if (sqEl){
    const e = ans(n);
    const bmCls = isBookmarked(n) ? ' bm' : '';
    sqEl.className = 'sq' + (e ? (e.ok ? ' ok' : ' bad') : '') + bmCls + (n === activeQ ? ' cur' : '');
  }
  if (set){
    const st = stats(set.ns);
    const pl = $('quizProgressLine');
    if (pl){
      pl.innerHTML = '<span><b>' + st.done + '</b> of ' + st.total + ' answered</span><span><i class="dot ok"></i><b>' + st.ok + '</b> right</span><span><i class="dot bad"></i><b>' + st.bad + '</b> wrong</span>' + (st.done ? '<span><b>' + pct(st.ok, st.done) + '%</b> accuracy</span>' : '');
    }
    const sw = $('quizStackWrap');
    if (sw) sw.innerHTML = stackBar(st);
    const bmFilterBtn = document.querySelector('#stSeg button[data-st="bm"]');
    if (bmFilterBtn){
      const bmInSet = set.ns.filter(qn => isBookmarked(qn)).length;
      bmFilterBtn.textContent = '★ Bookmarked (' + bmInSet + ')';
    }
  }
}

function handleBookmarkToggle(qn){
  if (!byN[qn]) return;
  const wasBm = isBookmarked(qn);
  toggleBookmark(qn);
  toast(wasBm ? 'Removed Q' + qn + ' from bookmarks' : '★ Bookmarked Q' + qn);
  if (view === 'quiz'){
    if (stFilter === 'bm' && wasBm){
      buildList();
      renderQuiz();
    } else {
      updateCardInPlace(qn);
    }
  } else if (view === 'bookmarks'){
    renderBookmarks();
  } else if (view === 'result'){
    renderResult();
  } else if (view === 'mistakes'){
    renderMistakes();
  }
}

function answerQuestion(qn, choice){
  if (!byN[qn] || ans(qn)) return;
  activeQ = qn;
  record(qn, choice);
  if (stFilter !== 'all'){
    renderQuiz();
  } else {
    updateCardInPlace(qn);
  }
}

function jumpToQuestion(qn){
  activeQ = qn;
  document.querySelectorAll('.sq.cur').forEach(el => el.classList.remove('cur'));
  const sqEl = $('sq-' + qn);
  if (sqEl) sqEl.classList.add('cur');
  const cardEl = $('qcard-' + qn);
  if (cardEl){
    cardEl.scrollIntoView({behavior: 'smooth', block: 'start'});
    cardEl.classList.add('flash');
    setTimeout(() => cardEl.classList.remove('flash'), 900);
  }
}

/* ---------- results ---------- */
function ring(ok, total){
  const r = 54, c = 2 * Math.PI * r, f = total ? ok / total : 0;
  return '<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--sunken)" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '"/></svg>' +
    '<div class="lbl"><div><b>' + ok + '/' + total + '</b><small>correct</small></div></div></div>';
}
function mistakeCard(n){
  const q = byN[n], e = ans(n), all = store.a[n];
  return '<article class="mistake">' + metaRow(q, all && all.w > 1 ? '<span class="missed">missed ' + all.w + '×</span>' : '') +
    '<p class="stem">' + esc(q.q) + '</p>' + (q.code ? '<pre class="code">' + highlight(q.code, q.lang) + '</pre>' : '') +
    '<div class="answers"><div class="ans yours"><span class="who">You chose ' + 'ABCD'[e.c] + '</span><span class="' + (q.oc[e.c] ? 'mono' : '') + '">' + esc(q.o[e.c]) + '</span></div>' +
    '<div class="ans correct"><span class="who">Correct: ' + 'ABCD'[q.a] + '</span><span class="' + (q.oc[q.a] ? 'mono' : '') + '">' + esc(q.o[q.a]) + '</span></div></div>' +
    '<p class="explain"><b>Why:</b> ' + esc(q.e) + '</p></article>';
}
function renderResult(){
  const st = stats(set.ns);
  const wrong = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
  const lvRows = ['E', 'M', 'T'].map(l => {
    const ns = set.ns.filter(n => byN[n].lv === l); if (!ns.length) return '';
    const s = stats(ns);
    return '<div class="lvrow"><span>' + LV[l] + '</span>' + stackBar(s) + '<span class="num">' + s.ok + '/' + s.total + '</span></div>';
  }).join('');
  $('vResult').innerHTML =
  '<div class="result">' +
    '<div><div class="eyebrow">Result</div><h2 style="font-size:24px">' + esc(set.title) + '</h2></div>' +
    '<div class="panel scorecard">' + ring(st.ok, st.total) +
      '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' +
        '<div class="legend"><span><i class="dot ok"></i>Right <b>' + st.ok + '</b></span><span><i class="dot bad"></i>Wrong <b>' + st.bad + '</b></span><span><i class="dot todo"></i>Skipped <b>' + st.todo + '</b></span>' + (st.done ? '<span>Accuracy <b>' + pct(st.ok, st.done) + '%</b></span>' : '') + '</div>' +
        '<div class="lvrows">' + lvRows + '</div>' +
        '<div class="rowbtns">' + (wrong.length ? '<button class="btn primary" type="button" id="retryWrong">Retry the ' + wrong.length + ' wrong</button>' : '') +
          (st.todo ? '<button class="btn" type="button" id="backToQuiz">Answer the ' + st.todo + ' skipped</button>' : '') +
          '<button class="btn" type="button" id="restartSet">Restart this set</button><button class="btn ghost" type="button" data-home>All sessions</button></div>' +
      '</div></div>' +
    (wrong.length ? '<div class="grouphead"><h3>Where you went wrong</h3><span class="muted">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + '</span></div>' + wrong.map(mistakeCard).join('')
      : (st.done ? '<div class="panel">No wrong answers in this set.' + (st.todo ? ' ' + st.todo + ' still unanswered.' : '') + '</div>' : '<div class="panel">Nothing answered yet in this set.</div>')) +
  '</div>';
}

/* ---------- all mistakes ---------- */
function renderMistakes(){
  const wrong = wrongList();
  let html = '<div class="result"><div><div class="eyebrow">Review</div><h2 style="font-size:24px">My mistakes</h2><p class="muted" style="margin:4px 0 0">Every question whose latest answer was wrong, grouped by session.</p></div>';
  if (!wrong.length){
    html += '<div class="panel">No wrong answers right now. <button class="btn small" type="button" data-home>Pick a session</button></div>';
  } else {
    html += '<div class="rowbtns"><button class="btn primary" type="button" id="practiseAllWrong">Practise all ' + wrong.length + '</button><button class="btn ghost" type="button" data-home>All sessions</button></div>';
    SESS.forEach(s => {
      const ns = wrong.filter(n => byN[n].s === s.n); if (!ns.length) return;
      html += '<div class="grouphead"><h3>' + esc(s.label) + ' · ' + esc(s.name) + '</h3><span class="muted">' + ns.length + ' wrong</span><button class="btn small" type="button" data-practise-session="' + s.n + '">Practise these</button></div>' + ns.map(mistakeCard).join('');
    });
  }
  $('vMistakes').innerHTML = html + '</div>';
}
function practiseWrong(ns, title){
  if (!ns.length) return;
  clearAnswers(ns);
  startSet({kind:'retry', title, sub:'Your earlier answers on these are cleared so you can try them fresh.', ns});
}

/* ---------- bookmarked questions ---------- */
function bookmarkCard(n){
  const q = byN[n], e = ans(n), all = store.a[n];
  let ansHtml = '';
  if (e && !e.ok){
    ansHtml = '<div class="ans yours"><span class="who">Your last choice: ' + 'ABCD'[e.c] + '</span><span class="' + (q.oc[e.c] ? 'mono' : '') + '">' + esc(q.o[e.c]) + '</span></div>';
  } else if (e && e.ok){
    ansHtml = '<div class="ans correct"><span class="who">Your last choice: ' + 'ABCD'[e.c] + '</span><span>✓ Answered correctly</span></div>';
  }
  return '<article class="mistake">' + metaRow(q, all && all.w ? '<span class="missed">missed ' + all.w + '×</span>' : '') +
    '<p class="stem">' + esc(q.q) + '</p>' + (q.code ? '<pre class="code">' + highlight(q.code, q.lang) + '</pre>' : '') +
    '<div class="answers">' + ansHtml +
    '<div class="ans correct"><span class="who">Correct: ' + 'ABCD'[q.a] + '</span><span class="' + (q.oc[q.a] ? 'mono' : '') + '">' + esc(q.o[q.a]) + '</span></div></div>' +
    '<p class="explain"><b>Why:</b> ' + esc(q.e) + '</p></article>';
}
function renderBookmarks(){
  const bms = bookmarkList();
  let html = '<div class="result"><div><div class="eyebrow">Saved for revision</div><h2 style="font-size:24px">★ Bookmarked questions</h2><p class="muted" style="margin:4px 0 0">Questions you starred across sessions for quick revision or focused practice.</p></div>';
  if (!bms.length){
    html += '<div class="panel">No bookmarked questions yet. Tap <b>☆ Bookmark</b> on any question card to save it here. <button class="btn small" type="button" data-home>Pick a session</button></div>';
  } else {
    html += '<div class="rowbtns"><button class="btn primary" type="button" id="practiseAllBm">Practise all ' + bms.length + ' bookmarked</button><button class="btn ghost" type="button" data-home>All sessions</button></div>';
    SESS.forEach(s => {
      const ns = bms.filter(n => byN[n].s === s.n); if (!ns.length) return;
      html += '<div class="grouphead"><h3>' + esc(s.label) + ' · ' + esc(s.name) + '</h3><span class="muted">' + ns.length + ' saved</span><button class="btn small" type="button" data-practise-bm-session="' + s.n + '">Practise these</button></div>' + ns.map(bookmarkCard).join('');
    });
  }
  $('vBookmarks').innerHTML = html + '</div>';
}
function practiseBookmarked(ns, title){
  if (!ns.length) return;
  startSet({kind:'bookmark', title, sub:'Your starred questions for focused review.', ns});
}

function sampleRandom(k){
  const todo = shuffle(Q.filter(q => !ans(q.n)).map(q => q.n));
  let pick = todo.slice(0, k);
  if (pick.length < k){
    const extra = shuffle(Q.filter(q => ans(q.n)).map(q => q.n)).slice(0, k - pick.length);
    clearAnswers(extra); pick = pick.concat(extra);
  }
  return pick.sort((a, b) => a - b);
}
function sampleMock(){
  const freshFirst = ns => shuffle(ns.slice()).sort((a, b) => (ans(a) ? 1 : 0) - (ans(b) ? 1 : 0));
  const picked = SESS.map(s => freshFirst(s.qs)[0]);
  const rest = freshFirst(Q.map(q => q.n).filter(n => !picked.includes(n)));
  const usedTwice = new Set();
  for (const n of rest){
    if (picked.length >= MOCK_SIZE) break;
    const s = byN[n].s; if (usedTwice.has(s)) continue;
    usedTwice.add(s); picked.push(n);
  }
  clearAnswers(picked.filter(n => ans(n)));
  return picked.sort((a, b) => a - b);
}

/* ---------- quick facts ---------- */
function renderInfo(){
  const box = (title, items) => '<div class="panel"><h3>' + title + '</h3><ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul></div>';
  const keyTables = SESS.map(s => {
    const rows = s.qs.map(qn => {
      const q = byN[qn];
      const letter = 'ABCD'[q.a];
      return '<div style="display:grid;grid-template-columns:52px 34px minmax(0,1fr);gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline">' +
        '<span class="mono" style="font-weight:600;color:var(--accent)">Q' + q.n + '</span>' +
        '<span class="mono" style="font-weight:700;color:var(--ok)">' + letter + '</span>' +
        '<span style="overflow-wrap:anywhere">' + esc(q.o[q.a]) + '</span>' +
      '</div>';
    }).join('');
    return '<div class="panel" style="grid-column:1 / -1">' +
      '<h3>Answer Key · S' + String(s.n).padStart(2, '0') + ' · ' + esc(s.name) + ' (' + s.qs.length + ' Qs)</h3>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 18px">' + rows + '</div>' +
    '</div>';
  }).join('');

  $('vInfo').innerHTML =
  '<div class="info">' +
    '<div><div class="eyebrow">Revise before the exam · Syllabus Notes &amp; Answer Key</div><h2>Quick Facts &amp; Answer Key · Linux &amp; Cloud Computing (' + TOTAL + ' MCQs)</h2><p class="muted" style="margin-top:6px">Key command flags, cloud concepts, and the complete Answer Key for all ' + TOTAL + ' given questions.</p></div>' +
    '<div class="facts">' +
    box('Linux Basics &amp; Filesystem', [
      '<code>uname -r</code> kernel release, <code>uname -m</code> hardware arch, <code>uname -a</code> all info.',
      'Hard links (<code>ln</code>) share the inode and survive deleting the original; symbolic links (<code>ln -s</code>) store the path, cross filesystems, and break if target is deleted.',
      '<code>find</code> searches live filesystems (<code>-type f/l/b</code>, <code>-size +4k</code>); <code>locate</code> uses a prebuilt database updated by <code>updatedb</code>.',
      '<code>df -i</code> checks inode usage (full inodes block file creation even with free disk space); <code>du</code> shows directory disk usage; <code>lsblk -f</code> shows filesystem types.',
      '<code>gzip</code> replaces the original with <code>.gz</code> unless <code>-k</code> is used; <code>tar -cvf</code> archives and <code>-z</code> enables gzip.']) +
    box('Permissions, Users, Vi &amp; Shell', [
      '<code>umask 0002</code> on new directories (base 777) yields <code>775</code>. <code>chmod -R +x</code> applies recursively.',
      '<code>usermod -a -G grp user</code> appends a secondary group; omitting <code>-a</code> replaces existing secondary groups.',
      '<code>chown user:group</code> sets both; <code>chown :group</code> sets only group; <code>chgrp -R</code> sets group recursively.',
      '<code>/etc/passwd</code> stores user info &amp; primary GID (UID 0 is root); <code>/etc/group</code> stores group memberships; <code>/etc/sudoers</code> is edited with <code>visudo</code>.',
      'Streams: <code>0</code> stdin, <code>1</code> stdout, <code>2</code> stderr. <code>$?</code> holds last exit status (<code>0</code> = success). <code>cmd1 &amp;&amp; cmd2</code> runs on success; <code>||</code> on failure; <code>;</code> always.']) +
    box('Cloud Paradigms, Architecture &amp; Models', [
      'Cloud architecture has <b>2 parts</b>: Front End (client/browser) and Back End (provider servers, storage, security).',
      'Service models: <b>IaaS</b> (VMs/hardware), <b>PaaS</b> (runtime/IDE, high vendor lock-in), <b>SaaS</b> (most complete, browser-delivered, network dependent).',
      'Grid computing connects geographically &amp; operationally dispersed heterogeneous nodes; Utility computing uses the Pay-per-Use model.',
      'Cloud Planning has <b>3 phases</b>: Strategy, Planning, and Deployment. QoS covers security, reliability, and disaster recovery.']) +
    box('Virtualization &amp; Hypervisors', [
      '<b>Type-1 Hypervisor</b> (Bare-metal / Native): VMware ESXi, Citrix XenServer, Microsoft Hyper-V.',
      '<b>Type-2 Hypervisor</b> (Hosted on OS): VMware Player, Parallels Desktop.',
      'VMM coordinates <b>3 modules</b>: Dispatcher (entry point), Allocator (resource allocation), and Interpreter.',
      'Multitenant virtualization isolates tenants sharing physical hardware.']) +
    keyTables +
    '</div>' +
    '<div class="rowbtns"><button class="btn primary" type="button" id="mock40Info">Start a mock paper</button><button class="btn ghost" type="button" data-home>All sessions</button></div>' +
  '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;

  if (t.id === 'themeBtn'){
    const next = getActiveTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    return;
  }
  if (t.id === 'navBackBtn'){ navBack(); return; }
  if (t.id === 'navFwdBtn'){ navForward(); return; }
  if (t.id === 'brandBtn' || t.id === 'consoleHomeBtn' || t.hasAttribute('data-home')){ resetArmed = false; show('home'); return; }
  if (t.id === 'mistakesBtn'){ show('mistakes'); return; }
  if (t.id === 'bookmarksBtn'){ show('bookmarks'); return; }
  if (t.id === 'infoBtn'){ show('info'); return; }

  if (t.dataset.bm !== undefined){
    handleBookmarkToggle(+t.dataset.bm);
    return;
  }

  if (t.id === 'mock40' || t.id === 'mock40Info'){
    startSet({kind:'mock', title:'Mock paper · 40 questions', sub:'One question from every session, plus seven more from the larger blocks.', ns:sampleMock()});
    return;
  }
  if (t.dataset.session){ startSession(+t.dataset.session); return; }
  if (t.dataset.subset){ startSubset(+t.dataset.subset); return; }
  if (t.dataset.sort){ sortMode = t.dataset.sort; renderHome(); return; }
  if (t.dataset.review){
    const s = sessByN[+t.dataset.review];
    const ns = s.qs.filter(n => { const e = ans(n); return e && !e.ok; });
    practiseWrong(ns, s.label + ' mistakes · ' + s.name);
    return;
  }
  if (t.dataset.practiseSession){
    const s = sessByN[+t.dataset.practiseSession];
    practiseWrong(wrongList().filter(n => byN[n].s === s.n), s.label + ' mistakes · ' + s.name);
    return;
  }
  if (t.dataset.practiseBmSession){
    const s = sessByN[+t.dataset.practiseBmSession];
    practiseBookmarked(bookmarkList().filter(n => byN[n].s === s.n), s.label + ' bookmarked · ' + s.name);
    return;
  }
  if (t.id === 'practiseWrong' || t.id === 'practiseAllWrong'){ practiseWrong(wrongList(), 'All my mistakes'); return; }
  if (t.id === 'practiseBm' || t.id === 'practiseAllBm'){ practiseBookmarked(bookmarkList(), 'All bookmarked questions'); return; }
  if (t.id === 'random20'){ startSet({kind:'random', title:'Random 20', sub:'Unanswered questions first, drawn from all ' + SESS.length + ' sessions.', ns:sampleRandom(20)}); return; }
  if (t.id === 'resetBtn'){ resetArmed = true; renderHome(); return; }
  if (t.id === 'resetNo'){ resetArmed = false; renderHome(); return; }
  if (t.id === 'resetYes'){ resetArmed = false; resetAll(); refresh(); toast('All progress cleared'); return; }

  if (t.dataset.opt !== undefined && t.dataset.q !== undefined && !t.disabled){
    answerQuestion(+t.dataset.q, +t.dataset.opt);
    return;
  }
  if (t.dataset.jump !== undefined){
    jumpToQuestion(+t.dataset.jump);
    return;
  }
  if (t.dataset.retryOne !== undefined){
    const qn = +t.dataset.retryOne;
    clearAnswers([qn]);
    if (stFilter !== 'all') renderQuiz();
    else updateCardInPlace(qn);
    return;
  }
  if (t.dataset.lv){ lvFilter = t.dataset.lv; buildList(); renderQuiz(); return; }
  if (t.dataset.st){ stFilter = t.dataset.st; buildList(); renderQuiz(); return; }
  if (t.id === 'prevSetBtn'){
    if (set && set.kind === 'session' && set.s > 1) startSession(set.s - 1);
    else if (set && set.kind === 'subset' && set.t > 1) startSubset(set.t - 1);
    return;
  }
  if (t.id === 'nextSetBtn'){
    if (set && set.kind === 'session' && set.s < SESS.length) startSession(set.s + 1);
    else if (set && set.kind === 'subset' && set.t < SUBSETS.length) startSubset(set.t + 1);
    return;
  }
  if (t.id === 'scrollTopBtn'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (t.id === 'finish' || t.id === 'toResult'){ show('result'); return; }
  if (t.id === 'retryWrong'){
    const ns = set.ns.filter(n => { const e = ans(n); return e && !e.ok; });
    practiseWrong(ns, set.kind === 'session' ? set.title.replace(' · ', ' mistakes · ') : 'Mistakes from ' + set.title);
    return;
  }
  if (t.id === 'backToQuiz'){ stFilter = 'todo'; lvFilter = 'all'; buildList(); show('quiz'); return; }
  if (t.id === 'restartSet' || t.id === 'restartSetQuiz'){
    clearAnswers(set.ns);
    lvFilter = 'all';
    stFilter = 'all';
    buildList();
    show('quiz');
    toast('Set answers cleared');
    return;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t && t.id === 'switcherSelect'){
    const val = t.value;
    if (val.startsWith('s:')) startSession(+val.slice(2));
    else if (val.startsWith('t:')) startSubset(+val.slice(2));
  }
});

/* ---------- boot ---------- */
initTheme();
lsRead();
show('home');
})();
</script>
